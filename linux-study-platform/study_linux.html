x":"在后边加上single 回车"},{"t":"p","x":"最后按\"b\"启动，启动后就进入了单用户模式了"},{"t":"p","x":"此时已经进入到单用户模式了，你可以更改root密码了。更密码的命令为 passwd"},{"t":"p","x":"【使用系统安装光盘的救援模式】"},{"t":"p","x":"救援模式即rescue ，这个模式主要是应用于，系统无法进入的情况。如，grub损坏或者某一个配置文件修改出错。如何使用rescue模式呢？"},{"t":"p","x":"光盘启动，按F5 进入rescue模式"},{"t":"p","x":"输入linux rescue 回车"},{"t":"p","x":"选择语言，笔者建议你选择英语"},{"t":"p","x":"选择us 键盘"},{"t":"p","x":"这里问你是否启动网络，有时候可能会联网调试。我们选no"},{"t":"p","x":"这里告诉我们，接下来会把系统挂载在/mnt/sysimage 中。"},{"t":"p","x":"其中有三个选项:"},{"t":"li","x":"Continue 就是挂载后继续下一步。"},{"t":"li","x":"Read-Only 挂载成只读，这样更安全，有时文件系统损坏时，只读模式会防止文件系统进一步损坏。"},{"t":"li","x":"Skip就是不挂载，进入一个命令窗口模式。"},{"t":"p","x":"这里我们选择Continue。"},{"t":"p","x":"至此，系统已经挂载到了/mnt/sysimage中。接下来回车，输入chroot /mnt/sysimage 进入管理员环境。"},{"t":"p","x":"提示： 其实也可以到rescue模式下更改root的密码的。这个rescue模式和windows PE系统很相近。"},{"t":"p","x":"当运行了chroot /mnt/sysimage/ 后，再ls 看到目录结构和原来系统中的目录结构是一样的。"},{"t":"p","x":"没错！现在的环境和原来系统的环境是一模一样的。你可以输入exit 或者按Ctrl + D退出这个环境。然后你再ls 看一下"},{"t":"p","x":"这个目录其实就是rescue模式下的目录结构，而我们的系统文件全部在 /mnt/sysimage目录下。"}]},{"key":"t09","name":"Linux 远程登录","desc":"SSH 登录、免密登录、scp/sftp 传输文件","group":"② 系统与运维基础","diff":2,"blocks":[{"t":"h","x":"Linux 远程登录"},{"t":"p","x":"Linux 一般作为服务器使用，而服务器一般放在机房，你不可能在机房操作你的 Linux 服务器。"},{"t":"p","x":"这时我们就需要远程登录到Linux服务器来管理维护系统。"},{"t":"p","x":"Linux 系统中是通过 ssh 服务实现的远程登录功能，默认 ssh 服务端口号为 22。"},{"t":"p","x":"Window 系统上 Linux 远程登录客户端有 SecureCRT, Putty, SSH Secure Shell 等，本文以 Putty 为例来登录远程服务器。"},{"t":"p","x":"Putty 下载地址：https://www.putty.org/"},{"t":"p","x":"如果你下载了 Putty，请双击 putty.exe 然后弹出如下的窗口。"},{"t":"p","x":"在Host Name( or IP address) 下面的框中输入你要登录的远程服务器IP(可以通过ifconfig命令查看服务器ip)，然后回车。"},{"t":"p","x":"此时，提示我们输入要登录的用户名。"},{"t":"p","x":"输入root 然后回车，再输入密码，就能登录到远程的linux系统了。"},{"t":"h","x":"使用密钥认证机制远程登录linux"},{"t":"p","x":"SSH 为 Secure Shell 的缩写，由 IETF 的网络工作小组（Network Working Group）所制定。"},{"t":"p","x":"SSH 为建立在应用层和传输层基础上的安全协议。"},{"t":"p","x":"首先使用工具 PUTTYGEN.EXE 生成密钥对。打开工具 PUTTYGEN.EXE 后如下图所示："},{"t":"p","x":"该工具可以生成三种格式的key ：SSH-1(RSA) SSH-2(RSA) SSH-2(DSA) ，我们采用默认的格式即 SSH-2(RSA)。Number of bits in a generated key 这个是指生成的key的大小，这个数值越大，生成的key就越复杂，安全性就越高。这里我们写 2048。"},{"t":"p","x":"然后单击Generate 开始生成密钥对："},{"t":"p","x":"注意的是，在这个过程中鼠标要来回的动，否则这个进度条是不会动的。"},{"t":"p","x":"到这里，密钥对已经生成了。你可以给你的密钥输入一个密码，（在Key Passphrase那里）也可以留空。然后点 Save public key 保存公钥，点 Save private Key 保存私钥。笔者建议你放到一个比较安全的地方，一来防止别人偷窥，二来防止误删除。接下来就该到远程 linux 主机上设置了。"},{"t":"p","x":"1）创建目录 /root/.ssh 并设置权限"},{"t":"p","x":"[root@localhost ~]# mkdir /root/.ssh mkdir 命令用来创建目录，以后会详细介绍，暂时只了解即可。"},{"t":"p","x":"[root@localhost ~]# chmod 700 /root/.ssh chmod 命令是用来修改文件属性权限的，以后会详细介绍。"},{"t":"p","x":"2）创建文件 / root/.ssh/authorized_keys"},{"t":"p","x":"[root@localhost ~]# vim /root/.ssh/authorized_keys vim 命令是编辑一个文本文件的命令，同样在后续章节详细介绍。"},{"t":"p","x":"3）打开刚才生成的public key 文件，建议使用写字板打开，这样看着舒服一些，复制从AAAA开头至 \"---- END SSH2 PUBLIC KEY ----\" 该行上的所有内容，粘贴到/root/.ssh/authorized_keys 文件中，要保证所有字符在一行。（可以先把复制的内容拷贝至记事本，然后编辑成一行载粘贴到该文件中）。"},{"t":"p","x":"在这里要简单介绍一下，如何粘贴，用vim打开那个文件后，该文件不存在，所以vim会自动创建。按一下字母\"i\"然后同时按shift + Insert 进行粘贴（或者单击鼠标右键即可），前提是已经复制到剪切板中了。粘贴好后，然后把光标移动到该行最前面输入 ssh-rsa ，然后按空格。再按ESC，然后输入冒号wq 即 :wq 就保存了。格式如下图："},{"t":"p","x":"4）再设置putty选项，点窗口左侧的SSh –> Auth ，单击窗口右侧的Browse… 选择刚刚生成的私钥， 再点Open ，此时输入root，就不用输入密码就能登录了。"},{"t":"p","x":"如果在前面你设置了Key Passphrase ，那么此时就会提示你输入密码的。为了更加安全建议大家要设置一个Key Passphrase。"}]},{"key":"t10","name":"Linux 文件基本属性","desc":"rwx 权限含义、chmod/chown 修改权限与属主","group":"③ 文件与权限","diff":2,"blocks":[{"t":"h","x":"Linux 文件基本属性"},{"t":"p","x":"Linux 系统是一种典型的多用户系统，不同的用户处于不同的地位，拥有不同的权限。"},{"t":"p","x":"为了保护系统的安全性，Linux 系统对不同的用户访问同一文件（包括目录文件）的权限做了不同的规定。"},{"t":"p","x":"在 Linux 中我们通常使用以下两个命令来修改文件或目录的所属用户与权限："},{"t":"li","x":"chown (change owner) ： 修改所属用户与组。"},{"t":"li","x":"chmod (change mode) ： 修改用户的权限。"},{"t":"p","x":"下图中通过 chown 来授权用户，通过 chmod 为用户设置可以开门的权限。"},{"t":"p","x":"在 Linux 中我们可以使用 ll 或者 ls –l 命令来显示一个文件的属性以及文件所属的用户和组，如："},{"t":"code","x":"[root@www /]# ls -l\n\ntotal 64\n\ndr-xr-xr-x 2 root root 4096 Dec 14 2012 bin\n\ndr-xr-xr-x 4 root root 4096 Apr 19 2012 boot\n\n……"},{"t":"p","x":"实例中，bin 文件的第一个属性用 d 表示。d 在 Linux 中代表该文件是一个目录文件。"},{"t":"p","x":"在 Linux 中第一个字符代表这个文件是目录、文件或链接文件等等。"},{"t":"li","x":"当为 d 则是目录"},{"t":"li","x":"当为 - 则是文件；"},{"t":"li","x":"若是 l 则表示为链接文档(link file)；"},{"t":"li","x":"若是 b 则表示为装置文件里面的可供储存的接口设备(可随机存取装置)；"},{"t":"li","x":"若是 c 则表示为装置文件里面的串行端口设备，例如键盘、鼠标(一次性读取装置)。"},{"t":"p","x":"接下来的字符中，以三个为一组，且均为 rwx 的三个参数的组合。其中， r 代表可读(read)、 w 代表可写(write)、 x 代表可执行(execute)。 要注意的是，这三个权限的位置不会改变，如果没有权限，就会出现减号 - 而已。"},{"t":"p","x":"每个文件的属性由左边第一部分的 10 个字符来确定（如下图）。"},{"t":"p","x":"从左至右用 0-9 这些数字来表示。"},{"t":"p","x":"第 0 位确定文件类型，第 1-3 位确定属主（该文件的所有者）拥有该文件的权限。"},{"t":"p","x":"其中，第 1、4、7 位表示读权限，如果用 r 字符表示，则有读权限，如果用 - 字符表示，则没有读权限；"},{"t":"p","x":"第 2、5、8 位表示写权限，如果用 w 字符表示，则有写权限，如果用 - 字符表示没有写权限；第 3、6、9 位表示可执行权限，如果用 x 字符表示，则有执行权限，如果用 - 字符表示，则没有执行权限。"},{"t":"h","x":"Linux文件属主和属组"},{"t":"code","x":"[root@www /]# ls -l\n\ntotal 64\n\ndrwxr-xr-x 2 root root 4096 Feb 15 14:46 cron\n\ndrwxr-xr-x 3 mysql mysql 4096 Apr 21 2014 mysql\n\n……"},{"t":"p","x":"对于文件来说，它都有一个特定的所有者，也就是对该文件具有所有权的用户。"},{"t":"p","x":"同时，在Linux系统中，用户是按组分类的，一个用户属于一个或多个组。"},{"t":"p","x":"文件所有者以外的用户又可以分为文件所属组的同组用户和其他用户。"},{"t":"p","x":"因此，Linux系统按文件所有者、文件所有者同组用户和其他用户来规定了不同的文件访问权限。"},{"t":"p","x":"在以上实例中，mysql 文件是一个目录文件，属主和属组都为 mysql，属主有可读、可写、可执行的权限；与属主同组的其他用户有可读和可执行的权限；其他用户也有可读和可执行的权限。"},{"t":"p","x":"对于 root 用户来说，一般情况下，文件的权限对其不起作用。"},{"t":"h","x":"更改文件属性"},{"t":"h","x":"1、chgrp：更改文件属组"},{"t":"p","x":"语法："},{"t":"code","x":"chgrp [-R] 属组名 文件名"},{"t":"p","x":"参数选项"},{"t":"li","x":"-R：递归更改文件属组，就是在更改某个目录文件的属组时，如果加上 -R 的参数，那么该目录下的所有文件的属组都会更改。"},{"t":"h","x":"2、chown：更改文件所有者（owner），也可以同时更改文件所属组。"},{"t":"p","x":"语法："},{"t":"code","x":"chown [–R] 所有者 文件名\n\nchown [-R] 所有者:属组名 文件名"},{"t":"p","x":"进入 /root 目录（~）将install.log的拥有者改为bin这个账号："},{"t":"code","x":"[root@www ~] cd ~\n\n[root@www ~]# chown bin install.log\n\n[root@www ~]# ls -l\n\n-rw-r--r-- 1 bin users 68495 Jun 25 08:53 install.log"},{"t":"p","x":"将install.log的拥有者与群组改回为root："},{"t":"code","x":"[root@www ~]# chown root:root install.log\n\n[root@www ~]# ls -l\n\n-rw-r--r-- 1 root root 68495 Jun 25 08:53 install.log"},{"t":"h","x":"3、chmod：更改文件9个属性"},{"t":"p","x":"Linux文件属性有两种设置方法，一种是数字，一种是符号。"},{"t":"p","x":"Linux 文件的基本权限就有九个，分别是 owner/group/others(拥有者/组/其他) 三种身份各有自己的 read/write/execute 权限。"},{"t":"p","x":"先复习一下刚刚上面提到的数据：文件的权限字符为： -rwxrwxrwx ， 这九个权限是三个三个一组的！其中，我们可以使用数字来代表各个权限，各权限的分数对照表如下："},{"t":"li","x":"r:4"},{"t":"li","x":"w:2"},{"t":"li","x":"x:1"},{"t":"p","x":"每种身份(owner/group/others)各自的三个权限(r/w/x)分数是需要累加的，例如当权限为： -rwxrwx--- 分数则是："},{"t":"li","x":"owner = rwx = 4+2+1 = 7"},{"t":"li","x":"group = rwx = 4+2+1 = 7"},{"t":"li","x":"others= --- = 0+0+0 = 0"},{"t":"p","x":"所以等一下我们设定权限的变更时，该文件的权限数字就是 770。变更权限的指令 chmod 的语法是这样的："},{"t":"code","x":"chmod [-R] xyz 文件或目录"},{"t":"p","x":"选项与参数："},{"t":"li","x":"xyz : 就是刚刚提到的数字类型的权限属性，为 rwx 属性数值的相加。"},{"t":"li","x":"-R : 进行递归(recursive)的持续变更，以及连同次目录下的所有文件都会变更"},{"t":"p","x":"举例来说，如果要将 .bashrc 这个文件所有的权限都设定启用，那么命令如下："},{"t":"code","x":"[root@www ~]# ls -al .bashrc\n\n-rw-r--r-- 1 root root 395 Jul 4 11:45 .bashrc\n\n[root@www ~]# chmod 777 .bashrc\n\n[root@www ~]# ls -al .bashrc\n\n-rwxrwxrwx 1 root root 395 Jul 4 11:45 .bashrc"},{"t":"p","x":"那如果要将权限变成 -rwxr-xr-- 呢？那么权限的分数就成为 [4+2+1][4+0+1][4+0+0]=754。"},{"t":"h","x":"符号类型改变文件权限"},{"t":"p","x":"还有一个改变权限的方法，从之前的介绍中我们可以发现，基本上就九个权限分别是："},{"t":"li","x":"user：用户"},{"t":"li","x":"group：组"},{"t":"li","x":"others：其他"},{"t":"p","x":"那么我们就可以使用 u, g, o 来代表三种身份的权限。"},{"t":"p","x":"此外， a 则代表 all，即全部的身份。读写的权限可以写成 r, w, x，也就是可以使用下表的方式来看："},{"t":"p","x":"如果我们需要将文件权限设置为 -rwxr-xr-- ，可以使用 chmod u=rwx,g=rx,o=r 文件名 来设定:"},{"t":"code","x":"# touch test1 // 创建 test1 文件\n\n# ls -al test1 // 查看 test1 默认权限\n\n-rw-r--r-- 1 root root 0 Nov 15 10:32 test1\n\n# chmod u=rwx,g=rx,o=r test1 // 修改 test1 权限\n\n# ls -al test1\n\n-rwxr-xr-- 1 root root 0 Nov 15 10:32 test1"},{"t":"p","x":"而如果是要将权限去掉而不改变其他已存在的权限呢？例如要拿掉全部人的可执行权限，则："},{"t":"code","x":"# chmod a-x test1\n\n# ls -al test1\n\n-rw-r--r-- 1 root root 0 Nov 15 10:32 test1"},{"t":"h","x":"更多参考内容"},{"t":"li","x":"Linux chgrp 命令"},{"t":"li","x":"Linux chown 命令"},{"t":"li","x":"Linux chmod 命令"}]},{"key":"t11","name":"Linux 文件与目录管理","desc":"ls/cd/cp/mv/rm/mkdir/touch 等操作与管理","group":"③ 文件与权限","diff":2,"blocks":[{"t":"h","x":"Linux 文件与目录管理"},{"t":"p","x":"我们知道 Linux 的目录结构为树状结构，最顶级的目录为根目录 /。"},{"t":"p","x":"其他目录通过挂载可以将它们添加到树中，通过解除挂载可以移除它们。"},{"t":"p","x":"在开始本教程前我们需要先知道什么是绝对路径与相对路径。"},{"t":"p","x":"绝对路径：路径的写法，由根目录 / 写起，例如： /usr/share/doc 这个目录。"},{"t":"p","x":"相对路径：路径的写法，不是由 / 写起，例如由 /usr/share/doc 要到 /usr/share/man 底下时，可以写成： cd ../man 这就是相对路径的写法。"},{"t":"h","x":"处理目录的常用命令"},{"t":"p","x":"接下来我们就来看几个常见的处理目录的命令吧："},{"t":"li","x":"ls（英文全拼：list files）: 列出目录及文件名"},{"t":"li","x":"cd（英文全拼：change directory）：切换目录"},{"t":"li","x":"pwd（英文全拼：print work directory）：显示目前的目录"},{"t":"li","x":"mkdir（英文全拼：make directory）：创建一个新的目录"},{"t":"li","x":"rmdir（英文全拼：remove directory）：删除一个空的目录"},{"t":"li","x":"cp（英文全拼：copy file）: 复制文件或目录"},{"t":"li","x":"rm（英文全拼：remove）: 删除文件或目录"},{"t":"li","x":"mv（英文全拼：move file）: 移动文件与目录，或修改文件与目录的名称"},{"t":"p","x":"你可以使用 man [命令] 来查看各个命令的使用文档，如 ：man cp。"},{"t":"h","x":"ls (列出目录)"},{"t":"p","x":"在Linux系统当中， ls 命令可能是最常被运行的。"},{"t":"p","x":"语法："},{"t":"code","x":"[root@www ~]# ls [-aAdfFhilnrRSt] 目录名称\n\n[root@www ~]# ls [--color={never,auto,always}] 目录名称\n\n[root@www ~]# ls [--full-time] 目录名称"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-a ：全部的文件，连同隐藏文件( 开头为 . 的文件) 一起列出来(常用)"},{"t":"li","x":"-d ：仅列出目录本身，而不是列出目录内的文件数据(常用)"},{"t":"li","x":"-l ：长数据串列出，包含文件的属性与权限等等数据；(常用)"},{"t":"p","x":"将目录下的所有文件列出来(含属性与隐藏档)"},{"t":"code","x":"[root@www ~]# ls -al ~"},{"t":"h","x":"cd (切换目录)"},{"t":"p","x":"cd是Change Directory的缩写，这是用来变换工作目录的命令。"},{"t":"p","x":"语法："},{"t":"code","x":"cd [相对路径或绝对路径]"},{"t":"code","x":"#使用 mkdir 命令创建 runoob 目录\n\n[root@www ~]# mkdir runoob\n\n#使用绝对路径切换到 runoob 目录\n\n[root@www ~]# cd /root/runoob/\n\n#使用相对路径切换到 runoob 目录\n\n[root@www ~]# cd ./runoob/\n\n# 表示回到自己的家目录，亦即是 /root 这个目录\n\n[root@www runoob]# cd ~\n\n# 表示去到目前的上一级目录，亦即是 /root 的上一级目录的意思；\n\n[root@www ~]# cd .."},{"t":"p","x":"接下来大家多操作几次应该就可以很好的理解 cd 命令的。"},{"t":"h","x":"pwd (显示目前所在的目录)"},{"t":"p","x":"pwd 是 Print Working Directory 的缩写，也就是显示目前所在目录的命令。"},{"t":"code","x":"[root@www ~]# pwd [-P]"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-P ：显示出确实的路径，而非使用链接 (link) 路径。"},{"t":"p","x":"实例：单纯显示出目前的工作目录："},{"t":"code","x":"[root@www ~]# pwd\n\n/root \u003c== 显示出目录啦～"},{"t":"p","x":"实例显示出实际的工作目录，而非链接档本身的目录名而已。"},{"t":"code","x":"[root@www ~]# cd /var/mail \u003c==注意，/var/mail是一个链接档\n\n[root@www mail]# pwd\n\n/var/mail \u003c==列出目前的工作目录\n\n[root@www mail]# pwd -P\n\n/var/spool/mail \u003c==怎么回事？有没有加 -P 差很多～\n\n[root@www mail]# ls -ld /var/mail\n\nlrwxrwxrwx 1 root root 10 Sep 4 17:54 /var/mail -> spool/mail\n\n# 看到这里应该知道为啥了吧？因为 /var/mail 是链接档，链接到 /var/spool/mail \n\n# 所以，加上 pwd -P 的选项后，会不以链接档的数据显示，而是显示正确的完整路径啊！"},{"t":"h","x":"mkdir (创建新目录)"},{"t":"p","x":"如果想要创建新的目录的话，那么就使用mkdir (make directory)吧。"},{"t":"p","x":"语法："},{"t":"code","x":"mkdir [-mp] 目录名称"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-m ：配置文件的权限喔！直接配置，不需要看默认权限 (umask) 的脸色～"},{"t":"li","x":"-p ：帮助你直接将所需要的目录(包含上一级目录)递归创建起来！"},{"t":"p","x":"实例：请到/tmp底下尝试创建数个新目录看看："},{"t":"code","x":"[root@www ~]# cd /tmp\n\n[root@www tmp]# mkdir test \u003c==创建一名为 test 的新目录\n\n[root@www tmp]# mkdir test1/test2/test3/test4\n\nmkdir: cannot create directory `test1/test2/test3/test4': \n\nNo such file or directory \u003c== 没办法直接创建此目录啊！\n\n[root@www tmp]# mkdir -p test1/test2/test3/test4"},{"t":"p","x":"加了这个 -p 的选项，可以自行帮你创建多层目录！"},{"t":"p","x":"实例：创建权限为 rwx--x--x 的目录。"},{"t":"code","x":"[root@www tmp]# mkdir -m 711 test2\n\n[root@www tmp]# ls -l\n\ndrwxr-xr-x 3 root root 4096 Jul 18 12:50 test\n\ndrwxr-xr-x 3 root root 4096 Jul 18 12:53 test1\n\ndrwx--x--x 2 root root 4096 Jul 18 12:54 test2"},{"t":"p","x":"上面的权限部分，如果没有加上 -m 来强制配置属性，系统会使用默认属性。"},{"t":"p","x":"如果我们使用 -m ，如上例我们给予 -m 711 来给予新的目录 drwx--x--x 的权限。"},{"t":"h","x":"rmdir (删除空的目录)"},{"t":"p","x":"语法："},{"t":"code","x":"rmdir [-p] 目录名称"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-p ：从该目录起，一次删除多级空目录"},{"t":"p","x":"删除 runoob 目录"},{"t":"code","x":"[root@www tmp]# rmdir runoob/"},{"t":"p","x":"将 mkdir 实例中创建的目录(/tmp 底下)删除掉！"},{"t":"code","x":"[root@www tmp]# ls -l \u003c==看看有多少目录存在？\n\ndrwxr-xr-x 3 root root 4096 Jul 18 12:50 test\n\ndrwxr-xr-x 3 root root 4096 Jul 18 12:53 test1\n\ndrwx--x--x 2 root root 4096 Jul 18 12:54 test2\n\n[root@www tmp]# rmdir test \u003c==可直接删除掉，没问题\n\n[root@www tmp]# rmdir test1 \u003c==因为尚有内容，所以无法删除！\n\nrmdir: `test1': Directory not empty\n\n[root@www tmp]# rmdir -p test1/test2/test3/test4\n\n[root@www tmp]# ls -l \u003c==您看看，底下的输出中test与test1不见了！\n\ndrwx--x--x 2 root root 4096 Jul 18 12:54 test2"},{"t":"p","x":"利用 -p 这个选项，立刻就可以将 test1/test2/test3/test4 一次删除。"},{"t":"p","x":"不过要注意的是，这个 rmdir 仅能删除空的目录，你可以使用 rm 命令来删除非空目录。"},{"t":"h","x":"cp (复制文件或目录)"},{"t":"p","x":"cp 即拷贝文件和目录。"},{"t":"p","x":"语法:"},{"t":"code","x":"[root@www ~]# cp [-adfilprsu] 来源档(source) 目标档(destination)\n\n[root@www ~]# cp [options] source1 source2 source3 .... directory"},{"t":"p","x":"选项与参数："},{"t":"p","x":"-a：相当於 -pdr 的意思，至於 pdr 请参考下列说明；(常用)"},{"t":"p","x":"-d：若来源档为链接档的属性(link file)，则复制链接档属性而非文件本身；"},{"t":"p","x":"-f：为强制(force)的意思，若目标文件已经存在且无法开启，则移除后再尝试一次；"},{"t":"p","x":"-i：若目标档(destination)已经存在时，在覆盖时会先询问动作的进行(常用)"},{"t":"p","x":"-l：进行硬式链接(hard link)的链接档创建，而非复制文件本身；"},{"t":"p","x":"-p：连同文件的属性一起复制过去，而非使用默认属性(备份常用)；"},{"t":"p","x":"-r：递归持续复制，用於目录的复制行为；(常用)"},{"t":"p","x":"-s：复制成为符号链接档 (symbolic link)，亦即『捷径』文件；"},{"t":"p","x":"-u：若 destination 比 source 旧才升级 destination ！"},{"t":"p","x":"用 root 身份，将 root 目录下的 .bashrc 复制到 /tmp 下，并命名为 bashrc"},{"t":"code","x":"[root@www ~]# cp ~/.bashrc /tmp/bashrc\n\n[root@www ~]# cp -i ~/.bashrc /tmp/bashrc\n\ncp: overwrite `/tmp/bashrc'? n \u003c==n不覆盖，y为覆盖"},{"t":"h","x":"rm (移除文件或目录)"},{"t":"p","x":"语法："},{"t":"code","x":"rm [-fir] 文件或目录"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-f ：就是 force 的意思，忽略不存在的文件，不会出现警告信息；"},{"t":"li","x":"-i ：互动模式，在删除前会询问使用者是否动作"},{"t":"li","x":"-r ：递归删除啊！最常用在目录的删除了！这是非常危险的选项！！！"},{"t":"p","x":"将刚刚在 cp 的实例中创建的 bashrc 删除掉！"},{"t":"code","x":"[root@www tmp]# rm -i bashrc\n\nrm: remove regular file `bashrc'? y"},{"t":"p","x":"如果加上 -i 的选项就会主动询问喔，避免你删除到错误的档名！"},{"t":"h","x":"mv (移动文件与目录，或修改名称)"},{"t":"p","x":"语法："},{"t":"code","x":"[root@www ~]# mv [-fiu] source destination\n\n[root@www ~]# mv [options] source1 source2 source3 .... directory"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-f ：force 强制的意思，如果目标文件已经存在，不会询问而直接覆盖；"},{"t":"li","x":"-i ：若目标文件 (destination) 已经存在时，就会询问是否覆盖！"},{"t":"li","x":"-u ：若目标文件已经存在，且 source 比较新，才会升级 (update)"},{"t":"p","x":"复制一文件，创建一目录，将文件移动到目录中"},{"t":"code","x":"[root@www ~]# cd /tmp\n\n[root@www tmp]# cp ~/.bashrc bashrc\n\n[root@www tmp]# mkdir mvtest\n\n[root@www tmp]# mv bashrc mvtest"},{"t":"p","x":"将某个文件移动到某个目录去，就是这样做！"},{"t":"p","x":"将刚刚的目录名称更名为 mvtest2"},{"t":"code","x":"[root@www tmp]# mv mvtest mvtest2"},{"t":"h","x":"Linux 文件内容查看"},{"t":"p","x":"Linux系统中使用以下命令来查看文件的内容："},{"t":"li","x":"cat 由第一行开始显示文件内容"},{"t":"li","x":"tac 从最后一行开始显示，可以看出 tac 是 cat 的倒着写！"},{"t":"li","x":"nl 显示的时候，顺道输出行号！"},{"t":"li","x":"more 一页一页的显示文件内容"},{"t":"li","x":"less 与 more 类似，但是比 more 更好的是，他可以往前翻页！"},{"t":"li","x":"head 只看头几行"},{"t":"li","x":"tail 只看尾巴几行"},{"t":"p","x":"你可以使用 man [命令]来查看各个命令的使用文档，如 ：man cp。"},{"t":"h","x":"cat"},{"t":"p","x":"由第一行开始显示文件内容"},{"t":"p","x":"语法："},{"t":"code","x":"cat [-AbEnTv]"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-A ：相当於 -vET 的整合选项，可列出一些特殊字符而不是空白而已；"},{"t":"li","x":"-b ：列出行号，仅针对非空白行做行号显示，空白行不标行号！"},{"t":"li","x":"-E ：将结尾的断行字节 $ 显示出来；"},{"t":"li","x":"-n ：列印出行号，连同空白行也会有行号，与 -b 的选项不同；"},{"t":"li","x":"-T ：将 [tab] 按键以 ^I 显示出来；"},{"t":"li","x":"-v ：列出一些看不出来的特殊字符"},{"t":"p","x":"检看 /etc/issue 这个文件的内容："},{"t":"code","x":"[root@www ~]# cat /etc/issue\n\nCentOS release 6.4 (Final)\n\nKernel \\r on an \\m"},{"t":"h","x":"tac"},{"t":"p","x":"tac与cat命令刚好相反，文件内容从最后一行开始显示，可以看出 tac 是 cat 的倒着写！如："},{"t":"code","x":"[root@www ~]# tac /etc/issue\n\nKernel \\r on an \\m\n\nCentOS release 6.4 (Final)"},{"t":"h","x":"nl"},{"t":"p","x":"显示行号"},{"t":"p","x":"语法："},{"t":"code","x":"nl [-bnw] 文件"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-b ：指定行号指定的方式，主要有两种：\n\n -b a ：表示不论是否为空行，也同样列出行号(类似 cat -n)；\n\n -b t ：如果有空行，空的那一行不要列出行号(默认值)；"},{"t":"li","x":"-n ：列出行号表示的方法，主要有三种：\n\n -n ln ：行号在荧幕的最左方显示；\n\n -n rn ：行号在自己栏位的最右方显示，且不加 0 ；\n\n -n rz ：行号在自己栏位的最右方显示，且加 0 ；"},{"t":"li","x":"-w ：行号栏位的占用的位数。"},{"t":"p","x":"实例一：用 nl 列出 /etc/issue 的内容"},{"t":"code","x":"[root@www ~]# nl /etc/issue\n\n 1 CentOS release 6.4 (Final)\n\n 2 Kernel \\r on an \\m"},{"t":"h","x":"more"},{"t":"p","x":"一页一页翻动"},{"t":"code","x":"[root@www ~]# more /etc/man_db.config \n\n#\n\n# Generated automatically from man.conf.in by the\n\n# configure script.\n\n#\n\n# man.conf from man-1.6d\n\n....(中间省略)....\n\n--More--(28%) \u003c== 重点在这一行喔！你的光标也会在这里等待你的命令"},{"t":"p","x":"在 more 这个程序的运行过程中，你有几个按键可以按的："},{"t":"li","x":"空白键 (space)：代表向下翻一页；"},{"t":"li","x":"Enter ：代表向下翻『一行』；"},{"t":"li","x":"/字串 ：代表在这个显示的内容当中，向下搜寻『字串』这个关键字；"},{"t":"li","x":":f ：立刻显示出档名以及目前显示的行数；"},{"t":"li","x":"q ：代表立刻离开 more ，不再显示该文件内容。"},{"t":"li","x":"b 或 [ctrl]-b ：代表往回翻页，不过这动作只对文件有用，对管线无用。"},{"t":"h","x":"less"},{"t":"p","x":"一页一页翻动，以下实例输出/etc/man.config文件的内容："},{"t":"code","x":"[root@www ~]# less /etc/man.config\n\n#\n\n# Generated automatically from man.conf.in by the\n\n# configure script.\n\n#\n\n# man.conf from man-1.6d\n\n....(中间省略)....\n\n: \u003c== 这里可以等待你输入命令！"},{"t":"p","x":"less运行时可以输入的命令有："},{"t":"li","x":"空白键 ：向下翻动一页；"},{"t":"li","x":"[pagedown]：向下翻动一页；"},{"t":"li","x":"[pageup] ：向上翻动一页；"},{"t":"li","x":"/字串 ：向下搜寻『字串』的功能；"},{"t":"li","x":"?字串 ：向上搜寻『字串』的功能；"},{"t":"li","x":"n ：重复前一个搜寻 (与 / 或 ? 有关！)"},{"t":"li","x":"N ：反向的重复前一个搜寻 (与 / 或 ? 有关！)"},{"t":"li","x":"q ：离开 less 这个程序；"},{"t":"h","x":"head"},{"t":"p","x":"取出文件前面几行"},{"t":"p","x":"语法："},{"t":"code","x":"head [-n number] 文件"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-n ：后面接数字，代表显示几行的意思"},{"t":"code","x":"[root@www ~]# head /etc/man.config"},{"t":"p","x":"默认的情况中，显示前面 10 行！若要显示前 20 行，就得要这样："},{"t":"code","x":"[root@www ~]# head -n 20 /etc/man.config"},{"t":"h","x":"tail"},{"t":"p","x":"取出文件后面几行"},{"t":"p","x":"语法："},{"t":"code","x":"tail [-n number] 文件"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-n ：后面接数字，代表显示几行的意思"},{"t":"li","x":"-f ：表示持续侦测后面所接的档名，要等到按下[ctrl]-c才会结束tail的侦测"},{"t":"code","x":"[root@www ~]# tail /etc/man.config\n\n# 默认的情况中，显示最后的十行！若要显示最后的 20 行，就得要这样：\n\n[root@www ~]# tail -n 20 /etc/man.config"}]},{"key":"t12","name":"Linux 用户和用户组管理","desc":"useradd/usermod/userdel、passwd、/etc/passwd 与 /etc/group","group":"④ 用户与磁盘","diff":3,"blocks":[{"t":"h","x":"Linux 用户和用户组管理"},{"t":"p","x":"Linux系统是一个多用户多任务的分时操作系统，任何一个要使用系统资源的用户，都必须首先向系统管理员申请一个账号，然后以这个账号的身份进入系统。"},{"t":"p","x":"用户的账号一方面可以帮助系统管理员对使用系统的用户进行跟踪，并控制他们对系统资源的访问；另一方面也可以帮助用户组织文件，并为用户提供安全性保护。"},{"t":"p","x":"每个用户账号都拥有一个唯一的用户名和各自的口令。"},{"t":"p","x":"用户在登录时键入正确的用户名和口令后，就能够进入系统和自己的主目录。"},{"t":"p","x":"实现用户账号的管理，要完成的工作主要有如下几个方面："},{"t":"li","x":"用户账号的添加、删除与修改。"},{"t":"li","x":"用户口令的管理。"},{"t":"li","x":"用户组的管理。"},{"t":"h","x":"一、Linux系统用户账号的管理"},{"t":"p","x":"用户账号的管理工作主要涉及到用户账号的添加、修改和删除。"},{"t":"p","x":"添加用户账号就是在系统中创建一个新账号，然后为新账号分配用户号、用户组、主目录和登录Shell等资源。刚添加的账号是被锁定的，无法使用。"},{"t":"h","x":"1、添加新的用户账号使用useradd命令，其语法如下："},{"t":"code","x":"useradd 选项 用户名"},{"t":"p","x":"参数说明："},{"t":"p","x":"选项:"},{"t":"li","x":"-c comment 指定一段注释性描述。"},{"t":"li","x":"-d 目录 指定用户主目录，如果此目录不存在，则同时使用-m选项，可以创建主目录。"},{"t":"li","x":"-g 用户组 指定用户所属的用户组。"},{"t":"li","x":"-G 用户组，用户组 指定用户所属的附加组。"},{"t":"li","x":"-s Shell文件 指定用户的登录Shell。"},{"t":"li","x":"-u 用户号 指定用户的用户号，如果同时有-o选项，则可以重复使用其他用户的标识号。"},{"t":"p","x":"用户名:"},{"t":"h","x":"实例1"},{"t":"code","x":"# useradd –d /home/sam -m sam"},{"t":"p","x":"此命令创建了一个用户sam，其中-d和-m选项用来为登录名sam产生一个主目录 /home/sam（/home为默认的用户主目录所在的父目录）。"},{"t":"h","x":"实例2"},{"t":"code","x":"# useradd -s /bin/sh -g group –G adm,root gem"},{"t":"p","x":"此命令新建了一个用户gem，该用户的登录Shell是 /bin/sh，它属于group用户组，同时又属于adm和root用户组，其中group用户组是其主组。"},{"t":"p","x":"这里可能新建组：#groupadd group及groupadd adm"},{"t":"p","x":"增加用户账号就是在/etc/passwd文件中为新用户增加一条记录，同时更新其他系统文件如/etc/shadow, /etc/group等。"},{"t":"p","x":"Linux提供了集成的系统管理工具userconf，它可以用来对用户账号进行统一管理。"},{"t":"h","x":"2、删除帐号"},{"t":"p","x":"如果一个用户的账号不再使用，可以从系统中删除。删除用户账号就是要将/etc/passwd等系统文件中的该用户记录删除，必要时还删除用户的主目录。"},{"t":"p","x":"删除一个已有的用户账号使用userdel命令，其格式如下："},{"t":"code","x":"userdel 选项 用户名"},{"t":"p","x":"常用的选项是 -r，它的作用是把用户的主目录一起删除。"},{"t":"p","x":"例如："},{"t":"code","x":"# userdel -r sam"},{"t":"p","x":"此命令删除用户sam在系统文件中（主要是/etc/passwd, /etc/shadow, /etc/group等）的记录，同时删除用户的主目录。"},{"t":"h","x":"3、修改帐号"},{"t":"p","x":"修改用户账号就是根据实际情况更改用户的有关属性，如用户号、主目录、用户组、登录Shell等。"},{"t":"p","x":"修改已有用户的信息使用usermod命令，其格式如下："},{"t":"code","x":"usermod 选项 用户名"},{"t":"p","x":"常用的选项包括-c, -d, -m, -g, -G, -s, -u以及-o等，这些选项的意义与useradd命令中的选项一样，可以为用户指定新的资源值。"},{"t":"p","x":"另外，有些系统可以使用选项：-l 新用户名"},{"t":"p","x":"这个选项指定一个新的账号，即将原来的用户名改为新的用户名。"},{"t":"p","x":"例如："},{"t":"code","x":"# usermod -s /bin/ksh -d /home/z –g developer sam"},{"t":"p","x":"此命令将用户sam的登录Shell修改为ksh，主目录改为/home/z，用户组改为developer。"},{"t":"h","x":"4、用户口令的管理"},{"t":"p","x":"用户管理的一项重要内容是用户口令的管理。用户账号刚创建时没有口令，但是被系统锁定，无法使用，必须为其指定口令后才可以使用，即使是指定空口令。"},{"t":"p","x":"指定和修改用户口令的Shell命令是passwd。超级用户可以为自己和其他用户指定口令，普通用户只能用它修改自己的口令。命令的格式为："},{"t":"code","x":"passwd 选项 用户名"},{"t":"p","x":"可使用的选项："},{"t":"li","x":"-l 锁定口令，即禁用账号。"},{"t":"li","x":"-u 口令解锁。"},{"t":"li","x":"-d 使账号无口令。"},{"t":"li","x":"-f 强迫用户下次登录时修改口令。"},{"t":"p","x":"如果默认用户名，则修改当前用户的口令。"},{"t":"p","x":"例如，假设当前用户是sam，则下面的命令修改该用户自己的口令："},{"t":"code","x":"$ passwd \n\nOld password:****** \n\nNew password:******* \n\nRe-enter new password:*******"},{"t":"p","x":"如果是超级用户，可以用下列形式指定任何用户的口令："},{"t":"code","x":"# passwd sam \n\nNew password:******* \n\nRe-enter new password:*******"},{"t":"p","x":"普通用户修改自己的口令时，passwd命令会先询问原口令，验证后再要求用户输入两遍新口令，如果两次输入的口令一致，则将这个口令指定给用户；而超级用户为用户指定口令时，就不需要知道原口令。"},{"t":"p","x":"为了系统安全起见，用户应该选择比较复杂的口令，例如最好使用8位长的口令，口令中包含有大写、小写字母和数字，并且应该与姓名、生日等不相同。"},{"t":"p","x":"为用户指定空口令时，执行下列形式的命令："},{"t":"code","x":"# passwd -d sam"},{"t":"p","x":"此命令将用户 sam 的口令删除，这样用户 sam 下一次登录时，系统就不再允许该用户登录了。"},{"t":"p","x":"passwd 命令还可以用 -l(lock) 选项锁定某一用户，使其不能登录，例如："},{"t":"code","x":"# passwd -l sam"},{"t":"h","x":"二、Linux系统用户组的管理"},{"t":"p","x":"每个用户都有一个用户组，系统可以对一个用户组中的所有用户进行集中管理。不同Linux 系统对用户组的规定有所不同，如Linux下的用户属于与它同名的用户组，这个用户组在创建用户时同时创建。"},{"t":"p","x":"用户组的管理涉及用户组的添加、删除和修改。组的增加、删除和修改实际上就是对/etc/group文件的更新。"},{"t":"h","x":"1、增加一个新的用户组使用groupadd命令。其格式如下："},{"t":"code","x":"groupadd 选项 用户组"},{"t":"p","x":"可以使用的选项有："},{"t":"li","x":"-g GID 指定新用户组的组标识号（GID）。"},{"t":"li","x":"-o 一般与-g选项同时使用，表示新用户组的GID可以与系统已有用户组的GID相同。"},{"t":"h","x":"实例1："},{"t":"code","x":"# groupadd group1"},{"t":"p","x":"此命令向系统中增加了一个新组group1，新组的组标识号是在当前已有的最大组标识号的基础上加1。"},{"t":"h","x":"实例2："},{"t":"code","x":"# groupadd -g 101 group2"},{"t":"p","x":"此命令向系统中增加了一个新组group2，同时指定新组的组标识号是101。"},{"t":"h","x":"2、如果要删除一个已有的用户组，使用groupdel命令，其格式如下："},{"t":"code","x":"groupdel 用户组"},{"t":"h","x":"例如："},{"t":"code","x":"# groupdel group1"},{"t":"p","x":"此命令从系统中删除组group1。"},{"t":"h","x":"3、修改用户组的属性使用groupmod命令。其语法如下："},{"t":"code","x":"groupmod 选项 用户组"},{"t":"p","x":"常用的选项有："},{"t":"li","x":"-g GID 为用户组指定新的组标识号。"},{"t":"li","x":"-o 与-g选项同时使用，用户组的新GID可以与系统已有用户组的GID相同。"},{"t":"li","x":"-n新用户组 将用户组的名字改为新名字"},{"t":"h","x":"实例1："},{"t":"code","x":"# groupmod -g 102 group2"},{"t":"p","x":"此命令将组group2的组标识号修改为102。"},{"t":"h","x":"实例2："},{"t":"code","x":"# groupmod –g 10000 -n group3 group2"},{"t":"p","x":"此命令将组group2的标识号改为10000，组名修改为group3。"},{"t":"h","x":"4、如果一个用户同时属于多个用户组，那么用户可以在用户组之间切换，以便具有其他用户组的权限。"},{"t":"p","x":"用户可以在登录后，使用命令newgrp切换到其他用户组，这个命令的参数就是目的用户组。例如："},{"t":"code","x":"$ newgrp root"},{"t":"p","x":"这条命令将当前用户切换到root用户组，前提条件是root用户组确实是该用户的主组或附加组。类似于用户账号的管理，用户组的管理也可以通过集成的系统管理工具来完成。"},{"t":"h","x":"三、与用户账号有关的系统文件"},{"t":"p","x":"完成用户管理的工作有许多种方法，但是每一种方法实际上都是对有关的系统文件进行修改。"},{"t":"p","x":"与用户和用户组相关的信息都存放在一些系统文件中，这些文件包括/etc/passwd, /etc/shadow, /etc/group等。"},{"t":"p","x":"下面分别介绍这些文件的内容。"},{"t":"h","x":"1、/etc/passwd文件是用户管理工作涉及的最重要的一个文件。"},{"t":"p","x":"Linux系统中的每个用户都在/etc/passwd文件中有一个对应的记录行，它记录了这个用户的一些基本属性。"},{"t":"p","x":"这个文件对所有用户都是可读的。它的内容类似下面的例子："},{"t":"code","x":"＃ cat /etc/passwd\n\nroot:x:0:0:Superuser:/:\n\ndaemon:x:1:1:System daemons:/etc:\n\nbin:x:2:2:Owner of system commands:/bin:\n\nsys:x:3:3:Owner of system files:/usr/sys:\n\nadm:x:4:4:System accounting:/usr/adm:\n\nuucp:x:5:5:UUCP administrator:/usr/lib/uucp:\n\nauth:x:7:21:Authentication administrator:/tcb/files/auth:\n\ncron:x:9:16:Cron daemon:/usr/spool/cron:\n\nlisten:x:37:4:Network daemon:/usr/net/nls:\n\nlp:x:71:18:Printer administrator:/usr/spool/lp:\n\nsam:x:200:50:Sam san:/home/sam:/bin/sh"},{"t":"p","x":"从上面的例子我们可以看到，/etc/passwd中一行记录对应着一个用户，每行记录又被冒号(:)分隔为7个字段，其格式和具体含义如下："},{"t":"code","x":"用户名:口令:用户标识号:组标识号:注释性描述:主目录:登录Shell"},{"t":"h","x":"1）\"用户名\"是代表用户账号的字符串。"},{"t":"p","x":"通常长度不超过8个字符，并且由大小写字母和/或数字组成。登录名中不能有冒号(:)，因为冒号在这里是分隔符。"},{"t":"p","x":"为了兼容起见，登录名中最好不要包含点字符(.)，并且不使用连字符(-)和加号(+)打头。"},{"t":"h","x":"2）“口令”一些系统中，存放着加密后的用户口令字。"},{"t":"p","x":"虽然这个字段存放的只是用户口令的加密串，不是明文，但是由于/etc/passwd文件对所有用户都可读，所以这仍是一个安全隐患。因此，现在许多Linux 系统（如SVR4）都使用了shadow技术，把真正的加密后的用户口令字存放到/etc/shadow文件中，而在/etc/passwd文件的口令字段中只存放一个特殊的字符，例如“x”或者“*”。"},{"t":"h","x":"3）“用户标识号”是一个整数，系统内部用它来标识用户。"},{"t":"p","x":"一般情况下它与用户名是一一对应的。如果几个用户名对应的用户标识号是一样的，系统内部将把它们视为同一个用户，但是它们可以有不同的口令、不同的主目录以及不同的登录Shell等。"},{"t":"p","x":"通常用户标识号的取值范围是0～65 535。0是超级用户root的标识号，1～99由系统保留，作为管理账号，普通用户的标识号从100开始。在Linux系统中，这个界限是500。"},{"t":"h","x":"4）“组标识号”字段记录的是用户所属的用户组。"},{"t":"p","x":"它对应着/etc/group文件中的一条记录。"},{"t":"h","x":"5)“注释性描述”字段记录着用户的一些个人情况。"},{"t":"p","x":"例如用户的真实姓名、电话、地址等，这个字段并没有什么实际的用途。在不同的Linux 系统中，这个字段的格式并没有统一。在许多Linux系统中，这个字段存放的是一段任意的注释性描述文字，用做finger命令的输出。"},{"t":"h","x":"6)“主目录”，也就是用户的起始工作目录。"},{"t":"p","x":"它是用户在登录到系统之后所处的目录。在大多数系统中，各用户的主目录都被组织在同一个特定的目录下，而用户主目录的名称就是该用户的登录名。各用户对自己的主目录有读、写、执行（搜索）权限，其他用户对此目录的访问权限则根据具体情况设置。"},{"t":"h","x":"7)用户登录后，要启动一个进程，负责将用户的操作传给内核，这个进程是用户登录到系统后运行的命令解释器或某个特定的程序，即Shell。"},{"t":"p","x":"Shell是用户与Linux系统之间的接口。Linux的Shell有许多种，每种都有不同的特点。常用的有sh(Bourne Shell), csh(C Shell), ksh(Korn Shell), tcsh(TENEX/TOPS-20 type C Shell), bash(Bourne Again Shell)等。"},{"t":"p","x":"系统管理员可以根据系统情况和用户习惯为用户指定某个Shell。如果不指定Shell，那么系统使用sh为默认的登录Shell，即这个字段的值为/bin/sh。"},{"t":"p","x":"用户的登录Shell也可以指定为某个特定的程序（此程序不是一个命令解释器）。"},{"t":"p","x":"利用这一特点，我们可以限制用户只能运行指定的应用程序，在该应用程序运行结束后，用户就自动退出了系统。有些Linux 系统要求只有那些在系统中登记了的程序才能出现在这个字段中。"},{"t":"h","x":"8)系统中有一类用户称为伪用户（pseudo users）。"},{"t":"p","x":"这些用户在/etc/passwd文件中也占有一条记录，但是不能登录，因为它们的登录Shell为空。它们的存在主要是方便系统管理，满足相应的系统进程对文件属主的要求。"},{"t":"p","x":"常见的伪用户如下所示："},{"t":"code","x":"伪 用 户 含 义 \n\nbin 拥有可执行的用户命令文件 \n\nsys 拥有系统文件 \n\nadm 拥有帐户文件 \n\nuucp UUCP使用 \n\nlp lp或lpd子系统使用 \n\nnobody NFS使用"},{"t":"h","x":"拥有帐户文件"},{"t":"p","x":"1、除了上面列出的伪用户外，还有许多标准的伪用户，例如：audit, cron, mail, usenet等，它们也都各自为相关的进程和文件所需要。"},{"t":"p","x":"由于/etc/passwd文件是所有用户都可读的，如果用户的密码太简单或规律比较明显的话，一台普通的计算机就能够很容易地将它破解，因此对安全性要求较高的Linux系统都把加密后的口令字分离出来，单独存放在一个文件中，这个文件是/etc/shadow文件。\n\n有超级用户才拥有该文件读权限，这就保证了用户密码的安全性。"},{"t":"p","x":"2、/etc/shadow中的记录行与/etc/passwd中的一一对应，它由pwconv命令根据/etc/passwd中的数据自动产生"},{"t":"p","x":"它的文件格式与/etc/passwd类似，由若干个字段组成，字段之间用\":\"隔开。这些字段是："},{"t":"code","x":"登录名:加密口令:最后一次修改时间:最小时间间隔:最大时间间隔:警告时间:不活动时间:失效时间:标志"},{"t":"li","x":"\"登录名\"是与/etc/passwd文件中的登录名相一致的用户账号"},{"t":"li","x":"\"口令\"字段存放的是加密后的用户口令字，长度为13个字符。如果为空，则对应用户没有口令，登录时不需要口令；如果含有不属于集合 { ./0-9A-Za-z }中的字符，则对应的用户不能登录。"},{"t":"li","x":"\"最后一次修改时间\"表示的是从某个时刻起，到用户最后一次修改口令时的天数。时间起点对不同的系统可能不一样。例如在SCO Linux 中，这个时间起点是1970年1月1日。"},{"t":"li","x":"\"最小时间间隔\"指的是两次修改口令之间所需的最小天数。"},{"t":"li","x":"\"最大时间间隔\"指的是口令保持有效的最大天数。"},{"t":"li","x":"\"警告时间\"字段表示的是从系统开始警告用户到用户密码正式失效之间的天数。"},{"t":"li","x":"\"不活动时间\"表示的是用户没有登录活动但账号仍能保持有效的最大天数。"},{"t":"li","x":"\"失效时间\"字段给出的是一个绝对的天数，如果使用了这个字段，那么就给出相应账号的生存期。期满后，该账号就不再是一个合法的账号，也就不能再用来登录了。"},{"t":"p","x":"下面是/etc/shadow的一个例子："},{"t":"code","x":"＃ cat /etc/shadow\n\nroot:Dnakfw28zf38w:8764:0:168:7:::\n\ndaemon:*::0:0::::\n\nbin:*::0:0::::\n\nsys:*::0:0::::\n\nadm:*::0:0::::\n\nuucp:*::0:0::::\n\nnuucp:*::0:0::::\n\nauth:*::0:0::::\n\ncron:*::0:0::::\n\nlisten:*::0:0::::\n\nlp:*::0:0::::\n\nsam:EkdiSECLWPdSa:9740:0:0::::"},{"t":"h","x":"3、用户组的所有信息都存放在/etc/group文件中。"},{"t":"p","x":"将用户分组是Linux 系统中对用户进行管理及控制访问权限的一种手段。"},{"t":"p","x":"每个用户都属于某个用户组；一个组中可以有多个用户，一个用户也可以属于不同的组。"},{"t":"p","x":"当一个用户同时是多个组中的成员时，在/etc/passwd文件中记录的是用户所属的主组，也就是登录时所属的默认组，而其他组称为附加组。"},{"t":"p","x":"用户要访问属于附加组的文件时，必须首先使用newgrp命令使自己成为所要访问的组中的成员。"},{"t":"p","x":"用户组的所有信息都存放在/etc/group文件中。此文件的格式也类似于/etc/passwd文件，由冒号(:)隔开若干个字段，这些字段有："},{"t":"code","x":"组名:口令:组标识号:组内用户列表"},{"t":"li","x":"\"组名\"是用户组的名称，由字母或数字构成。与/etc/passwd中的登录名一样，组名不应重复。"},{"t":"li","x":"\"口令\"字段存放的是用户组加密后的口令字。一般Linux 系统的用户组都没有口令，即这个字段一般为空，或者是*。"},{"t":"li","x":"\"组标识号\"与用户标识号类似，也是一个整数，被系统内部用来标识组。"},{"t":"li","x":"\"组内用户列表\"是属于这个组的所有用户的列表，不同用户之间用逗号(,)分隔。这个用户组可能是用户的主组，也可能是附加组。"},{"t":"p","x":"/etc/group文件的一个例子如下："},{"t":"code","x":"root::0:root\n\nbin::2:root,bin\n\nsys::3:root,uucp\n\nadm::4:root,adm\n\ndaemon::5:root,daemon\n\nlp::7:root,lp\n\nusers::20:root,sam"},{"t":"h","x":"四、添加批量用户"},{"t":"p","x":"添加和删除用户对每位Linux系统管理员都是轻而易举的事，比较棘手的是如果要添加几十个、上百个甚至上千个用户时，我们不太可能还使用useradd一个一个地添加，必然要找一种简便的创建大量用户的方法。Linux系统提供了创建大量用户的工具，可以让您立即创建大量用户，方法如下："},{"t":"h","x":"（1）先编辑一个文本用户文件。"},{"t":"p","x":"每一列按照/etc/passwd密码文件的格式书写，要注意每个用户的用户名、UID、宿主目录都不可以相同，其中密码栏可以留做空白或输入x号。一个范例文件user.txt内容如下："},{"t":"code","x":"user001::600:100:user:/home/user001:/bin/bash\n\nuser002::601:100:user:/home/user002:/bin/bash\n\nuser003::602:100:user:/home/user003:/bin/bash\n\nuser004::603:100:user:/home/user004:/bin/bash\n\nuser005::604:100:user:/home/user005:/bin/bash\n\nuser006::605:100:user:/home/user006:/bin/bash"},{"t":"h","x":"（2）以root身份执行命令 /usr/sbin/newusers，从刚创建的用户文件user.txt中导入数据，创建用户："},{"t":"code","x":"# newusers \u003c user.txt"},{"t":"p","x":"然后可以执行命令 vipw 或 vi /etc/passwd 检查 /etc/passwd 文件是否已经出现这些用户的数据，并且用户的宿主目录是否已经创建。"},{"t":"h","x":"（3）执行命令/usr/sbin/pwunconv。"},{"t":"p","x":"将 /etc/shadow 产生的 shadow 密码解码，然后回写到 /etc/passwd 中，并将/etc/shadow的shadow密码栏删掉。这是为了方便下一步的密码转换工作，即先取消 shadow password 功能。"},{"t":"code","x":"# pwunconv"},{"t":"h","x":"（4）编辑每个用户的密码对照文件。"},{"t":"p","x":"格式为："},{"t":"code","x":"用户名:密码"},{"t":"p","x":"实例文件 passwd.txt 内容如下："},{"t":"code","x":"user001:123456\n\nuser002:123456\n\nuser003:123456\n\nuser004:123456\n\nuser005:123456\n\nuser006:123456"},{"t":"h","x":"（5）以 root 身份执行命令 /usr/sbin/chpasswd。"},{"t":"p","x":"创建用户密码，chpasswd 会将经过 /usr/bin/passwd 命令编码过的密码写入 /etc/passwd 的密码栏。"},{"t":"code","x":"# chpasswd \u003c passwd.txt"},{"t":"h","x":"（6）确定密码经编码写入/etc/passwd的密码栏后。"},{"t":"p","x":"执行命令 /usr/sbin/pwconv 将密码编码为 shadow password，并将结果写入 /etc/shadow。"},{"t":"code","x":"# pwconv"},{"t":"p","x":"这样就完成了大量用户的创建了，之后您可以到/home下检查这些用户宿主目录的权限设置是否都正确，并登录验证用户密码是否正确。"}]},{"key":"t13","name":"Linux 磁盘管理","desc":"df/du、分区、挂载与卸载（mount/umount）","group":"④ 用户与磁盘","diff":3,"blocks":[{"t":"h","x":"Linux 磁盘管理"},{"t":"p","x":"Linux 磁盘管理好坏直接关系到整个系统的性能问题。"},{"t":"p","x":"Linux 磁盘管理常用三个命令为 df、du 和 fdisk。"},{"t":"li","x":"df（英文全称：disk free）：列出文件系统的整体磁盘使用量"},{"t":"li","x":"du（英文全称：disk used）：检查磁盘空间使用量"},{"t":"li","x":"fdisk：用于磁盘分区"},{"t":"h","x":"df"},{"t":"p","x":"df命令参数功能：检查文件系统的磁盘空间占用情况。可以利用该命令来获取硬盘被占用了多少空间，目前还剩下多少空间等信息。"},{"t":"p","x":"语法："},{"t":"code","x":"df [-ahikHTm] [目录或文件名]"},{"t":"p","x":"选项与参数："},{"t":"p","x":"-h：以人类可读的方式显示输出结果（例如，使用 KB、MB、GB 等单位）。"},{"t":"p","x":"-T：显示文件系统的类型。"},{"t":"p","x":"-t \u003c文件系统类型>：只显示指定类型的文件系统。"},{"t":"p","x":"-i：显示 inode 使用情况。"},{"t":"p","x":"-H：该参数是 -h 的变体，但是使用 1000 字节作为基本单位而不是 1024 字节。这意味着它会以 SI（国际单位制）单位（例如 MB、GB）而不是二进制单位（例如 MiB、GiB）来显示磁盘使用情况。"},{"t":"p","x":"-k：这个选项会以 KB 作为单位显示磁盘空间使用情况。"},{"t":"p","x":"-a：该参数将显示所有的文件系统，包括虚拟文件系统，例如 proc、sysfs 等。如果没有使用该选项，默认情况下，df 命令不会显示虚拟文件系统。"},{"t":"h","x":"实例 1"},{"t":"p","x":"将系统内所有的文件系统列出来！"},{"t":"code","x":"[root@www ~]# df\n\nFilesystem 1K-blocks Used Available Use% Mounted on\n\n/dev/hdc2 9920624 3823112 5585444 41% /\n\n/dev/hdc3 4956316 141376 4559108 4% /home\n\n/dev/hdc1 101086 11126 84741 12% /boot\n\ntmpfs 371332 0 371332 0% /dev/shm"},{"t":"p","x":"在 Linux 底下如果 df 没有加任何选项，那么默认会将系统内所有的 \n\n(不含特殊内存内的文件系统与 swap) 都以 1 Kbytes 的容量来列出来！"},{"t":"h","x":"实例 2"},{"t":"p","x":"将容量结果以易读的容量格式显示出来"},{"t":"code","x":"[root@www ~]# df -h\n\nFilesystem Size Used Avail Use% Mounted on\n\n/dev/hdc2 9.5G 3.7G 5.4G 41% /\n\n/dev/hdc3 4.8G 139M 4.4G 4% /home\n\n/dev/hdc1 99M 11M 83M 12% /boot\n\ntmpfs 363M 0 363M 0% /dev/shm"},{"t":"h","x":"实例 3"},{"t":"p","x":"将系统内的所有特殊文件格式及名称都列出来"},{"t":"code","x":"[root@www ~]# df -aT\n\nFilesystem Type 1K-blocks Used Available Use% Mounted on\n\n/dev/hdc2 ext3 9920624 3823112 5585444 41% /\n\nproc proc 0 0 0 - /proc\n\nsysfs sysfs 0 0 0 - /sys\n\ndevpts devpts 0 0 0 - /dev/pts\n\n/dev/hdc3 ext3 4956316 141376 4559108 4% /home\n\n/dev/hdc1 ext3 101086 11126 84741 12% /boot\n\ntmpfs tmpfs 371332 0 371332 0% /dev/shm\n\nnone binfmt_misc 0 0 0 - /proc/sys/fs/binfmt_misc\n\nsunrpc rpc_pipefs 0 0 0 - /var/lib/nfs/rpc_pipefs"},{"t":"h","x":"实例 4"},{"t":"p","x":"将 /etc 底下的可用的磁盘容量以易读的容量格式显示"},{"t":"code","x":"[root@www ~]# df -h /etc\n\nFilesystem Size Used Avail Use% Mounted on\n\n/dev/hdc2 9.5G 3.7G 5.4G 41% /"},{"t":"h","x":"du"},{"t":"p","x":"Linux du 命令也是查看使用空间的，但是与 df 命令不同的是 Linux du 命令是对文件和目录磁盘使用的空间的查看，还是和df命令有一些区别的，这里介绍 Linux du 命令。"},{"t":"p","x":"语法："},{"t":"code","x":"du [-ahskm] 文件或目录名称"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-a ：列出所有的文件与目录容量，因为默认仅统计目录底下的文件量而已。"},{"t":"li","x":"-h ：以人们较易读的容量格式 (G/M) 显示；"},{"t":"li","x":"-s ：仅显示指定目录或文件的总大小，而不显示其子目录的大小。"},{"t":"li","x":"-S ：包括子目录下的总计，与 -s 有点差别。"},{"t":"li","x":"-k ：以 KBytes 列出容量显示；"},{"t":"li","x":"-m ：以 MBytes 列出容量显示；"},{"t":"h","x":"实例 1"},{"t":"p","x":"只列出当前目录下的所有文件夹容量（包括隐藏文件夹）:"},{"t":"code","x":"[root@www ~]# du\n\n8 ./test4 \u003c==每个目录都会列出来\n\n8 ./test2\n\n....中间省略....\n\n12 ./.gconfd \u003c==包括隐藏文件的目录\n\n220 . \u003c==这个目录(.)所占用的总量"},{"t":"p","x":"直接输入 du 没有加任何选项时，则 du 会分析当前所在目录里的子目录所占用的硬盘空间。"},{"t":"h","x":"实例 2"},{"t":"p","x":"将文件的容量也列出来"},{"t":"code","x":"[root@www ~]# du -a\n\n12 ./install.log.syslog \u003c==有文件的列表了\n\n8 ./.bash_logout\n\n8 ./test4\n\n8 ./test2\n\n....中间省略....\n\n12 ./.gconfd\n\n220 ."},{"t":"h","x":"实例 3"},{"t":"p","x":"检查根目录底下每个目录所占用的容量"},{"t":"code","x":"[root@www ~]# du -sm /*\n\n7 /bin\n\n6 /boot\n\n.....中间省略....\n\n0 /proc\n\n.....中间省略....\n\n1 /tmp\n\n3859 /usr \u003c==系统初期最大就是他了啦！\n\n77 /var"},{"t":"p","x":"通配符 * 来代表每个目录。"},{"t":"p","x":"与 df 不一样的是，du 这个命令其实会直接到文件系统内去搜寻所有的文件数据。"},{"t":"h","x":"fdisk"},{"t":"p","x":"fdisk 是 Linux 的磁盘分区表操作工具。"},{"t":"p","x":"语法："},{"t":"code","x":"fdisk [-l] 装置名称"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-l ：输出后面接的装置所有的分区内容。若仅有 fdisk -l 时，\n\n 则系统将会把整个系统内能够搜寻到的装置的分区均列出来。"},{"t":"h","x":"实例 1"},{"t":"p","x":"列出所有分区信息"},{"t":"code","x":"[root@AY120919111755c246621 tmp]# fdisk -l\n\nDisk /dev/xvda: 21.5 GB, 21474836480 bytes\n\n255 heads, 63 sectors/track, 2610 cylinders\n\nUnits = cylinders of 16065 * 512 = 8225280 bytes\n\nSector size (logical/physical): 512 bytes / 512 bytes\n\nI/O size (minimum/optimal): 512 bytes / 512 bytes\n\nDisk identifier: 0x00000000\n\n Device Boot Start End Blocks Id System\n\n/dev/xvda1 * 1 2550 20480000 83 Linux\n\n/dev/xvda2 2550 2611 490496 82 Linux swap / Solaris\n\nDisk /dev/xvdb: 21.5 GB, 21474836480 bytes\n\n255 heads, 63 sectors/track, 2610 cylinders\n\nUnits = cylinders of 16065 * 512 = 8225280 bytes\n\nSector size (logical/physical): 512 bytes / 512 bytes\n\nI/O size (minimum/optimal): 512 bytes / 512 bytes\n\nDisk identifier: 0x56f40944\n\n Device Boot Start End Blocks Id System\n\n/dev/xvdb2 1 2610 20964793+ 83 Linux"},{"t":"h","x":"实例 2"},{"t":"p","x":"找出你系统中的根目录所在磁盘，并查阅该硬盘内的相关信息"},{"t":"code","x":"[root@www ~]# df / \u003c==注意：重点在找出磁盘文件名而已\n\nFilesystem 1K-blocks Used Available Use% Mounted on\n\n/dev/hdc2 9920624 3823168 5585388 41% /\n\n[root@www ~]# fdisk /dev/hdc \u003c==仔细看，不要加上数字喔！\n\nThe number of cylinders for this disk is set to 5005.\n\nThere is nothing wrong with that, but this is larger than 1024,\n\nand could in certain setups cause problems with:\n\n1) software that runs at boot time (e.g., old versions of LILO)\n\n2) booting and partitioning software from other OSs\n\n (e.g., DOS FDISK, OS/2 FDISK)\n\nCommand (m for help): \u003c==等待你的输入！"},{"t":"p","x":"输入 m 后，就会看到底下这些命令介绍"},{"t":"code","x":"Command (m for help): m \u003c== 输入 m 后，就会看到底下这些命令介绍\n\nCommand action\n\n a toggle a bootable flag\n\n b edit bsd disklabel\n\n c toggle the dos compatibility flag\n\n d delete a partition \u003c==删除一个partition\n\n l list known partition types\n\n m print this menu\n\n n add a new partition \u003c==新增一个partition\n\n o create a new empty DOS partition table\n\n p print the partition table \u003c==在屏幕上显示分割表\n\n q quit without saving changes \u003c==不储存离开fdisk程序\n\n s create a new empty Sun disklabel\n\n t change a partition's system id\n\n u change display/entry units\n\n v verify the partition table\n\n w write table to disk and exit \u003c==将刚刚的动作写入分割表\n\n x extra functionality (experts only)"},{"t":"p","x":"离开 fdisk 时按下 q，那么所有的动作都不会生效！相反的， 按下w就是动作生效的意思。"},{"t":"code","x":"Command (m for help): p \u003c== 这里可以输出目前磁盘的状态\n\nDisk /dev/hdc: 41.1 GB, 41174138880 bytes \u003c==这个磁盘的文件名与容量\n\n255 heads, 63 sectors/track, 5005 cylinders \u003c==磁头、扇区与磁柱大小\n\nUnits = cylinders of 16065 * 512 = 8225280 bytes \u003c==每个磁柱的大小\n\n Device Boot Start End Blocks Id System\n\n/dev/hdc1 * 1 13 104391 83 Linux\n\n/dev/hdc2 14 1288 10241437+ 83 Linux\n\n/dev/hdc3 1289 1925 5116702+ 83 Linux\n\n/dev/hdc4 1926 5005 24740100 5 Extended\n\n/dev/hdc5 1926 2052 1020096 82 Linux swap / Solaris\n\n# 装置文件名 启动区否 开始磁柱 结束磁柱 1K大小容量 磁盘分区槽内的系统\n\nCommand (m for help): q"},{"t":"p","x":"想要不储存离开吗？按下 q 就对了！不要随便按 w 啊！"},{"t":"p","x":"使用 p 可以列出目前这颗磁盘的分割表信息，这个信息的上半部在显示整体磁盘的状态。"},{"t":"h","x":"磁盘格式化"},{"t":"p","x":"磁盘分割完毕后自然就是要进行文件系统的格式化，格式化的命令非常的简单，使用 mkfs（make filesystem） 命令。"},{"t":"p","x":"语法："},{"t":"code","x":"mkfs [-t 文件系统格式] 装置文件名"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-t ：可以接文件系统格式，例如 ext3, ext2, vfat 等(系统有支持才会生效)"},{"t":"h","x":"实例 1"},{"t":"p","x":"查看 mkfs 支持的文件格式"},{"t":"code","x":"[root@www ~]# mkfs[tab][tab]\n\nmkfs mkfs.cramfs mkfs.ext2 mkfs.ext3 mkfs.msdos mkfs.vfat"},{"t":"p","x":"按下两个[tab]，会发现 mkfs 支持的文件格式如上所示。"},{"t":"h","x":"实例 2"},{"t":"p","x":"将分区 /dev/hdc6（可指定你自己的分区） 格式化为 ext3 文件系统："},{"t":"code","x":"[root@www ~]# mkfs -t ext3 /dev/hdc6\n\nmke2fs 1.39 (29-May-2006)\n\nFilesystem label= \u003c==这里指的是分割槽的名称(label)\n\nOS type: Linux\n\nBlock size=4096 (log=2) \u003c==block 的大小配置为 4K \n\nFragment size=4096 (log=2)\n\n251392 inodes, 502023 blocks \u003c==由此配置决定的inode/block数量\n\n25101 blocks (5.00%) reserved for the super user\n\nFirst data block=0\n\nMaximum filesystem blocks=515899392\n\n16 block groups\n\n32768 blocks per group, 32768 fragments per group\n\n15712 inodes per group\n\nSuperblock backups stored on blocks:\n\n 32768, 98304, 163840, 229376, 294912\n\nWriting inode tables: done\n\nCreating journal (8192 blocks): done \u003c==有日志记录\n\nWriting superblocks and filesystem accounting information: done\n\nThis filesystem will be automatically checked every 34 mounts or\n\n180 days, whichever comes first. Use tune2fs -c or -i to override.\n\n# 这样就创建起来我们所需要的 Ext3 文件系统了！简单明了！"},{"t":"h","x":"磁盘检验"},{"t":"p","x":"fsck（file system check）用来检查和维护不一致的文件系统。"},{"t":"p","x":"若系统掉电或磁盘发生问题，可利用fsck命令对文件系统进行检查。"},{"t":"p","x":"语法："},{"t":"code","x":"fsck [-t 文件系统] [-ACay] 装置名称"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-t : 给定档案系统的型式，若在 /etc/fstab 中已有定义或 kernel 本身已支援的则不需加上此参数"},{"t":"li","x":"-s : 依序一个一个地执行 fsck 的指令来检查"},{"t":"li","x":"-A : 对/etc/fstab 中所有列出来的 分区（partition）做检查"},{"t":"li","x":"-C : 显示完整的检查进度"},{"t":"li","x":"-d : 打印出 e2fsck 的 debug 结果"},{"t":"li","x":"-p : 同时有 -A 条件时，同时有多个 fsck 的检查一起执行"},{"t":"li","x":"-R : 同时有 -A 条件时，省略 / 不检查"},{"t":"li","x":"-V : 详细显示模式"},{"t":"li","x":"-a : 如果检查有错则自动修复"},{"t":"li","x":"-r : 如果检查有错则由使用者回答是否修复"},{"t":"li","x":"-y : 选项指定检测每个文件是自动输入yes，在不确定那些是不正常的时候，可以执行 # fsck -y 全部检查修复。"},{"t":"h","x":"实例 1"},{"t":"p","x":"查看系统有多少文件系统支持的 fsck 命令："},{"t":"code","x":"[root@www ~]# fsck[tab][tab]\n\nfsck fsck.cramfs fsck.ext2 fsck.ext3 fsck.msdos fsck.vfat"},{"t":"h","x":"实例 2"},{"t":"p","x":"强制检测 /dev/hdc6 分区:"},{"t":"code","x":"[root@www ~]# fsck -C -f -t ext3 /dev/hdc6 \n\nfsck 1.39 (29-May-2006)\n\ne2fsck 1.39 (29-May-2006)\n\nPass 1: Checking inodes, blocks, and sizes\n\nPass 2: Checking directory structure\n\nPass 3: Checking directory connectivity\n\nPass 4: Checking reference counts\n\nPass 5: Checking group summary information\n\nvbird_logical: 11/251968 files (9.1% non-contiguous), 36926/1004046 blocks"},{"t":"p","x":"如果没有加上 -f 的选项，则由于这个文件系统不曾出现问题，检查的经过非常快速！若加上 -f 强制检查，才会一项一项的显示过程。"},{"t":"h","x":"磁盘挂载与卸除"},{"t":"p","x":"Linux 的磁盘挂载使用 mount 命令，卸载使用 umount 命令。"},{"t":"p","x":"磁盘挂载语法："},{"t":"code","x":"mount [-t 文件系统] [-L Label名] [-o 额外选项] [-n] 装置文件名 挂载点"},{"t":"h","x":"实例 1"},{"t":"p","x":"用默认的方式，将刚刚创建的 /dev/hdc6 挂载到 /mnt/hdc6 上面！"},{"t":"code","x":"[root@www ~]# mkdir /mnt/hdc6\n\n[root@www ~]# mount /dev/hdc6 /mnt/hdc6\n\n[root@www ~]# df\n\nFilesystem 1K-blocks Used Available Use% Mounted on\n\n.....中间省略.....\n\n/dev/hdc6 1976312 42072 1833836 3% /mnt/hdc6"},{"t":"p","x":"磁盘卸载命令 umount 语法："},{"t":"code","x":"umount [-fn] 装置文件名或挂载点"},{"t":"p","x":"选项与参数："},{"t":"li","x":"-f ：强制卸除！可用在类似网络文件系统 (NFS) 无法读取到的情况下；"},{"t":"li","x":"-n ：不升级 /etc/mtab 情况下卸除。"},{"t":"p","x":"卸载/dev/hdc6"},{"t":"code","x":"[root@www ~]# umount /dev/hdc6"}]},{"key":"t14","name":"Linux vi/vim","desc":"三种模式、常用快捷键、编辑与保存退出","group":"⑤ 编辑器与软件包","diff":2,"blocks":[{"t":"h","x":"Linux vi/vim"},{"t":"p","x":"所有的 Unix Like 系统都会内建 vi 文书编辑器，其他的文书编辑器则不一定会存在。"},{"t":"p","x":"但是目前我们使用比较多的是 vim 编辑器。"},{"t":"p","x":"vim 具有程序编辑的能力，可以主动的以字体颜色辨别语法的正确性，方便程序设计。"},{"t":"p","x":"相关文章：史上最全Vim快捷键键位图 — 入门到进阶"},{"t":"h","x":"什么是 vim？"},{"t":"p","x":"Vim 是从 vi 发展出来的一个文本编辑器。代码补全、编译及错误跳转等方便编程的功能特别丰富，在程序员中被广泛使用。"},{"t":"p","x":"简单的来说， vi 是老式的字处理器，不过功能已经很齐全了，但是还是有可以进步的地方。 vim 则可以说是程序开发者的一项很好用的工具。"},{"t":"p","x":"连 vim 的官方网站 (https://www.vim.org/) 自己也说 vim 是一个程序开发工具而不是文字处理软件。"},{"t":"h","x":"vim 键盘图"},{"t":"p","x":"↑ 点击任意按键，查看详细说明和示例用法"},{"t":"h","x":"vi/vim 的使用"},{"t":"p","x":"基本上 vi/vim 共分为三种模式，命令模式（Command Mode）、输入模式（Insert Mode）和命令行模式（Command-Line Mode）。"},{"t":"h","x":"命令模式"},{"t":"p","x":"用户刚刚启动 vi/vim，便进入了命令模式。"},{"t":"p","x":"此状态下敲击键盘动作会被 Vim 识别为命令，而非输入字符，比如我们此时按下 i，并不会输入一个字符，i 被当作了一个命令。"},{"t":"p","x":"以下是普通模式常用的几个命令："},{"t":"li","x":"i -- 切换到输入模式，在光标当前位置开始输入文本。"},{"t":"li","x":"x -- 删除当前光标所在处的字符。"},{"t":"li","x":": -- 切换到底线命令模式，以在最底一行输入命令。"},{"t":"li","x":"a -- 进入插入模式，在光标下一个位置开始输入文本。"},{"t":"li","x":"o：在当前行的下方插入一个新行，并进入插入模式。"},{"t":"li","x":"O -- 在当前行的上方插入一个新行，并进入插入模式。"},{"t":"li","x":"dd -- 剪切当前行。"},{"t":"li","x":"yy -- 复制当前行。"},{"t":"li","x":"p（小写） -- 粘贴剪贴板内容到光标下方。"},{"t":"li","x":"P（大写）-- 粘贴剪贴板内容到光标上方。"},{"t":"li","x":"u -- 撤销上一次操作。"},{"t":"li","x":"Ctrl + r -- 重做上一次撤销的操作。"},{"t":"li","x":":w -- 保存文件。"},{"t":"li","x":":q -- 退出 Vim 编辑器。"},{"t":"li","x":":q! -- 强制退出Vim 编辑器，不保存修改。"},{"t":"p","x":"若想要编辑文本，只需要启动 Vim，进入了命令模式，按下 i 切换到输入模式即可。"},{"t":"p","x":"命令模式只有一些最基本的命令，因此仍要依靠底线命令行模式输入更多命令。"},{"t":"h","x":"输入模式"},{"t":"p","x":"在命令模式下按下 i 就进入了输入模式，使用 Esc 键可以返回到普通模式。"},{"t":"p","x":"在输入模式中，可以使用以下按键："},{"t":"li","x":"字符按键以及Shift组合，输入字符"},{"t":"li","x":"ENTER，回车键，换行"},{"t":"li","x":"BACK SPACE，退格键，删除光标前一个字符"},{"t":"li","x":"DEL，删除键，删除光标后一个字符"},{"t":"li","x":"方向键，在文本中移动光标"},{"t":"li","x":"HOME/END，移动光标到行首/行尾"},{"t":"li","x":"Page Up/Page Down，上/下翻页"},{"t":"li","x":"Insert，切换光标为输入/替换模式，光标将变成竖线/下划线"},{"t":"li","x":"ESC，退出输入模式，切换到命令模式"},{"t":"h","x":"底线命令模式"},{"t":"p","x":"在命令模式下按下 :（英文冒号）就进入了底线命令模式。"},{"t":"p","x":"底线命令模式可以输入单个或多个字符的命令，可用的命令非常多。"},{"t":"p","x":"在底线命令模式中，基本的命令有（已经省略了冒号）："},{"t":"li","x":":w：保存文件。"},{"t":"li","x":":q：退出 Vim 编辑器。"},{"t":"li","x":":wq：保存文件并退出 Vim 编辑器。"},{"t":"li","x":":q!：强制退出Vim编辑器，不保存修改。"},{"t":"p","x":"按 ESC 键可随时退出底线命令模式。"},{"t":"p","x":"简单的说，我们可以将这三个模式想成底下的图标来表示："},{"t":"h","x":"vi/vim 使用实例"},{"t":"h","x":"使用 vi/vim 进入一般模式"},{"t":"p","x":"如果你想要使用 vi 来建立一个名为 runoob.txt 的文件时，你可以这样做："},{"t":"code","x":"$ vim runoob.txt"},{"t":"p","x":"直接输入 vi 文件名 就能够进入 vi 的一般模式了。请注意，记得 vi 后面一定要加文件名，不管该文件存在与否！"},{"t":"h","x":"按下 i 进入输入模式(也称为编辑模式)，开始编辑文字"},{"t":"p","x":"在一般模式之中，只要按下 i, o, a 等字符就可以进入输入模式了！"},{"t":"p","x":"在编辑模式当中，你可以发现在左下角状态栏中会出现 –INSERT- 的字样，那就是可以输入任意字符的提示。"},{"t":"p","x":"这个时候，键盘上除了 Esc 这个按键之外，其他的按键都可以视作为一般的输入按钮了，所以你可以进行任何的编辑。"},{"t":"h","x":"按下 ESC 按钮回到一般模式"},{"t":"p","x":"好了，假设我已经按照上面的样式给他编辑完毕了，那么应该要如何退出呢？是的！没错！就是给他按下 Esc 这个按钮即可！马上你就会发现画面左下角的 – INSERT – 不见了！"},{"t":"h","x":"在一般模式中按下 :wq 储存后离开 vi"},{"t":"p","x":"OK，我们要存档了，存盘并离开的指令很简单，输入 :wq 即可保存离开！"},{"t":"p","x":"OK! 这样我们就成功创建了一个 runoob.txt 的文件。"},{"t":"h","x":"vi/vim 按键说明"},{"t":"p","x":"除了上面简易范例的 i, Esc, :wq 之外，其实 vim 还有非常多的按键可以使用。"},{"t":"h","x":"第一部分：一般模式可用的光标移动、复制粘贴、搜索替换等"},{"t":"h","x":"第二部分：一般模式切换到编辑模式的可用的按钮说明"},{"t":"h","x":"第三部分：一般模式切换到指令行模式的可用的按钮说明"},{"t":"p","x":"特别注意，在 vi/vim 中，数字是很有意义的！数字通常代表重复做几次的意思！ 也有可能是代表去到第几个什么什么的意思。"},{"t":"p","x":"举例来说，要删除 50 行，则是用 『50dd』 对吧！ 数字加在动作之前，如我要向下移动 20 行呢？那就是『20j』或者是『20↓』即可。"}]},{"key":"t15","name":"Linux yum 命令","desc":"RPM 系（CentOS/RHEL）软件包安装、更新、卸载","group":"⑤ 编辑器与软件包","diff":2,"blocks":[{"t":"h","x":"Linux yum 命令"},{"t":"p","x":"yum 是 CentOS 5/6/7、RHEL 5/6/7 默认包管理器，依赖解析性能较差，复杂依赖场景易卡顿，目前官方已停止维护。"},{"t":"p","x":"从 CentOS 8、RHEL 8 及以上版本开始，系统默认采用继任工具 dnf；dnf 向下兼容绝大多数 yum 命令，使用习惯基本一致。"},{"t":"p","x":"yum（ Yellow dog Updater, Modified）是一个在 Fedora 和 RedHat 以及 SUSE 中的 Shell 前端软件包管理器。"},{"t":"p","x":"CentOS 8、RHEL 8 及以上版本开始请使用 dnf 命令：https://www.runoob.com/linux/linux-comm-dnf.html"},{"t":"p","x":"基于 RPM 包管理，能够从指定的服务器自动下载 RPM 包并且安装，可以自动处理依赖性关系，并且一次安装所有依赖的软件包，无须繁琐地一次次下载、安装。"},{"t":"p","x":"yum 提供了查找、安装、删除某一个、一组甚至全部软件包的命令，而且命令简洁而又好记。"},{"t":"h","x":"yum 语法"},{"t":"code","x":"yum [options] [command] [package ...]"},{"t":"li","x":"options：可选，选项包括-h（帮助），-y（当安装过程提示选择全部为 \"yes\"），-q（不显示安装的过程）等等。"},{"t":"li","x":"command：要进行的操作。"},{"t":"li","x":"package：安装的包名。"},{"t":"h","x":"yum常用命令"},{"t":"p","x":"1. 列出所有可更新的软件清单命令：yum check-update"},{"t":"p","x":"2. 更新所有软件命令：yum update"},{"t":"p","x":"3. 仅安装指定的软件命令：yum install \u003cpackage_name>"},{"t":"p","x":"4. 仅更新指定的软件命令：yum update \u003cpackage_name>"},{"t":"p","x":"5. 列出所有可安裝的软件清单命令：yum list"},{"t":"p","x":"6. 删除软件包命令：yum remove \u003cpackage_name>"},{"t":"p","x":"7. 查找软件包命令：yum search \u003ckeyword>"},{"t":"p","x":"8. 清除缓存命令:"},{"t":"li","x":"yum clean packages: 清除缓存目录下的软件包"},{"t":"li","x":"yum clean headers: 清除缓存目录下的 headers"},{"t":"li","x":"yum clean oldheaders: 清除缓存目录下旧的 headers"},{"t":"li","x":"yum clean, yum clean all (= yum clean packages; yum clean oldheaders) :清除缓存目录下的软件包及旧的 headers"},{"t":"h","x":"实例 1"},{"t":"p","x":"安装 pam-devel"},{"t":"code","x":"[root@www ~]# yum install pam-devel\n\nSetting up Install Process\n\nParsing package install arguments\n\nResolving Dependencies \u003c==先检查软件的属性相依问题\n\n--> Running transaction check\n\n---> Package pam-devel.i386 0:0.99.6.2-4.el5 set to be updated\n\n--> Processing Dependency: pam = 0.99.6.2-4.el5 for package: pam-devel\n\n--> Running transaction check\n\n---> Package pam.i386 0:0.99.6.2-4.el5 set to be updated\n\nfilelists.xml.gz 100% |=========================| 1.6 MB 00:05\n\nfilelists.xml.gz 100% |=========================| 138 kB 00:00\n\n-> Finished Dependency Resolution\n\n……(省略)"},{"t":"h","x":"实例 2"},{"t":"p","x":"移除 pam-devel"},{"t":"code","x":"[root@www ~]# yum remove pam-devel\n\nSetting up Remove Process\n\nResolving Dependencies \u003c==同样的，先解决属性相依的问题\n\n--> Running transaction check\n\n---> Package pam-devel.i386 0:0.99.6.2-4.el5 set to be erased\n\n--> Finished Dependency Resolution\n\nDependencies Resolved\n\n=============================================================================\n\n Package Arch Version Repository Size\n\n=============================================================================\n\nRemoving:\n\n pam-devel i386 0.99.6.2-4.el5 installed 495 k\n\nTransaction Summary\n\n=============================================================================\n\nInstall 0 Package(s)\n\nUpdate 0 Package(s)\n\nRemove 1 Package(s) \u003c==还好，并没有属性相依的问题，单纯移除一个软件\n\nIs this ok [y/N]: y\n\nDownloading Packages:\n\nRunning rpm_check_debug\n\nRunning Transaction Test\n\nFinished Transaction Test\n\nTransaction Test Succeeded\n\nRunning Transaction\n\n Erasing : pam-devel ######################### [1/1]\n\nRemoved: pam-devel.i386 0:0.99.6.2-4.el5\n\nComplete!"},{"t":"h","x":"实例 3"},{"t":"p","x":"利用 yum 的功能，找出以 pam 为开头的软件名称有哪些？"},{"t":"code","x":"[root@www ~]# yum list pam*\n\nInstalled Packages\n\npam.i386 0.99.6.2-3.27.el5 installed\n\npam_ccreds.i386 3-5 installed\n\npam_krb5.i386 2.2.14-1 installed\n\npam_passwdqc.i386 1.0.2-1.2.2 installed\n\npam_pkcs11.i386 0.5.3-23 installed\n\npam_smb.i386 1.1.7-7.2.1 installed\n\nAvailable Packages \u003c==底下则是『可升级』的或『未安装』的\n\npam.i386 0.99.6.2-4.el5 base\n\npam-devel.i386 0.99.6.2-4.el5 base\n\npam_krb5.i386 2.2.14-10 base"},{"t":"h","x":"国内 yum 源"},{"t":"p","x":"网易（163）yum 源是国内较好的 yum 源之一 ，无论是速度还是软件版本，都非常的不错。"},{"t":"p","x":"将yum源设置为163 yum，可以提升软件包安装和更新的速度，同时避免一些常见软件版本无法找到。"},{"t":"h","x":"安装步骤"},{"t":"p","x":"首先备份/etc/yum.repos.d/CentOS-Base.repo"},{"t":"code","x":"mv /etc/yum.repos.d/CentOS-Base.repo /etc/yum.repos.d/CentOS-Base.repo.backup"},{"t":"p","x":"下载对应版本 repo 文件, 放入 /etc/yum.repos.d/ (操作前请做好相应备份)"},{"t":"li","x":"CentOS5 ：http://mirrors.163.com/.help/CentOS5-Base-163.repo"},{"t":"li","x":"CentOS6 ：http://mirrors.163.com/.help/CentOS6-Base-163.repo"},{"t":"li","x":"CentOS7 ：http://mirrors.163.com/.help/CentOS7-Base-163.repo"},{"t":"code","x":"wget http://mirrors.163.com/.help/CentOS6-Base-163.repo\n\nmv CentOS6-Base-163.repo CentOS-Base.repo"},{"t":"p","x":"运行以下命令生成缓存"},{"t":"code","x":"yum clean all\n\nyum makecache"},{"t":"p","x":"除了网易之外，国内还有其他不错的 yum 源，比如中科大和搜狐。"},{"t":"p","x":"中科大的 yum 源，安装方法查看：https://lug.ustc.edu.cn/wiki/mirrors/help/centos"},{"t":"p","x":"sohu 的 yum 源安装方法查看: http://mirrors.sohu.com/help/centos.html"},{"t":"p","x":"阿里云的源：https://developer.aliyun.com/mirror/centos"}]},{"key":"t16","name":"Linux apt 命令","desc":"Debian 系（Ubuntu）软件包管理 apt/apt-get","group":"⑤ 编辑器与软件包","diff":2,"blocks":[{"t":"h","x":"Linux apt 命令"},{"t":"p","x":"apt（Advanced Packaging Tool）是一个在 Debian 和 Ubuntu 中的 Shell 前端软件包管理器。"},{"t":"p","x":"apt 命令提供了查找、安装、升级、删除某一个、一组甚至全部软件包的命令，而且命令简洁而又好记。"},{"t":"p","x":"apt 命令执行需要超级管理员权限(root)。"},{"t":"h","x":"apt 语法"},{"t":"code","x":"apt [options] [command] [package ...]"},{"t":"li","x":"options：可选，选项包括 -h（帮助），-y（当安装过程提示选择全部为\"yes\"），-q（不显示安装的过程）等等。"},{"t":"li","x":"command：要进行的操作。"},{"t":"li","x":"package：安装的包名。"},{"t":"h","x":"apt 常用命令"},{"t":"p","x":"列出所有可更新的软件清单命令：sudo apt update"},{"t":"p","x":"升级软件包：sudo apt upgrade"},{"t":"p","x":"列出可更新的软件包及版本信息：apt list --upgradable"},{"t":"p","x":"升级软件包，升级前先删除需要更新软件包：sudo apt full-upgrade"},{"t":"p","x":"安装指定的软件命令：sudo apt install \u003cpackage_name>"},{"t":"p","x":"安装多个软件包：sudo apt install \u003cpackage_1> \u003cpackage_2> \u003cpackage_3>"},{"t":"p","x":"更新指定的软件命令：sudo apt update \u003cpackage_name>"},{"t":"p","x":"显示软件包具体信息,例如：版本号，安装大小，依赖关系等等：sudo apt show \u003cpackage_name>"},{"t":"p","x":"删除软件包命令：sudo apt remove \u003cpackage_name>"},{"t":"p","x":"清理不再使用的依赖和库文件: sudo apt autoremove"},{"t":"p","x":"移除软件包及配置文件: sudo apt purge \u003cpackage_name>"},{"t":"p","x":"查找软件包命令： sudo apt search \u003ckeyword>"},{"t":"p","x":"列出所有已安装的包：apt list --installed"},{"t":"p","x":"列出所有已安装的包的版本信息：apt list --all-versions"},{"t":"h","x":"实例"},{"t":"p","x":"查看一些可更新的包："},{"t":"code","x":"sudo apt update"},{"t":"p","x":"升级安装包："},{"t":"code","x":"sudo apt upgrade"},{"t":"p","x":"在以上交互式输入字母 Y 即可开始升级。"},{"t":"p","x":"可以将以下两个命令组合起来，一键升级："},{"t":"code","x":"sudo apt update && sudo apt upgrade -y"},{"t":"p","x":"安装 mplayer 包："},{"t":"code","x":"sudo apt install mplayer"},{"t":"p","x":"如过不太记得完整的包名，我们可以只输入前半部分的包名，然后按下 Tab 键，会列出相关的包名："},{"t":"p","x":"以上实例我们输入来 reds，然后按下 Tab 键，输出来四个相关的包。"},{"t":"p","x":"如果我们想安装一个软件包，但如果软件包已经存在，则不要升级它，可以使用 –no-upgrade 选项:"},{"t":"code","x":"sudo apt install \u003cpackage_name> --no-upgrade"},{"t":"p","x":"安装 mplayer 如果存在则不要升级："},{"t":"code","x":"sudo apt install mplayer --no-upgrade"},{"t":"p","x":"如果只想升级，不要安装可以使用 --only-upgrade 参数："},{"t":"code","x":"sudo apt install \u003cpackage_name> --only-upgrade"},{"t":"p","x":"只升级 mplayer，如果不存在就不要安装它："},{"t":"code","x":"sudo apt install mplayer --only-upgrade"},{"t":"p","x":"如果需要设置指定版本，语法格式如下："},{"t":"code","x":"sudo apt install \u003cpackage_name>=\u003cversion_number>"},{"t":"p","x":"package_name 为包名，version_number 为版本号。"},{"t":"p","x":"移除包可以使用 remove 命令："},{"t":"code","x":"sudo apt remove mplayer"},{"t":"p","x":"查找名为 libimobile 的相关包："},{"t":"code","x":"apt search libimobile"},{"t":"p","x":"查看 pinta 包的相关信息："},{"t":"code","x":"apt show pinta"},{"t":"p","x":"列出可更新的软件包："},{"t":"code","x":"apt list --upgradeable"},{"t":"p","x":"清理不再使用的依赖和库文件："},{"t":"code","x":"sudo apt autoremove"},{"t":"p","x":"在以上交互式输入字母 Y 即可开始清理。"}]},{"key":"t17","name":"Shell 教程（总览）","desc":"Shell 是什么、Shell 脚本的创建与执行","group":"⑥ Shell 编程（12 讲完整版）","diff":3,"blocks":[{"t":"h","x":"Shell 教程"},{"t":"p","x":"Shell 是一个用 C 语言编写的程序，它是用户使用 Linux 的桥梁。Shell 既是一种命令语言，又是一种程序设计语言。"},{"t":"p","x":"Shell 是指一种应用程序，这个应用程序提供了一个界面，用户通过这个界面访问操作系统内核的服务。"},{"t":"p","x":"Ken Thompson 的 sh 是第一种 Unix Shell，Windows Explorer 是一个典型的图形界面 Shell。"},{"t":"p","x":"Shell 在线工具"},{"t":"h","x":"Shell 脚本"},{"t":"p","x":"Shell 脚本（shell script），是一种为 shell 编写的脚本程序。"},{"t":"p","x":"业界所说的 shell 通常都是指 shell 脚本，但读者朋友要知道，shell 和 shell script 是两个不同的概念。"},{"t":"p","x":"由于习惯的原因，简洁起见，本文出现的 \"shell编程\" 都是指 shell 脚本编程，不是指开发 shell 自身。"},{"t":"h","x":"Shell 环境"},{"t":"p","x":"Shell 编程跟 JavaScript、php 编程一样，只要有一个能编写代码的文本编辑器和一个能解释执行的脚本解释器就可以了。"},{"t":"p","x":"Linux 的 Shell 种类众多，常见的有："},{"t":"li","x":"Bourne Shell（/usr/bin/sh或/bin/sh）"},{"t":"li","x":"Bourne Again Shell（/bin/bash）"},{"t":"li","x":"C Shell（/usr/bin/csh）"},{"t":"li","x":"K Shell（/usr/bin/ksh）"},{"t":"li","x":"Shell for Root（/sbin/sh）"},{"t":"li","x":"……"},{"t":"p","x":"本教程关注的是 Bash，也就是 Bourne Again Shell，由于易用和免费，Bash 在日常工作中被广泛使用。同时，Bash 也是大多数Linux 系统默认的 Shell。"},{"t":"p","x":"在一般情况下，人们并不区分 Bourne Shell 和 Bourne Again Shell，所以，像 #!/bin/sh，它同样也可以改为 #!/bin/bash。"},{"t":"p","x":"#! 告诉系统其后路径所指定的程序即是解释此脚本文件的 Shell 程序。"},{"t":"h","x":"第一个shell脚本"},{"t":"p","x":"打开文本编辑器(可以使用 vi/vim 命令来创建文件)，新建一个文件 test.sh，扩展名为 sh（sh代表shell），扩展名并不影响脚本执行，见名知意就好，如果你用 php 写 shell 脚本，扩展名就用 php 好了。"},{"t":"p","x":"输入一些代码，第一行一般是这样："},{"t":"h","x":"实例"},{"t":"p","x":"#! 是一个约定的标记，它告诉系统这个脚本需要什么解释器来执行，即使用哪一种 Shell。"},{"t":"p","x":"echo 命令用于向窗口输出文本。"},{"t":"h","x":"运行 Shell 脚本有两种方法："},{"t":"p","x":"1、作为可执行程序"},{"t":"p","x":"将上面的代码保存为 test.sh，并 cd 到相应目录："},{"t":"code","x":"chmod +x ./test.sh #使脚本具有执行权限\n\n./test.sh #执行脚本"},{"t":"p","x":"注意，一定要写成 ./test.sh，而不是 test.sh，运行其它二进制的程序也一样，直接写 test.sh，linux 系统会去 PATH 里寻找有没有叫 test.sh 的，而只有 /bin, /sbin, /usr/bin，/usr/sbin 等在 PATH 里，你的当前目录通常不在 PATH 里，所以写成 test.sh 是会找不到命令的，要用 ./test.sh 告诉系统说，就在当前目录找。"},{"t":"p","x":"2、作为解释器参数"},{"t":"p","x":"这种运行方式是，直接运行解释器，其参数就是 shell 脚本的文件名，如："},{"t":"code","x":"/bin/sh test.sh\n\n/bin/php test.php"},{"t":"p","x":"这种方式运行的脚本，不需要在第一行指定解释器信息，写了也没用。"}]},{"key":"t18","name":"Shell 变量","desc":"变量定义、使用、只读变量、删除变量、变量类型","group":"⑥ Shell 编程（12 讲完整版）","diff":3,"blocks":[{"t":"h","x":"Shell 变量"},{"t":"p","x":"在 Shell 编程中，变量是用于存储数据值的名称。"},{"t":"p","x":"定义变量时，变量名不加美元符号（$，PHP语言中变量需要），如："},{"t":"p","x":"注意，变量名和等号之间不能有空格，这可能和你熟悉的所有编程语言都不一样。同时，变量名的命名须遵循如下规则："},{"t":"li","x":"只包含字母、数字和下划线： 变量名可以包含字母（大小写敏感）、数字和下划线 _，不能包含其他特殊字符。"},{"t":"li","x":"不能以数字开头： 变量名不能以数字开头，但可以包含数字。"},{"t":"li","x":"避免使用 Shell 关键字： 不要使用Shell的关键字（例如 if、then、else、fi、for、while 等）作为变量名，以免引起混淆。"},{"t":"li","x":"使用大写字母表示常量： 习惯上，常量的变量名通常使用大写字母，例如 PI=3.14。"},{"t":"li","x":"避免使用特殊符号： 尽量避免在变量名中使用特殊符号，因为它们可能与 Shell 的语法产生冲突。"},{"t":"li","x":"避免使用空格： 变量名中不应该包含空格，因为空格通常用于分隔命令和参数。"},{"t":"p","x":"有效的 Shell 变量名示例如下："},{"t":"code","x":"RUNOOB=\"www.runoob.com\"\n\nLD_LIBRARY_PATH=\"/bin/\"\n\n_var=\"123\"\n\nvar2=\"abc\""},{"t":"p","x":"无效的变量命名："},{"t":"code","x":"# 避免使用if作为变量名\n\nif=\"some_value\"\n\n# 避免使用 $ 等特殊符号\n\nvariable_with_$=42\n\n?var=123\n\nuser*name=runoob\n\n# 避免空格\n\nvariable with space=\"value\""},{"t":"p","x":"等号两侧避免使用空格："},{"t":"code","x":"# 正确的赋值\n\nvariable_name=value\n\n# 有可能会导致错误\n\nvariable_name = value"},{"t":"p","x":"除了显式地直接赋值，还可以用语句给变量赋值，如："},{"t":"p","x":"以上语句将 /etc 下目录的文件名循环出来。"},{"t":"h","x":"使用变量"},{"t":"p","x":"使用一个定义过的变量，只要在变量名前面加美元符号即可，如："},{"t":"h","x":"实例"},{"t":"p","x":"变量名外面的花括号是可选的，加不加都行，加花括号是为了帮助解释器识别变量的边界，比如下面这种情况："},{"t":"h","x":"实例"},{"t":"p","x":"如果不给skill变量加花括号，写成echo \"I am good at $skillScript\"，解释器就会把$skillScript当成一个变量（其值为空），代码执行结果就不是我们期望的样子了。"},{"t":"p","x":"推荐给所有变量加上花括号，这是个好的编程习惯。"},{"t":"p","x":"已定义的变量，可以被重新定义，如："},{"t":"h","x":"实例"},{"t":"p","x":"这样写是合法的，但注意，第二次赋值的时候不能写$your_name=\"alibaba\"，使用变量的时候才加美元符（$）。"},{"t":"h","x":"只读变量"},{"t":"p","x":"使用 readonly 命令可以将变量定义为只读变量，只读变量的值不能被改变。"},{"t":"p","x":"下面的例子尝试更改只读变量，结果报错："},{"t":"h","x":"实例"},{"t":"p","x":"运行脚本，结果如下："},{"t":"code","x":"/bin/sh: NAME: This variable is read only."},{"t":"h","x":"删除变量"},{"t":"p","x":"使用 unset 命令可以删除变量。语法："},{"t":"code","x":"unset variable_name"},{"t":"p","x":"变量被删除后不能再次使用。unset 命令不能删除只读变量。"},{"t":"p","x":"实例"},{"t":"h","x":"实例"},{"t":"p","x":"以上实例执行将没有任何输出。"},{"t":"h","x":"变量类型"},{"t":"p","x":"Shell 支持不同类型的变量，其中一些主要的类型包括："},{"t":"p","x":"字符串变量： 在 Shell中，变量通常被视为字符串。"},{"t":"p","x":"你可以使用单引号 ' 或双引号 \" 来定义字符串，例如："},{"t":"code","x":"my_string='Hello, World!'\n\n或者\n\nmy_string=\"Hello, World!\""},{"t":"p","x":"整数变量： 在一些Shell中，你可以使用 declare 或 typeset 命令来声明整数变量。"},{"t":"p","x":"这样的变量只包含整数值，例如："},{"t":"code","x":"declare -i my_integer=42"},{"t":"p","x":"这样的声明告诉 Shell 将 my_integer 视为整数，如果尝试将非整数值赋给它，Shell会尝试将其转换为整数。"},{"t":"p","x":"数组变量： Shell 也支持数组，允许你在一个变量中存储多个值。"},{"t":"p","x":"数组可以是整数索引数组或关联数组，以下是一个简单的整数索引数组的例子："},{"t":"code","x":"my_array=(1 2 3 4 5)"},{"t":"p","x":"或者关联数组："},{"t":"code","x":"declare -A associative_array\n\nassociative_array[\"name\"]=\"John\"\n\nassociative_array[\"age\"]=30"},{"t":"p","x":"环境变量： 这些是由操作系统或用户设置的特殊变量，用于配置 Shell 的行为和影响其执行环境。"},{"t":"p","x":"例如，PATH 变量包含了操作系统搜索可执行文件的路径："},{"t":"code","x":"echo $PATH"},{"t":"p","x":"特殊变量： 有一些特殊变量在 Shell 中具有特殊含义，例如 $0 表示脚本的名称，$1, $2, 等表示脚本的参数。"},{ 的参数个数"],["$*","以一个单字符串显示所有向脚本传递的参数"],["$$","脚本运行的当前进程ID号"],["$!","后台运行的最后一个进程的ID号"],["$@","与$*相同，但是使用时加引号，并在引号中返回每个参数。"],["$-","显示Shell使用的当前选项，与set命令功能相同。"],["$?","显示最后命令的退出状态。0表示没有错误，其他任何值表明有错误。"]]}]},{"key":"t27","name":"Shell 输入/输出重定向","desc":">/ >>/ \u003c/ 与 /dev/null、Here Document（镜像站独有）","group":"⑥ Shell 编程（12 讲完整版）","diff":3,"blocks":[{"t":"h","x":"Shell 输入/输出重定向"},{"t":"p","x":"大多数 UNIX 系统命令从你的终端接受输入并将所产生的输出发送回​​到您的终端。一个命令通常从一个叫标准输入的地方读取输入，默认情况下，这恰好是你的终端。同样，一个命令通常将其输出写入到标准输出，默认情况下，这也是你的终端。"},{"t":"p","x":"重定向命令列表如下："},{"t":"table","x":[["命令","说明"],["command > file","将输出重定向到 file。"],["command \u003c file","将输入重定向到 file。"],["command >> file","将输出以追加的方式重定向到 file。"],["n > file","将文件描述符为 n 的文件重定向到 file。"],["n >> file","将文件描述符为 n 的文件以追加的方式重定向到 file。"],["n >& m","将输出文件 m 和 n 合并。"],["n \u003c& m","将输入文件 m 和 n 合并。"],["\u003c\u003c tag","将开始标记 tag 和结束标记 tag 之间的内容作为输入。"]]},{"t":"p","x":"需要注意的是文件描述符 0 通常是标准输入（STDIN），1 是标准输出（STDOUT），2 是标准错误输出（STDERR）。"},{"t":"h","x":"输出重定向"},{"t":"p","x":"重定向一般通过在命令间插入特定的符号来实现。特别的，这些符号的语法如下所示:"},{"t":"code","x":"command1 > file1"},{"t":"p","x":"上面这个命令执行command1然后将输出的内容存入file1。"},{"t":"p","x":"注意任何file1内的已经存在的内容将被新内容替代。如果要将新内容添加在文件末尾，请使用>>操作符。"},{"t":"h","x":"实例"},{"t":"p","x":"执行下面的 who 命令，它将命令的完整的输出重定向在用户文件中(users):"},{"t":"code","x":"$ who > users"},{"t":"p","x":"执行后，并没有在终端输出信息，这是因为输出已被从默认的标准输出设备（终端）重定向到指定的文件。"},{"t":"p","x":"你可以使用 cat 命令查看文件内容："},{"t":"code","x":"$ cat users\n\n_mbsetupuser console Oct 31 17:35 \n\ntianqixin console Oct 31 17:35 \n\ntianqixin ttys000 Dec 1 11:33"},{"t":"p","x":"输出重定向会覆盖文件内容，请看下面的例子："},{"t":"code","x":"$ echo \"菜鸟教程：www.runoob.com\" > users\n\n$ cat users\n\n菜鸟教程：www.runoob.com\n\n$"},{"t":"p","x":"如果不希望文件内容被覆盖，可以使用 >> 追加到文件末尾，例如："},{"t":"code","x":"$ echo \"菜鸟教程：www.runoob.com\" >> users\n\n$ cat users\n\n菜鸟教程：www.runoob.com\n\n菜鸟教程：www.runoob.com\n\n$"},{"t":"h","x":"输入重定向"},{"t":"p","x":"和输出重定向一样，Unix 命令也可以从文件获取输入，语法为："},{"t":"code","x":"command1 \u003c file1"},{"t":"p","x":"这样，本来需要从键盘获取输入的命令会转移到文件读取内容。"},{"t":"p","x":"注意：输出重定向是大于号(>)，输入重定向是小于号(\u003c)。"},{"t":"h","x":"实例"},{"t":"p","x":"接着以上实例，我们需要统计 users 文件的行数,执行以下命令："},{"t":"code","x":"$ wc -l users\n\n 2 users"},{"t":"p","x":"也可以将输入重定向到 users 文件："},{"t":"code","x":"$ wc -l \u003c users\n\n 2"},{"t":"p","x":"注意：上面两个例子的结果不同：第一个例子，会输出文件名；第二个不会，因为它仅仅知道从标准输入读取内容。"},{"t":"code","x":"command1 \u003c infile > outfile"},{"t":"p","x":"同时替换输入和输出，执行command1，从文件infile读取内容，然后将输出写入到outfile中。"},{"t":"h","x":"重定向深入讲解"},{"t":"p","x":"一般情况下，每个 Unix/Linux 命令运行时都会打开三个文件："},{"t":"li","x":"标准输入文件(stdin)：stdin的文件描述符为0，Unix程序默认从stdin读取数据。"},{"t":"li","x":"标准输出文件(stdout)：stdout 的文件描述符为1，Unix程序默认向stdout输出数据。"},{"t":"li","x":"标准错误文件(stderr)：stderr的文件描述符为2，Unix程序会向stderr流中写入错误信息。"},{"t":"p","x":"默认情况下，command > file 将 stdout 重定向到 file，command \u003c file 将stdin 重定向到 file。"},{"t":"p","x":"如果希望 stderr 重定向到 file，可以这样写："},{"t":"code","x":"$ command 2>file"},{"t":"p","x":"如果希望 stderr 追加到 file 文件末尾，可以这样写："},{"t":"code","x":"$ command 2>>file"},{"t":"p","x":"2 表示标准错误文件(stderr)。"},{"t":"p","x":"如果希望将 stdout 和 stderr 合并后重定向到 file，可以这样写："},{"t":"code","x":"$ command > file 2>&1\n\n或者\n\n$ command >> file 2>&1"},{"t":"p","x":"如果希望对 stdin 和 stdout 都重定向，可以这样写："},{"t":"code","x":"$ command \u003c file1 >file2"},{"t":"p","x":"command 命令将 stdin 重定向到 file1，将 stdout 重定向到 file2。"},{"t":"h","x":"Here Document"},{"t":"p","x":"Here Document 是 Shell 中的一种特殊的重定向方式，用来将输入重定向到一个交互式 Shell 脚本或程序。"},{"t":"p","x":"它的基本的形式如下："},{"t":"code","x":"command \u003c\u003c delimiter\n\n document\n\ndelimiter"},{"t":"p","x":"它的作用是将两个 delimiter 之间的内容(document) 作为输入传递给 command。"},{"t":"p","x":"注意："},{"t":"li","x":"结尾的delimiter 一定要顶格写，前面不能有任何字符，后面也不能有任何字符，包括空格和 tab 缩进。"},{"t":"li","x":"开始的delimiter前后的空格会被忽略掉。"},{"t":"h","x":"实例"},{"t":"p","x":"在命令行中通过 wc -l 命令计算 Here Document 的行数："},{"t":"code","x":"$ wc -l \u003c\u003c EOF\n\n 欢迎来到\n\n 菜鸟教程\n\n www.runoob.com\n\nEOF\n\n3 # 输出结果为 3 行\n\n$"},{"t":"p","x":"我们也可以将 Here Document 用在脚本中，例如："},{"t":"code","x":"#!/bin/bash\n\n# author:菜鸟教程\n\n# url:www.runoob.com\n\ncat \u003c\u003c EOF\n\n欢迎来到\n\n菜鸟教程\n\nwww.runoob.com\n\nEOF"},{"t":"p","x":"执行以上脚本，输出结果："},{"t":"code","x":"欢迎来到\n\n菜鸟教程\n\nwww.runoob.com"},{"t":"h","x":"/dev/null 文件"},{"t":"p","x":"如果希望执行某个命令，但又不希望在屏幕上显示输出结果，那么可以将输出重定向到 /dev/null："},{"t":"code","x":"$ command > /dev/null"},{"t":"p","x":"/dev/null 是一个特殊的文件，写入到它的内容都会被丢弃；如果尝试从该文件读取内容，那么什么也读不到。但是 /dev/null 文件非常有用，将命令的输出重定向到它，会起到\"禁止输出\"的效果。"},{"t":"p","x":"如果希望屏蔽 stdout 和 stderr，可以这样写："},{"t":"code","x":"$ command > /dev/null 2>&1"},{"t":"p","x":"注意：0 是标准输入（STDIN），1 是标准输出（STDOUT），2 是标准错误输出（STDERR）。"},{"t":"p","x":"这里的 2 和 > 之间不可以有空格，2> 是一体的时候才表示错误输出。"}]},{"key":"t28","name":"Shell 文件包含","desc":"用 . 或 source 引入其他脚本文件（镜像站独有）","group":"⑥ Shell 编程（12 讲完整版）","diff":3,"blocks":[{"t":"h","x":"Shell 文件包含"},{"t":"p","x":"和其他语言一样，Shell 也可以包含外部脚本。这样可以很方便的封装一些公用的代码作为一个独立的文件。"},{"t":"p","x":"Shell 文件包含的语法格式如下："},{"t":"code","x":". filename # 注意点号(.)和文件名中间有一空格\n\n或\n\nsource filename"},{"t":"h","x":"实例"},{"t":"p","x":"创建两个 shell 脚本文件。"},{"t":"p","x":"test1.sh 代码如下："},{"t":"code","x":"#!/bin/bash\n\n# author:菜鸟教程\n\n# url:www.runoob.com\n\nurl=\"http://www.runoob.com\""},{"t":"p","x":"test2.sh 代码如下："},{"t":"code","x":"#!/bin/bash\n\n# author:菜鸟教程\n\n# url:www.runoob.com\n\n#使用 . 号来引用test1.sh 文件\n\n. ./test1.sh\n\n# 或者使用以下包含文件代码\n\n# source ./test1.sh\n\necho \"菜鸟教程官网地址：$url\""},{"t":"p","x":"接下来，我们为 test2.sh 添加可执行权限并执行："},{"t":"code","x":"$ chmod +x test2.sh \n\n$ ./test2.sh \n\n菜鸟教程官网地址：http://www.runoob.com"},{"t":"p","x":"注：被包含的文件 test1.sh 不需要可执行权限。"}]},{"key":"t29","name":"Nginx 安装配置","desc":"Nginx 编译安装、配置虚拟主机、启动与重启","group":"⑦ 服务与实战部署","diff":4,"blocks":[{"t":"h","x":"Nginx 安装配置"},{"t":"p","x":"Nginx(\"engine x\")是一款是由俄罗斯的程序设计师Igor Sysoev所开发高性能的 Web和 反向代理 服务器，也是一个 IMAP/POP3/SMTP 代理服务器。"},{"t":"p","x":"在高连接并发的情况下，Nginx是Apache服务器不错的替代品。"},{"t":"h","x":"Nginx 安装"},{"t":"p","x":"系统平台：CentOS release 6.6 (Final) 64位。"},{"t":"h","x":"一、安装编译工具及库文件"},{"t":"code","x":"yum -y install make zlib zlib-devel gcc-c++ libtool openssl openssl-devel"},{"t":"h","x":"二、首先要安装 PCRE"},{"t":"p","x":"PCRE 作用是让 Nginx 支持 Rewrite 功能。"},{"t":"p","x":"1、下载 PCRE 安装包，下载地址： http://downloads.sourceforge.net/project/pcre/pcre/8.35/pcre-8.35.tar.gz"},{"t":"code","x":"[root@bogon src]# cd /usr/local/src/\n\n[root@bogon src]# wget http://downloads.sourceforge.net/project/pcre/pcre/8.35/pcre-8.35.tar.gz"},{"t":"p","x":"2、解压安装包:"},{"t":"code","x":"[root@bogon src]# tar zxvf pcre-8.35.tar.gz"},{"t":"p","x":"3、进入安装包目录"},{"t":"code","x":"[root@bogon src]# cd pcre-8.35"},{"t":"p","x":"4、编译安装"},{"t":"code","x":"[root@bogon pcre-8.35]# ./configure\n\n[root@bogon pcre-8.35]# make && make install"},{"t":"p","x":"5、查看pcre版本"},{"t":"code","x":"[root@bogon pcre-8.35]# pcre-config --version"},{"t":"h","x":"安装 Nginx"},{"t":"p","x":"1、下载 Nginx，下载地址：https://nginx.org/en/download.html"},{"t":"code","x":"[root@bogon src]# cd /usr/local/src/\n\n[root@bogon src]# wget http://nginx.org/download/nginx-1.6.2.tar.gz"},{"t":"p","x":"2、解压安装包"},{"t":"code","x":"[root@bogon src]# tar zxvf nginx-1.6.2.tar.gz"},{"t":"p","x":"3、进入安装包目录"},{"t":"code","x":"[root@bogon src]# cd nginx-1.6.2"},{"t":"p","x":"4、编译安装"},{"t":"code","x":"[root@bogon nginx-1.6.2]# ./configure --prefix=/usr/local/webserver/nginx --with-http_stub_status_module --with-http_ssl_module --with-pcre=/usr/local/src/pcre-8.35\n\n[root@bogon nginx-1.6.2]# make\n\n[root@bogon nginx-1.6.2]# make install"},{"t":"p","x":"5、查看nginx版本"},{"t":"code","x":"[root@bogon nginx-1.6.2]# /usr/local/webserver/nginx/sbin/nginx -v"},{"t":"p","x":"到此，nginx安装完成。"},{"t":"h","x":"Nginx 配置"},{"t":"p","x":"创建 Nginx 运行使用的用户 www："},{"t":"code","x":"[root@bogon conf]# /usr/sbin/groupadd www \n\n[root@bogon conf]# /usr/sbin/useradd -g www www"},{"t":"p","x":"配置nginx.conf\n\n，将/usr/local/webserver/nginx/conf/nginx.conf替换为以下内容"},{"t":"code","x":"[root@bogon conf]# cat /usr/local/webserver/nginx/conf/nginx.conf\n\nuser www www;\n\nworker_processes 2; #设置值和CPU核心数一致\n\nerror_log /usr/local/webserver/nginx/logs/nginx_error.log crit; #日志位置和日志级别\n\npid /usr/local/webserver/nginx/nginx.pid;\n\n#Specifies the value for maximum file descriptors that can be opened by this process.\n\nworker_rlimit_nofile 65535;\n\nevents\n\n{\n\n use epoll;\n\n worker_connections 65535;\n\n}\n\nhttp\n\n{\n\n include mime.types;\n\n default_type application/octet-stream;\n\n log_format main '$remote_addr - $remote_user [$time_local] \"$request\" '\n\n '$status $body_bytes_sent \"$http_referer\" '\n\n '\"$http_user_agent\" $http_x_forwarded_for';\n\n \n\n#charset gb2312;\n\n \n\n server_names_hash_bucket_size 128;\n\n client_header_buffer_size 32k;\n\n large_client_header_buffers 4 32k;\n\n client_max_body_size 8m;\n\n \n\n sendfile on;\n\n tcp_nopush on;\n\n keepalive_timeout 60;\n\n tcp_nodelay on;\n\n fastcgi_connect_timeout 300;\n\n fastcgi_send_timeout 300;\n\n fastcgi_read_timeout 300;\n\n fastcgi_buffer_size 64k;\n\n fastcgi_buffers 4 64k;\n\n fastcgi_busy_buffers_size 128k;\n\n fastcgi_temp_file_write_size 128k;\n\n gzip on; \n\n gzip_min_length 1k;\n\n gzip_buffers 4 16k;\n\n gzip_http_version 1.0;\n\n gzip_comp_level 2;\n\n gzip_types text/plain application/x-javascript text/css application/xml;\n\n gzip_vary on;\n\n \n\n #limit_zone crawler $binary_remote_addr 10m;\n\n #下面是server虚拟主机的配置\n\n server\n\n {\n\n listen 80;#监听端口\n\n server_name localhost;#域名\n\n index index.html index.htm index.php;\n\n root /usr/local/webserver/nginx/html;#站点目录\n\n location ~ .*\\.(php|php5)?$\n\n {\n\n #fastcgi_pass unix:/tmp/php-cgi.sock;\n\n fastcgi_pass 127.0.0.1:9000;\n\n fastcgi_index index.php;\n\n include fastcgi.conf;\n\n }\n\n location ~ .*\\.(gif|jpg|jpeg|png|bmp|swf|ico)$\n\n {\n\n expires 30d;\n\n # access_log off;\n\n }\n\n location ~ .*\\.(js|css)?$\n\n {\n\n expires 15d;\n\n # access_log off;\n\n }\n\n access_log off;\n\n }\n\n}"},{"t":"p","x":"检查配置文件nginx.conf的正确性命令："},{"t":"code","x":"[root@bogon conf]# /usr/local/webserver/nginx/sbin/nginx -t"},{"t":"h","x":"启动 Nginx"},{"t":"p","x":"Nginx 启动命令如下："},{"t":"code","x":"[root@bogon conf]# /usr/local/webserver/nginx/sbin/nginx"},{"t":"h","x":"访问站点"},{"t":"p","x":"从浏览器访问我们配置的站点ip："},{"t":"h","x":"Nginx 其他命令"},{"t":"p","x":"以下包含了 Nginx 常用的几个命令："},{"t":"code","x":"/usr/local/webserver/nginx/sbin/nginx -s reload # 重新载入配置文件\n\n/usr/local/webserver/nginx/sbin/nginx -s reopen # 重启 Nginx\n\n/usr/local/webserver/nginx/sbin/nginx -s stop # 停止 Nginx"}]},{"key":"t30","name":"MySQL 安装配置","desc":"MySQL 安装、初始化、用户与权限、常用运维命令","group":"⑦ 服务与实战部署","diff":4,"blocks":[{"t":"h","x":"MySQL 安装配置"},{"t":"p","x":"MySQL 是最流行的关系型数据库管理系统，由瑞典MySQL AB公司开发，目前属于Oracle公司。"},{"t":"p","x":"MySQL所使用的SQL语言是用于访问数据库的最常用标准化语言。"},{"t":"p","x":"MySQL由于其体积小、速度快、总体拥有成本低，尤其是开放源码这一特点，一般中小型网站的开发都选择MySQL作为网站数据库。"},{"t":"h","x":"MySQL 安装"},{"t":"p","x":"本教程的系统平台：CentOS release 6.6 (Final) 64位。"},{"t":"h","x":"一、安装编译工具及库文件"},{"t":"code","x":"yum -y install gcc gcc-c++ make autoconf libtool-ltdl-devel gd-devel freetype-devel libxml2-devel libjpeg-devel libpng-devel openssl-devel curl-devel bison patch unzip libmcrypt-devel libmhash-devel ncurses-devel sudo bzip2 flex libaio-devel"},{"t":"h","x":"二、 安装cmake 编译器"},{"t":"p","x":"cmake 版本：cmake-3.1.1。"},{"t":"p","x":"1、下载地址：http://www.cmake.org/files/v3.1/cmake-3.1.1.tar.gz"},{"t":"code","x":"$ wget http://www.cmake.org/files/v3.1/cmake-3.1.1.tar.gz"},{"t":"p","x":"2、解压安装包"},{"t":"code","x":"$ tar zxvf cmake-3.1.1.tar.gz"},{"t":"p","x":"3、进入安装包目录"},{"t":"code","x":"$ cd cmake-3.1.1"},{"t":"p","x":"4、编译安装"},{"t":"code","x":"$ ./bootstrap\n\n$ make && make install"},{"t":"h","x":"三、安装 MySQL"},{"t":"p","x":"MySQL版本：mysql-5.6.15。"},{"t":"p","x":"1、下载地址： http://dev.mysql.com/get/Downloads/MySQL-5.6/mysql-5.6.15.tar.gz"},{"t":"code","x":"$ wget http://dev.mysql.com/get/Downloads/MySQL-5.6/mysql-5.6.15.tar.gz"},{"t":"p","x":"2、解压安装包"},{"t":"code","x":"$ tar zxvf mysql-5.6.15.tar.gz"},{"t":"p","x":"3、进入安装包目录"},{"t":"code","x":"$ cd mysql-5.6.15"},{"t":"p","x":"4、编译安装"},{"t":"code","x":"$ cmake -DCMAKE_INSTALL_PREFIX=/usr/local/webserver/mysql/ -DMYSQL_UNIX_ADDR=/tmp/mysql.sock -DDEFAULT_CHARSET=utf8 -DDEFAULT_COLLATION=utf8_general_ci -DWITH_EXTRA_CHARSETS=all -DWITH_MYISAM_STORAGE_ENGINE=1 -DWITH_INNOBASE_STORAGE_ENGINE=1 -DWITH_MEMORY_STORAGE_ENGINE=1 -DWITH_READLINE=1 -DWITH_INNODB_MEMCACHED=1 -DWITH_DEBUG=OFF -DWITH_ZLIB=bundled -DENABLED_LOCAL_INFILE=1 -DENABLED_PROFILING=ON -DMYSQL_MAINTAINER_MODE=OFF -DMYSQL_DATADIR=/usr/local/webserver/mysql/data -DMYSQL_TCP_PORT=3306\n\n$ make && make install"},{"t":"p","x":"5、查看mysql版本:"},{"t":"code","x":"$ /usr/local/webserver/mysql/bin/mysql --version"},{"t":"p","x":"到此，mysql安装完成。"},{"t":"h","x":"MySQL 配置"},{"t":"p","x":"1、创建mysql运行使用的用户mysql："},{"t":"code","x":"$ /usr/sbin/groupadd mysql\n\n$ /usr/sbin/useradd -g mysql mysql"},{"t":"p","x":"2、创建binlog和库的存储路径并赋予mysql用户权限"},{"t":"code","x":"$ mkdir -p /usr/local/webserver/mysql/binlog /www/data_mysql\n\n$ chown mysql.mysql /usr/local/webserver/mysql/binlog/ /www/data_mysql/"},{"t":"p","x":"3、创建my.cnf配置文件"},{"t":"p","x":"将/etc/my.cnf替换为下面内容"},{"t":"code","x":"$ cat /etc/my.cnf\n\n[client]\n\nport = 3306\n\nsocket = /tmp/mysql.sock\n\n[mysqld]\n\nreplicate-ignore-db = mysql\n\nreplicate-ignore-db = test\n\nreplicate-ignore-db = information_schema\n\nuser = mysql\n\nport = 3306\n\nsocket = /tmp/mysql.sock\n\nbasedir = /usr/local/webserver/mysql\n\ndatadir = /www/data_mysql\n\nlog-error = /usr/local/webserver/mysql/mysql_error.log\n\npid-file = /usr/local/webserver/mysql/mysql.pid\n\nopen_files_limit = 65535\n\nback_log = 600\n\nmax_connections = 5000\n\nmax_connect_errors = 1000\n\ntable_open_cache = 1024\n\nexternal-locking = FALSE\n\nmax_allowed_packet = 32M\n\nsort_buffer_size = 1M\n\njoin_buffer_size = 1M\n\nthread_cache_size = 600\n\n#thread_concurrency = 8\n\nquery_cache_size = 128M\n\nquery_cache_limit = 2M\n\nquery_cache_min_res_unit = 2k\n\ndefault-storage-engine = MyISAM\n\ndefault-tmp-storage-engine=MYISAM\n\nthread_stack = 192K\n\ntransaction_isolation = READ-COMMITTED\n\ntmp_table_size = 128M\n\nmax_heap_table_size = 128M\n\nlog-slave-updates\n\nlog-bin = /usr/local/webserver/mysql/binlog/binlog\n\nbinlog-do-db=oa_fb\n\nbinlog-ignore-db=mysql\n\nbinlog_cache_size = 4M\n\nbinlog_format = MIXED\n\nmax_binlog_cache_size = 8M\n\nmax_binlog_size = 1G\n\nrelay-log-index = /usr/local/webserver/mysql/relaylog/relaylog\n\nrelay-log-info-file = /usr/local/webserver/mysql/relaylog/relaylog\n\nrelay-log = /usr/local/webserver/mysql/relaylog/relaylog\n\nexpire_logs_days = 10\n\nkey_buffer_size = 256M\n\nread_buffer_size = 1M\n\nread_rnd_buffer_size = 16M\n\nbulk_insert_buffer_size = 64M\n\nmyisam_sort_buffer_size = 128M\n\nmyisam_max_sort_file_size = 10G\n\nmyisam_repair_threads = 1\n\nmyisam_recover\n\ninteractive_timeout = 120\n\nwait_timeout = 120\n\nskip-name-resolve\n\n#master-connect-retry = 10\n\nslave-skip-errors = 1032,1062,126,1114,1146,1048,1396\n\n#master-host = 192.168.1.2\n\n#master-user = username\n\n#master-password = password\n\n#master-port = 3306\n\nserver-id = 1\n\nloose-innodb-trx=0 \n\nloose-innodb-locks=0 \n\nloose-innodb-lock-waits=0 \n\nloose-innodb-cmp=0 \n\nloose-innodb-cmp-per-index=0\n\nloose-innodb-cmp-per-index-reset=0\n\nloose-innodb-cmp-reset=0 \n\nloose-innodb-cmpmem=0 \n\nloose-innodb-cmpmem-reset=0 \n\nloose-innodb-buffer-page=0 \n\nloose-innodb-buffer-page-lru=0 \n\nloose-innodb-buffer-pool-stats=0 \n\nloose-innodb-metrics=0 \n\nloose-innodb-ft-default-stopword=0 \n\nloose-innodb-ft-inserted=0 \n\nloose-innodb-ft-deleted=0 \n\nloose-innodb-ft-being-deleted=0 \n\nloose-innodb-ft-config=0 \n\nloose-innodb-ft-index-cache=0 \n\nloose-innodb-ft-index-table=0 \n\nloose-innodb-sys-tables=0 \n\nloose-innodb-sys-tablestats=0 \n\nloose-innodb-sys-indexes=0 \n\nloose-innodb-sys-columns=0 \n\nloose-innodb-sys-fields=0 \n\nloose-innodb-sys-foreign=0 \n\nloose-innodb-sys-foreign-cols=0\n\nslow_query_log_file=/usr/local/webserver/mysql/mysql_slow.log\n\nlong_query_time = 1\n\n[mysqldump]\n\nquick\n\nmax_allowed_packet = 32M"},{"t":"p","x":"4、初始化数据库"},{"t":"code","x":"$/usr/local/webserver/mysql/scripts/mysql_install_db --defaults-file=/etc/my.cnf --user=mysql"},{"t":"p","x":"显示如下信息："},{"t":"code","x":"Installing MySQL system tables...2015-01-26 20:18:51 0 [Warning] TIMESTAMP with implicit DEFAULT value is deprecated. Please use --explicit_defaults_for_timestamp server option (see documentation for more details).\n\nOK\n\nFilling help tables...2015-01-26 20:18:57 0 [Warning] TIMESTAMP with implicit DEFAULT value is deprecated. Please use --explicit_defaults_for_timestamp server option (see documentation for more details).\n\nOK\n\n..."},{"t":"p","x":"5、创建开机启动脚本"},{"t":"code","x":"$ cd /usr/local/webserver/mysql/\n\n$ cp support-files/mysql.server /etc/rc.d/init.d/mysqld \n\n$ chkconfig --add mysqld \n\n$ chkconfig --level 35 mysqld on"},{"t":"p","x":"6、启动mysql服务器"},{"t":"code","x":"$ service mysqld start"},{"t":"p","x":"7、连接 MySQL"},{"t":"code","x":"$ /usr/local/webserver/mysql/bin/mysql -u root -p"},{"t":"h","x":"修改MySQL用户密码"},{"t":"code","x":"mysqladmin -u用户名 -p旧密码 password 新密码"},{"t":"p","x":"或进入mysql命令行"},{"t":"code","x":"SET PASSWORD FOR '用户名'@'主机' = PASSWORD(‘密码');"},{"t":"p","x":"创建新用户并授权:"},{"t":"code","x":"grant all privileges on *.* to 用户名@'%' identified by '密码' with grant option;"},{"t":"h","x":"其他命令"},{"t":"li","x":"启动：service mysqld start"},{"t":"li","x":"停止：service mysqld stop"},{"t":"li","x":"重启：service mysqld restart"},{"t":"li","x":"重载配置：service mysqld reload"}]},{"key":"t31","name":"Linux 测验","desc":"完成菜鸟教程官方 Linux 测验，检验掌握程度","group":"⑧ 检验学习成果","diff":2,"blocks":[{"t":"h","x":"Linux 测验"},{"t":"h","x":"测验完成！"},{"t":"h","x":"更多测验"}]}],"commands":[{"cat":"文件管理","name":"cat","desc":"连接并显示文件内容","diff":1,"intro":"cat（英文全拼：concatenate）命令用于连接文件并打印到标准输出设备上，它的主要作用是用于查看和连接文件。","syntax":"cat [选项] [文件]","params":[],"examples":[{"desc":"查看文件内容：显示文件 filename 的内容。","code":"cat filename"},{"desc":"创建文件：将标准输入重定向到文件 filename，覆盖该文件的内容。","code":"cat > filename"},{"desc":"追加内容到文件：将标准输入追加到文件 filename 的末尾。","code":"cat >> filename"},{"desc":"连接文件：将 file1 和 file2 的内容合并到 file3 中。","code":"cat file1 file2 > file3"},{"desc":"显示多个文件的内容：同时显示 file1 和 file2 的内容。","code":"cat file1 file2"},{"desc":"使用管道：将 cat 命令的输出作为另一个命令的输入。","code":"cat filename | command"},{"desc":"查看文件的最后几行：显示文件 filename 的最后 10 行。","code":"cat filename | tail -n 10"},{"desc":"使用 -n 选项显示行号：显示文件 filename 的内容，并在每行的前面加上行号。","code":"cat -n filename"},{"desc":"使用 -b 选项仅显示非空行的行号：","code":"cat -b filename"},{"desc":"使用 -s 选项合并空行：显示文件 filename 的内容，并合并连续的空行。","code":"cat -s filename"}],"example":"cat filename"},{"cat":"文件管理","name":"chattr","desc":"更改文件属性","diff":1,"intro":"Linux chattr 命令用于改变文件或目录的属性，这些属性可以控制文件系统的行为，提供更高级的文件管理功能。","syntax":"chattr [选项] [+/-/=属性] 文件或目录","params":[["a","仅追加：文件只能追加内容，不能删除或修改已有内容（需 root 权限）。"],["i","不可变：文件不能被删除、修改、重命名或创建硬链接（需 root 权限）。"],["A","不更新文件的最后访问时间（atime）。"],["c","文件在磁盘上自动压缩（部分文件系统支持）。"],["s","安全删除：文件被删除时，其数据会被清零（不可恢复）。"],["u","文件被删除后，其内容仍可恢复（与 s 相反）。"],["d","文件在 dump 备份时会被跳过。"]],"examples":[{"desc":"添加属性（+）：","code":"sudo chattr +i file.txt # 设置文件为不可变（防删除/修改）\n\nsudo chattr +a /var/log/syslog # 日志文件只能追加"},{"desc":"移除属性（-）：","code":"sudo chattr -i file.txt # 取消不可变属性"},{"desc":"重置属性（=）：","code":"sudo chattr =a file.txt # 移除所有属性，仅保留 `a`"},{"desc":"保护重要配置文件：","code":"chattr +i /etc/passwd\n\nchattr +i /etc/shadow"},{"desc":"设置日志文件只能追加：","code":"chattr +a /var/log/messages"},{"desc":"递归设置目录属性：","code":"chattr -R +i /etc/important/"},{"desc":"查看文件属性（使用 lsattr 命令）：","code":"lsattr filename"},{"desc":"输出示例：","code":"----i--------- file.txt # `i` 表示不可变"}],"example":"sudo chattr +i file.txt # 设置文件为不可变（防删除/修改）"},{"cat":"文件管理","name":"chgrp","desc":"更改文件所属组","diff":1,"intro":"Linux chgrp（英文全拼：change group）命令用于变更文件或目录的所属群组。","syntax":"chgrp [-cfhRv][--help][--version][所属群组][文件或目录...]\n\n或\n\nchgrp [-cfhRv][--help][--reference=\u003c参考文件或目录>][--version][文件或目录...]","params":[["-c 或 --changes","效果类似 \"-v\" 参数，但仅回报更改的部分。适合需要确认具体修改了哪些文件时使用。"],["-f 或 --quiet 或 --silent","不显示错误信息。当脚本需要静默执行时使用，避免大量错误输出干扰结果。"],["-h 或 --no-dereference","只对符号连接的文件作修改，而不改动其他任何相关文件。修改符号链接本身的所属组时必须使用。"],["-R 或 --recursive","递归处理，将指定目录下的所有文件及子目录一并处理。批量修改目录内所有文件时使用。"],["-v 或 --verbose","显示指令执行过程。用于调试或确认每个文件的修改状态。"],["--help","显示帮助信息，列出所有可用参数。"],["--reference=\u003c参考文件或目录>","把指定文件或目录的所属群组全部设成和参考文件或目录的所属群组相同。用于批量复制权限场景。"],["--version","显示版本信息。"]],"examples":[{"desc":"更改单个文件的所属组:","code":"# 将 file.txt 的所属组设置为 developers\n\nchgrp developers file.txt"},{"desc":"更改多个文件的所属组:","code":"# 一次性修改多个文件的所属群组\n\nchgrp users file1.txt file2.txt file3.txt"},{"desc":"递归更改目录及其内容的所属组:","code":"# -R 参数会遍历整个目录树\n\nchgrp -R www-data /var/www/html"},{"desc":"使用参考文件的组:","code":"# 将 target_file.txt 的组设置为与 source_file.txt 相同\n\nchgrp --reference=source_file.txt target_file.txt"},{"desc":"显示详细操作信息:","code":"# -v 参数会报告每个文件的修改状态\n\nchgrp -v staff document.pdf"}],"example":"chgrp developers file.txt"},{"cat":"文件管理","name":"chmod","desc":"更改文件权限","diff":1,"intro":"Linux chmod（英文全拼：change mode）命令是控制用户对文件的权限的命令。","syntax":"chmod [选项] 权限模式 文件...\n\nchmod [选项] --reference=参考文件 文件...","params":[["+","为指定的用户类型增加权限"],["-","去除指定用户类型的权限"],["=","设置指定用户权限的设置，即将用户类型的所有权限重新设置"]],"examples":[{"desc":"","code":"[ugoa...][[+-=][rwxX]...][,...]"},{"desc":"将文件 file1.txt 设为所有人皆可读取 :","code":"chmod ugo+r file1.txt"},{"desc":"将文件 file1.txt 设为所有人皆可读取 :","code":"chmod a+r file1.txt"},{"desc":"将文件 file1.txt 与 file2.txt 设为该文件拥有者，与其所属同一个群体者可写入，但其他以外的人则不可写入 :","code":"chmod ug+w,o-w file1.txt file2.txt"},{"desc":"为 ex1.py 文件拥有者增加可执行权限:","code":"chmod u+x ex1.py"},{"desc":"将目前目录下的所有文件与子目录皆设为任何人可读取 :","code":"chmod -R a+r *"},{"desc":"此外chmod也可以用数字来表示权限如 :","code":"chmod 777 file"},{"desc":"语法为：","code":"chmod abc file"},{"desc":"","code":"chmod a=rwx file"}],"example":"[ugoa...][[+-=][rwxX]...][,...]"},{"cat":"文件管理","name":"chown","desc":"更改文件所有者","diff":1,"intro":"Linux chown（英文全拼：change owner）命令用于设置文件所有者和文件关联组的命令。","syntax":"chown [选项] 所有者[:组] 文件...\n\nchown [选项] --reference=参考文件 文件...","params":[],"examples"
