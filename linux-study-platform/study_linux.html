<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a16">
<meta name="description" content="Linux 系统学习与打卡平台 · 教程 / 命令大全 / 实用技巧 / 打卡记录 / 多格式导出">
<title>Linux 学习打卡 · 系统学习与打卡平台</title>
<style>
/* ══════════════ 1. 设计令牌 ══════════════ */
:root{
  --bg:#050a16; --bg2:#071127; --bg3:#0a1a35;
  --panel:#0b1730; --panel2:#0e1f3f; --panel3:#12274b;
  --line:rgba(88,158,255,.14); --line2:rgba(88,158,255,.30); --line3:rgba(88,158,255,.5);
  --txt:#dce8ff; --txt2:#93a9cf; --txt3:#5d7396;
  --pri:#3b82f6; --pri2:#60a5fa; --cyan:#22d3ee; --cyan2:#67e8f9;
  --ok:#22c55e; --ok2:#4ade80; --warn:#f59e0b; --bad:#ef4444; --purple:#a78bfa;
  --r:14px; --r2:10px; --r3:8px;
  --sh:0 8px 32px rgba(0,0,0,.45);
  --glow:0 0 0 1px rgba(88,158,255,.22),0 10px 34px rgba(27,86,190,.22);
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Cascadia Mono","JetBrains Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --side:286px; --top:60px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--txt);
  font-size:15px; line-height:1.75; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1100px 620px at 12% -8%,rgba(37,99,235,.20),transparent 62%),
    radial-gradient(900px 520px at 96% 4%,rgba(34,211,238,.14),transparent 60%),
    radial-gradient(760px 620px at 50% 112%,rgba(99,102,241,.14),transparent 62%);
}
body::after{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background-image:linear-gradient(rgba(88,158,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(88,158,255,.045) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% 26%,#000 0%,transparent 78%);
          mask-image:radial-gradient(circle at 50% 26%,#000 0%,transparent 78%);
}
a{color:var(--pri2);text-decoration:none}
button{font-family:inherit}
::selection{background:rgba(59,130,246,.42);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(88,158,255,.22);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(88,158,255,.42);background-clip:padding-box}

/* ══════════════ 2. 骨架布局 ══════════════ */
.app{position:relative;z-index:1;min-height:100vh}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--side);z-index:60;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(11,23,48,.97),rgba(7,17,39,.99));
  border-right:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:transform .34s var(--ease);
}
.app.collapsed .sidebar{transform:translateX(-100%)}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(3,7,18,.66);opacity:0;visibility:hidden;transition:.3s}
.main{
  margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column;
  transition:margin-left .34s var(--ease);
}
.app.collapsed .main{margin-left:0}

/* ── 侧边栏 ── */
.brand{display:flex;align-items:center;gap:11px;padding:16px 18px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand-logo{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,#2563eb,#22d3ee);color:#fff;font-size:19px;
  box-shadow:0 6px 20px rgba(37,99,235,.5);position:relative;overflow:hidden;
}
.brand-logo::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 32%,rgba(255,255,255,.4),transparent 68%);transform:translateX(-120%);animation:sheen 3.6s infinite}
@keyframes sheen{0%,62%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15.5px;letter-spacing:.4px;line-height:1.3}
.brand-txt span{display:block;font-size:11px;color:var(--txt3);letter-spacing:1.6px;text-transform:uppercase}
.side-scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 24px}
.side-search{position:relative;margin:0 0 12px}
.side-search input{
  width:100%;padding:10px 32px 10px 34px;border-radius:var(--r2);
  background:rgba(6,14,32,.9);border:1px solid var(--line);color:var(--txt);font-size:13.5px;outline:none;
  transition:.24s;
}
.side-search input:focus{border-color:var(--line3);box-shadow:0 0 0 3px rgba(59,130,246,.16);background:rgba(9,20,44,.95)}
.side-search input::placeholder{color:var(--txt3)}
.side-search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:13px;pointer-events:none}
.side-search .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--txt3);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:5px;display:none}
.side-search .sx:hover{color:var(--txt);background:rgba(88,158,255,.14)}
.nav-group{margin-bottom:6px}
.nav-group>.ng-h{
  display:flex;align-items:center;gap:8px;padding:9px 10px 7px;
  font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--txt3);text-transform:uppercase;
}
.ng-h .ng-count{margin-left:auto;font-size:10px;letter-spacing:0;color:var(--txt3);background:rgba(88,158,255,.1);border:1px solid var(--line);padding:1px 7px;border-radius:20px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8.5px 11px;margin-bottom:2px;border:1px solid transparent;border-radius:var(--r2);
  background:transparent;color:var(--txt2);font-size:13.5px;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s,transform .2s;
  position:relative;overflow:hidden;
}
.nav-item .ni-ico{width:19px;flex:0 0 19px;text-align:center;font-size:14px;opacity:.92}
.nav-item .ni-t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .ni-b{flex:0 0 auto;font-size:10.5px;color:var(--txt3);font-variant-numeric:tabular-nums}
.nav-item::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);
  width:3px;height:60%;border-radius:0 3px 3px 0;background:linear-gradient(#22d3ee,#3b82f6);
  transition:transform .24s var(--ease);
}
.nav-item:hover{background:rgba(59,130,246,.12);color:var(--txt);border-color:var(--line)}
.nav-item:hover::before{transform:translateY(-50%) scaleY(1)}
.nav-item.on{background:linear-gradient(90deg,rgba(59,130,246,.26),rgba(34,211,238,.09));color:#fff;border-color:var(--line2)}
.nav-item.on::before{transform:translateY(-50%) scaleY(1)}
.nav-item.on .ni-b{color:var(--cyan2)}
.nav-item.done .ni-t::after{content:"✓";margin-left:6px;color:var(--ok);font-size:11px;font-weight:800}
.nav-item.hide{display:none}
.side-foot{flex:0 0 auto;padding:11px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--txt3);display:flex;align-items:center;gap:7px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* ── 顶栏 ── */
.topbar{
  position:sticky;top:0;z-index:40;height:var(--top);flex:0 0 auto;
  display:flex;align-items:center;gap:12px;padding:0 20px;
  background:rgba(6,13,30,.82);border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:10px;
  background:rgba(88,158,255,.09);border:1px solid var(--line);color:var(--txt2);
  cursor:pointer;font-size:16px;transition:.22s;
}
.icon-btn:hover{background:rgba(59,130,246,.24);color:#fff;border-color:var(--line2);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.crumb .cb-ico{font-size:16px}
.crumb b{font-weight:650;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .cb-sub{color:var(--txt3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.ring-wrap{position:relative;width:40px;height:40px;flex:0 0 40px}
.ring{width:40px;height:40px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.4;stroke-linecap:round}
.ring .rb{stroke:rgba(88,158,255,.16)}
.ring .rf{stroke:url(#rgrad);transition:stroke-dashoffset .8s var(--ease)}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--cyan2);font-variant-numeric:tabular-nums}

/* ══════════════ 3. 舞台 / 内容 ══════════════ */
.stage{flex:1 1 auto;width:100%;max-width:1180px;margin:0 auto;padding:22px 20px 120px}
.page{animation:fadeUp .42s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-h h3{margin:0;font-size:16px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.sec-h .bars{flex:1 1 auto;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.panel{
  background:linear-gradient(160deg,rgba(13,26,52,.86),rgba(9,19,40,.9));
  border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:var(--sh);position:relative;overflow:hidden;
}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(96,165,250,.6),transparent)}
.panel+.panel{margin-top:14px}

/* ── 页头 ── */
.page-head{margin-bottom:18px}
.page-head .ph-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--cyan2);background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.28);
  padding:3px 10px;border-radius:20px;margin-bottom:10px;font-weight:700;
}
.page-head h1{margin:0 0 8px;font-size:clamp(21px,3.2vw,28px);line-height:1.32;letter-spacing:.2px;
  background:linear-gradient(96deg,#fff,#9dc4ff 58%,#67e8f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-head p{margin:0;color:var(--txt2);font-size:14px;max-width:820px}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 11px;border-radius:20px;
  background:rgba(88,158,255,.09);border:1px solid var(--line);color:var(--txt2)}
.chip b{color:var(--txt);font-variant-numeric:tabular-nums}
.chip.d-1{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.34);color:var(--ok2)}
.chip.d-2{background:rgba(59,130,246,.13);border-color:rgba(59,130,246,.36);color:var(--pri2)}
.chip.d-3{background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.36);color:#fbbf24}
.chip.d-4{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.36);color:#f87171}

/* ── 看板 ── */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.stat{
  position:relative;padding:15px 16px;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(150deg,rgba(16,32,62,.9),rgba(9,19,40,.92));
  border:1px solid var(--line);transition:transform .28s var(--ease),border-color .28s,box-shadow .28s;
}
.stat:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--glow)}
.stat .st-l{font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:6px}
.stat .st-v{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:.5px;font-variant-numeric:tabular-nums;
  background:linear-gradient(96deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .st-v small{font-size:13px;font-weight:600;-webkit-text-fill-color:var(--txt3);margin-left:3px}
.stat .st-bar{height:4px;border-radius:4px;background:rgba(88,158,255,.14);overflow:hidden;margin-top:11px}
.stat .st-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2563eb,#22d3ee);transition:width .9s var(--ease)}
.stat .st-f{font-size:11.5px;color:var(--txt3);margin-top:8px}

.prog-list{display:flex;flex-direction:column;gap:11px}
.prog-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.prog-row .pr-n{font-size:13.5px;display:flex;align-items:center;gap:7px}
.prog-row .pr-v{font-size:12px;color:var(--txt3);font-variant-numeric:tabular-nums}
.prog-row .pr-track{grid-column:1/-1;height:6px;border-radius:6px;background:rgba(88,158,255,.11);overflow:hidden}
.prog-row .pr-track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3b82f6,#22d3ee);transition:width .9s var(--ease)}

/* ── 快捷键入口 ── */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.qcard{
  display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);cursor:pointer;
  background:linear-gradient(150deg,rgba(16,32,62,.82),rgba(9,19,40,.9));
  border:1px solid var(--line);transition:.26s var(--ease);text-align:left;
}
.qcard:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--glow)}
.qcard .qc-i{width:40px;height:40px;flex:0 0 40px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(140deg,rgba(59,130,246,.34),rgba(34,211,238,.2));border:1px solid var(--line2)}
.qcard b{display:block;font-size:14px;margin-bottom:2px}
.qcard span{display:block;font-size:12px;color:var(--txt3);line-height:1.5}

/* ══════════════ 4. 教程正文 ══════════════ */
.art{font-size:15px;line-height:1.85}
.blk-p{margin:10px 0;color:#c9dbf7}
.blk-li{position:relative;margin:7px 0 7px 20px;color:#c3d6f4;padding-left:14px}
.blk-li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;border-radius:50%;
  background:linear-gradient(135deg,#22d3ee,#3b82f6);box-shadow:0 0 7px rgba(34,211,238,.7)}
.blk-h{
  position:relative;margin:30px 0 12px;padding-left:15px;font-size:17.5px;font-weight:700;letter-spacing:.3px;scroll-margin-top:80px;
}
.blk-h::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:3px;
  background:linear-gradient(180deg,#22d3ee,#3b82f6);box-shadow:0 0 12px rgba(34,211,238,.55)}
.blk-note{
  margin:14px 0;padding:12px 15px;border-radius:var(--r2);font-size:14px;color:#bfe0ff;
  background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.26);border-left:3px solid var(--cyan);
}
.blk-note::before{content:"💡 ";font-size:14px}

.code-wrap{
  margin:13px 0;border-radius:var(--r2);overflow:hidden;
  background:#060d1f;border:1px solid var(--line);transition:border-color .24s,box-shadow .24s;
}
.code-wrap:hover{border-color:var(--line2);box-shadow:0 6px 24px rgba(15,45,110,.4)}
.code-head{
  display:flex;align-items:center;gap:8px;padding:6px 8px 6px 13px;
  background:linear-gradient(180deg,rgba(20,40,78,.85),rgba(11,23,48,.85));
  border-bottom:1px solid var(--line);
}
.code-lang{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt3);font-weight:700;font-family:var(--mono)}
.code-lang::before{content:"● ";color:var(--cyan);font-size:9px}
.code-head .sp{flex:1 1 auto}
.copy-btn{
  display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:7px;cursor:pointer;
  font-size:12px;font-weight:650;letter-spacing:.3px;
  background:rgba(59,130,246,.2);border:1px solid rgba(96,165,250,.34);color:#bfdbfe;
  transition:background .2s,color .2s,box-shadow .2s,transform .12s,border-color .2s;
}
.copy-btn:hover{background:rgba(59,130,246,.34);color:#fff;border-color:var(--line3)}
.copy-btn:active{transform:scale(.93)}
.copy-btn.copied{
  background:linear-gradient(90deg,rgba(103,232,249,.95),rgba(190,242,255,.95));color:#06283a;
  border-color:#a5f3fc;box-shadow:0 0 0 4px rgba(103,232,249,.2),0 0 22px rgba(103,232,249,.55);
  animation:copypop .42s var(--ease);
}
@keyframes copypop{0%{transform:scale(.9)}55%{transform:scale(1.09)}100%{transform:scale(1)}}
pre.code{margin:0;padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.7;color:#a8e6ff;white-space:pre;-webkit-overflow-scrolling:touch}
pre.code code{font-family:inherit}

.tbl-wrap{margin:15px 0;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:rgba(6,13,30,.55)}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:460px}
table.dt th{
  text-align:left;padding:10px 13px;font-weight:700;font-size:12.5px;letter-spacing:.5px;white-space:nowrap;
  background:linear-gradient(180deg,rgba(23,45,84,.96),rgba(14,29,58,.96));color:#bcd7ff;
  border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:2;
}
table.dt td{padding:10px 13px;border-bottom:1px solid var(--line);color:#c3d6f4;vertical-align:top}
table.dt tr:last-child td{border-bottom:0}
table.dt tbody tr{transition:background .18s}
table.dt tbody tr:hover{background:rgba(59,130,246,.085)}
table.dt tbody tr.pick{background:rgba(34,211,238,.10);box-shadow:inset 3px 0 0 var(--cyan)}

/* ══════════════ 5. 命令表 ══════════════ */
.cmd-tools{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.inp{
  flex:1 1 220px;min-width:0;padding:9px 13px;border-radius:var(--r2);font-size:13.5px;
  background:rgba(6,14,32,.9);border:1px solid var(--line);color:var(--txt);outline:none;transition:.22s;
}
.inp:focus{border-color:var(--line3);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
.inp::placeholder{color:var(--txt3)}
.sel{padding:9px 12px;border-radius:var(--r2);font-size:13px;background:rgba(6,14,32,.9);border:1px solid var(--line);color:var(--txt2);outline:none;cursor:pointer}
.sel option{background:#0b1730}
.cmd-name{
  font-family:var(--mono);font-size:13.5px;font-weight:700;color:#7dd3fc;cursor:pointer;
  background:none;border:0;padding:0;text-align:left;border-bottom:1px dashed rgba(125,211,252,.4);transition:.2s;
}
.cmd-name:hover{color:#fff;border-bottom-color:#fff;text-shadow:0 0 12px rgba(125,211,252,.8)}
.cmd-desc{color:#c3d6f4}
.cmd-ex{
  font-family:var(--mono);font-size:12.5px;color:#a8e6ff;cursor:pointer;word-break:break-all;
  background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.18);border-radius:6px;
  padding:4px 9px;display:inline-block;transition:.2s;max-width:100%;text-align:left;
}
.cmd-ex:hover{background:rgba(103,232,249,.24);border-color:rgba(103,232,249,.6);color:#06283a;box-shadow:0 0 16px rgba(103,232,249,.4)}
.cmd-ex.none{color:var(--txt3);background:transparent;border-color:var(--line);cursor:default}
.cmd-ex.none:hover{background:transparent;color:var(--txt3);border-color:var(--line);box-shadow:none}

/* 复选 */
.ck{
  appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;border-radius:7px;cursor:pointer;
  border:1.6px solid rgba(96,165,250,.45);background:rgba(6,14,32,.9);position:relative;
  transition:background .2s,border-color .2s,transform .12s,box-shadow .24s;display:block;margin:0 auto;
}
.ck:hover{border-color:var(--cyan2);box-shadow:0 0 0 4px rgba(34,211,238,.14)}
.ck:active{transform:scale(.88)}
.ck:checked{background:linear-gradient(140deg,#22d3ee,#3b82f6);border-color:#67e8f9;box-shadow:0 0 16px rgba(34,211,238,.55)}
.ck:checked::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #04202c;border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.ck:checked+*{color:#fff}
td.c-c::before{content:""}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.pager button{
  min-width:36px;height:36px;padding:0 11px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;
  background:rgba(88,158,255,.08);border:1px solid var(--line);color:var(--txt2);transition:.2s;
}
.pager button:hover:not(:disabled){background:rgba(59,130,246,.26);color:#fff;border-color:var(--line2)}
.pager button:disabled{opacity:.32;cursor:not-allowed}
.pager button.on{background:linear-gradient(140deg,#3b82f6,#22d3ee);color:#04202c;border-color:transparent;box-shadow:0 0 16px rgba(59,130,246,.5)}
.pager .pg-info{font-size:12.5px;color:var(--txt3);margin:0 6px}

/* ══════════════ 6. 技巧卡 ══════════════ */
.tip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.tip{
  border-radius:var(--r);padding:15px;position:relative;
  background:linear-gradient(155deg,rgba(15,30,58,.9),rgba(9,19,40,.94));
  border:1px solid var(--line);transition:.28s var(--ease);
}
.tip:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--glow)}
.tip.done{border-color:rgba(34,197,94,.45);box-shadow:0 0 0 1px rgba(34,197,94,.2),0 8px 28px rgba(34,197,94,.14)}
.tip-h{display:flex;gap:10px;align-items:flex-start}
.tip-h .ck{width:19px;height:19px;flex:0 0 19px;border-radius:6px;margin:3px 0 0}
.tip-h .ck:checked::after{left:6px;top:2px;width:4px;height:9px}
.tip-t{font-size:14.5px;font-weight:680;color:#dbeafe;line-height:1.55}
.tip-d{font-size:13px;color:var(--txt2);margin:9px 0 0;line-height:1.7}
.tip-idx{position:absolute;right:12px;top:10px;font-size:11px;color:var(--txt3);font-family:var(--mono);font-weight:700}

/* ══════════════ 7. 打卡操作栏 ══════════════ */
.cbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(9,20,42,.96),rgba(6,13,30,.99));
  border-top:1px solid var(--line2);box-shadow:0 -10px 40px rgba(0,0,0,.55);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateY(120%);transition:transform .34s var(--ease);
}
.cbar.show{transform:none}
.cbar-info{font-size:13.5px;color:var(--txt2);display:flex;align-items:center;gap:7px}
.cbar-info b{color:var(--cyan2);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.badge-n{background:linear-gradient(140deg,#22d3ee,#3b82f6);color:#04202c;font-weight:800;font-size:11.5px;padding:2px 8px;border-radius:20px}
.date-input{
  padding:9px 12px;border-radius:var(--r2);font-size:13.5px;font-family:inherit;
  background:rgba(6,14,32,.95);border:1px solid var(--line2);color:var(--txt);outline:none;cursor:pointer;
  color-scheme:dark;transition:.2s;
}
.date-input:focus{border-color:var(--line3);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 17px;border-radius:var(--r2);cursor:pointer;font-size:13.5px;font-weight:650;letter-spacing:.2px;
  border:1px solid var(--line2);background:rgba(88,158,255,.1);color:var(--txt2);
  transition:.22s var(--ease);white-space:nowrap;
}
.btn:hover{background:rgba(59,130,246,.28);color:#fff;border-color:var(--line3);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn-pri{
  background:linear-gradient(135deg,#2563eb,#22d3ee);color:#03202e;border-color:transparent;font-weight:750;
  box-shadow:0 6px 22px rgba(34,211,238,.34);
}
.btn-pri:hover{box-shadow:0 8px 30px rgba(34,211,238,.55);color:#03202e;background:linear-gradient(135deg,#3b82f6,#67e8f9)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#4ade80);color:#03210f;border-color:transparent;font-weight:750}
.btn-ok:hover{color:#03210f;background:linear-gradient(135deg,#22c55e,#86efac)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn-ghost{background:transparent;border-color:var(--line)}
.cbar-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt2);cursor:pointer;user-select:none}
.cbar-check input{accent-color:#22d3ee;width:16px;height:16px;cursor:pointer}
.cbar .sp{flex:1 1 auto}
.cbar.flash{animation:barflash .6s var(--ease)}
@keyframes barflash{0%{box-shadow:0 -10px 40px rgba(34,211,238,0)}40%{box-shadow:0 -10px 46px rgba(34,211,238,.6)}100%{box-shadow:0 -10px 40px rgba(0,0,0,.55)}}

/* 提交按钮提交中的脉冲 */
.pulse{animation:pulseBtn .5s var(--ease)}
@keyframes pulseBtn{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}

/* ══════════════ 8. Toast ══════════════ */
.toast-wrap{position:fixed;top:74px;right:18px;z-index:90;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{
  min-width:206px;max-width:330px;padding:12px 15px;border-radius:var(--r2);font-size:13.5px;
  background:linear-gradient(150deg,rgba(14,32,64,.98),rgba(9,20,42,.98));
  border:1px solid var(--line2);box-shadow:0 12px 40px rgba(0,0,0,.55);
  display:flex;gap:10px;align-items:flex-start;
  animation:tin .34s var(--ease) both;
}
.toast.out{animation:tout .3s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateX(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(28px) scale(.96)}}
.toast .t-ic{font-size:16px;line-height:1.4}
.toast b{display:block;font-size:13.5px;margin-bottom:1px}
.toast span{color:var(--txt2);font-size:12.5px;line-height:1.55}
.toast.ok{border-color:rgba(34,197,94,.45)}
.toast.ok .t-ic{color:var(--ok2)}
.toast.info{border-color:rgba(34,211,238,.45)}
.toast.info .t-ic{color:var(--cyan2)}
.toast.err{border-color:rgba(239,68,68,.45)}
.toast.err .t-ic{color:#f87171}

/* ══════════════ 9. 记录 / 导出 ══════════════ */
.exp-row{display:flex;flex-wrap:wrap;gap:11px;align-items:center}
.exp-card{
  flex:1 1 200px;min-width:0;padding:15px;border-radius:var(--r);text-align:left;cursor:pointer;
  background:linear-gradient(155deg,rgba(16,32,62,.9),rgba(9,19,40,.94));
  border:1px solid var(--line);transition:.26s var(--ease);
}
.exp-card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--glow)}
.exp-card .ec-i{font-size:22px;margin-bottom:6px}
.exp-card b{display:block;font-size:14.5px;margin-bottom:3px}
.exp-card span{font-size:12px;color:var(--txt3);line-height:1.55;display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:rgba(88,158,255,.1);border:1px solid var(--line);color:var(--txt2);cursor:default}
.tag.done{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.34);color:var(--ok2)}
.lv{font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-block}
.lv-1{background:rgba(34,197,94,.16);color:#4ade80;border:1px solid rgba(34,197,94,.34)}
.lv-2{background:rgba(59,130,246,.16);color:#60a5fa;border:1px solid rgba(59,130,246,.34)}
.lv-3{background:rgba(245,158,11,.16);color:#fbbf24;border:1px solid rgba(245,158,11,.34)}
.lv-4{background:rgba(239,68,68,.16);color:#f87171;border:1px solid rgba(239,68,68,.34)}
.st-done{color:var(--ok2);font-weight:650}
.st-todo{color:var(--txt3)}
.blank{padding:34px 18px;text-align:center;color:var(--txt3);font-size:13.5px}
.blank .bi{font-size:34px;display:block;margin-bottom:10px;opacity:.5}

/* ══════════════ 10. 模态 ══════════════ */
.modal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(3,7,18,.76);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .24s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{
  position:relative;width:100%;max-width:740px;max-height:86vh;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(14,30,60,.99),rgba(8,17,37,.99));
  border:1px solid var(--line2);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.7);
  animation:mup .34s var(--ease);
}
@keyframes mup{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.modal-h .mh-t{flex:1 1 auto;min-width:0}
.modal-h h3{margin:0;font-size:17px;font-family:var(--mono);color:#7dd3fc}
.modal-h .mh-s{font-size:12.5px;color:var(--txt3);margin-top:2px}
.modal-b{padding:16px 18px;overflow-y:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch}
.modal-x{width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:1px solid var(--line);background:rgba(88,158,255,.08);color:var(--txt2);cursor:pointer;font-size:16px;transition:.2s}
.modal-x:hover{background:rgba(239,68,68,.24);color:#fff;border-color:rgba(239,68,68,.5)}
.kv{margin-bottom:14px}
.kv-l{font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt3);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.kv-l::after{content:"";flex:1 1 auto;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.ex-item{margin-bottom:11px;padding:11px 13px;border-radius:var(--r2);background:rgba(6,13,30,.6);border:1px solid var(--line)}
.ex-item .ex-d{font-size:13px;color:var(--txt2);margin-bottom:7px}
.ex-item pre{margin:0;font-family:var(--mono);font-size:12.5px;color:#a8e6ff;white-space:pre-wrap;word-break:break-all;line-height:1.7}

/* ══════════════ 11. 页脚 / 友情链接 ══════════════ */
.foot{
  flex:0 0 auto;margin-top:auto;padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:rgba(6,13,30,.5);
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;
  font-size:12.5px;color:var(--txt3);text-align:center;
}
.fl-link{position:relative}
.fl-btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:22px;cursor:pointer;
  background:rgba(88,158,255,.1);border:1px solid var(--line2);color:var(--txt2);font-size:13px;font-weight:600;transition:.24s;
}
.fl-btn:hover{background:rgba(59,130,246,.26);color:#fff;border-color:var(--line3);box-shadow:0 0 20px rgba(59,130,246,.35)}
.fl-btn .arw{font-size:9px;transition:transform .26s}
.fl-link.open .fl-btn .arw{transform:rotate(180deg)}
.fl-menu{
  position:absolute;bottom:calc(100% + 9px);left:50%;transform:translate(-50%,8px) scale(.97);
  min-width:250px;padding:7px;border-radius:12px;z-index:80;
  background:linear-gradient(160deg,rgba(14,30,60,.99),rgba(8,17,37,.99));
  border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.6);
  opacity:0;visibility:hidden;transition:.24s var(--ease);
}
.fl-link.open .fl-menu{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
.fl-menu .fm-h{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);padding:7px 11px 5px;font-weight:700}
.fl-menu a{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:13.5px;color:var(--txt2);
  transition:.2s;border:1px solid transparent;
}
.fl-menu a:hover{background:rgba(59,130,246,.22);color:#fff;border-color:var(--line2)}
.fl-menu a .fa-i{width:20px;flex:0 0 20px;text-align:center;font-size:14px}
.fl-menu a .fa-d{margin-left:auto;font-size:11px;color:var(--txt3);font-family:var(--mono)}
.fl-menu a:hover .fa-d{color:var(--cyan2)}
.fl-sep{height:1px;background:var(--line);margin:6px 8px}
.foot .cp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}

/* ══════════════ 12. 响应式 ══════════════ */
@media (max-width:1100px){
  .stage{max-width:100%}
}
@media (max-width:900px){
  .sidebar{width:300px;max-width:86vw;transform:translateX(-100%);box-shadow:0 0 60px rgba(0,0,0,.7)}
  .app.mobile-open .sidebar{transform:none}
  .app.mobile-open .scrim{opacity:1;visibility:visible}
  .main{margin-left:0}
  .app.collapsed .main{margin-left:0}
  .stage{padding:18px 14px 130px}
  .topbar{padding:0 13px;gap:9px}
  .crumb .cb-sub{display:none}
  .toast-wrap{left:14px;right:14px;top:70px}
  .toast{max-width:none;min-width:0}
  .code-head{padding:5px 7px 5px 11px}
  pre.code{font-size:12.5px;padding:11px 12px}
  .tip-grid{grid-template-columns:1fr}
  .cbar{padding:10px 13px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
  .cbar-info{font-size:12.5px;width:100%}
  .cbar .sp{display:none}
  .cbar .date-input{flex:1 1 130px}
  .cbar .btn{padding:9px 14px;font-size:13px}
  .fl-menu{left:auto;right:0;transform:translateY(8px) scale(.97)}
  .fl-link.open .fl-menu{transform:translateY(0) scale(1)}
  .fl-menu{max-width:calc(100vw - 40px)}
  .modal{padding:10px}
  .modal-box{max-height:92vh}
  table.dt{min-width:520px}
  .page-head h1{font-size:21px}
}
@media (max-width:600px){
  body{font-size:14.5px}
  .stage{padding:14px 11px 132px}
  .panel{padding:14px;border-radius:12px}
  .stat .st-v{font-size:23px}
  .dash-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
  .art{font-size:14.5px}
  .blk-h{font-size:16.5px;margin-top:24px}
  table.dt{font-size:12.5px}
  table.dt th,table.dt td{padding:8px 10px}
  .cmd-tools{flex-direction:column;align-items:stretch}
  .inp{flex:1 1 auto}
  .exp-card{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
/* 打印 */
@media print{
  body{background:#fff;color:#000}
  .sidebar,.topbar,.cbar,.foot,.toast-wrap,.scrim{display:none !important}
  .main{margin:0}
  .panel{background:#fff;border:1px solid #ccc;box-shadow:none}
}
</style>
</head>

<div class="app" id="app">

  <!-- ══ 主区 ══ -->
  <main class="main">

      <div class="crumb" id="crumb">
        <span class="cb-ico">📊</span>
        <b>学习看板</b>

          <a href="https://linux.vbird.org/" target="_blank" rel="noopener noreferrer"><span class="fa-i">🐦</span><span>鸟哥的 Linux 私房菜</span><span class="fa-d">vbird.org</span></a>
          <a href="https://www.kernel.org/" target="_blank" rel="noopener noreferrer"><span class="fa-i">⚙️</span><span>Linux 内核官网</span><span class="fa-d">kernel.org</span></a>
          <a href="https://www.gnu.org/" target="_blank" rel="noopener noreferrer"><span class="fa-i">🐂</span><span>GNU 项目</span><span class="fa-d">gnu.org</span></a>
        </div>

    </footer>
  </main>

  <!-- ══ 打卡操作栏 ══ -->

"t":"h","x":"Windows WSL 安装 Linux"},{"t":"p","x":"WSL（Windows Subsystem for Linux） 是微软为 Windows 用户提供的一个子系统，它允许你在 Windows 上原生运行 Linux（不是虚拟机，不是双系统），直接使用 Bash、apt、gcc、Python、Node.js 等 Linux 工具。"},{"t":"h","x":"WSL 的版本区别"},{"t":"table","x":[["特性","WSL1","WSL2"],["内核架构","翻译系统调用（兼容层）","真正的 Linux 内核（轻量虚拟机）"],["性能（文件访问）","Windows ↔ Linux 访问更快","Linux ↔ Linux 内部访问更快"],["启动速度","更快","略慢"],["Docker 支持","不支持","✅ 完全支持"],["系统资源占用","较少","稍高"]]},{"t":"p","x":"推荐使用 WSL2，兼容性更强，功能更完整。"},{"t":"h","x":"安装步骤（以 WSL2 为例）"},{"t":"h","x":"前提条件"},{"t":"li","x":"Windows 10 2004（或更高版本） / Windows 11"},{"t":"li","x":"启用虚拟化（BIOS 中 VT-x 或 AMD-V 开启）"},{"t":"h","x":"方法一：一键安装（推荐）"},{"t":"code","x":"wsl --install"},{"t":"p","x":"该命令会自动："},{"t":"li","x":"启用 WSL 功能"},{"t":"li","x":"安装 WSL2 内核"},{"t":"li","x":"安装默认的 Ubuntu"},{"t":"li","x":"设置为 WSL2"},{"t":"p","x":"安装完后，重启一次系统即可。"},{"t":"h","x":"方法二：手动安装（适合定制需求）"},{"t":"p","x":"1、启用 WSL 功能和虚拟机平台"},{"t":"code","x":"dism.exe /online /enable-feature /featurename:Microsoft-Windows-Subsystem-Linux /all /norestart\n\ndism.exe /online /enable-feature /featurename:VirtualMachinePlatform /all /norestart"},{"t":"p","x":"2、下载并安装 Linux 内核更新包"},{"t":"p","x":"👉 下载地址：https://aka.ms/wsl2kernel"},{"t":"p","x":"3、设置默认 WSL 版本为 WSL2"},{"t":"code","x":"wsl --set-default-version 2"},{"t":"p","x":"4、从 Microsoft Store 安装 Linux 发行版（如 Ubuntu）"},{"t":"p","x":"也可命令行方式安装："},{"t":"code","x":"wsl --install -d Ubuntu"},{"t":"h","x":"常用命令速查表"},{"t":"table","x":[["命令","说明"],["wsl","启动默认 Linux"],["wsl --list --verbose","查看已安装的发行版和版本"],["wsl --set-version Ubuntu 2","设置 Ubuntu 使用 WSL2"],["wsl --install -d Debian","安装指定发行版"],["wsl --shutdown","关闭所有 WSL 实例"],["wsl -e bash","以 Bash 启动 Linux Shell"]]},{"t":"h","x":"日常使用指南"},{"t":"p","x":"如何访问 Windows 文件？"},{"t":"p","x":"在 WSL 中，Windows 文件挂载在 /mnt/c、/mnt/d 等目录："},{"t":"code","x":"cd /mnt/c/Users/你的用户名/Desktop"},{"t":"p","x":"如何访问 WSL 文件？"},{"t":"p","x":"在 Windows 中访问："},{"t":"code","x":"\\\\wsl$\\Ubuntu\\home\\your_username"},{"t":"p","x":"或者在资源管理器地址栏输入：\\\\wsl$"},{"t":"h","x":"配套推荐工具"},{"t":"table","x":[["工具","说明"],["Windows Terminal","多标签终端，支持彩色和自定义配置"],["VS Code + Remote WSL","在 VS Code 中直接编辑 Linux 文件"],["oh-my-zsh / fish","美化终端，提升操作体验"],["tmux / screen","多终端管理工具"]]},{"t":"h","x":"如何卸载或重置？"},{"t":"code","x":"# 卸载某个 Linux 发行版\n\nwsl --unregister Ubuntu\n\n# 重置 WSL 所有数据（危险操作）\n\nwsl --unregister \u003c发行版名>"}]},{"key":"t06","name":"Linux 系统启动过程","desc":"BIOS → MBR → GRUB → 内核 → init/systemd → 登录","group":"② 系统与运维基础","diff":2,"blocks":[{"t":"h","x":"Linux 系统启动过程"},{"t":"p","x":"linux启动时我们会看到许多启动信息。"},{"t":"p","x":"Linux系统的启动过程并不是大家想象中的那么复杂，其过程可以分为5个阶段："},{"t":"li","x":"内核的引导。"},{"t":"li","x":"运行 init。"},{"t":"li","x":"系统初始化。"},{"t":"li","x":"建立终端 。"},{"t":"li","x":"用户登录系统。"},{"t":"p","x":"init程序的类型："},{"t":"li","x":"SysV: init, CentOS 5之前, 配置文件： /etc/inittab。"},{"t":"li","x":"Upstart: init,CentOS 6, 配置文件： /etc/inittab, /etc/init/*.conf。"},{"t":"li","x":"Systemd： systemd, CentOS 7,配置文件： /usr/lib/systemd/system、 /etc/systemd/system。"},{"t":"h","x":"内核引导"},{"t":"p","x":"当计算机打开电源后，首先是BIOS开机自检，按照BIOS中设置的启动设备（通常是硬盘）来启动。"},{"t":"p","x":"操作系统接管硬件以后，首先读入 /boot 目录下的内核文件。"},{"t":"h","x":"运行init"},{"t":"p","x":"init 进程是系统所有进程的起点，你可以把它比拟成系统所有进程的老祖宗，没有这个进程，系统中任何进程都不会启动。"},{"t":"p","x":"init 程序首先是需要读取配置文件 /etc/inittab。"},{"t":"h","x":"运行级别"},{"t":"p","x":"许多程序需要开机启动。它们在Windows叫做\"服务\"（service），在Linux就叫做\"守护进程\"（daemon）。"},{"t":"p","x":"init进程的一大任务，就是去运行这些开机启动的程序。"},{"t":"p","x":"但是，不同的场合需要启动不同的程序，比如用作服务器时，需要启动Apache，用作桌面就不需要。"},{"t":"p","x":"Linux允许为不同的场合，分配不同的开机启动程序，这就叫做\"运行级别\"（runlevel）。也就是说，启动时根据\"运行级别\"，确定要运行哪些程序。"},{"t":"p","x":"Linux系统有7个运行级别(runlevel)："},{"t":"li","x":"运行级别0：系统停机状态，系统默认运行级别不能设为0，否则不能正常启动"},{"t":"li","x":"运行级别1：单用户工作状态，root权限，用于系统维护，禁止远程登录"},{"t":"li","x":"运行级别2：多用户状态(没有NFS)"},{"t":"li","x":"运行级别3：完全的多用户状态(有NFS)，登录后进入控制台命令行模式"},{"t":"li","x":"运行级别4：系统未使用，保留"},{"t":"li","x":"运行级别5：X11控制台，登录后进入图形GUI模式"},{"t":"li","x":"运行级别6：系统正常关闭并重启，默认运行级别不能设为6，否则不能正常启动"},{"t":"h","x":"系统初始化"},{"t":"p","x":"在init的配置文件中有这么一行： si::sysinit:/etc/rc.d/rc.sysinit　它调用执行了/etc/rc.d/rc.sysinit，而rc.sysinit是一个bash shell的脚本，它主要是完成一些系统初始化的工作，rc.sysinit是每一个运行级别都要首先运行的重要脚本。"},{"t":"p","x":"它主要完成的工作有：激活交换分区，检查磁盘，加载硬件模块以及其它一些需要优先执行任务。"},{"t":"code","x":"l5:5:wait:/etc/rc.d/rc 5"},{"t":"p","x":"这一行表示以5为参数运行/etc/rc.d/rc，/etc/rc.d/rc是一个Shell脚本，它接受5作为参数，去执行/etc/rc.d/rc5.d/目录下的所有的rc启动脚本，/etc/rc.d/rc5.d/目录中的这些启动脚本实际上都是一些连接文件，而不是真正的rc启动脚本，真正的rc启动脚本实际上都是放在/etc/rc.d/init.d/目录下。"},{"t":"p","x":"而这些rc启动脚本有着类似的用法，它们一般能接受start、stop、restart、status等参数。"},{"t":"p","x":"/etc/rc.d/rc5.d/中的rc启动脚本通常是K或S开头的连接文件，对于以 S 开头的启动脚本，将以start参数来运行。"},{"t":"p","x":"而如果发现存在相应的脚本也存在K打头的连接，而且已经处于运行态了(以/var/lock/subsys/下的文件作为标志)，则将首先以stop为参数停止这些已经启动了的守护进程，然后再重新运行。"},{"t":"p","x":"这样做是为了保证是当init改变运行级别时，所有相关的守护进程都将重启。"},{"t":"p","x":"至于在每个运行级中将运行哪些守护进程，用户可以通过chkconfig或setup中的\"System Services\"来自行设定。"},{"t":"h","x":"建立终端"},{"t":"p","x":"rc执行完毕后，返回init。这时基本系统环境已经设置好了，各种守护进程也已经启动了。"},{"t":"p","x":"init接下来会打开6个终端，以便用户登录系统。在inittab中的以下6行就是定义了6个终端："},{"t":"code","x":"1:2345:respawn:/sbin/mingetty tty1\n\n2:2345:respawn:/sbin/mingetty tty2\n\n3:2345:respawn:/sbin/mingetty tty3\n\n4:2345:respawn:/sbin/mingetty tty4\n\n5:2345:respawn:/sbin/mingetty tty5\n\n6:2345:respawn:/sbin/mingetty tty6"},{"t":"p","x":"从上面可以看出在2、3、4、5的运行级别中都将以respawn方式运行mingetty程序，mingetty程序能打开终端、设置模式。"},{"t":"p","x":"同时它会显示一个文本登录界面，这个界面就是我们经常看到的登录界面，在这个登录界面中会提示用户输入用户名，而用户输入的用户将作为参数传给login程序来验证用户的身份。"},{"t":"h","x":"用户登录系统"},{"t":"p","x":"一般来说，用户的登录方式有三种："},{"t":"li","x":"（1）命令行登录"},{"t":"li","x":"（2）ssh登录"},{"t":"li","x":"（3）图形界面登录"},{"t":"p","x":"对于运行级别为5的图形方式用户来说，他们的登录是通过一个图形化的登录界面。登录成功后可以直接进入 KDE、Gnome 等窗口管理器。"},{"t":"p","x":"而本文主要讲的还是文本方式登录的情况：当我们看到mingetty的登录界面时，我们就可以输入用户名和密码来登录系统了。"},{"t":"p","x":"Linux 的账号验证程序是 login，login 会接收 mingetty 传来的用户名作为用户名参数。"},{"t":"p","x":"然后 login 会对用户名进行分析：如果用户名不是 root，且存在 /etc/nologin 文件，login 将输出 nologin 文件的内容，然后退出。"},{"t":"p","x":"这通常用来系统维护时防止非root用户登录。只有/etc/securetty中登记了的终端才允许 root 用户登录，如果不存在这个文件，则 root 用户可以在任何终端上登录。"},{"t":"p","x":"/etc/usertty文件用于对用户作出附加访问限制，如果不存在这个文件，则没有其他限制。"},{"t":"h","x":"图形模式与文字模式的切换方式"},{"t":"p","x":"Linux预设提供了六个命令窗口终端机让我们来登录。"},{"t":"p","x":"默认我们登录的就是第一个窗口，也就是tty1，这个六个窗口分别为tty1,tty2 … tty6，你可以按下Ctrl + Alt + F1 ~ F6 来切换它们。"},{"t":"p","x":"如果你安装了图形界面，默认情况下是进入图形界面的，此时你就可以按Ctrl + Alt + F1 ~ F6来进入其中一个命令窗口界面。"},{"t":"p","x":"当你进入命令窗口界面后再返回图形界面只要按下Ctrl + Alt + F7 就回来了。"},{"t":"p","x":"如果你用的vmware 虚拟机，命令窗口切换的快捷键为 Alt + Space + F1~F6. 如果你在图形界面下请按Alt + Shift + Ctrl + F1~F6 切换至命令窗口。"},{"t":"h","x":"Linux 关机"},{"t":"p","x":"在linux领域内大多用在服务器上，很少遇到关机的操作。毕竟服务器上跑一个服务是永无止境的，除非特殊情况下，不得已才会关机。"},{"t":"p","x":"正确的关机流程为：sync > shutdown > reboot > halt"},{"t":"p","x":"关机指令为：shutdown ，你可以man shutdown 来看一下帮助文档。"},{"t":"p","x":"例如你可以运行如下命令关机："},{"t":"code","x":"sync 将数据由内存同步到硬盘中。\n\nshutdown 关机指令，你可以man shutdown 来看一下帮助文档。例如你可以运行如下命令关机：\n\nshutdown –h 10 ‘This server will shutdown after 10 mins’ 这个命令告诉大家，计算机将在10分钟后关机，并且会显示在登陆用户的当前屏幕中。\n\nshutdown –h now 立马关机\n\nshutdown –h 20:25 系统会在今天20:25关机\n\nshutdown –h +10 十分钟后关机\n\nshutdown –r now 系统立马重启\n\nshutdown –r +10 系统十分钟后重启\n\nreboot 就是重启，等同于 shutdown –r now\n\nhalt 关闭系统，等同于shutdown –h now 和 poweroff"},{"t":"p","x":"最后总结一下，不管是重启系统还是关闭系统，首先要运行 sync 命令，把内存中的数据写到磁盘中。"},{"t":"p","x":"关机的命令有 shutdown –h now halt poweroff 和 init 0 , 重启系统的命令有 shutdown –r now reboot init 6。"},{"t":"h","x":"参考文章："},{"t":"li","x":"http://www.ruanyifeng.com/blog/2013/08/linux_boot_process.html"}]},{"key":"t07","name":"Linux 系统目录结构","desc":"/bin /etc /home /usr /var 等目录的作用与规范","group":"② 系统与运维基础","diff":2,"blocks":[{"t":"h","x":"Linux 系统目录结构"},{"t":"p","x":"登录系统后，在当前命令窗口下输入命令："},{"t":"code","x":"ls /"},{"t":"p","x":"你会看到如下图所示:"},{"t":"p","x":"树状目录结构："},{"t":"p","x":"以下是对这些目录的解释："},{"t":"table","x":[["目录","作用详解","常见文件 / 示例"],["/","根文件系统，所有挂载点与路径的起点。包含系统必须的子目录与入口结构。","无具体数据文件，只有子目录结构。"],["/bin","系统启动和单用户模式下必须的基础命令，所有用户可执行。","ls, cp, mv, rm, bash"],["/sbin","系统管理与维护命令，面向 root。","fsck, reboot, shutdown"],["/usr","用户级程序与库的主集合，包含大部分系统软件、文档与工具。","/usr/bin, /usr/lib, /usr/share"],
