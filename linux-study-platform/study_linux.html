}
function doXlsx(){
  download(zipStore(buildXlsxFiles()), fname('xlsx'));
  toast('ok','Excel 已导出', exportRows().length+' 行数据，标准 .xlsx 格式。');
}
/* ── PDF（打印为 PDF，无外部依赖） ── */
function doPdf(){
  var rows = exportRows();
  var n = rows.length;
  var tr = rows.map(function(r,i){
    return '<tr>'+
      '<td class="c">'+xesc(i+1)+'</td>'+
      '<td>'+xesc(r[0])+'</td>'+
      '<td>'+xesc(r[1])+'</td>'+
      '<td class="c">'+xesc(r[2])+'</td>'+
      '<td class="c">'+xesc(r[3]||'—')+'</td>'+
      '<td class="c '+(r[4]==='已完成'?'ok':'no')+'">'+xesc(r[4])+'</td>'+
    '</tr>';
  }).join('');
  var html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">'+
    '<title>Linux 学习打卡记录</title><style>'+
    '@page{size:A4 portrait;margin:14mm 10mm}'+
    'body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#101827;margin:0}'+
    'h1{font-size:19px;margin:0 0 4px;color:#1e3a8a}'+
    '.meta{font-size:11px;color:#5b6b86;margin-bottom:12px}'+
    '.meta b{color:#1e3a8a}'+
    'table{width:100%;border-collapse:collapse;font-size:10.5px}'+
    'th{background:#1e3a8a;color:#fff;padding:7px 6px;border:1px solid #c9d6ea;text-align:left;font-size:11px}'+
    'td{padding:6px;border:1px solid #d8e2f0;vertical-align:top;line-height:1.5}'+
    'tr:nth-child(even) td{background:#f5f8fd}'+
    'td.c{text-align:center;white-space:nowrap}'+
    'td.ok{color:#15803d;font-weight:700}td.no{color:#94a3b8}'+
    'tfoot td{background:#eef4ff;font-weight:700;font-size:11px}'+
    '.ft{margin-top:12px;font-size:10px;color:#8494ad;text-align:center}'+
    '</style></head><body>'+
    '<h1>Linux 学习打卡记录表</h1>'+
    '<div class="meta">导出时间：'+xesc(new Date().toLocaleString('zh-CN'))+
      ' &nbsp;|&nbsp; 记录条数：<b>'+n+'</b>'+
      ' &nbsp;|&nbsp; 已完成：<b>'+rows.filter(function(r){return r[4]==='已完成';}).length+'</b>'+
      ' &nbsp;|&nbsp; 未完成：<b>'+rows.filter(function(r){return r[4]!=='已完成';}).length+'</b>'+
      (expOnlyDone?' &nbsp;|&nbsp; <b>仅含已打卡</b>':'')+
    '</div>'+
    '<table><thead><tr><th style="width:6%">序号</th><th style="width:17%">大标题</th>'+
    '<th style="width:36%">学习内容</th><th style="width:11%">内容难度</th>'+
    '<th style="width:15%">打卡日期</th><th style="width:11%">是否完成</th></tr></thead>'+
    '<tbody>'+tr+'</tbody>'+
    '<tfoot><tr><td colspan="5">合计</td><td class="c">'+n+' 条</td></tr></tfoot>'+
    '</table><div class="ft">由「Linux 学习打卡」自动生成 · 数据存储于本机浏览器</div>'+
    '</body></html>';
  var w = window.open('', '_blank');
  if(!w){ toast('err','无法打开打印窗口','请允许本站弹出窗口后重试。'); return; }
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 420);
  toast('info','已生成 PDF 预览', '在弹出的打印窗口中，目标选择「另存为 PDF」并保存。', 4200);
}
/* ── JSON 备份 ── */
function doJson(){
  var payload = {app:'Linux学习打卡', version:3, exported:new Date().toISOString(), total:TOTAL, records:store.records};
  download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}), 'linux-checkin-backup-'+todayStr()+'.json');
  toast('ok','备份已导出','JSON 备份可在其他设备导入恢复。');
}

/* ───────── 17. 命令详情模态 ───────── */
function openCmd(name){
  var i = CMD_INDEX[name];
  if(i===undefined) return;
  var c = CMDS[i];
  $('#modalTitle').textContent = c.name;
  $('#modalSub').innerHTML = esc(c.cat)+' · '+esc(c.desc)+' · <span class="lv lv-'+c.diff+'">'+LV[c.diff]+'</span>';
  var h = '';
  if(c.intro) h += '<div class="kv"><div class="kv-l">简介</div><div style="font-size:13.5px;color:#c9dbf7;line-height:1.8">'+linkify(c.intro)+'</div></div>';
  if(c.syntax) h += '<div class="kv"><div class="kv-l">语法</div>'+codeBlock(c.syntax,'bash')+'</div>';
  if(c.params && c.params.length){
    h += '<div class="kv"><div class="kv-l">参数 / 选项（'+c.params.length+'）</div><div class="tbl-wrap"><div class="tbl-scroll"><table class="dt" style="min-width:380px"><thead><tr><th style="width:34%">参数</th><th>说明</th></tr></thead><tbody>';
    c.params.forEach(function(p){ h += '<tr><td style="font-family:var(--mono);color:#7dd3fc">'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>'; });
    h += '</tbody></table></div></div></div>';
  }
  if(c.examples && c.examples.length){
    h += '<div class="kv"><div class="kv-l">使用实例（'+c.examples.length+'）</div>';
    c.examples.forEach(function(e){
      h += '<div class="ex-item">'+
        (e.desc ? '<div class="ex-d">'+linkify(e.desc)+'</div>' : '')+
        (e.code ? '<div style="display:flex;gap:9px;align-items:flex-start"><pre style="flex:1 1 auto">'+esc(e.code)+'</pre>'+
                  '<button class="copy-btn" type="button" data-copycode="'+esc(e.code).replace(/"/g,'&quot;')+'">复制</button></div>' : '')+
        '</div>';
    });
    h += '</div>';
  } else if(c.example){
    h += '<div class="kv"><div class="kv-l">参考用法</div>'+codeBlock(c.example,'bash')+'</div>';
  }
  /* 本条命令的打卡 */
  var uid = 'cmd:'+c.name, rec = recOf(uid);
  h += '<div class="kv" style="margin-bottom:0"><div class="kv-l">打卡</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">'+
      '<label class="cbar-check"><input type="checkbox" class="ck" data-unit="'+uid+'"'+(pending[uid]?' checked':'')+'> 我已记住 '+esc(c.name)+'</label>'+
      (rec? '<span class="chip d-1">✅ 已打卡 · '+esc(fmtCn(rec.d))+'</span>' : '<span class="chip">⭕ 尚未打卡</span>')+
      '<span style="font-size:12px;color:var(--txt3)">勾选后关闭本窗口，在底部选择日期并提交打卡</span>'+
    '</div></div>';
  $('#modalBody').innerHTML = h;
  $('#modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  $('#modal').classList.remove('show');
  document.body.style.overflow = '';
}

/* ───────── 18. 侧边栏 / 移动端 ───────── */
function isMobile(){ return window.innerWidth <= 900; }
function toggleSide(){
  if(isMobile()){
    $('#app').classList.toggle('mobile-open');
  } else {
    $('#app').classList.toggle('collapsed');
    try{ localStorage.setItem('linuxCheckin.sideCollapsed', $('#app').classList.contains('collapsed')?'1':'0'); }catch(e){}
  }
}
function closeMobile(){ $('#app').classList.remove('mobile-open'); }
function initSide(){
  var c = '0';
  try{ c = localStorage.getItem('linuxCheckin.sideCollapsed') || '0'; }catch(e){}
  if(!isMobile() && c==='1') $('#app').classList.add('collapsed');
}
function navSearch(){
  var inp = $('#navSearch'), clr = $('#navClear');
  inp.addEventListener('input', function(){
    var q = inp.value.trim().toLowerCase();
    clr.style.display = q ? '' : 'none';
    $$('#sideNav .nav-item').forEach(function(b){
      var k = (b.getAttribute('data-srch')||'') + ' ' + b.textContent.toLowerCase();
      b.classList.toggle('hide', !!q && k.indexOf(q) < 0);
    });
    $$('#sideNav .nav-group').forEach(function(g){
      var any = $$('.nav-item:not(.hide)', g).length;
      g.style.display = any ? '' : 'none';
    });
  });
  clr.addEventListener('click', function(){
    inp.value=''; inp.dispatchEvent(new Event('input')); inp.focus();
  });
}

/* ───────── 19. 打卡提交 ───────── */
function initCbar(){
  var d = $('#cbDate');
  d.value = todayStr();
  $('#cbToday').addEventListener('change', function(){
    if(this.checked) d.value = todayStr();
  });
  d.addEventListener('change', function(){
    if(d.value !== todayStr()) $('#cbToday').checked = false;
  });
  $('#cbClear').addEventListener('click', function(){
    Object.keys(pending).forEach(function(id){ /* noop */ });
    pending = {};
    $$('.ck').forEach(function(el){ el.checked = false; });
    $$('tr.pick').forEach(function(tr){ tr.classList.remove('pick'); });
    refreshBar();
    toast('info','已撤销选择','本次待提交的内容已清空。',1800);
  });
  $('#cbSubmit').addEventListener('click', submitCheckin);
}
function submitCheckin(){
  var ids = pendingIds();
  if(!ids.length){ toast('info','还没有勾选内容','请先在教程 / 命令 / 技巧中勾选要打卡的条目。'); return; }
  var date = $('#cbDate').value || todayStr();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('err','日期无效','请选择有效的打卡日期。'); return; }
  var btn = $('#cbSubmit');
  btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse');
  var ts = Date.now();
  ids.forEach(function(id, k){
    if(!UNIT_MAP[id]) return;
    store.records[id] = {d: date, ts: ts + k};
  });
  saveStore();
  pending = {};
  refreshBar();
  updateRing();
  /* 局部刷新状态提示，不整体重绘以免打断阅读位置 */
  refreshVisibleChecks();
  toast('ok','打卡成功 ✅', '已提交 '+ids.length+' 项 · 打卡日期 '+fmtCn(date)+'。可前往「打卡记录与导出」查看。', 3400);
}
/* 提交后同步页面上的打卡徽标（保留滚动位置，不打断阅读） */
function refreshVisibleChecks(){
  var v = curView;
  if(!v) return;
  render(true);
}

/* ───────── 20. 事件委托 ───────── */
function initEvents(){
  document.addEventListener('click', function(ev){
    var el;
    /* 导航跳转 */
    if((el = ev.target.closest('[data-go]'))){
      ev.preventDefault();
      go('#/'+el.getAttribute('data-go'));
      if(isMobile()) closeMobile();
      return;
    }
    /* 复制代码块 */
    if((el = ev.target.closest('.copy-btn'))){
      if(el.hasAttribute('data-copycode')){
        copyText(el.getAttribute('data-copycode'), el);
      } else {
        var wrap = el.closest('.code-wrap');
        var code = wrap ? wrap.querySelector('code,pre') : null;
        copyText(code ? code.innerText : '', el);
      }
      return;
    }
    /* 点击举例复制 */
    if((el = ev.target.closest('button.cmd-ex'))){
      copyText(el.textContent, el);
      return;
    }
    /* 打开命令详情 */
    if((el = ev.target.closest('button.cmd-name'))){
      openCmd(el.getAttribute('data-cmd'));
      return;
    }
    /* 记录页：撤销 */
    if((el = ev.target.closest('[data-undo]'))){
      var id = el.getAttribute('data-undo');
      delete store.records[id];
      saveStore(); updateRing(); render();
      toast('info','已撤销打卡', (UNIT_MAP[id]? UNIT_MAP[id].title : id)+' 的打卡记录已删除。');
      return;
    }
    /* 记录页：去打卡 */
    if((el = ev.target.closest('[data-jump]'))){
      var jid = el.getAttribute('data-jump');
      var u = UNIT_MAP[jid];
      if(!u) return;
      if(u.kind==='tut') go('#/tut/'+u.key);
      else if(u.kind==='cmd') go('#/cat/'+encodeURIComponent((CMDS[CMD_INDEX[u.key]]||{}).cat||CATS[0]));
      else go('#/tips');
      return;
    }
    /* 导出按钮 */
    if(ev.target.closest('#expCsv')){ doCsv(); return; }
    if(ev.target.closest('#expXls')){ doXlsx(); return; }
    if(ev.target.closest('#expPdf')){ doPdf(); return; }
    if(ev.target.closest('#expJson')){ doJson(); return; }
    if(ev.target.closest('#expReset')){
      var n = doneCount();
      if(!n){ toast('info','没有需要清空的记录'); return; }
      if(window.confirm('确定要清空全部 '+n+' 条打卡记录吗？此操作不可恢复。建议先导出备份。')){
        store.records = {}; saveStore(); updateRing(); render();
        toast('ok','已清空','全部打卡记录已删除。');
      }
      return;
    }
    /* 模态关闭 */
    if(ev.target.closest('#modalX') || ev.target.closest('#modalBg')){ closeModal(); return; }
    /* 友情链接下拉 */
    if(ev.target.closest('#flBtn')){
      var fl = $('#flLink'); fl.classList.toggle('open');
      $('#flBtn').setAttribute('aria-expanded', fl.classList.contains('open')?'true':'false');
      return;
    }
    if(!ev.target.closest('#flLink')){
      var f2 = $('#flLink'); if(f2) f2.classList.remove('open');
    }
  });

  /* 勾选（change 不冒泡到 click 委托时需要单独监听） */
  document.addEventListener('change', function(ev){
    var el = ev.target;
    if(el.classList && el.classList.contains('ck')){
      var id = el.getAttribute('data-unit');
      if(!id) return;
      markPending(id, el.checked);
      var tr = el.closest('tr');
      if(tr) tr.classList.toggle('pick', el.checked);
      if(el.closest('.tip')){
        /* 技巧卡片的选中反馈 */
        el.closest('.tip').style.borderColor = el.checked ? 'rgba(34,211,238,.6)' : '';
      }
      return;
    }
    if(el.id === 'expOnly'){
      expOnlyDone = el.checked;
      render();
      return;
    }
  });

  /* 顶部按钮 */
  $('#btnToggle').addEventListener('click', toggleSide);
  $('#scrim').addEventListener('click', closeMobile);
  $('#btnRecords').addEventListener('click', function(){ go('#/records'); });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ closeModal(); var f3=$('#flLink'); if(f3) f3.classList.remove('open'); }
    if(e.key==='/' && !/input|textarea/i.test((document.activeElement||{}).tagName||'')){
      e.preventDefault(); var n = $('#navSearch'); if(n){ n.focus(); } 
    }
  });
  window.addEventListener('resize', function(){
    if(!isMobile()) $('#app').classList.remove('mobile-open');
  });
  window.addEventListener('beforeprint', function(){});
}

/* ───────── 21. 启动 ───────── */
function boot(){
  var y = $('#footYear'); if(y) y.textContent = new Date().getFullYear();
  initSide();
  navSearch();
  initCbar();
  initEvents();
  if(!location.hash) location.replace('#/home');
  render();
  if(store.migrated){
    var n = doneCount();
    if(n) setTimeout(function(){ toast('info','已迁移历史打卡数据','从旧版本继承了 '+n+' 条打卡记录。',4200); }, 900);
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* 调试 / 自动化测试钩子（只读为主，不影响正常使用） */
window.__lc = {
  version: function(){ return '3.1'; },
  stats: function(){ return {total: TOTAL, done: doneCount(), units: UNITS.length}; },
  store: function(){ return JSON.parse(JSON.stringify(store)); },
  exportRows: exportRows,
  HEAD: HEAD,
  buildXlsxFiles: buildXlsxFiles,
  zipStore: zipStore,
  crc32: crc32
};

})();
</script>
