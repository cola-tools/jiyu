:"dirs","desc":"显示目录栈内容","diff":3,"intro":"Linux dirs命令用于显示目录记录。","syntax":"dirs [+/-n -l]","params":[],"examples":[{"desc":"列出\"/home/cc/Ruijie\"里所有内容的详细信息。可用如下命令。","code":"dir -l /home/cc/Ruijie"},{"desc":"下面是显示的内容：","code":"$ dir -l /home/cc/Ruijie\n\n总计2168\n\n-rwxr-xr-x 1 cc cc 112876 2008-06-26 libpcap.so.0.6.2 -rwxr-xr-x 1 cc cc 737192 2008-06-26 libstdc++.so.5 -rwxr-xr-x 1 cc cc1938 2004-04-23 readme.txt\n\n-rwxr-xr-x 1 cc cc 1350772 2005-08-31 xrgsu"}],"example":"dir -l /home/cc/Ruijie"},{"cat":"磁盘管理","name":"du","desc":"显示目录或文件大小","diff":3,"intro":"Linux du （英文全拼：disk usage）命令用于显示目录或文件的大小。","syntax":"du [-abcDhHklmsSx][-L \u003c符号连接>][-X \u003c文件>][--block-size][--exclude=\u003c目录或文件>][--max-depth=\u003c目录层数>][--help][--version][目录或文件]","params":[],"examples":[{"desc":"显示目录或者文件所占空间:","code":"# du\n\n608 ./test6\n\n308 ./test4\n\n4 ./scf/lib\n\n4 ./scf/service/deploy/product\n\n4 ./scf/service/deploy/info\n\n12 ./scf/service/deploy\n\n16 ./scf/service\n\n4 ./scf/doc\n\n4 ./scf/bin\n\n32 ./scf\n\n8 ./test3\n\n1288 ."},{"desc":"显示指定文件所占空间","code":"# du log2012.log \n\n300 log2012.log"},{"desc":"方便阅读的格式显示test目录所占空间情况：","code":"# du -h test\n\n608K test/test6\n\n308K test/test4\n\n4.0K test/scf/lib\n\n4.0K test/scf/service/deploy/product\n\n4.0K test/scf/service/deploy/info\n\n12K test/scf/service/deploy\n\n16K test/scf/service\n\n4.0K test/scf/doc\n\n4.0K test/scf/bin\n\n32K test/scf\n\n8.0K test/test3\n\n1.3M test"}],"example":"608 ./test6"},{"cat":"磁盘管理","name":"edquota","desc":"编辑磁盘配额","diff":3,"intro":"Linux edquota命令用于编辑用户或群组的磁盘配额。","syntax":"edquota [-p \u003c源用户名称>][-ug][用户或群组名称...]","params":[],"examples":[],"example":"sudo edquota -u tom"},{"cat":"磁盘管理","name":"eject","desc":"弹出可移动设备","diff":3,"intro":"Linux eject命令用于退出抽取式设备。","syntax":"eject [-dfhnqrstv][-a \u003c开关>][-c \u003c光驱编号>][设备]","params":[],"examples":[{"desc":"","code":"# eject //不加参数默认弹出\n\n# eject -r /dev/cdrom //指定设备"}],"example":"eject /dev/cdrom"},{"cat":"磁盘管理","name":"mcd","desc":"切换 MS-DOS 目录","diff":3,"intro":"Linux mcd为mtools工具指令，可在MS-DOS文件系统中切换工作目录。若不加任何参数，则显示目前所在的磁盘与工作目录。","syntax":"mcd [msdosdirectory]","params":[],"examples":[{"desc":"变更目前工作目录到 a: emp 中。","code":"mcd a: emp"},{"desc":"传回目前工作目录。","code":"mcd"}],"example":"mcd a: emp"},{"cat":"磁盘管理","name":"mdeltree","desc":"删除 MS-DOS 目录树","diff":3,"intro":"Linux mdeltree命令可用来删除 MSDOS 格式档案及目录。","syntax":"mdeltree [-v] msdosdirectory [msdosdirectories...]","params":[],"examples":[{"desc":"将 A 磁盘根目录中的 msdosdir 目录以下的档案与目录都删除掉。","code":"mcopy a:msdosdir"}],"example":"mcopy a:msdosdir"},{"cat":"磁盘管理","name":"mdu","desc":"显示 MS-DOS 磁盘使用","diff":3,"intro":"Linux mdu命令用于显示MS-DOS目录所占用的磁盘空间。","syntax":"mdu [-as][目录]","params":[],"examples":[],"example":"mdu a:"},{"cat":"磁盘管理","name":"mkdir","desc":"创建新目录","diff":2,"intro":"Linux mkdir（英文全拼：make directory）命令用于创建目录。","syntax":"mkdir [-p] dirName","params":[],"examples":[{"desc":"在工作目录下，建立一个名为 runoob 的子目录 :","code":"mkdir runoob"},{"desc":"若 runoob2 目录原本不存在，则建立一个。（注：本例若不加 -p 参数，且原本 runoob2 目录不存在，则产生错误。）","code":"mkdir -p runoob2/test"}],"example":"mkdir runoob"},{"cat":"磁盘管理","name":"mlabel","desc":"设置 MS-DOS 卷标","diff":3,"intro":"Linux mlabel命令用于设定磁盘的标签 (Label)。","syntax":"mlabel [-vcs] drive:[new_label]","params":[],"examples":[{"desc":"将 A 盘的标签更改为 newlabel。","code":"mlabel a:newlabel"}],"example":"mlabel a:newlabel"},{"cat":"磁盘管理","name":"mmd","desc":"创建 MS-DOS 目录","diff":3,"intro":"Linux mmd命令用于在MS-DOS文件系统中建立目录。","syntax":"mmd [目录...]","params":[],"examples":[],"example":"mmd a:\\docs"},{"cat":"磁盘管理","name":"mrd","desc":"删除 MS-DOS 目录","diff":3,"intro":"Linux mrd命令用于删除MS-DOS文件系统中的目录。","syntax":"mrd [目录...]","params":[],"examples":[],"example":"mrd a:\\docs"},{"cat":"磁盘管理","name":"mzip","desc":"管理 ZIP 磁盘","diff":3,"intro":"Linux mzip命令是Zip/Jaz磁盘驱动器控制指令。","syntax":"mzip [-efpqruwx]","params":[],"examples":[],"example":"mzip -e a:"},{"cat":"磁盘管理","name":"pwd","desc":"显示当前目录路径","diff":2,"intro":"Linux pwd（英文全拼：print work directory） 命令用于显示当前用户所在的工作目录的完整路径。","syntax":"pwd [--help][--version]","params":[["-L","显示逻辑路径（默认行为），解析符号链接"],["-P","显示物理路径，不解析符号链接"],["--help","显示帮助信息"],["--version","显示版本信息"]],"examples":[{"desc":"最简单的用法是直接输入命令：","code":"$ pwd\n\n/home/username/projects"},{"desc":"","code":"#!/bin/bash\n\nCURRENT_DIR=$(pwd)\n\necho \"当前目录是: $CURRENT_DIR\""}],"example":"pwd"},{"cat":"磁盘管理","name":"quota","desc":"显示磁盘配额","diff":3,"intro":"Linux quota命令用于显示磁盘已使用的空间与限制。","syntax":"quota [-quvV][用户名称...] 或 quota [-gqvV][群组名称...]","params":[],"examples":[{"desc":"","code":"# quota -guvs \u003c==显示目前执行者（就是 root ）的 quota 值 \n\n# quota -uvs test \u003c==显示 test 这个使用者的 quota 值"}],"example":"quota -u tom"},{"cat":"磁盘管理","name":"mount","desc":"挂载文件系统","diff":3,"intro":"Linux mount命令是经常会使用到的命令，它用于挂载Linux系统外的文件。","syntax":"mount [-hV]\n\nmount -a [-fFnrsvw] [-t vfstype]\n\nmount [-fnrsvw] [-o options [,...]] device | dir\n\nmount [-fnrsvw] [-t vfstype] [-o options] device dir","params":[],"examples":[{"desc":"将 /dev/hda1 挂在 /mnt 之下。","code":"#mount /dev/hda1 /mnt"},{"desc":"将 /dev/hda1 用唯读模式挂在 /mnt 之下。","code":"#mount -o ro /dev/hda1 /mnt"},{"desc":"将 /tmp/image.iso 这个光碟的 image 档使用 loop 模式挂在 /mnt/cdrom之下。用这种方法可以将一般网络上可以找到的 Linux 光 碟 ISO 档在不烧录成光碟的情况下检视其内容。","code":"#mount -o loop /tmp/image.iso /mnt/cdrom"}],"example":"sudo mount -o remount,rw /"},{"cat":"磁盘管理","name":"mmount","desc":"挂载 MS-DOS 文件系统","diff":3,"intro":"Linux mmount命令用于挂入MS-DOS文件系统。","syntax":"mmount [驱动器代号][mount参数]","params":[],"examples":[],"example":"mmount a: /mnt/floppy"},{"cat":"磁盘管理","name":"rmdir","desc":"删除空目录","diff":3,"intro":"Linux rmdir（英文全拼：remove directory）命令删除空的目录。","syntax":"rmdir [-p] dirName","params":[],"examples":[{"desc":"将工作目录下，名为 AAA 的子目录删除 :","code":"rmdir AAA"},{"desc":"在工作目录下的 BBB 目录中，删除名为 Test 的子目录。若 Test 删除后，BBB 目录成为空目录，则 BBB 亦予删除。","code":"rmdir -p BBB/Test"}],"example":"rmdir AAA"},{"cat":"磁盘管理","name":"rmt","desc":"远程磁带操作","diff":3,"intro":"Linux rmt命令通过进程间通信远程控制磁带机。","syntax":"rmt","params":[],"examples":[],"example":"rmt -f /dev/st0"},{"cat":"磁盘管理","name":"stat","desc":"显示文件状态信息","diff":3,"intro":"Linux stat 命令用于显示 inode 内容。","syntax":"stat [文件或目录]","params":[],"examples":[{"desc":"查看 testfile 文件的inode内容内容，可以用以下命令：","code":"stat testfile"},{"desc":"执行以上命令输出结果：","code":"# stat testfile #输入命令\n\n File: `testfile'\n\n Size: 102 Blocks: 8 IO Block: 4096 regular file\n\nDevice: 807h/2055d Inode: 1265161 Links: 1\n\nAccess: (0644/-rw-r--r--) Uid: ( 0/ root) Gid: ( 0/ root)\n\nAccess: 2014-08-13 14:07:20.000000000 +0800\n\nModify: 2014-08-13 14:07:07.000000000 +0800\n\nChange: 2014-08-13 14:07:07.000000000 +0800"}],"example":"stat testfile"},{"cat":"磁盘管理","name":"tree","desc":"以树状图显示目录","diff":3,"intro":"Linux tree命令用于以树状图列出目录的内容。","syntax":"tree [-aACdDfFgilnNpqstux][-I \u003c范本样式>][-P \u003c范本样式>][目录...]","params":[],"examples":[{"desc":"以树状图列出当前目录结构。可直接使用如下命令：","code":"tree"},{"desc":"该命令有如下输出结果：","code":"# tree #以树状图列出当前目录结构 \n\n. #当前目录结构 \n\n|-- README \n\n|-- examples.desktop \n\n|-- file \n\n|-- file.new \n\n|-- index.htm \n\n|-- test \n\n| |-- README \n\n| |-- file \n\n| |-- testfile \n\n| |-- testfile1 \n\n| |-- xaa \n\n| |-- xab \n\n| |-- xac \n\n| |-- xad \n\n| |-- xae \n\n| |-- xaf \n\n| |-- xag \n\n| |-- xah \n\n| `-- xai \n\n|-- test.tar.gz \n\n|-- test.zip \n\n|-- testfile \n\n|-- testfile.new \n\n|-- testfile.patch \n\n|-- testfile1 \n\n|-- testfile2 \n\n|-- testfile3 \n\n|-- xaa \n\n|-- xab \n\n|-- xac \n\n|-- xad \n\n|-- xae \n\n|-- xaf \n\n|-- xag \n\n|-- xah \n\n|-- xai \n\n|-- \\345\\205\\254\\345\\205\\261\\347\\232\\204 \n\n|-- \\345\\233\\276\\347\\211\\207 \n\n| |-- 075b5c2bb1628c1a5343c10a.jpg \n\n| |-- 0c978fe989ac787e799757095719d3c4.jpg \n\n| |-- 20050726194826866443.jpg \n\n| |-- 20061113171548785122.jpg \n\n| |-- 2007102221576687.jpg \n\n| |-- 39.jpg \n\n| |-- 434887ec4340916a78f0559a.jpg \n\n| |-- 498da016ac02fb2bc93d6d08.jpg \n\n| |-- 7b284f5a0f854da2f3bf90b204149a34.jpg \n\n| |-- 9196c030d342a68d5edf0e98.jpg \n\n| |-- a56c5a90de15c8a9a977a4cc.jpg \n\n| |-- c74f62167c9d2b244a90a79e.jpg \n\n| `-- img13.jpg \n\n|-- \\346\\226\\207\\346\\241\\243 \n\n|-- \\346\\241\\214\\351\\235\\242 \n\n|-- \\346\\250\\241\\346\\235\\277 \n\n|-- \\350\\247\\206\\351\\242\\221 \n\n`-- \\351\\237\\263\\344\\271\\220 \n\n8 directories, 48 files #统计信息，该目录共8个子目录，48个文件"}],"example":"tree"},{"cat":"磁盘管理","name":"umount","desc":"卸载文件系统","diff":3,"intro":"Linux umount（英文全拼：unmount）命令用于卸除文件系统。","syntax":"umount [-ahnrvV][-t \u003c文件系统类型>][文件系统]","params":[],"examples":[{"desc":"下面两条命令分别通过设备名和挂载点卸载文件系统，同时输出详细信息：","code":"# umount -v /dev/sda1 通过设备名卸载 \n\n/dev/sda1 umounted \n\n# umount -v /mnt/mymount/ 通过挂载点卸载 \n\n/tmp/diskboot.img umounted"},{"desc":"如果设备正忙，卸载即告失败。卸载失败的常见原因是，某个打开的shell当前目录为挂载点里的某个目录：","code":"# umount -v /mnt/mymount/ \n\numount: /mnt/mymount: device is busy \n\numount: /mnt/mymount: device is busy"}],"example":"/dev/sda1 umounted"},{"cat":"磁盘管理","name":"ls","desc":"列出目录内容","diff":2,"intro":"Linux ls（英文全拼： list directory contents）命令用于显示指定工作目录下之内容（列出目前工作目录所含的文件及子目录)。","syntax":"ls [-alrtAFR] [name...]","params":[["-a 或 --all","显示所有文件（包括以 . 开头的隐藏文件）。"],["-A 或 --almost-all","显示除 . 和 .. 外的所有文件（包括隐藏文件）。"],["-l","以长格式（详细信息）列出文件（权限、所有者、大小、修改时间等）。"],["-h 或 --human-readable","与 -l 一起使用时，以人类可读的格式显示文件大小（如 KB、MB）。"],["-t","按修改时间排序（最新优先）。"],["-r 或 --reverse","反向排序（配合 -t、-S 等使用）。"],["-S","按文件大小排序（大文件优先）。"],["-R 或 --recursive","递归列出子目录内容。"],["-F 或 --classify","在文件名后附加标识符（如 / 表示目录，* 表示可执行文件）。"],["--color","彩色输出（通常默认启用，--color=auto）。"],["-i 或 --inode","显示文件的 inode 编号。"],["-n 或 --numeric-uid-gid","以数字形式显示 UID 和 GID（替代用户名和组名）。"],["-d 或 --directory","仅显示目录本身，而非其内容（常用于配合 -l）。"],["-1","每行只显示一个文件（默认在终端宽度不足时自动启用）。"],["-m","以逗号分隔的列表形式显示文件。"],["-Q 或 --quote-name","用引号括住文件名（适用于含空格的文件名）。"],["--group-directories-first","先显示目录，后显示文件。"],["--time-style=\u003c格式>","自定义时间显示格式（如 +%Y-%m-%d）。"]],"examples":[{"desc":"详细列出当前目录所有文件（含隐藏文件）：","code":"ls -la"},{"desc":"按大小反向排序文件（大文件优先）：","code":"ls -lShr"},{"desc":"递归列出 /var/log 目录内容，并显示人类可读的文件大小：","code":"ls -lhR /var/log"},{"desc":"仅显示目录的详细信息（不递归）：","code":"ls -ld /etc"},{"desc":"按修改时间排序（最新文件最后显示）：","code":"ls -ltr"},{"desc":"列出根目录下的所有目录：","code":"# ls /\n\nbin dev lib media net root srv upload www\n\nboot etc lib64 misc opt sbin sys usr\n\nhome lost+found mnt proc selinux tmp var"},{"desc":"将 /bin 目录以下所有目录及文件详细资料列出:","code":"ls -lR /bin"},{"desc":"当文件名包含空格、特殊字符或者开始字符为破折号时，可以使用反斜杠（\\）进行转义，或者使用引号将文件名括起来。例如：","code":"ls \"my file.txt\" # 列出文件名为\"my file.txt\"的文件\n\nls my\\ file.txt # 列出文件名为\"my file.txt\"的文件\n\nls -- -filename # 列出文件名为\"-filename\"的文件"},{"desc":"ls 命令还可以使用通配符进行模式匹配，例如 * 表示匹配任意字符，? 表示匹配一个字符，[...] 表示匹配指定范围内的字符。例如：","code":"ls *.txt # 列出所有扩展名为.txt的文件\n\nls file?.txt # 列出文件名为file?.txt的文件，其中?表示任意一个字符\n\nls [abc]*.txt # 列出以a、b或c开头、扩展名为.txt的文件"},{"desc":"列出目前工作目录下所有名称是 s 开头的文件，越新的排越后面:","code":"ls -ltr s*"}],"example":"ls -la"},{"cat":"磁盘管理","name":"quotacheck","desc":"检查磁盘配额","diff":3,"intro":"Linux quotacheck命令用于检查磁盘的使用空间与限制。","syntax":"quotacheck [-adgRuv][文件系统...]","params":[],"examples":[],"example":"sudo quotacheck -avug"},{"cat":"磁盘管理","name":"quotaoff","desc":"关闭磁盘配额","diff":3,"intro":"Linux quotaoff 命令关闭磁盘空间限制。","syntax":"quotaoff [-aguv][文件系统...]","params":[],"examples":[{"desc":"关闭配额限制:","code":"# quotaoff -a"}],"example":"sudo quotaoff -a"},{"cat":"磁盘管理","name":"lndir","desc":"创建目录软链接树","diff":3,"intro":"Linux lndir命令用于连接目录内容。","syntax":"lndir [-ignorelinks][-silent][源目录][目的目录]","params":[],"examples":[{"desc":"给目录下所有的文件或者子文件目录建立链接：","code":"lndir /home/uptech abc"}],"example":"lndir /home/uptech abc"},{"cat":"磁盘管理","name":"repquota","desc":"报告磁盘配额","diff":3,"intro":"Linux repquota命令用于检查磁盘空间限制的状态。","syntax":"repquota [-aguv][文件系统...]","params":[],"examples":[],"example":"sudo repquota -a"},{"cat":"磁盘管理","name":"quotaon","desc":"启用磁盘配额","diff":3,"intro":"Linux quotaon 命令用于开启磁盘空间限制。","syntax":"quotaon [-aguv][文件系统...]","params":[],"examples":[],"example":"sudo quotaon -a"},{"cat":"磁盘维护","name":"badblocks","desc":"检测磁盘坏块","diff":4,"intro":"Linux badblocks命令用于检查磁盘装置中损坏的区块。","syntax":"badblocks [-svw][-b \u003c区块大小>][-o \u003c输出文件>][磁盘装置][磁盘区块数][启始区块]","params":[],"examples":[{"desc":"查看系统当前硬盘信息。","code":"# fdisk -l"},{"desc":"例如，显示信息如下：","code":"Disk /dev/sda: 298.9 GB, 298999349248 bytes\n\n255 heads, 63 sectors/track, 36351 cylinders\n\nUnits = cylinders of 16065 * 512 = 8225280 bytes\n\n Device Boot Start End Blocks Id System\n\n/dev/sda1 1 262 2104483+ 82 Linux swap / Solaris\n\n/dev/sda2 * 263 32898 262148670 83 Linux\n\n/dev/sda3 32899 36351 27736222+ 83 Linux\n\nDisk /dev/sdb: 42.9 GB, 42949672960 bytes\n\n64 heads, 32 sectors/track, 40960 cylinders\n\nUnits = cylinders of 2048 * 512 = 1048576 bytes"},{"desc":"通过命令扫描硬盘。","code":"# badblocks -s -v /dev/sdnx"},{"desc":"其中n表示硬盘设备名，x表示硬盘对应的分区号。例如需要检查\"/dev/sda2\"，执行命令如下：","code":"# badblocks -s -v /dev/sda2\n\nChecking blocks 0 to 30681000\n\nChecking for bad blocks (read-only test): 306809600674112/ 306810000000\n\n30680964\n\n30680965\n\n30680966\n\n30680967\n\n30680968\n\n30680969\n\n30680970\n\n30680971\n\n30680972\n\n30680973\n\n...\n\ndone\n\nPass completed, 37 bad blocks found.其中，“37 bad blocks found”表示硬盘存在37个坏块。"}],"example":"Disk /dev/sda: 298.9 GB, 298999349248 bytes"},{"cat":"磁盘维护","name":"cfdisk","desc":"磁盘分区工具","diff":4,"intro":"Linux cfdisk命令用于磁盘分区。","syntax":"cfdisk [-avz][-c \u003c柱面数目>-h \u003c磁头数目>-s \u003c盘区数目>][-P \u003cr,s,t>][外围设备代号]","params":[],"examples":[{"desc":"进行磁盘分区：","code":"# cfsik"},{"desc":"进行磁盘分区，使用箭头进行操作，而不使用反白表示：","code":"# cfsik -a"},{"desc":"进行磁盘分区，使用箭头进行操作，而不使用反白表示：","code":"# cfsik -s 3"}],"example":"sudo cfdisk /dev/sda"},{"cat":"磁盘维护","name":"dd","desc":"转换和复制文件","diff":4,"intro":"Linux dd 命令用于读取、转换并输出数据。","syntax":"dd if=boot.img of=/dev/fd0 bs=1440k","params":[],"examples":[{"desc":"在Linux 下制作启动盘，可使用如下命令：","code":"dd if=boot.img of=/dev/fd0 bs=1440k"},{"desc":"将testfile文件中的所有英文字母转换为大写，然后转成为testfile_1文件，在命令提示符中使用如下命令：","code":"dd if=testfile_2 of=testfile_1 conv=ucase"},{"desc":"其中testfile_2 的内容为：","code":"$ cat testfile_2 #testfile_2的内容 \n\nHELLO LINUX! \n\nLinux is a free unix-type opterating system. \n\nThis is a linux testfile! \n\nLinux test"},{"desc":"转换完成后，testfile_1 的内容如下：","code":"$ dd if=testfile_2 of=testfile_1 conv=ucase #使用dd 命令，大小写转换记录了0+1 的读入 \n\n记录了0+1 的写出 \n\n95字节（95 B）已复制，0.000131446 秒，723 KB/s \n\ncmd@hdd-desktop:~$ cat testfile_1 #查看转换后的testfile_1文件内容 \n\nHELLO LINUX! \n\nLINUX IS A FREE UNIX-TYPE OPTERATING SYSTEM. \n\nTHIS IS A LINUX TESTFILE! \n\nLINUX TEST #testfile_2中的所有字符都变成了大写字母"},{"desc":"由标准输入设备读入字符串，并将字符串转换成大写后，再输出到标准输出设备，使用的命令为：","code":"dd conv=ucase"},{"desc":"输入以上命令后按回车键，输入字符串，再按回车键，按组合键Ctrl+D 退出，出现以下结果：","code":"$ dd conv=ucase \n\nHello Linux! #输入字符串后按回车键 \n\nHELLO LINUX! #按组合键Ctrl+D退出，转换成大写结果 \n\n记录了0+1 的读入 \n\n记录了0+1 的写出 \n\n13字节（13 B）已复制，12.1558 秒，0.0 KB/s"}],"example":"dd if=boot.img of=/dev/fd0 bs=1440k"},{"cat":"磁盘维护","name":"e2fsck","desc":"检查修复 ext2/ext3 文件系统","diff":4,"intro":"Linux e2fsck命令用于检查使用 Linux ext2 档案系统的 partition 是否正常工作。","syntax":"e2fsck [-pacnydfvFV] [-b superblock] [-B blocksize] [-l|-L bad_blocks_file] [-C fd] device","params":[],"examples":[{"desc":"检查 /dev/hda5 是否正常，如果有异常便自动修复，并且设定若有问答，均回答[是] :","code":"e2fsck -a -y /dev/hda5"}],"example":"e2fsck -a -y /dev/hda5"},{"cat":"磁盘维护","name":"ext2ed","desc":"ext2 文件系统编辑器","diff":4,"intro":"Linux ext2ed命令是ext2文件系统编辑程序。","syntax":"ext2ed","params":[],"examples":[],"example":"ext2ed /dev/sda1"},{"cat":"磁盘维护","name":"fsck","desc":"文件系统一致性检查","diff":4,"intro":"Linux fsck（英文全拼：file system check）命令用于检查与修复 Linux 档案系统，可以同时检查一个或多个 Linux 档案系统。","syntax":"fsck [-sACVRP] [-t fstype] [--] [fsck-options] filesys [...]","params":[],"examples":[{"desc":"检查 msdos 档案系统的 /dev/hda5 是否正常，如果有异常便自动修复 :","code":"fsck -t msdos -a /dev/hda5"}],"example":"fsck -t msdos -a /dev/hda5"},{"cat":"磁盘维护","name":"fsck.minix","desc":"检查修复 minix 文件系统","diff":4,"intro":"Linux fsck.minix命令用于检查文件系统并尝试修复错误。","syntax":"fsck.minix [-aflmrsv][外围设备代号]","params":[],"examples":[],"example":"sudo fsck.minix /dev/sda1"},{"cat":"磁盘维护","name":"fsconf","desc":"文件系统配置工具","diff":4,"intro":"Linux fsconf命令用于设置文件系统相关功能。","syntax":"fsconf [--check]","params":[],"examples":[],"example":"fsconf"},{"cat":"磁盘维护","name":"fdformat","desc":"软盘低级格式化","diff":4,"intro":"Linux fdformat命令用于对指定的软碟机装置进行低阶格式化。","syntax":"fdformat [-n] device","params":[],"examples":[{"desc":"","code":"fdformat -n /dev/fd0h1440"}],"example":"fdformat -n /dev/fd0h1440"},{"cat":"磁盘维护","name":"hdparm","desc":"硬盘参数设置工具","diff":4,"intro":"Linux hdparm命令用于显示与设定硬盘的参数。","syntax":"hdparm [-CfghiIqtTvyYZ][-a \u003c快取分区>][-A \u003c0或1>][-c \u003cI/O模式>][-d \u003c0或1>][-k \u003c0或1>][-K \u003c0或1>][-m \u003c分区数>][-n \u003c0或1>][-p \u003cPIO模式>][-P \u003c分区数>][-r \u003c0或1>][-S \u003c时间>][-u \u003c0或1>][-W \u003c0或1>][-X \u003c传输模式>][设备]","params":[],"examples":[{"desc":"显示硬盘的相关设置：","code":"# hdparm /dev/sda\n\n /dev/sda:\n\n IO_support = 0 (default 16-bit)\n\n readonly = 0 (off)\n\n readahead = 256 (on)\n\n geometry = 19929［柱面数］/255［磁头数］/63［扇区数］, sectors = 320173056［总扇区数］, start = 0［起始扇区数］"},{"desc":"显示硬盘的柱面、磁头、扇区数","code":"# hdparm -g /dev/sda\n\n /dev/sda:\n\n geometry = 19929［柱面数］/255［磁头数］/63［扇区数］, sectors = 320173056［总扇区数］, start = 0［起始扇区数］"},{"desc":"评估硬盘的读取效率","code":"hdparm -t /dev/sda\n\n /dev/sda:\n\n Timing buffered disk reads: 166 MB in 3.03 seconds = 54.85 MB/sec\n\n [root@linuxso.com ~]# hdparm -t /dev/sda\n\n /dev/sda:\n\n Timing buffered disk reads: 160 MB in 3.01 seconds = 53.11 MB/sec\n\n [root@linuxso.com ~]# hdparm -t /dev/sda\n\n /dev/sda:\n\n Timing buffered disk reads: 166 MB in 3.00 seconds = 55.31 MB/sec"}],"example":"/dev/sda:"},{"cat":"磁盘维护","name":"mformat","desc":"格式化 MS-DOS 磁盘","diff":4,"intro":"Linux mformat命令用于对MS-DOS文件系统的磁盘进行格式化。","syntax":"mformat [-t cylinders] [-h heads] [-s sectors] [-l volume_label] [-F] [-I fsVer-sion] [-S sizecode] [-2 sectors_on_track_0] [-M software_sector_size] [-a] [-X] [-C] [-H hidden_sectors] [-r root_sectors] [-B boot_sector] [-0 rate_on_track_0] [-A rate_on_other_tracks] [-1] [-k] drive:","params":[],"examples":[{"desc":"用预设值把 a: （就是 /dev/fd0）里的磁碟片格式化。","code":"mformat a:"}],"example":"mformat a:"},{"cat":"磁盘维护","name":"mkbootdisk","desc":"创建启动软盘","diff":4,"intro":"Linux mkbootdisk命令用于建立目前系统的启动盘。","syntax":"mkbootdisk [--noprompt][--verbose][--version][--device \u003c设备>][--mkinitrdargs \u003c参数>][kernel 版本]","params":[],"examples":[],"example":"mkbootdisk --device /dev/fd0 $(uname -r)"},{"cat":"磁盘维护","name":"mkdosfs","desc":"创建 DOS 文件系统","diff":4,"intro":"Linux mkdosfs命令用于建立DOS文件系统。","syntax":"mkdosfs [ -c | -l filename ]\n\n　　 [ -f number_of_FATs ]\n\n　　 [ -F FAT_size ]\n\n　　 [ -i volume_id ]\n\n　　 [ -m message_file ]\n\n　　 [ -n volume_name ]\n\n　　 [ -r root_dir_entry ]\n\n　　 [ -s sector_per_cluster ]\n\n　　 [ -v ]\n\n　　 device\n\n　　 [ block_count ]","params":[],"examples":[{"desc":"将 A 槽里的磁碟片格式化为 DOS 格式，并将标签设为 Tester","code":"mkdosfs -n Tester /dev/fd0"}],"example":"mkdosfs -n Tester /dev/fd0"},{"cat":"磁盘维护","name":"mke2fs","desc":"创建 ext2/ext3 文件系统","diff":4,"intro":"Linux mke2fs命令用于建立ext2文件系统。","syntax":"mke2fs [-cFMqrSvV][-b \u003c区块大小>][-f \u003c不连续区段大小>][-i \u003c字节>][-N \u003cinode数>][-l \u003c文件>][-L \u003c标签>][-m \u003c百分比值>][-R=\u003c区块数>][ 设备名称][区块数]","params":[],"examples":[],"example":"sudo mke2fs -t ext4 /dev/sdb1"},{"cat":"磁盘维护","name":"mkfs.ext2","desc":"创建 ext2 文件系统","diff":4,"intro":"功能说明：与 mke2fs命令 相同","syntax":"","params":[],"examples":[],"example":"sudo mkfs.ext2 /dev/sdb1"},{"cat":"磁盘维护","name":"mkfs.msdos","desc":"创建 MS-DOS 文件系统","diff":4,"intro":"功能说明：与 mkdosfs 命令 相同。","syntax":"","params":[],"examples":[],"example":"sudo mkfs.msdos /dev/sdb1"},{"cat":"磁盘维护","name":"mkinitrd","desc":"生成 initrd 镜像","diff":4,"intro":"Linux mkinitrd命令用于建立要载入ramdisk的映像文件。","syntax":"mkinitrd [-fv][--omit-scsi-modules][--version][--preload=\u003c模块名称>][--with=\u003c模块名称>][映像文件][Kernel 版本]","params":[],"examples":[],"example":"sudo mkinitrd /boot/initrd.img $(uname -r)"},{"cat":"磁盘维护","name":"mkisofs","desc":"制作 ISO 镜像文件","diff":4,"intro":"Linux mkisofs命令用于建立ISO 9660映像文件。","syntax":"mkisofs [-adDfhJlLNrRTvz][-print-size][-quiet][-A \u003c应用程序ID>][-abstract \u003c摘要文件>][-b \u003c开机映像文件>][-biblio \u003cISBN文件>][-c \u003c开机文件名称>][-C \u003c盘区编号，磁区编号>][-copyright \u003c版权信息文件>][-hide \u003c目录或文件名>][-hide-joliet \u003c文件或目录名>][-log-file \u003c记录文件>][-m \u003c目录或文件名>][-M \u003c开机映像文件>][-o \u003c映像文件>][-p \u003c数据处理人>][-P \u003c光盘发行人>][-sysid \u003c系统ID >][-V \u003c光盘ID >][-volset \u003c卷册集ID>][-volset-size \u003c光盘总数>][-volset-seqno \u003c卷册序号>][-x \u003c目录>][目录或文件]","params":[],"examples":[],"example":"mkisofs -o my.iso /home/user/data"},{"cat":"磁盘维护","name":"mkswap","desc":"创建交换分区","diff":4,"intro":"Linux mkswap命令用于设置交换区(swap area)。","syntax":"mkswap [-cf][-v0][-v1][设备名称或文件][交换区大小]","params":[],"examples":[],"example":"sudo mkswap /dev/sdb2 && sudo swapon /dev/sdb2"},{"cat":"磁盘维护","name":"mpartition","desc":"分区 MS-DOS 磁盘","diff":4,"intro":"Linux mpartition命令用于建立或删除MS-DOS的分区。","syntax":"mpartition [-acdfIprv][-b \u003c磁区数>][-h \u003c磁头数>][l \u003c磁区数>][-s \u003c磁区数>][-t \u003c柱面数>][驱动器代号]","params":[],"examples":[],"example":"mpartition -c a:"},{"cat":"磁盘维护","name":"swapon","desc":"启用交换分区","diff":4,"intro":"Linux swapon命令用于激活Linux系统中交换空间，Linux系统的内存管理必须使用交换区来建立虚拟内存。","syntax":"/sbin/swapon -a [-v]\n\n/sbin/swapon [-v] [-p priority] specialfile ...\n\n/sbin/swapon [-s]","params":[],"examples":[],"example":"sudo swapon --show"},{"cat":"磁盘维护","name":"symlinks","desc":"管理符号链接","diff":4,"intro":"Linux symlinks命令用于维护符号连接的工具程序。","syntax":"symlinks [-cdrstv][目录]","params":[],"examples":[],"example":"symlinks -c /usr/local"},{"cat":"磁盘维护","name":"sync","desc":"同步数据到磁盘","diff":4,"intro":"Linux sync命令用于数据同步,sync命令是在关闭Linux系统时使用的。","syntax":"sync","params":[],"examples":[],"example":"sync"},{"cat":"磁盘维护","name":"mbadblocks","desc":"检测 MS-DOS 坏块","diff":4,"intro":"Linux mbadblocks命令用于检查MS-DOS文件系统的磁盘是否有损坏的磁区。","syntax":"mbadblocks [驱动器代号]","params":[],"examples":[],"example":"mbadblocks a:"},{"cat":"磁盘维护","name":"mkfs.minix","desc":"创建 minix 文件系统","diff":4,"intro":"Linux mkfs.minix命令用于建立Minix文件系统。","syntax":"mkfs.minix [-cv][-i \u003cinode数目>][-l \u003c文件>][-n \u003c文件名长度>][设备名称][区块数]","params":[],"examples":[],"example":"sudo mkfs.minix /dev/sdb1"},{"cat":"磁盘维护","name":"fsck.ext2","desc":"检查修复 ext2 文件系统","diff":4,"intro":"Linux fsck.ext2命令用于检查文件系统并尝试修复错误。","syntax":"fsck.ext2 [-acdfFnprsStvVy][-b \u003c分区第一个磁区地址>][-B \u003c区块大小>][-C \u003c反叙述器>][-I \u003cinode缓冲区块数>][-l/L \u003c损坏区块文件>][-P \u003c处理inode大小>][外围设备代号]","params":[],"examples":[],"example":"sudo fsck.ext2 /dev/sdb1"},{"cat":"磁盘维护","name":"fdisk","desc":"磁盘分区表操作","diff":4,"intro":"Linux fdisk 是一个创建和维护分区表的程序，它兼容 DOS 类型的分区表、BSD 或者 SUN 类型的磁盘列表。","syntax":"fdisk [必要参数][选择参数]","params":[],"examples":[{"desc":"显示当前分区情况：","code":"# fdisk -l\n\nDisk /dev/sda: 10.7 GB, 10737418240 bytes\n\n255 heads, 63 sectors/track, 1305 cylinders\n\nUnits = cylinders of 16065 * 512 = 8225280 bytes\n\n Device Boot Start End Blocks Id System\n\n/dev/sda1 * 1 13 104391 83 Linux\n\n/dev/sda2 14 1305 10377990 8e Linux LVM\n\nDisk /dev/sdb: 5368 MB, 5368709120 bytes\n\n255 heads, 63 sectors/track, 652 cylinders\n\nUnits = cylinders of 16065 * 512 = 8225280 bytes\n\nDisk /dev/sdb doesn't contain a valid partition table"},{"desc":"显示SCSI硬盘的每个分区情况","code":"# fdisk -lu \n\nDisk /dev/sda: 10.7 GB, 10737418240 bytes\n\n255 heads, 63 sectors/track, 1305 cylinders, total 20971520 sectors\n\nUnits = sectors of 1 * 512 = 512 bytes\n\n Device Boot Start End Blocks Id System\n\n/dev/sda1 * 63 208844 104391 83 Linux\n\n/dev/sda2 208845 20964824 10377990 8e Linux LVM\n\nDisk /dev/sdb: 5368 MB, 5368709120 bytes\n\n255 heads, 63 sectors/track, 652 cylinders, total 10485760 sectors\n\nUnits = sectors of 1 * 512 = 512 bytes\n\nDisk /dev/sdb doesn't contain a valid partition table"}],"example":"Disk /dev/sda: 10.7 GB, 10737418240 bytes"},{"cat":"磁盘维护","name":"losetup","desc":"设置回环设备","diff":4,"intro":"Linux losetup 命令用于设置循环设备。","syntax":"losetup [-d][-e \u003c加密方式>][-o \u003c平移数目>][循环设备代号][文件]","params":[],"examples":[{"desc":"（1）创建空的磁盘镜像文件，这里创建一个1.44M的软盘","code":"$ dd if=/dev/zero of=floppy.img bs=512 count=2880"},{"desc":"（2）使用 losetup将磁盘镜像文件虚拟成块设备","code":"$ losetup /dev/loop1 floppy.img"},{"desc":"（3）挂载块设备","code":"$ mount /dev/loop0 /tmp"},{"desc":"（4） 卸载loop设备","code":"$ umount /tmp\n\n$ losetup -d /dev/loop1"},{"desc":"1. 首先创建一个 1G 大小的空文件：","code":"# dd if=/dev/zero of=loopfile.img bs=1G count=1\n\n1+0 records in\n\n1+0 records out\n\n1073741824 bytes (1.1 GB) copied, 69.3471 s, 15.5 MB/s"},{"desc":"2. 对该文件格式化为 ext4 格式：","code":"# mkfs.ext4 loopfile.img\n\n。。。。"},{"desc":"3. 用 file 命令查看下格式化后的文件类型：","code":"# file loopfile.img\n\nloopfile.img: Linux rev 1.0 ext4 filesystem data, UUID=a9dfb4a0-6653-4407-ae05-7044d92c1159 (extents) (large files) (huge files)"},{"desc":"4. 准备将上面的文件挂载起来：","code":"# mkdir /mnt/loopback\n\n# mount -o loop loopfile.img /mnt/loopback"},{"desc":"上面的 mount 命令实际等价于下面两条命令：","code":"# losetup /dev/loop0 loopfile.img\n\n# mount /dev/loop0 /mnt/loopback"},{"desc":"然而对于第一种方法(mount -o loop)并不能适用于所有的场景。比如，我们想创建一个硬盘文件，然后对该文件进行分区，接着挂载其中一个子分区，这时就不能用 -o loop 这种方法了。因此必须如下做：","code":"# losetup /dev/loop1 loopfile.img\n\n# fdisk /dev/loop1"}],"example":"dd if=/dev/zero of=floppy.img bs=512 count=2880"},{"cat":"磁盘维护","name":"mkfs","desc":"创建 Linux 文件系统","diff":4,"intro":"Linux mkfs（英文全拼：make file system）命令用于在特定的分区上建立 linux 文件系统。","syntax":"mkfs [-V] [-t fstype] [fs-options] filesys [blocks]","params":[],"examples":[{"desc":"在 /dev/hda5 上建一个 msdos 的档案系统，同时检查是否有坏轨存在，并且将过程详细列出来 :","code":"mkfs -V -t msdos -c /dev/hda5"},{"desc":"将sda6分区格式化为ext3格式","code":"mkfs -t ext3 /dev/sda6"}],"example":"mkfs -V -t msdos -c /dev/hda5"},{"cat":"磁盘维护","name":"sfdisk","desc":"高级分区工具","diff":4,"intro":"Linux sfdisk命令是硬盘分区工具程序。","syntax":"sfdisk [-?Tvx][-d \u003c硬盘>][-g \u003c硬盘>][-l \u003c硬盘>][-s \u003c分区>][-V \u003c硬盘>]","params":[],"examples":[{"desc":"显示分区信息：","code":"# sfdisk -l\n\nDisk /dev/sda: 1305 cylinders, 255 heads, 63 sectors/track\n\nUnits = cylinders of 8225280 bytes, blocks of 1024 bytes, counting from 0\n\nDevice Boot Start End #cyls #blocks Id System\n\n/dev/sda1 * 0+ 12 13- 104391 83 Linux\n\n/dev/sda2 13 1304 1292 10377990 8e Linux LVM\n\n/dev/sda3 0 - 0 0 0 Empty\n\n/dev/sda4 0 - 0 0 0 Empty\n\nDisk /dev/sdb: 652 cylinders, 255 heads, 63 sectors/track\n\nsfdisk: ERROR: sector 0 does not have an msdos signature\n\n/dev/sdb: unrecognized partition\n\nNo partitions found"}],"example":"Disk /dev/sda: 1305 cylinders, 255 heads, 63 sectors/track"},{"cat":"磁盘维护","name":"swapoff","desc":"关闭交换分区","diff":4,"intro":"Linux swapoff命令用于关闭系统交换区(swap area)。","syntax":"swapoff [设备]","params":[],"examples":[{"desc":"显示分区信息:","code":"# sfdisk -l //显示分区信息\n\nDisk /dev/sda: 1305 cylinders, 255 heads, 63 sectors/track\n\nUnits = cylinders of 8225280 bytes, blocks of 1024 bytes, counting from 0\n\n Device Boot Start End #cyls #blocks Id System\n\n/dev/sda1 * 0+ 12 13- 104391 83 Linux\n\n/dev/sda2 13 1304 1292 10377990 8e Linux LVM\n\n/dev/sda3 0 - 0 0 0 Empty\n\n/dev/sda4 0 - 0 0 0 Empty\n\nDisk /dev/sdb: 652 cylinders, 255 heads, 63 sectors/track\n\nsfdisk: ERROR: sector 0 does not have an msdos signature\n\n/dev/sdb: unrecognized partition\n\nNo partitions found"},{"desc":"关闭交换分区。","code":"# swapoff /dev/sda2 // 关闭交换分区"}],"example":"Disk /dev/sda: 1305 cylinders, 255 heads, 63 sectors/track"},{"cat":"磁盘维护","name":"partprobe","desc":"重新加载分区表","diff":4,"intro":"partprobe 是 Linux 系统中一个用于通知操作系统重新读取分区表的实用工具。当你在不重启系统的情况下修改了磁盘分区表后，partprobe 可以帮助内核识别这些变更。","syntax":"partprobe [选项] [设备...]","params":[["-d","不更新内核"],["-s","显示摘要信息"],["-h","显示帮助信息"],["-v","显示版本信息"]],"examples":[{"desc":"","code":"sudo partprobe /dev/sda"},{"desc":"","code":"sudo partprobe -s"},{"desc":"","code":"/dev/sda: msdos partitions 1 2 3"},{"desc":"","code":"sudo partprobe"}],"example":"sudo partprobe /dev/sda"},{"cat":"磁盘维护","name":"resize2fs","desc":"调整 ext2/3/4 文件系统大小","diff":4,"intro":"resize2fs 是 Linux 系统中用于调整 ext2/ext3/ext4 文件系统大小的实用工具。它可以在不丢失数据的情况下扩大或缩小文件系统，通常与 LVM (逻辑卷管理) 或磁盘分区工具配合使用。","syntax":"resize2fs [选项] 设备 [新大小]","params":[["设备","指定要调整的文件系统所在的设备 (如 /dev/sda1)"],["新大小","可选参数，指定文件系统的新大小 (单位可以是 K/M/G)"]],"examples":[],"example":"sudo resize2fs /dev/sdb1"},{"cat":"磁盘维护","name":"btrfs","desc":"Btrfs 文件系统管理工具","diff":4,"intro":"Btrfs（B-tree File System）是一种先进的 Linux 文件系统，由 Oracle 开发并于 2007 年首次发布。它的设计目标是解决传统文件系统的局限性，提供更好的扩展性、可靠性和管理功能。","syntax":"btrfs [选项] [子命令选项] [参数]","params":[["-v","详细输出模式"],["--help","显示帮助信息"],["--version","显示版本信息"]],"examples":[{"desc":"","code":"# 推荐使用 zstd 压缩算法\n\nmount -o compress=zstd /dev/sdX /mnt/btrfs"},{"desc":"","code":"# 每月执行一次数据检查\n\nsudo btrfs scrub start /mnt/btrfs"}],"example":"mount -o compress=zstd /dev/sdX /mnt/btrfs"},{"cat":"网络通讯","name":"apachectl","desc":"Apache 服务控制工具","diff":3,"intro":"Linux apachectl命令可用来控制Apache HTTP服务器的程序。","syntax":"apachectl [configtest][fullstatus][graceful][help][restart][start][status][stop]","params":[],"examples":[],"example":"sudo apachectl restart"},{"cat":"网络通讯","name":"arpwatch","desc":"监控以太网地址","diff":3,"intro":"Linux arpwatch命令用于监听网络上ARP的记录。","syntax":"arpwatch [-d][-f\u003c记录文件>][-i\u003c接口>][-r\u003c记录文件>]","params":[],"examples":[{"desc":"监听网卡eth0的ARP信息","code":"arpwatch -i eth0"},{"desc":"监听ARP的信息，将相关信息记录到相应的文件","code":"# arpwatch -i eth0 -f a.log //将信息记录到a.log中"}],"example":"arpwatch -i eth0"},{"cat":"网络通讯","name":"dip","desc":"拨号 IP 连接工具","diff":3,"intro":"Linux dip命令用于IP拨号连接。","syntax":"dip [-aikltv][-m\u003cMTU数目>][-p\u003c协议>][拨号script文件]","params":[],"examples":[{"desc":"建立拨号连接","code":"$ dip -t"}],"example":"dip -t"},{"cat":"网络通讯","name":"getty","desc":"终端登录管理","diff":3,"intro":"Linux getty命令用于设置终端机模式，连线速率和管制线路。","syntax":"getty [-h][-d\u003c组态配置文件>][-r\u003c延迟秒数>][-t\u003c超时秒数>][-w\u003c等待字符串>][终端机编号][连线速率\u003c终端机类型>\u003c管制线路>] 或 getty [-c\u003c定义配置文件>]","params":[],"examples":[{"desc":"开启终端：","code":"# getty tty7"}],"example":"getty tty2"},{"cat":"网络通讯","name":"mingetty","desc":"轻量级 getty","diff":3,"intro":"Linux mingetty命令是精简版的getty。","syntax":"mingetty [--long-hostname][--noclear][tty]","params":[],"examples":[],"example":"mingetty tty3"},{"cat":"网络通讯","name":"uux","desc":"远程命令执行","diff":3,"intro":"Linux uux命令用于在远端的UUCP主机上执行指令。","syntax":"uux [-bcCIjlnrvz][-a\u003c地址>][-g\u003c等级>][-s\u003c文件>][-x\u003c层级>][--help][指令]","params":[],"examples":[{"desc":"在远程主机 uucp 执行命令","code":"# uux hnlinux! date /// 在远程主机 指定date命令查看系统时间"}],"example":"uux - remote!cat /etc/hosts"},{"cat":"网络通讯","name":"telnet","desc":"远程终端连接","diff":3,"intro":"Linux telnet命令用于远端登入。","syntax":"telnet [-8acdEfFKLrx][-b\u003c主机别名>][-e\u003c脱离字符>][-k\u003c域名>][-l\u003c用户名称>][-n\u003c记录文件>][-S\u003c服务类型>][-X\u003c认证形态>][主机名称或IP地址\u003c通信端口>]","params":[],"examples":[{"desc":"登录远程主机","code":"# telnet 192.168.0.5 \n\n//登录IP为 192.168.0.5 的远程主机"}],"example":"//登录IP为 192.168.0.5 的远程主机"},{"cat":"网络通讯","name":"uulog","desc":"UUCP 日志查看","diff":3,"intro":"Linux uulog命令用于显示UUCP记录文件。","syntax":"uulog [-DFISv][-\u003c行数>][-f\u003c主机>][-I\u003c配置文件>][-n\u003c行数>][-s\u003c主机>][-u\u003c用户>][-X\u003c层级>][--help]","params":[],"examples":[{"desc":"显示uucp log信息","code":"# uulog"}],"example":"uulog -s host"},{"cat":"网络通讯","name":"uustat","desc":"UUCP 状态显示","diff":3,"intro":"Linux uustat命令用于显示UUCP目前的状况。","syntax":"uustat [-aeiKmMNpqQRv][-B\u003c行数>][-c\u003c指令>][-C\u003c指令>][-I\u003c配置文件>][-k\u003c工作>][-o\u003c小时>][-r\u003c工作>][-s\u003c主机>][-S\u003c主机>][-u\u003c用户>][-U\u003c用户>][-W\u003c附注>][-y\u003c小时>][-x\u003c层级>][--help]","params":[],"examples":[{"desc":"显示所有任务","code":"# uustat -a"},{"desc":"显示等待的任务","code":"# uustat -e"}],"example":"uustat -a"},{"cat":"网络通讯","name":"ppp-off","desc":"断开 PPP 连接","diff":3,"intro":"Linux ppp命令用于关闭ppp连线。","syntax":"ppp-off","params":[],"examples":[{"desc":"关闭ppp连线","code":"# ppp-off"}],"example":"ppp-off"},{"cat":"网络通讯","name":"netconfig","desc":"网络配置工具","diff":3,"intro":"Linux netconfig命令用于设置网络环境。","syntax":"netconfig","params":[],"examples":[],"example":"netconfig"},{"cat":"网络通讯","name":"nc","desc":"网络工具 netcat","diff":3,"intro":"Linux nc命令用于设置路由器。","syntax":"nc [-hlnruz][-g\u003c网关...>][-G\u003c指向器数目>][-i\u003c延迟秒数>][-o\u003c输出文件>][-p\u003c通信端口>][-s\u003c来源位址>][-v...][-w\u003c超时秒数>][主机名称][通信端口...]","params":[],"examples":[{"desc":"TCP端口扫描","code":"# nc -v -z -w2 192.168.0.3 1-100 \n\n192.168.0.3: inverse host lookup failed: Unknown host\n\n(UNKNOWN) [192.168.0.3] 80 (http) open\n\n(UNKNOWN) [192.168.0.3] 23 (telnet) open\n\n(UNKNOWN) [192.168.0.3] 22 (ssh) open"},{"desc":"扫描UDP端口","code":"# nc -u -z -w2 192.168.0.1 1-1000 //扫描192.168.0.3 的端口 范围是 1-1000"},{"desc":"扫描指定端口","code":"# nc -nvv 192.168.0.1 80 //扫描 80端口\n\n(UNKNOWN) [192.168.0.1] 80 (?) open\n\ny //用户输入"}],"example":"192.168.0.3: inverse host lookup failed: Unknown host"},{"cat":"网络通讯","name":"httpd","desc":"HTTP 服务器","diff":3,"intro":"Linux httpd命令是Apache HTTP服务器程序。","syntax":"httpd [-hlLStvVX][-c\u003chttpd指令>][-C\u003chttpd指令>][-d\u003c服务器根目录>][-D\u003c设定文件参数>][-f\u003c设定文件>]","params":[],"examples":[{"desc":"检查配置文件语法错误","code":"# httpd -t\n\nhttpd: Could not determine the server's fully qualified domain name, using 127.0.0.1 for ServerName\n\nSyntax OK"},{"desc":"启动httpd","code":"httpd\n\nhttpd: Could not determine the server's fully qualified domain name, using 127.0.0.1 for ServerName"},{"desc":"显示编译模块","code":"# httpd -l \n\nCompiled in modules:\n\n core.c\n\n prefork.c\n\n http_core.c\n\n mod_so.c"},{"desc":"显示配置文件","code":"# httpd -L>1.log|tail -n 20 1.log\n\nMaximum number of children alive at the same time\n\nAllowed in *.conf only outside , or \n\nServerLimit (prefork.c)\n\nMaximum value of MaxClients for this run of Apache\n\nAllowed in *.conf only outside , or \n\nKeepAliveTimeout (http_core.c)\n\nKeep-Alive timeout duration (sec)\n\nAllowed in *.conf only outside , or \n\nMaxKeepAliveRequests (http_core.c)\n\nMaximum number of Keep-Alive requests per connection, or 0 for infinite\n\nAllowed in *.conf only outside , or \n\nKeepAlive (http_core.c)\n\nWhether persistent connections should be On or Off\n\nAllowed in *.conf only outside , or \n\nLoadModule (mod_so.c)\n\na module name and the name of a shared object file to load it from\n\nAllowed in *.conf only outside , or \n\nLoadFile (mod_so.c)\n\nshared object file or library to load into the server at runtime\n\nAllowed in *.conf only outside , or"}],"example":"Syntax OK"},{"cat":"网络通讯","name":"ifconfig","desc":"配置网络接口","diff":3,"intro":"Linux ifconfig命令用于显示或设置网络设备。","syntax":"ifconfig [网络设备][down up -allmulti -arp -promisc][add\u003c地址>][del\u003c地址>][\u003chw\u003c网络设备类型>\u003c硬件地址>][io_addr\u003cI/O地址>][irq\u003cIRQ地址>][media\u003c网络媒介类型>][mem_start\u003c内存地址>][metric\u003c数目>][mtu\u003c字节>][netmask\u003c子网掩码>][tunnel\u003c地址>][-broadcast\u003c地址>][-pointopoint\u003c地址>][IP地址]","params":[],"examples":[{"desc":"显示网络设备信息","code":"# ifconfig \n\neth0 Link encap:Ethernet HWaddr 00:50:56:0A:0B:0C \n\n inet addr:192.168.0.3 Bcast:192.168.0.255 Mask:255.255.255.0\n\n inet6 addr: fe80::250:56ff:fe0a:b0c/64 Scope:Link\n\n UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1\n\n RX packets:172220 errors:0 dropped:0 overruns:0 frame:0\n\n TX packets:132379 errors:0 dropped:0 overruns:0 carrier:0\n\n collisions:0 txqueuelen:1000 \n\n RX bytes:87101880 (83.0 MiB) TX bytes:41576123 (39.6 MiB)\n\n Interrupt:185 Base address:0x2024 \n\nlo Link encap:Local Loopback \n\n inet addr:127.0.0.1 Mask:255.0.0.0\n\n inet6 addr: ::1/128 Scope:Host\n\n UP LOOPBACK RUNNING MTU:16436 Metric:1\n\n RX packets:2022 errors:0 dropped:0 overruns:0 frame:0\n\n TX packets:2022 errors:0 dropped:0 overruns:0 carrier:0\n\n collisions:0 txqueuelen:0 \n\n RX bytes:2459063 (2.3 MiB) TX bytes:2459063 (2.3 MiB)"},{"desc":"启动关闭指定网卡","code":"# ifconfig eth0 down\n\n# ifconfig eth0 up"},{"desc":"为网卡配置和删除IPv6地址","code":"# ifconfig eth0 add 33ffe:3240:800:1005::2/ 64 //为网卡设置IPv6地址\n\n# ifconfig eth0 del 33ffe:3240:800:1005::2/ 64 //为网卡删除IPv6地址"},{"desc":"用ifconfig修改MAC地址","code":"# ifconfig eth0 down //关闭网卡\n\n# ifconfig eth0 hw ether 00:AA:BB:CC:DD:EE //修改MAC地址\n\n# ifconfig eth0 up //启动网卡\n\n# ifconfig eth1 hw ether 00:1D:1C:1D:1E //关闭网卡并修改MAC地址 \n\n# ifconfig eth1 up //启动网卡"},{"desc":"配置IP地址","code":"# ifconfig eth0 192.168.1.56 \n\n//给eth0网卡配置IP地址\n\n# ifconfig eth0 192.168.1.56 netmask 255.255.255.0 \n\n// 给eth0网卡配置IP地址,并加上子掩码\n\n# ifconfig eth0 192.168.1.56 netmask 255.255.255.0 broadcast 192.168.1.255\n\n// 给eth0网卡配置IP地址,加上子掩码,加上个广播地址"},{"desc":"启用和关闭ARP协议","code":"# ifconfig eth0 arp //开启\n\n# ifconfig eth0 -arp //关闭"},{"desc":"设置最大传输单元","code":"# ifconfig eth0 mtu 1500 \n\n//设置能通过的最大数据包大小为 1500 bytes"}],"example":"eth0 Link encap:Ethernet HWaddr 00:50:56:0A:0B:0C"},{"cat":"网络通讯","name":"minicom","desc":"串口通信工具","diff":3,"intro":"Linux minicom命令用于调制解调器通信程序。","syntax":"minicom [-8lmMostz][-a\u003con或0ff>][-c\u003con或off>][-C\u003c取文件>][-d\u003c编号>][-p\u003c模拟终端机>][-S\u003cscript文件>][配置文件]","params":[],"examples":[],"example":"minicom -s"},{"cat":"网络通讯","name":"mesg","desc":"消息权限设置","diff":3,"intro":"Linux mesg命令用于设置终端机的写入权限。","syntax":"mesg [ny]","params":[],"examples":[{"desc":"root 的终端","code":"# mesg y //在这个终端设置允许发送消息"},{"desc":"其他普通用户的终端：","code":"$ write root pts/4 \n\nhello\n\nhello\n\nEOF //Ctrl+D 结束输入"},{"desc":"root 的终端 终端显示","code":"# \n\nMessage from root@w3cschool.cc (as hnlinux) on pts/5 at 14:48 ...\n\nhello\n\nEOF"}],"example":"write root pts/4"},{"cat":"网络通讯","name":"dnsconf","desc":"DNS 配置工具","diff":3,"intro":"Linux dnsconf命令用于设置DNS服务器组态。","syntax":"dnsconf [--deldomain\u003c域>][--delsecondary\u003c域>][--newdomain\u003c域>][--set\u003c主机>\u003cIP>][--setcname\u003cCNAME>\u003c主机>][--setmx\u003c域>\u003c主机>][--setns\u003c域>\u003c主机>][--unset\u003c主机>]","params":[],"examples":[],"example":"dnsconf"},{"cat":"网络通讯","name":"wall","desc":"向所有用户发送消息","diff":3,"intro":"Linux wall命令会将讯息传给每一个 mesg 设定为 yes 的上线使用者。当使用终端机介面做为标准传入时, 讯息结束时需加上 EOF (通常用 Ctrl+D)。","syntax":"wall [ message ]","params":[],"examples":[{"desc":"传讯息\"hi\" 给每一个使用者","code":"wall hi"},{"desc":"广播消息","code":"# wall Ilove\n\nBroadcast message from root (pts/4) (Thu May 27 16:41:09 2014):\n\nIlove"}],"example":"wall hi"},{"cat":"网络通讯","name":"netstat","desc":"网络状态查看","diff":3,"intro":"Linux netstat 命令用于显示网络状态。","syntax":"netstat [-acCeFghilMnNoprstuvVwx][-A\u003c网络类型>][--ip]","params":[],"examples":[{"desc":"显示详细的网络状况","code":"# netstat -a"},{"desc":"显示当前户籍UDP连接状况","code":"# netstat -nu"},{"desc":"显示UDP端口号的使用情况","code":"# netstat -apu\n\nActive Internet connections (servers and established)\n\nProto Recv-Q Send-Q Local Address Foreign Address State PID/Program name \n\nudp 0 0 *:32768 *:* - \n\nudp 0 0 *:nfs *:* - \n\nudp 0 0 *:641 *:* 3006/rpc.statd \n\nudp 0 0 192.168.0.3:netbios-ns *:* 3537/nmbd \n\nudp 0 0 *:netbios-ns *:* 3537/nmbd \n\nudp 0 0 192.168.0.3:netbios-dgm *:* 3537/nmbd \n\nudp 0 0 *:netbios-dgm *:* 3537/nmbd \n\nudp 0 0 *:tftp *:* 3346/xinetd \n\nudp 0 0 *:999 *:* 3366/rpc.rquotad \n\nudp 0 0 *:sunrpc *:* 2986/portmap \n\nudp 0 0 *:ipp *:* 6938/cupsd \n\nudp 0 0 *:1022 *:* 3392/rpc.mountd \n\nudp 0 0 *:638 *:* 3006/rpc.statd"},{"desc":"显示网卡列表","code":"# netstat -i\n\nKernel Interface table\n\nIface MTU Met RX-OK RX-ERR RX-DRP RX-OVR TX-OK TX-ERR TX-DRP TX-OVR Flg\n\neth0 1500 0 181864 0 0 0 141278 0 0 0 BMRU\n\nlo 16436 0 3362 0 0 0 3362 0 0 0 LRU"},{"desc":"显示组播组的关系","code":"# netstat -g\n\nIPv6/IPv4 Group Memberships\n\nInterface RefCnt Group\n\n--------------- ------ ---------------------\n\nlo 1 ALL-SYSTEMS.MCAST.NET\n\neth0 1 ALL-SYSTEMS.MCAST.NET\n\nlo 1 ff02::1\n\neth0 1 ff02::1:ff0a:b0c\n\neth0 1 ff02::1"},{"desc":"显示网络统计信息","code":"# netstat -s\n\nIp:\n\n 184695 total packets received\n\n 0 forwarded\n\n 0 incoming packets discarded\n\n 184687 incoming packets delivered\n\n 143917 requests sent out\n\n 32 outgoing packets dropped\n\n 30 dropped because of missing route\n\nIcmp:\n\n 676 ICMP messages received\n\n 5 input ICMP message failed.\n\n ICMP input histogram:\n\n destination unreachable: 44\n\n echo requests: 287\n\n echo replies: 345\n\n 304 ICM 检测与另一个主机之间的网络连接。","syntax":"ping [选项] [目标主机/IP地址]","params":[],"examples":[{"desc":"1、检测是否与主机连通：","code":"# ping www.runoob.com //ping主机\n\nPING aries.m.alikunlun.com (114.80.174.110) 56(84) bytes of data.\n\n64 bytes from 114.80.174.110: icmp_seq=1 ttl=64 time=0.025 ms\n\n64 bytes from 114.80.174.110: icmp_seq=2 ttl=64 time=0.036 ms\n\n64 bytes from 114.80.174.110: icmp_seq=3 ttl=64 time=0.034 ms\n\n64 bytes from 114.80.174.110: icmp_seq=4 ttl=64 time=0.034 ms\n\n64 bytes from 114.80.174.110: icmp_seq=5 ttl=64 time=0.028 ms\n\n64 bytes from 114.80.174.110: icmp_seq=6 ttl=64 time=0.028 ms\n\n64 bytes from 114.80.174.110: icmp_seq=7 ttl=64 time=0.034 ms\n\n64 bytes from 114.80.174.110: icmp_seq=8 ttl=64 time=0.034 ms\n\n64 bytes from 114.80.174.110: icmp_seq=9 ttl=64 time=0.036 ms\n\n64 bytes from 114.80.174.110: icmp_seq=10 ttl=64 time=0.041 ms\n\n--- aries.m.alikunlun.com ping statistics ---\n\n10 packets transmitted, 30 received, 0% packet loss, time 29246ms\n\nrtt min/avg/max/mdev = 0.021/0.035/0.078/0.011 ms\n\n//需要手动终止Ctrl+C"},{"desc":"2、指限制发送数据包数量：","code":"# ping -c 2 www.runoob.com\n\nPING aries.m.alikunlun.com (114.80.174.120) 56(84) bytes of data.\n\n64 bytes from 114.80.174.120: icmp_seq=1 ttl=54 time=6.18 ms\n\n64 bytes from 114.80.174.120: icmp_seq=2 ttl=54 time=15.4 ms\n\n--- aries.m.alikunlun.com ping statistics ---\n\n2 packets transmitted, 2 received, 0% packet loss, time 1016ms\n\nrtt min/avg/max/mdev = 6.185/10.824/15.464/4.640 ms\n\n//收到两次包后，自动退出"},{"desc":"3、多参数使用：-i 3 发送周期为 3秒 -s 设置发送包的大小 -t 设置TTL值为 255","code":"# ping -i 3 -s 1024 -t 255 g.cn //ping主机\n\nPING g.cn (203.208.37.104) 1024(1052) bytes of data.\n\n1032 bytes from bg-in-f104.1e100.net (203.208.37.104): icmp_seq=0 ttl=243 time=62.5 ms\n\n1032 bytes from bg-in-f104.1e100.net (203.208.37.104): icmp_seq=1 ttl=243 time=63.9 ms\n\n1032 bytes from bg-in-f104.1e100.net (203.208.37.104): icmp_seq=2 ttl=243 time=61.9 ms\n\n--- g.cn ping statistics ---\n\n3 packets transmitted, 3 received, 0% packet loss, time 6001ms\n\nrtt min/avg/max/mdev = 61.959/62.843/63.984/0.894 ms, pipe 2"},{"desc":"4、设置数据包间隔时间：以 0.2 秒的间隔发送数据包，这个参数适合测试短时间内网络的稳定性。","code":"ping -i 0.2 www.runoob.com"},{"desc":"5、指定数据包大小：设置数据包大小为 128 字节，适用于检查较大数据传输时的稳定性。","code":"ping -s 128 www.runoob.com"},{"desc":"6、设置网络超时：测试时间限制为 10 秒，适合在网络环境不确定的情况下测试连通性。","code":"ping -w 10 www.example.com"},{"desc":"","code":"PING www.example.com (93.184.216.34): 56 data bytes\n\n64 bytes from 93.184.216.34: icmp_seq=0 ttl=56 time=10.1 ms\n\n64 bytes from 93.184.216.34: icmp_seq=1 ttl=56 time=10.3 ms\n\n--- www.example.com ping statistics ---\n\n2 packets transmitted, 2 packets received, 0% packet loss\n\nround-trip min/avg/max/stddev = 10.1/10.2/10.3/0.1 ms"},{"desc":"","code":"ping -c 1 -W 1 www.example.com"},{"desc":"","code":"ping -s 1024 -c 10 www.example.com"},{"desc":"","code":"ping -6 www.example.com"}],"example":"64 bytes from 114.80.174.110: icmp_seq=1 ttl=64 time=0.025 ms"},{"cat":"网络通讯","name":"pppstats","desc":"PPP 连接统计","diff":3,"intro":"Linux pppstats命令用于显示PPP连线状态。","syntax":"pppstats [-adrv][-c\u003c执行次数>][-w\u003c间隔秒数>][网络界面]","params":[],"examples":[{"desc":"显示ppp的了连接状态","code":"# pppstats"}],"example":"pppstats -v"},{"cat":"网络通讯","name":"samba","desc":"Samba 文件共享","diff":3,"intro":"Linux samba命令用于Samba服务器控制。","syntax":"samba [start][stop][status][restart]","params":[],"examples":[{"desc":"启动Samba","code":"# samba start"}],"example":"samba --version"},{"cat":"网络通讯","name":"setserial","desc":"串口参数设置","diff":3,"intro":"Linux setserial命令用于设置或显示串口的相关信息。","syntax":"setserial [-abgGqvVz][设备][串口参数]","params":[],"examples":[{"desc":"显示串口信息","code":"# setserial -g /dev/ttyS2 \n\n/dev/ttyS2, UART: unknown, Port: 0x03e8, IRQ: 4"}],"example":"/dev/ttyS2, UART: unknown, Port: 0x03e8, IRQ: 4"},{"cat":"网络通讯","name":"talk","desc":"终端聊天工具","diff":3,"intro":"Linux talk命令用于与其他使用者对谈。","syntax":"talk person [ttyname]","params":[],"examples":[{"desc":"与现在机器上的使用者Rollaend对谈，此时 Rollaend 只有一个连线","code":"talk Rollaend"},{"desc":"与linuxfab.cx上的使用者Rollaend对谈，使用pts/2来对谈","code":"talk Rollaend@linuxfab.cx pts/2"}],"example":"talk Rollaend"},{"cat":"网络通讯","name":"traceroute","desc":"路由跟踪工具","diff":3,"intro":"Linux traceroute命令用于显示数据包到主机间的路径。","syntax":"traceroute [-dFlnrvx][-f\u003c存活数值>][-g\u003c网关>...][-i\u003c网络界面>][-m\u003c存活数值>][-p\u003c通信端口>][-s\u003c来源地址>][-t\u003c服务类型>][-w\u003c超时秒数>][主机名称或IP地址][数据包大小]","params":[],"examples":[{"desc":"显示到达目的地的数据包路由","code":"# traceroute www.google.com\n\ntraceroute: Warning: www.google.com has multiple addresses; using 66.249.89.99\n\ntraceroute to www.l.google.com (66.249.89.99), 30 hops max, 38 byte packets\n\n1 192.168.0.1 (192.168.0.1) 0.653 ms 0.846 ms 0.200 ms\n\n2 118.250.4.1 (118.250.4.1) 36.610 ms 58.438 ms 55.146 ms\n\n3 222.247.28.177 (222.247.28.177) 54.809 ms 39.879 ms 19.186 ms\n\n4 61.187.255.253 (61.187.255.253) 18.033 ms 49.699 ms 72.147 ms\n\n5 61.137.2.177 (61.137.2.177) 32.912 ms 72.947 ms 41.809 ms\n\n6 202.97.46.5 (202.97.46.5) 60.436 ms 25.527 ms 40.023 ms\n\n7 202.97.35.69 (202.97.35.69) 40.049 ms 66.091 ms 44.358 ms\n\n8 202.97.35.110 (202.97.35.110) 42.140 ms 70.913 ms 41.144 ms\n\n9 202.97.35.14 (202.97.35.14) 116.929 ms 57.081 ms 60.336 ms\n\n10 202.97.60.34 (202.97.60.34) 54.871 ms 69.302 ms 64.353 ms\n\n11 * * *\n\n12 209.85.255.80 (209.85.255.80) 95.954 ms 79.844 ms 76.052 ms\n\n MPLS Label=385825 CoS=5 TTL=1 S=0\n\n13 209.85.249.195 (209.85.249.195) 118.687 ms 120.905 ms 113.936 ms\n\n14 72.14.236.126 (72.14.236.126) 115.843 ms 137.109 ms 186.491 ms\n\n15 nrt04s01-in-f99.1e100.net (66.249.89.99) 168.024 ms 140.551 ms 161.127 ms"}],"example":"1 192.168.0.1 (192.168.0.1) 0.653 ms 0.846 ms 0.200 ms"},{"cat":"网络通讯","name":"tty","desc":"显示终端名称","diff":3,"intro":"Linux tty命令用于显示终端机连接标准输入设备的文件名称。","syntax":"tty [-s][--help][--version]","params":[],"examples":[{"desc":"显示当前终端","code":"# tty\n\n/dev/pts/4"}],"example":"/dev/pts/4"},{"cat":"网络通讯","name":"newaliases","desc":"重建邮件别名数据库","diff":3,"intro":"Linux newaliases命令会使用一个在 /etc/aliases 中的档案做使用者名称转换的动作。当 sendmail 收到一个要送给 xxx 的信时，它会依据 aliases档的内容送给另一个使用者。这个功能可以创造一个只有在信件系统内才有效的使用者。例如 mailing list 就会用到这个功能，在 mailinglist 中，我们可能会创造一个叫 redlinux@link.ece.uci.edu 的 mailinglist，但实际上并没有一个叫 redlinux 的使用者。实际 aliases 档的内容是将送给这个使用者的信都收给 m","syntax":"newaliases","params":[],"examples":[{"desc":"","code":"# newaliases"},{"desc":"下面命令会做相同的事","code":"# sendmail -bi"}],"example":"sudo newaliases"},{"cat":"网络通讯","name":"uuname","desc":"显示 UUCP 主机名","diff":3,"intro":"Linux uname 命令用于显示关于当前系统的信息。","syntax":"uname [选项]","params":[],"examples":[{"desc":"1、显示所有系统信息：","code":"uname -a"},{"desc":"输出示例：","code":"Linux myhostname 5.8.0-53-generic #60~18.04.1-Ubuntu SMP Tue Apr 13 20:37:32 UTC 2021 x86_64 x86_64 x86_64 GNU/Linux"},{"desc":"2、查看内核版本：","code":"uname -r"},{"desc":"输出示例：","code":"5.8.0-53-generic"},{"desc":"3、查看操作系统名称：","code":"uname -s"},{"desc":"输出示例：","code":"Linux"},{"desc":"4、查看硬件架构：","code":"uname -m"},{"desc":"输出示例：","code":"x86_64"}],"example":"uname -a"},{"cat":"网络通讯","name":"netconf","desc":"网络配置工具","diff":3,"intro":"Linux netconf命令用于设置各项网络功能。","syntax":"netconf","params":[],"examples":[],"example":"netconf"},{"cat":"网络通讯","name":"write","desc":"向用户终端写消息","diff":3,"intro":"Linux write命令用于传讯息给其他使用者。","syntax":"write user [ttyname]","params":[],"examples":[{"desc":"传讯息给 Rollaend，此时 Rollaend 只有一个连线","code":"write Rollaend"},{"desc":"传讯息给 Rollaend，Rollaend 的连线有 pts/2，pts/3","code":"write Rollaend pts/2"}],"example":"write Rollaend"},{"cat":"网络通讯","name":"statserial","desc":"串口信号状态","diff":3,"intro":"Linux statserial命令用于显示串口状态。","syntax":"statserial [-dnx][串口设备名称]","params":[],"examples":[{"desc":"显示串口状态","code":"# statserial /dev/tty1"},{"desc":"只显示一次串口状态","code":"# statserial -n /dev/tty1"}],"example":"statserial -a /dev/ttyS0"},{"cat":"网络通讯","name":"efax","desc":"传真发送接收","diff":3,"intro":"Linux efax命令用于收发传真。","syntax":"efax [-sw][-a\u003cAT指令>][-c\u003c调制解调器属性>][-d\u003c驱动程序>][-f\u003c字体文件>][-g\u003c指令>][-h\u003c传真标题字符串>][-i\u003cAT指令>]
