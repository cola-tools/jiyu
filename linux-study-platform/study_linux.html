:[{"desc":"","code":"chown username filename\n\nchown john file.txt"},{"desc":"","code":"chown username:groupname filename\n\nchown john:developers script.sh"},{"desc":"","code":"chown :groupname filename\n\nchown :staff document.txt"},{"desc":"","code":"chown 1000:1000 filename # 用户ID 1000，组ID 1000\n\nchown 1001 filename # 只更改用户ID"},{"desc":"把 /var/run/httpd.pid 的所有者设置 root：","code":"chown root /var/run/httpd.pid"},{"desc":"将文件 file1.txt 的拥有者设为 runoob，群体的使用者 runoobgroup :","code":"chown runoob:runoobgroup file1.txt"},{"desc":"将当前前目录下的所有文件与子目录的拥有者皆设为 runoob，群体的使用者 runoobgroup:","code":"chown -R runoob:runoobgroup *"},{"desc":"把 /home/runoob 的关联组设置为 512 （关联组ID），不改变所有者：","code":"chown :512 /home/runoob"},{"desc":"1、Web 服务器文件管理","code":"# 将网站文件所有权给web服务器\n\nchown -R www-data:www-data /var/www/html/\n\n# 设置上传目录权限\n\nchown -R apache:apache /var/www/uploads/\n\nchmod -R 755 /var/www/uploads/"},{"desc":"2、用户文件管理","code":"# 将用户目录所有权返回给用户\n\nchown -R john:john /home/john/\n\n# 新建用户后设置home目录\n\nchown -R newuser:newuser /home/newuser/"}],"example":"chown username filename"},{"cat":"文件管理","name":"cksum","desc":"计算文件校验和","diff":1,"intro":"Linux cksum命令用于检查文件的CRC是否正确。确保文件从一个系统传输到另一个系统的过程中不被损坏。","syntax":"cksum [--help][--version][文件...]","params":[],"examples":[{"desc":"使用指令\"cksum\"计算文件\"testfile1\"的完整性，输入如下命令：","code":"$ cksum testfile1"},{"desc":"以上命令执行后，将输出校验码等相关的信息，具体输出信息如下所示：","code":"1263453430 78 testfile1 //输出信息"}],"example":"cksum testfile1"},{"cat":"文件管理","name":"cmp","desc":"逐字节比较两个文件","diff":1,"intro":"Linux cmp 命令用于比较两个文件是否有差异。","syntax":"cmp [-clsv][-i \u003c字符数目>][--help][第一个文件][第二个文件]","params":[],"examples":[{"desc":"要确定两个文件是否相同，请输入：","code":"cmp prog.o.bak prog.o"},{"desc":"这比较 prog.o.bak 和 prog.o。如果文件相同，则不显示消息。如果文件不同，则显示第一个不同的位置；例如：","code":"prog.o.bak prog.o differ: char 4, line 1"}],"example":"cmp prog.o.bak prog.o"},{"cat":"文件管理","name":"diff","desc":"比较文件内容差异","diff":1,"intro":"Linux diff 命令用于比较文件的差异。","syntax":"diff [-abBcdefHilnNpPqrstTuvwy][-\u003c行数>][-C \u003c行数>][-D \u003c巨集名称>][-I \u003c字符或字符串>][-S \u003c文件>][-W \u003c宽度>][-x \u003c文件或目录>][-X \u003c文件>][--help][--left-column][--suppress-common-line][文件或目录1][文件或目录2]","params":[],"examples":[{"desc":"","code":"[root@localhost test3]# diff log2014.log log2013.log \n\n3c3\n\n\u003c 2014-03\n\n---\n\n> 2013-03\n\n8c8\n\n\u003c 2013-07\n\n---\n\n> 2013-08\n\n11,12d10\n\n\u003c 2013-11\n\n\u003c 2013-12"},{"desc":"上面的\"3c3\"和\"8c8\"表示log2014.log和log20143log文件在3行和第8行内容有所不同；\"11,12d10\"表示第一个文件比第二个文件多了第11和12行。","code":"[root@localhost test3]# diff log2014.log log2013.log -y -W 50\n\n2013-01 2013-01\n\n2013-02 2013-02\n\n2014-03 | 2013-03\n\n2013-04 2013-04\n\n2013-05 2013-05\n\n2013-06 2013-06\n\n2013-07 2013-07\n\n2013-07 | 2013-08\n\n2013-09 2013-09\n\n2013-10 2013-10\n\n2013-11 \u003c\n\n2013-12 \u003c\n\n[root@localhost test3]# diff log2013.log log2014.log -y -W 50\n\n2013-01 2013-01\n\n2013-02 2013-02\n\n2013-03 | 2014-03\n\n2013-04 2013-04\n\n2013-05 2013-05\n\n2013-06 2013-06\n\n2013-07 2013-07\n\n2013-08 | 2013-07\n\n2013-09 2013-09\n\n2013-10 2013-10\n\n > 2013-11\n\n > 2013-12"}],"example":"[root@localhost test3]# diff log2014.log log2013.log"},{"cat":"文件管理","name":"diffstat","desc":"显示 diff 统计信息","diff":1,"intro":"Linux diffstat命令根据diff的比较结果，显示统计数字。","syntax":"diff [-wV][-n \u003c文件名长度>][-p \u003c文件名长度>]","params":[],"examples":[{"desc":"将目录\"test1\"和\"test2\"下的同名文件\"testf.txt\"使用diff指令进行比较。然后使用diffstat指令对结果进行统计显示，输入如下命令：","code":"$ diff test1 test2 | diffstat #进行比较结果的统计显示"},{"desc":"对于查看文件中的内容，用户可以通过指令\"cat\"进行查看即可，具体操作如下：","code":"$ cat test1/testf.txt #查看test1/testf的内容 \n\nabc \n\ndef \n\nghi \n\njkl \n\nmno \n\npqr \n\nstu \n\nvws \n\n$ cat test2/testf.txt #查看test2/testf的内容 \n\nabc \n\ndef \n\nghi \n\njkl \n\nmno"},{"desc":"从上面的文件内容显示，可以看到两个文件内容的差别。现在来运行刚才的命令，对文件比较的结果进行统计显示，结果如下：","code":"testfile | 2 +- #统计信息输出显示 \n\n1 file changed, 1 insertion(+), 1 deletion(-)"}],"example":"diff test1 test2 | diffstat #进行比较结果的统计显示"},{"cat":"文件管理","name":"file","desc":"识别文件类型","diff":1,"intro":"Linux file命令用于辨识文件类型。","syntax":"file [-bcLvz][-f \u003c名称文件>][-m \u003c魔法数字文件>...][文件或目录...]","params":[],"examples":[{"desc":"显示文件类型：","code":"[root@localhost ~]# file install.log\n\ninstall.log: UTF-8 Unicode text\n\n[root@localhost ~]# file -b install.log \u003c== 不显示文件名称\n\nUTF-8 Unicode text\n\n[root@localhost ~]# file -i install.log \u003c== 显示MIME类别。\n\ninstall.log: text/plain; charset=utf-8\n\n[root@localhost ~]# file -b -i install.log\n\ntext/plain; charset=utf-8"},{"desc":"显示符号链接的文件类型","code":"[root@localhost ~]# ls -l /var/mail\n\nlrwxrwxrwx 1 root root 10 08-13 00:11 /var/mail -> spool/mail\n\n[root@localhost ~]# file /var/mail\n\n/var/mail: symbolic link to `spool/mail'\n\n[root@localhost ~]# file -L /var/mail\n\n/var/mail: directory\n\n[root@localhost ~]# file /var/spool/mail\n\n/var/spool/mail: directory\n\n[root@localhost ~]# file -L /var/spool/mail\n\n/var/spool/mail: directory"}],"example":"[root@localhost ~]# file install.log"},{"cat":"文件管理","name":"find","desc":"查找文件或目录","diff":1,"intro":"Linux find 命令用于在指定目录下查找文件和目录。","syntax":"find [路径] [匹配条件] [动作]","params":[],"examples":[{"desc":"查找当前目录下名为 file.txt 的文件：","code":"find . -name file.txt"},{"desc":"将当前目录及其子目录下所有文件后缀为 .c 的文件列出来:","code":"# find . -name \"*.c\""},{"desc":"将当前目录及其子目录中的所有文件列出：","code":"# find . -type f"},{"desc":"查找 /home 目录下大于 1MB 的文件：","code":"find /home -size +1M"},{"desc":"查找 /var/log 目录下在 7 天前修改过的文件：","code":"find /var/log -mtime +7"},{"desc":"查找过去 7 天内被访问的文件:","code":"find /path/to/search -atime -7"},{"desc":"在当前目录下查找最近 20 天内状态发生改变的文件和目录:","code":"# find . -ctime 20"},{"desc":"将当前目录及其子目录下所有 20 天前及更早更新过的文件列出:","code":"# find . -ctime +20"},{"desc":"查找 /var/log 目录中更改时间在 7 日以前的普通文件，并在删除之前询问它们：","code":"# find /var/log -type f -mtime +7 -ok rm {} \\;"},{"desc":"查找当前目录中文件属主具有读、写权限，并且文件所属组的用户和其他用户具有读权限的文件：","code":"# find . -type f -perm 644 -exec ls -l {} \\;"}],"example":"find . -name file.txt"},{"cat":"文件管理","name":"git","desc":"分布式版本控制","diff":1,"intro":"Linux git命令是文字模式下的文件管理员。","syntax":"git","params":[],"examples":[],"example":"git clone https://github.com/user/repo.git"},{"cat":"文件管理","name":"gitview","desc":"git 仓库可视化工具","diff":1,"intro":"Linux gitview命令用于观看文件的内容，它会同时显示十六进制和ASCII格式的字码。","syntax":"gitview [-bchilv][文件]","params":[],"examples":[{"desc":"使用指令gitview以彩色模式观看文件\"/home/ rootlocal/demo.txt\"中的内容，输入如下命令：","code":"$ gitview -c /home/rootlocal/demo.txt #使用gitview指令观看指定文件内容"}],"example":"gitview -c /home/rootlocal/demo.txt #使用gitview指令观看指定文件内容"},{"cat":"文件管理","name":"indent","desc":"格式化 C 语言代码","diff":1,"intro":"Linux indent命令用于调整C原始代码文件的格式。","syntax":"indent [参数][源文件] 或 indent [参数][源文件][-o 目标文件]","params":[],"examples":[],"example":"indent -kr -i4 hello.c"},{"cat":"文件管理","name":"cut","desc":"按列提取文本","diff":1,"intro":"Linux cut命令用于显示每行从开头算起 num1 到 num2 的文字。","syntax":"cut [-bn] [file]\n\ncut [-c] [file]\n\ncut [-df] [file]","params":[],"examples":[{"desc":"当你执行who命令时，会输出类似如下的内容：","code":"$ who\n\nrocrocket :0 2009-01-08 11:07\n\nrocrocket pts/0 2009-01-08 11:23 (:0.0)\n\nrocrocket pts/1 2009-01-08 14:15 (:0.0)"},{"desc":"如果我们想提取每一行的第3个字节，就这样：","code":"$ who|cut -b 3\n\nc\n\nc"}],"example":"who"},{"cat":"文件管理","name":"ln","desc":"创建链接文件","diff":1,"intro":"Linux ln（英文全拼：link files）命令是一个非常重要命令，它的功能是为某一个文件在另外一个位置建立一个同步的链接。","syntax":"ln [参数][源文件或目录][目标文件或目录]","params":[],"examples":[{"desc":"给文件创建软链接，为log2013.log文件创建软链接link2013，如果log2013.log丢失，link2013将失效：","code":"ln -s log2013.log link2013"},{"desc":"输出：","code":"[root@localhost test]# ll\n\n-rw-r--r-- 1 root bin 61 11-13 06:03 log2013.log\n\n[root@localhost test]# ln -s log2013.log link2013\n\n[root@localhost test]# ll\n\nlrwxrwxrwx 1 root root 11 12-07 16:01 link2013 -> log2013.log\n\n-rw-r--r-- 1 root bin 61 11-13 06:03 log2013.log"},{"desc":"给文件创建硬链接，为log2013.log创建硬链接ln2013，log2013.log与ln2013的各项属性相同","code":"ln log2013.log ln2013"},{"desc":"输出：","code":"[root@localhost test]# ll\n\nlrwxrwxrwx 1 root root 11 12-07 16:01 link2013 -> log2013.log\n\n-rw-r--r-- 1 root bin 61 11-13 06:03 log2013.log\n\n[root@localhost test]# ln log2013.log ln2013\n\n[root@localhost test]# ll\n\nlrwxrwxrwx 1 root root 11 12-07 16:01 link2013 -> log2013.log\n\n-rw-r--r-- 2 root bin 61 11-13 06:03 ln2013\n\n-rw-r--r-- 2 root bin 61 11-13 06:03 log2013.log"}],"example":"ln -s log2013.log link2013"},{"cat":"文件管理","name":"less","desc":"分页查看文件内容","diff":1,"intro":"less 与 more 类似，less 可以随意浏览文件，支持翻页和搜索，支持向上翻页和向下翻页。","syntax":"less [参数] 文件","params":[],"examples":[{"desc":"1、查看文件","code":"less log2013.log"},{"desc":"2、ps查看进程信息并通过less分页显示","code":"ps -ef |less"},{"desc":"3、查看命令历史使用记录并通过less分页显示","code":"[root@localhost test]# history | less\n\n22 scp -r tomcat6.0.32 root@192.168.120.203:/opt/soft\n\n23 cd ..\n\n24 scp -r web root@192.168.120.203:/opt/\n\n25 cd soft\n\n26 ls\n\n……省略……"},{"desc":"4、浏览多个文件","code":"less log2013.log log2014.log"}],"example":"less log2013.log"},{"cat":"文件管理","name":"locate","desc":"快速查找文件","diff":1,"intro":"Linux locate命令用于查找符合条件的文档，他会去保存文档和目录名称的数据库内，查找合乎范本样式条件的文档或目录。","syntax":"locate [-d ][--help][--version][范本样式...]","params":[],"examples":[{"desc":"查找 passwd 文件，输入以下命令：","code":"locate passwd"},{"desc":"搜索 etc 目录下所有以 sh 开头的文件 ：","code":"locate /etc/sh"},{"desc":"忽略大小写搜索当前用户目录下所有以 r 开头的文件 ：","code":"locate -i ~/r"}],"example":"locate passwd"},{"cat":"文件管理","name":"lsattr","desc":"显示文件属性","diff":1,"intro":"Linux lsattr 命令用于显示文件扩展属性。","syntax":"lsattr [选项] [文件或目录...]","params":[],"examples":[{"desc":"1. 查看单个文件的属性","code":"lsattr /etc/passwd"},{"desc":"输出示例：","code":"----i--------- /etc/passwd"},{"desc":"2. 查看目录及其内容","code":"lsattr -R /var/log/ # 递归查看 /var/log/ 下所有文件"},{"desc":"3. 仅查看目录本身的属性（不显示子文件）","code":"lsattr -d /tmp/"},{"desc":"4. 显示隐藏文件的属性","code":"lsattr -a ~/.bashrc"},{"desc":"5. 结合 chattr 使用","code":"sudo chattr +i important_file.txt # 设置为不可变\n\nlsattr important_file.txt # 检查是否生效"},{"desc":"输出：","code":"----i--------- important_file.txt"}],"example":"lsattr /etc/passwd"},{"cat":"文件管理","name":"mattrib","desc":"修改 MS-DOS 文件属性","diff":1,"intro":"Linux mattrib命令用来变更或显示MS-DOS文件的属性。","syntax":"mattrib [-a|+a] [-h|+h] [-r|+r] [-s|+s] [-/] [-X] msdosfile [ msdosfiles ... ]","params":[],"examples":[{"desc":"列出 A 槽 MSDOS 格式磁片上所有文件的属性。","code":"mattrib a:"},{"desc":"除去 A 槽磁片上 msdos.sys 档案的隐藏、系统与唯读属性。","code":"mattrib -h -s -r a:msdos.sys"},{"desc":"除去 A 槽磁片上包含子目录下所有档案的唯读属性。","code":"mattrib -r -/ a:*.*"}],"example":"mattrib a:"},{"cat":"文件管理","name":"mc","desc":"文件管理器 Midnight Commander","diff":1,"intro":"Linux mc命令用于提供一个菜单式的文件管理程序。","syntax":"mc [-abcdfhkPstuUVx][-C \u003c参数>][-l \u003c文件>][-v \u003c文件>][目录]","params":[],"examples":[],"example":"mc"},{"cat":"文件管理","name":"mdel","desc":"删除 MS-DOS 文件","diff":1,"intro":"Linux mdel命令用来删除 MSDOS 格式的档案。","syntax":"mdel [-v] msdosfile [ msdosfiles ... ]","params":[],"examples":[{"desc":"将 A 槽磁片根目录中的 autoexec.bat 删除。","code":"mdel a:autoexec.bat ."}],"example":"mdel a:autoexec.bat ."},{"cat":"文件管理","name":"mdir","desc":"列出 MS-DOS 目录内容","diff":1,"intro":"Linux mdir命令用于显示MS-DOS目录。","syntax":"mdir [-afwx/][目录]","params":[],"examples":[{"desc":"显示a盘中的内容","code":"$ mdir -/ a:\\*"},{"desc":"以上命令执行后，mdir将显示指定盘\"a:\\\"中的所有子目录及其中的文件信息，如下所示：","code":"Volume in drive A has no label #加载信息 \n\nVolume Serial Number is 13D2~055C \n\nDirectory for A:\\ #以下为目录信息 \n\n./TEST \u003cDIR> 2011-08-23 16:59 \n\n#显示格式为文件名，目录大小，修改时间 \n\nAUTORUN.INF 265 2011-08-23 16:53 \n\nAUTORUN.BAT 43 2011-08-23 16:56 \n\n3 files 308 bytes #统计总大小 \n\n724 325 bytes free #剩余空间"}],"example":"mdir -/ a:\\*"},{"cat":"文件管理","name":"mktemp","desc":"创建临时文件或目录","diff":1,"intro":"Linux mktemp命令用于建立暂存文件。","syntax":"mktemp [-qu][文件名参数]","params":[],"examples":[{"desc":"使用mktemp 命令生成临时文件时，文件名参数应当以\"文件名.XXXX\"的形式给出，mktemp 会根据文件名参数建立一个临时文件。在命令行提示符输入如下命令：","code":"mktemp tmp.xxxx #生成临时文件"},{"desc":"使用该命令后，可使用dir 或ls看当前目录，得到如下结果：","code":"cmd@cmd-desktop:~$ mktemp tmp.xxxx #生成临时文件 \n\ncmd@cmd-desktop:~$dir #查看当前目录 \n\nfile test testfile testfile1 tmp.3847 #生成了tmp.3847"}],"example":"mktemp tmp.xxxx #生成临时文件"},{"cat":"文件管理","name":"more","desc":"分页显示文本内容","diff":1,"intro":"Linux more 命令类似 cat ，不过会以一页一页的形式显示，更方便使用者逐页阅读，而最基本的指令就是按空白键（space）就往下一页显示，按 b 键就会往回（back）一页显示，而且还有搜寻字串的功能（与 vi 相似），使用中的说明文件，请按 h 。","syntax":"more [-dlfpcsu] [-num] [+/pattern] [+linenum] [fileNames..]","params":[],"examples":[{"desc":"逐页显示 testfile 文档内容，如有连续两行以上空白行则以一行空白行显示。","code":"more -s testfile"},{"desc":"从第 20 行开始显示 testfile 之文档内容。","code":"more +20 testfile"}],"example":"more -s testfile"},{"cat":"文件管理","name":"mmove","desc":"移动 MS-DOS 文件","diff":1,"intro":"Linux mmove命令用于在MS-DOS文件系统中，移动文件或目录，或更改名称。","syntax":"mmove [源文件或目录...][目标文件或目录]","params":[],"examples":[{"desc":"使用指令mmove将文件\"autorun.bat\"移动到目录\"test\"中，输入如下命令：","code":"$ mmove autorun.bat test #移动文件到目录test中"}],"example":"mmove autorun.bat test #移动文件到目录test中"},{"cat":"文件管理","name":"mread","desc":"读取 MS-DOS 文件","diff":1,"intro":"Linux mread命令用于将MS-DOS文件复制到Linux/Unix的目录中。","syntax":"mread [MS-DOS文件...][Linux文件或目录]","params":[],"examples":[{"desc":"使用指令mread将盘\"a:\\\"中的所有内容复制到当前工作目录下，输入如下命令：","code":"$ mread a:\\* ./ #将a盘上的所有文件复制到当前工作目录"},{"desc":"执行该命令前，可以先使用mdir命令查看原来的目录结构。执行mread之后，可使用ls命令再次查看复制之后的文件结构，结果如下所示：","code":"$ mdir -/ a:\\* #查看a盘中的文件 \n\nVolume in drive A has no label #加载信息 \n\nVolume Serial Number is 13D2~055C \n\nDirectory for A:/ #以下为目录信息 \n\n./TEST \u003cDIR> 2011-08-23 16:59 \n\n#显示格式为文件名，目录大小，修改时间 \n\nAUTORUN.INF 265 2011-08-23 16:53 \n\nAUTORUN.BAT 43 2011-08-23 16:56 \n\n3 files 308 bytes #统计总大小 \n\n724 325 bytes free #剩余空间 \n\n$ mread A:\\* ./ #将a盘上所有文件复制到当前工作目录 \n\n$ ls #查看文件或子目录信息 \n\nTEST AUTORUN.INF AUTORUN.BAT #显示复制后的内容"}],"example":"mread a:\\* ./ #将a盘上的所有文件复制到当前工作目录"},{"cat":"文件管理","name":"mren","desc":"重命名 MS-DOS 文件","diff":1,"intro":"Linux mren命令用于更改MS-DOS文件或目录的名称，或是移动文件或目录。","syntax":"mren [源文件或目录...][目标文件或目录]","params":[],"examples":[{"desc":"使用指令mren将a盘下的文件\"autorun.bat\"的文件名修改为\"auto.bat\"，输入如下命令：","code":"$ mren a:\\autorun.bat auto.bat \n\n#将文件autorun.bat重命名为auto.bat"},{"desc":"使用该命令前后使用mdir命令查看并对比，得到结果如下：","code":"$ mdir -/ a:\\* #查看a盘中的文件 \n\nVolume in drive A has no label #加载信息 \n\nVolume Serial Number is 13D2~055C \n\nDirectory for A:\\ #以下为目录信息 \n\n./TEST \u003cDIR> 2011-08-23 16:59 #文件名，目录大小，修改时间 \n\nAUTORUN.BAT 43 2011-08-23 16:56 \n\n3 files 308 bytes #统计总大小 \n\n724 325 bytes free #剩余空间 \n\n#将文件autorun.bat重命名为auto.bat \n\n$ mren a:\\autorun.bat auto.bat \n\n$ mdir -/ a:\\* #再次查看a盘中文件 \n\nVolume in drive A has no label #加载信息 \n\nVolume Serial Number is 13D2~055C \n\nDirectory for A:\\ #以下为目录信息 \n\n./TEST \u003cDIR> 2011-08-23 16:59 #文件名目录大小 修改时间 \n\n#文件名被改为auto.bat，修改时间改为当前系统时间 \n\nAUTO.BAT 43 2011-08-23 16:56 \n\n3 files 308 bytes #统计总大小 \n\n724 325 bytes free #剩余空间"}],"example":"mren a:\\autorun.bat auto.bat"},{"cat":"文件管理","name":"mtools","desc":"MS-DOS 工具集","diff":1,"intro":"Linux mtools命令用于显示mtools支持的指令。","syntax":"mtools","params":[],"examples":[{"desc":"在命令提示符中直接输入mtools，可显示其所支持的MS-DOS命令，如下所示：","code":"$ mtools #显示所支持的MS-DOS命令 \n\nSupported commands: #命令列表 \n\nmattrib, mbadblocks, mcat, mcd, mclasserase, mcopy, mdel, mdeltree \n\nmdir, mdoctorfat, mdu, mformat, minfo, mlabel, mmd, mmount \n\nmpartition, mrd, mread, mmove, mren, mshowfat, mtoolstest, mtype \n\nmwrite, mzip"}],"example":"mtools #显示所支持的MS-DOS命令"},{"cat":"文件管理","name":"mtoolstest","desc":"测试 mtools 配置","diff":1,"intro":"Linux mtoolstest命令用于测试并显示mtools的相关设置。","syntax":"mtoolstest","params":[],"examples":[{"desc":"在命令行中直接输入mtoolstest，即可显示mtools软件包当前的配置信息，结果如下：","code":"$ mtoolstest #显示mtools 软件包当前的配置信息 \n\ndrive J: #mtools软件包当前的配置信息列表 \n\n#fn=0 mode=0 builtin \n\nfile=\"/dev/sdb4\" fat_bits=16 \n\ntracks=0 heads=0 sectors=0 hidden=0 \n\noffset=0x0 \n\npartition=0 \n\nmformat_only \n\ndrive Z: \n\n#fn=0 mode=0 builtin \n\nfile=\"/dev/sdb4\" fat_bits=16 \n\ntracks=0 heads=0 sectors=0 hidden=0 \n\noffset=0x0 \n\npartition=0 \n\nmformat_only \n\ndrive X: \n\n#fn=0 mode=0 builtin \n\nfile=\"$DISPLAY\" fat_bits=0 \n\ntracks=0 heads=0 sectors=0 hidden=0 \n\noffset=0x0 \n\npartition=0 \n\ndrive A: \n\n#fn=2 mode=128 defined in /etc/mtools.conf \n\nfile=\"/dev/fd0\" fat_bits=0 \n\ntracks=0 heads=0 sectors=0 hidden=0 \n\noffset=0x0 \n\npartition=0 \n\nexclusive \n\ndrive B: \n\n#fn=2 mode=128 defined in /etc/mtools.conf \n\nfile=\"/dev/fd1\" fat_bits=0 \n\ntracks=0 heads=0 sectors=0 hidden=0 \n\noffset=0x0 \n\npartition=0 \n\nexclusive \n\ndrive M: \n\n#fn=2 mode=0 defined in /etc/mtools.conf \n\nfile=\"/var/lib/dosemu/hdimage.first\" fat_bits=0 \n\ntracks=0 heads=0 sectors=0 hidden=0 \n\noffset=0x80 \n\npartition=1 \n\ndrive N: \n\n#fn=2 mode=0 defined in /etc/mtools.conf \n\nfile=\"/var/lib/dosemu/fdimage\" fat_bits=0 \n\ntracks=0 heads=0 sectors=0 hidden=0 \n\noffset=0x0 \n\npartition=0 \n\nmtools_fat_compatibility=0 \n\nmtools_skip_check=0 \n\nmtools_lower_case=0"}],"example":"mtoolstest #显示mtools 软件包当前的配置信息"},{"cat":"文件管理","name":"mv","desc":"移动或重命名文件","diff":1,"intro":"Linux mv（英文全拼：move file）命令用来为文件或目录改名、或将文件或目录移入其它位置。","syntax":"mv [options] source dest\n\nmv [options] source... directory","params":[],"examples":[{"desc":"将文件 aaa 改名为 bbb :","code":"mv aaa bbb"},{"desc":"将 info 目录放入 logs 目录中。注意，如果 logs 目录不存在，则该命令将 info 改名为 logs。","code":"mv info/ logs"},{"desc":"再如将 /usr/runoob 下的所有文件和目录移到当前目录下，命令行为：","code":"$ mv /usr/runoob/* ."}],"example":"mv aaa bbb"},{"cat":"文件管理","name":"od","desc":"以八进制等格式输出文件","diff":1,"intro":"Linux od命令用于输出文件内容。","syntax":"od [-abcdfhilovx][-A \u003c字码基数>][-j \u003c字符数目>][-N \u003c字符数目>][-s \u003c字符串字符数>][-t \u003c输出格式>][-w \u003c每列字符数>][--help][--version][文件...]","params":[],"examples":[{"desc":"创建 tmp 文件：","code":"$ echo abcdef g > tmp\n\n$ cat tmp\n\nabcdef g"},{"desc":"使用 od 命令：","code":"$ od -b tmp\n\n0000000 141 142 143 144 145 146 040 147 012\n\n0000011"},{"desc":"使用单字节八进制解释进行输出，注意左侧的默认地址格式为八字节:","code":"$ od -c tmp\n\n0000000 a b c d e f g \\n\n\n0000011"},{"desc":"使用ASCII码进行输出，注意其中包括转义字符","code":"$ od -t d1 tmp\n\n0000000 97 98 99 100 101 102 32 103 10\n\n0000011"},{"desc":"使用单字节十进制进行解释","code":"$ od -A d -c tmp\n\n0000000 a b c d e f g \\n\n\n0000009"}],"example":"echo abcdef g > tmp"},{"cat":"文件管理","name":"paste","desc":"合并文件内容","diff":1,"intro":"Linux paste 命令用于合并文件的列。","syntax":"paste [-s][-d \u003c间隔字符>][--help][--version][文件...]","params":[],"examples":[{"desc":"使用paste指令将文件\"file\"、\"testfile\"、\"testfile1\"进行合并，输入如下命令：","code":"paste file testfile testfile1 #合并指定文件的内容"},{"desc":"但是，在执行以上命令之前，首先使用\"cat\"指令对3个文件内容进行查看，显示如下所示：","code":"$ cat file #file文件的内容 \n\nxiongdan 200 \n\nlihaihui 233 \n\nlymlrl 231 \n\n$ cat testfile #testfile文件的内容 \n\nliangyuanm ss \n\n$ cat testfile1 #testfile1文件的内容 \n\nhuanggai 56 \n\nzhixi 73"},{"desc":"当合并指令\"$ paste file testfile testfile1\"执行后，程序界面中将显示合并后的文件内容，如下所示：","code":"xiongdan 200 \n\nlihaihui 233 \n\nlymlrl 231 \n\nliangyuanm ss \n\nhuanggai 56 \n\nzhixi 73"},{"desc":"若使用paste指令的参数\"-s\"，则可以将一个文件中的多行数据合并为一行进行显示。例如，将文件\"file\"中的3行数据合并为一行数据进行显示，输入如下命令","code":"$ paste -s file #合并指定文件的多行数据"},{"desc":"上面的命令执行后，显示的数据内容如下所示：","code":"xiongdan 200 lihaihui 233 lymlrl 231"}],"example":"paste file testfile testfile1 #合并指定文件的内容"},{"cat":"文件管理","name":"patch","desc":"为文件打补丁","diff":1,"intro":"Linux patch命令用于修补文件。","syntax":"patch [-bceEflnNRstTuvZ][-B \u003c备份字首字符串>][-d \u003c工作目录>][-D \u003c标示符号>][-F \u003c监别列数>][-g \u003c控制数值>][-i \u003c修补文件>][-o \u003c输出文件>][-p \u003c剥离层级>][-r \u003c拒绝文件>][-V \u003c备份方式>][-Y \u003c备份字首字符串>][-z \u003c备份字尾字符串>][--backup-if -mismatch][--binary][--help][--nobackup-if-mismatch][--verbose][原始文件 \u003c修补文件>] 或 path [-p \u003c剥离层级>] \u003c [修补文件]","params":[],"examples":[{"desc":"使用patch指令将文件\"testfile1\"升级，其升级补丁文件为\"testfile.patch\"，输入如下命令：","code":"$ patch -p0 testfile1 testfile.patch #使用补丁程序升级文件"},{"desc":"使用该命令前，可以先使用指令\"cat\"查看\"testfile1\"的内容。在需要修改升级的文件与原文件之间使用指令\"diff\"比较可以生成补丁文件。具体操作如下所示：","code":"$ cat testfile1 #查看testfile1的内容 \n\nHello,This is the firstfile! \n\n$ cat testfile2 #查看testfile2的内容 \n\nHello,Thisisthesecondfile! \n\n$ diff testfile1 testfile2 #比较两个文件 \n\n1c1 \n\n\u003cHello,Thisisthefirstfile! \n\n--- \n\n>Hello,Thisisthesecondfile! \n\n#将比较结果保存到testfile.patch文件 \n\n$ diff testfile1 testfile2>testfile.patch \n\n$ cat testfile.patch #查看补丁包的内容 \n\n1c1 \n\n\u003cHello,Thisisthefirstfile! \n\n--- \n\n>Hello,Thisisthesecondfile! \n\n#使用补丁包升级testfile1文件 \n\n$ patch -p0 testfile1 testfile.patch \n\npatching file testfile1 \n\n$cat testfile1 #再次查看testfile1的内容 \n\n#testfile1文件被修改为与testfile2一样的内容 \n\nHello,This is the secondfile!"}],"example":"patch -p0 testfile1 testfile.patch #使用补丁程序升级文件"},{"cat":"文件管理","name":"rcp","desc":"远程文件复制","diff":1,"intro":"Linux rcp命令用于复制远程文件或目录。","syntax":"rcp [-pr][源文件或目录][目标文件或目录]","params":[],"examples":[{"desc":"设本地主机当前账户为rootlocal，远程主机账户为root，要将远程主机（218.6.132.5）主目录下的文件\"testfile\"复制到本地目录\"test\"中，则输入如下命令：","code":"rcp root@218.6.132.5:./testfile testfile #复制远程文件到本地 \n\nrcp root@218.6.132.5:home/rootlocal/testfile testfile \n\n#要求当前登录账户cmd 登录到远程主机 \n\nrcp 218.6.132.5:./testfile testfile"}],"example":"rcp root@218.6.132.5:./testfile testfile #复制远程文件到本地"},{"cat":"文件管理","name":"rm","desc":"删除文件或目录","diff":1,"intro":"Linux rm（英文全拼：remove）命令用于删除一个文件或者目录。","syntax":"rm [options] name...","params":[],"examples":[{"desc":"删除文件可以直接使用rm命令，若删除目录则必须配合选项\"-r\"，例如：","code":"# rm test.txt \n\nrm：是否删除 一般文件 \"test.txt\"? y \n\n# rm homework \n\nrm: 无法删除目录\"homework\": 是一个目录 \n\n# rm -r homework \n\nrm：是否删除 目录 \"homework\"? y"},{"desc":"删除当前目录下的所有文件及目录，命令行为：","code":"rm -r *"}],"example":"rm：是否删除 一般文件 \"test.txt\"? y"},{"cat":"文件管理","name":"slocate","desc":"安全快速查找文件","diff":1,"intro":"Linux slocate命令查找文件或目录。","syntax":"slocate [-u][--help][--version][-d \u003c目录>][查找的文件]","params":[],"examples":[{"desc":"使用指令\"slocate\"显示文件名中含有关键字\"fdisk\"的文件路径信息，输入如下命令：","code":"$ slocate fdisk #显示文件名中含有fdisk关键字的文件的路径信息"},{"desc":"执行以上命令后，指令执行的输出信息如下：","code":"$ slocate fdisk #显示文件名中含有fdisk 关键字的文件的路径信息 \n\n/root/cfdisk #搜索到的文件路径列表 \n\n/root/fdisk \n\n/root/sfdisk \n\n/usr/include/grub/ieee1275/ofdisk.h \n\n/usr/share/doc/util-Linux/README.cfdisk \n\n/usr/share/doc/util-Linux/README.fdisk.gz \n\n/usr/share/doc/util-Linux/examples/sfdisk.examples.gz"}],"example":"slocate fdisk #显示文件名中含有fdisk关键字的文件的路径信息"},{"cat":"文件管理","name":"split","desc":"分割大文件","diff":1,"intro":"split 命令用于将一个大文件拆分成若干个小文件，方便传输、存储或并行处理。","syntax":"split [选项] [输入文件] [输出文件前缀]","params":[],"examples":[{"desc":"","code":"# 生成一个包含 5000 行的测试文件\n\n$ seq 1 5000 > data.txt\n\n# 每 1000 行拆分为一个小文件\n\n$ split -l 1000 data.txt part_\n\n# 查看生成的文件\n\n$ ls -lh part_*\n\n-rw-r--r-- 1 runoob runoob 3.9K May 19 14:30 part_aa\n\n-rw-r--r-- 1 runoob runoob 3.9K May 19 14:30 part_ab\n\n-rw-r--r-- 1 runoob runoob 3.9K May 19 14:30 part_ac\n\n-rw-r--r-- 1 runoob runoob 3.9K May 19 14:30 part_ad\n\n-rw-r--r-- 1 runoob runoob 3.9K May 19 14:30 part_ae"},{"desc":"","code":"# 生成一个 10MB 的测试文件\n\n$ dd if=/dev/urandom of=test.bin bs=1M count=10\n\n# 按每 2MB 拆分\n\n$ split -b 2M test.bin chunk_\n\n# 查看拆分结果\n\n$ ls -lh chunk_*\n\n-rw-r--r-- 1 runoob runoob 2.0M May 19 14:32 chunk_aa\n\n-rw-r--r-- 1 runoob runoob 2.0M May 19 14:32 chunk_ab\n\n-rw-r--r-- 1 runoob runoob 2.0M May 19 14:32 chunk_ac\n\n-rw-r--r-- 1 runoob runoob 2.0M May 19 14:32 chunk_ad\n\n-rw-r--r-- 1 runoob runoob 2.0M May 19 14:32 chunk_ae"},{"desc":"","code":"# 将文件均分为 3 份\n\n$ split -n 3 data.txt equal_\n\n# 查看各文件行数\n\n$ wc -l equal_*\n\n 1667 equal_aa\n\n 1667 equal_ab\n\n 1666 equal_ac\n\n 5000 total"},{"desc":"","code":"# 使用数字后缀，并指定后缀长度为 3\n\n$ split -d -a 3 -l 1000 data.txt runoob_\n\n# 生成的文件名\n\n$ ls runoob_*\n\nrunoob_000 runoob_001 runoob_002 runoob_003 runoob_004"},{"desc":"","code":"# 生成一个包含不同长度行的测试日志\n\n$ for i in $(seq 1 100); do echo \"Line $i: RUNOOB testing data $(head -c $((RANDOM % 50 + 10)) /dev/urandom | base64)\"; done > log.txt\n\n# 按 1KB 拆分，同时保持行完整性\n\n$ split -C 1K log.txt log_\n\n# 检查每个文件的最后一行是否完整（都以换行符结尾）\n\n$ for f in log_*; do echo \"$f: $(tail -c 1 $f | xxd | grep -c '0a')\"; done"},{"desc":"","code":"# 合并所有拆分文件，还原为原始文件\n\n$ cat part_* > restored.txt\n\n# 验证合并后的内容与原始文件一致\n\n$ diff data.txt restored.txt && echo \"文件一致，合并成功\"\n\n文件一致，合并成功"}],"example":"seq 1 5000 > data.txt"},{"cat":"文件管理","name":"tee","desc":"输出重定向并保存","diff":1,"intro":"Linux tee命令用于读取标准输入的数据，并将其内容输出成文件。","syntax":"tee [-ai][--help][--version][文件...]","params":[],"examples":[{"desc":"使用指令\"tee\"将用户输入的数据同时保存到文件\"file1\"和\"file2\"中，输入如下命令：","code":"$ tee file1 file2 #在两个文件中复制内容"},{"desc":"以上命令执行后，将提示用户输入需要保存到文件的数据，如下所示：","code":"My Linux #提示用户输入数据 \n\nMy Linux #输出数据，进行输出反馈"}],"example":"tee file1 file2 #在两个文件中复制内容"},{"cat":"文件管理","name":"tmpwatch","desc":"清理临时文件","diff":1,"intro":"Linux tmpwatch命令用于删除暂存文件。","syntax":"tmpwatch [-afqv][--test][超期时间][目录...]","params":[],"examples":[{"desc":"使用指令\"tmpwatch\"删除目录\"/tmp\"中超过一天未使用的文件，输入如下命令：","code":"$ tmpwatch 24 /tmp/ #删除/tmp目录中超过一天未使用的文件"},{"desc":"以上命令执行后，其执行结果如下所示：","code":"removing directctmp/orbit-tom if not empty"},{"desc":"注意：该指令需要root权限，因此在使用tmpwatch命令前应该使用su命令切换用户。切换管理权限操作如下所示：","code":"$ su #切换到root用户 \n\n口令：********** #输入用户密码"}],"example":"tmpwatch 24 /tmp/ #删除/tmp目录中超过一天未使用的文件"},{"cat":"文件管理","name":"touch","desc":"修改文件时间戳","diff":1,"intro":"Linux touch命令用于修改文件或者目录的时间属性，包括存取时间和更改时间。若文件不存在，系统会建立一个新的文件。","syntax":"touch [-acfm][-d\u003c日期时间>][-r\u003c参考文件或目录>] [-t\u003c日期时间>][--help][--version][文件或目录…]","params":[],"examples":[{"desc":"使用指令\"touch\"修改文件\"testfile\"的时间属性为当前系统时间，输入如下命令：","code":"$ touch testfile #修改文件的时间属性"},{"desc":"首先，使用ls命令查看testfile文件的属性，如下所示：","code":"$ ls -l testfile #查看文件的时间属性 \n\n#原来文件的修改时间为16:09 \n\n-rw-r--r-- 1 hdd hdd 55 2011-08-22 16:09 testfile"},{"desc":"执行指令\"touch\"修改文件属性以后，并再次查看该文件的时间属性，如下所示：","code":"$ touch testfile #修改文件时间属性为当前系统时间 \n\n$ ls -l testfile #查看文件的时间属性 \n\n#修改后文件的时间属性为当前系统时间 \n\n-rw-r--r-- 1 hdd hdd 55 2011-08-22 19:53 testfile"},{"desc":"使用指令\"touch\"时，如果指定的文件不存在，则将创建一个新的空白文件。例如，在当前目录下，使用该指令创建一个空白文件\"file\"，输入如下命令：","code":"$ touch file #创建一个名为“file”的新的空白文件"}],"example":"touch testfile #修改文件的时间属性"},{"cat":"文件管理","name":"umask","desc":"设置默认权限掩码","diff":1,"intro":"Linux umask命令指定在建立文件时预设的权限掩码。","syntax":"umask [-S][权限掩码]","params":[],"examples":[{"desc":"使用指令\"umask\"查看当前权限掩码，则输入下面的命令：","code":"$ umask #获取当前权限掩码"},{"desc":"执行上面的指令后，输出信息如下：","code":"0022"},{"desc":"接下来，使用指令\"mkdir\"创建一个目录，并使用指令\"ls\"获取该目录的详细信息，输入命令如下：","code":"$ mkdir test1 #创建目录 \n\n$ ls –d –l test1/ #显示目录的详细信息"},{"desc":"执行上面的命令后，将显示新创建目录的详细信息，如下所示：","code":"drwxr-xr-x 2 rootlocal rootlocal 4096 2011-9-19 21:46 test1/"}],"example":"umask #获取当前权限掩码"},{"cat":"文件管理","name":"which","desc":"查找可执行文件路径","diff":1,"intro":"Linux which命令用于查找文件。","syntax":"which [文件...]","params":[],"examples":[{"desc":"使用指令\"which\"查看指令\"bash\"的绝对路径，输入如下命令：","code":"$ which bash"},{"desc":"上面的指令执行后，输出信息如下所示：","code":"/bin/bash #bash可执行程序的绝对路径"}],"example":"which bash"},{"cat":"文件管理","name":"cp","desc":"复制文件或目录","diff":1,"intro":"Linux cp（英文全拼：copy file）命令主要用于复制文件或目录。","syntax":"cp [options] source dest\n\n或\n\ncp [选项] 源文件 目标文件","params":[],"examples":[{"desc":"1. 复制文件到目标目录","code":"cp file.txt /path/to/destination/"},{"desc":"2. 复制文件并重命名","code":"cp file.txt /path/to/destination/newfile.txt"},{"desc":"3. 递归复制目录","code":"cp -r /path/to/source_dir /path/to/destination/"},{"desc":"4. 交互模式复制","code":"cp -i file.txt /path/to/destination/"},{"desc":"5. 保留文件属性","code":"cp -p file.txt /path/to/destination/"},{"desc":"6. 仅复制更新的文件","code":"cp -u file.txt /path/to/destination/"},{"desc":"7. 显示复制过程","code":"cp -v file.txt /path/to/destination/"},{"desc":"8. 创建硬链接或符号链接","code":"cp -l file.txt /path/to/destination/ # 创建硬链接\n\ncp -s file.txt /path/to/destination/ # 创建符号链接"},{"desc":"9. 复制多个文件到目录","code":"cp file1.txt file2.txt /path/to/destination/"},{"desc":"10. 使用通配符复制","code":"cp *.txt /path/to/destination/"}],"example":"cp file.txt /path/to/destination/"},{"cat":"文件管理","name":"whereis","desc":"定位命令的二进制/源码/帮助","diff":1,"intro":"Linux whereis命令用于查找文件。","syntax":"whereis [-bfmsu][-B \u003c目录>...][-M \u003c目录>...][-S \u003c目录>...][文件...]","params":[],"examples":[{"desc":"使用指令\"whereis\"查看指令\"bash\"的位置，输入如下命令：","code":"$ whereis bash"},{"desc":"上面的指令执行后，输出信息如下所示：","code":"bash:/bin/bash/etc/bash.bashrc/usr/share/man/man1/bash.1.gz"},{"desc":"如果用户需要单独查询二进制文件或帮助文件，可使用如下命令：","code":"$ whereis -b bash \n\n$ whereis -m bash"},{"desc":"输出信息如下：","code":"$ whereis -b bash #显示bash 命令的二进制程序 \n\nbash: /bin/bash /etc/bash.bashrc /usr/share/bash # bash命令的二进制程序的地址 \n\n$ whereis -m bash #显示bash 命令的帮助文件 \n\nbash: /usr/share/man/man1/bash.1.gz #bash命令的帮助文件地址"}],"example":"whereis bash"},{"cat":"文件管理","name":"mcopy","desc":"复制 MS-DOS 文件","diff":1,"intro":"Linux mcopy命令用来复制 MSDOS 格式文件到 Linux 中，或是由 Linux 中复制 MSDOS 文件到磁片上。","syntax":"mcopy [-bnmpQt/][源文件][目标文件或目录]","params":[],"examples":[{"desc":"将 A 盘根目录中的 autoexec.bat 复制到目前工作目录之下：","code":"mcopy a:autoexec.bat ."},{"desc":"当复制的内容包括子目录和文件时，必须使用参数\"-/\"递归操作，因此该命令为：","code":"mcopy -/ A:\\*"},{"desc":"执行该命令前先使用mdir 命令查看原来的目录结构，执行mcopy 之后可使用ls 命令查看复制之后Linux系统中的文件结构，结果如下：","code":"cmd@cmd-desktop:~$ mdir -/ a:\\* #查看A 盘中的文件 \n\nVolume in drive A has no label #加载信息 \n\nVolume Serial Number is 13D2~055C \n\nDirectory for A:/ #以下为目录信息 \n\n#文件名目录大小 修改时间 \n\n./TEST \u003cDIR> 2009-09-23 16:59 \n\nAUTORUN.INF 265 2009-09-23 16:53 \n\nAUTORUN.BAT 43 2009-09-23 16:56 \n\n3 files 308 bytes #统计总大小 \n\n724 325 bytes free #剩余空间 \n\ncmd@cmd-desktop:~$ mcopy -/ A:\\* #将A盘上的所有文件复制到当前工作目录 \n\ncmd@cmd-desktop:~$ls \n\nTEST AUTORUN.INF AUTORUN.BAT #A盘中的内容复制到Linux文件系统结构中"}],"example":"mcopy a:autoexec.bat ."},{"cat":"文件管理","name":"mshowfat","desc":"显示 FAT 表信息","diff":1,"intro":"Linux mshowfat命令用于显示MS-DOS文件在FAT中的记录。","syntax":"mshowfat [文件...]","params":[],"examples":[{"desc":"使用指令mshowfat查看文件\"autorun.bat\"的FAT信息，输入如下命令：","code":"$ mshowfat autorun.bat"}],"example":"mshowfat autorun.bat"},{"cat":"文件管理","name":"rhmask","desc":"RedHat 权限掩码工具","diff":1,"intro":"Linux rhmask命令用于对文件进行加密和解密操作。","syntax":"rhmask [加密文件][输出文件] 或 rhmask [-d][加密文件][源文件][输出文件]","params":[],"examples":[{"desc":"使用指令\"rhmask\"将加密文件\"code.txt\"进行加密后，另存为输出文件\"demo.txt\"，输入如下命令：","code":"$ rhmask code.txt demo.txt"}],"example":"rhmask code.txt demo.txt"},{"cat":"文件管理","name":"scp","desc":"安全复制文件","diff":1,"intro":"Linux scp 命令用于 Linux 之间复制文件和目录。","syntax":"scp [-1246BCpqrv] [-c cipher] [-F ssh_config] [-i identity_file]\n\n[-l limit] [-o ssh_option] [-P port] [-S program]\n\n[[user@]host1:]file1 [...] [[user@]host2:]file2","params":[],"examples":[{"desc":"","code":"scp example.txt user@remote_host:/home/user/"},{"desc":"","code":"scp user@remote_host:/home/user/example.txt ."},{"desc":"","code":"scp -r my_directory user@remote_host:/home/user/"},{"desc":"","code":"scp -P 2222 example.txt user@remote_host:/home/user/"},{"desc":"","code":"scp -p example.txt user@remote_host:/home/user/"},{"desc":"","code":"scp -C large_file.zip user@remote_host:/home/user/"},{"desc":"","code":"scp local_file remote_username@remote_ip:remote_folder \n\n或者 \n\nscp local_file remote_username@remote_ip:remote_file \n\n或者 \n\nscp local_file remote_ip:remote_folder \n\n或者 \n\nscp local_file remote_ip:remote_file"},{"desc":"","code":"scp /home/space/music/1.mp3 root@www.runoob.com:/home/root/others/music \n\nscp /home/space/music/1.mp3 root@www.runoob.com:/home/root/others/music/001.mp3 \n\nscp /home/space/music/1.mp3 www.runoob.com:/home/root/others/music \n\nscp /home/space/music/1.mp3 www.runoob.com:/home/root/others/music/001.mp3"},{"desc":"","code":"scp -r local_folder remote_username@remote_ip:remote_folder \n\n或者 \n\nscp -r local_folder remote_ip:remote_folder"},{"desc":"","code":"scp -r /home/space/music/ root@www.runoob.com:/home/root/others/ \n\nscp -r /home/space/music/ www.runoob.com:/home/root/others/"}],"example":"scp example.txt user@remote_host:/home/user/"},{"cat":"文件管理","name":"awk","desc":"文本处理与分析工具","diff":1,"intro":"awk 是一种处理文本文件的语言，是一个强大的文本分析工具。","syntax":"awk options 'pattern {action}' file","params":[],"examples":[{"desc":"","code":"2 this is a test\n\n3 Do you like awk\n\nThis's a test\n\n10 There are orange,apple,mongo"},{"desc":"","code":"awk -F, '{print $1, $2}' log.txt"},{"desc":"","code":"2 this is a test\n\n3 Do you like awk\n\nThis's a test\n\n10 There are orange apple"},{"desc":"","code":"awk 'BEGIN { FS=\",\" } {print $1, $2}' log.txt"},{"desc":"","code":"2 this is a test\n\n3 Do you like awk\n\nThis's a test\n\n10 There are orange apple"},{"desc":"","code":"awk -F '[ ,]' '{print $1, $2, $5}' log.txt"},{"desc":"","code":"2 this test\n\n3 Do awk\n\nThis's a\n\n10 There apple"},{"desc":"","code":"awk -v 变量名=值 '{动作}' 文件名"},{"desc":"","code":"awk -va=1 '{print $1, $1+a}' log.txt"},{"desc":"","code":"2 3\n\n3 4\n\nThis's 1\n\n10 11"}],"example":"2 this is a test"},{"cat":"文件管理","name":"read","desc":"读取标准输入内容","diff":1,"intro":"Linux read命令用于从标准输入读取数值。","syntax":"read [-ers] [-a aname] [-d delim] [-i text] [-n nchars] [-N nchars] [-p prompt] [-t timeout] [-u fd] [name ...]","params":[],"examples":[{"desc":"1、简单读取","code":"#!/bin/bash\n\n#这里默认会换行 \n\necho \"输入网站名: \" \n\n#读取从键盘的输入 \n\nread website \n\necho \"你输入的网站名是 $website\" \n\nexit 0 #退出"},{"desc":"测试结果为：","code":"输入网站名: \n\nwww.runoob.com\n\n你输入的网站名是 www.runoob.com"},{"desc":"2、-p 参数，允许在 read 命令行中直接指定一个提示。","code":"#!/bin/bash\n\nread -p \"输入网站名:\" website\n\necho \"你输入的网站名是 $website\" \n\nexit 0"},{"desc":"测试结果为：","code":"输入网站名:www.runoob.com\n\n你输入的网站名是 www.runoob.com"},{"desc":"3、-t 参数指定 read 命令等待输入的秒数，当计时满时，read命令返回一个非零退出状态。","code":"#!/bin/bash\n\nif read -t 5 -p \"输入网站名:\" website\n\nthen\n\n echo \"你输入的网站名是 $website\"\n\nelse\n\n echo \"\\n抱歉，你输入超时了。\"\n\nfi\n\nexit 0"},{"desc":"执行程序不输入，等待 5 秒后：","code":"输入网站名:\n\n抱歉，你输入超时了"},{"desc":"4、除了输入时间计时，还可以使用 -n 参数设置 read 命令计数输入的字符。当输入的字符数目达到预定数目时，自动退出，并将输入的数据赋值给变量。","code":"#!/bin/bash\n\nread -n1 -p \"Do you want to continue [Y/N]?\" answer\n\ncase $answer in\n\nY | y)\n\n echo \"fine ,continue\";;\n\nN | n)\n\n echo \"ok,good bye\";;\n\n*)\n\n echo \"error choice\";;\n\nesac\n\nexit 0"},{"desc":"只接收 2 个输入就退出：","code":"#!/bin/bash\n\nread -n2 -p \"请随便输入两个字符: \" any\n\necho \"\\n您输入的两个字符是:$any\"\n\nexit 0"},{"desc":"执行程序输入两个字符：","code":"请随便输入两个字符: 12\n\n您输入的两个字符是:12"},{"desc":"5、-s 选项能够使 read 命令中输入的数据不显示在命令终端上（实际上，数据是显示的，只是 read 命令将文本颜色设置成与背景相同的颜色）。输入密码常用这个选项。","code":"#!/bin/bash\n\nread -s -p \"请输入您的密码:\" pass\n\necho \"\\n您输入的密码是 $pass\"\n\nexit 0"}],"example":"echo \"输入网站名: \""},{"cat":"文件管理","name":"rename","desc":"批量重命名文件","diff":1,"intro":"rename 命令是 Linux 系统中用于批量重命名文件的实用工具。它通过使用正则表达式或简单的字符串替换，可以高效地对多个文件进行重命名操作，特别适合需要批量处理文件名的场景。","syntax":"rename [选项] '表达式' 文件...","params":[["-v","显示详细操作信息（verbose）"],["-n","模拟运行，不实际执行重命名（dry-run）"],["-f","强制覆盖已存在的文件"],["-h","显示帮助信息"]],"examples":[{"desc":"","code":"rename 's/.html$/.php/' *.html"},{"desc":"","code":"rename 's/^/backup_/' *.txt"},{"desc":"","code":"rename 's/ //g' *"},{"desc":"","code":"rename 's/.jpg$/.JPG/' *.jpg"},{"desc":"","code":"rename 's/(d+)/sprintf(\"%03d\", $1)/e' *.png"},{"desc":"","code":"rename 'if (/.jpeg$/) { s/.jpeg$/.jpg/ }' *"}],"example":"rename 's/.html$/.php/' *.html"},{"cat":"文件管理","name":"realpath","desc":"显示文件的绝对路径","diff":1,"intro":"realpath 是 Linux 系统中一个实用的命令行工具，用于解析文件或目录的绝对路径（绝对路径是指从根目录 / 开始的完整路径）。它会解析所有符号链接（symbolic links）并规范化路径中的 .（当前目录）和 ..（上级目录）引用。","syntax":"realpath [选项] 文件或目录...","params":[["-e 或 --canonicalize-existing","只解析实际存在的路径（默认行为）"],["-m 或 --canonicalize-missing","解析路径，即使路径不存在"],["-L 或 --logical","解析符号链接时，不跟随符号链接"],["-P 或 --physical","解析符号链接时，跟随所有符号链接（默认行为）"],["-q 或 --quiet","静默模式，不显示错误信息"],["--relative-to=DIR","返回相对于指定目录的路径"],["--relative-base=DIR","只规范化指定目录下的路径部分"],["-s 或 --strip 或 --no-symlinks","不展开符号链接"],["-z 或 --zero","用 NUL 字符而非换行符分隔输出"]],"examples":[],"example":"realpath ./docs/../readme.txt"},{"cat":"文件管理","name":"shred","desc":"安全删除文件（覆盖后删除）","diff":1,"intro":"shred 是 Linux 系统中一个用于安全删除文件的命令行工具。与普通的 rm 命令不同，shred 会通过多次覆写文件内容的方式，确保文件数据无法被恢复。","syntax":"shred [选项]... 文件...","params":[["-n N","覆写次数（默认为3次）"],["-z","最后用零覆写以隐藏 shred 操作"],["-u","覆写后截断并删除文件"],["-v","显示详细操作过程"],["-f","必要时强制更改权限以允许写入"],["-x","不要处理超过文件大小的块"]],"examples":[{"desc":"","code":"shred -v document.txt"},{"desc":"","code":"shred -u -v secret-file.txt"},{"desc":"","code":"shred -n 10 -v -z data.db"},{"desc":"","code":"shred -v -n 1 /dev/sdX"},{"desc":"","code":"shred --random-source=/dev/urandom -v file.txt"},{"desc":"","code":"dd if=/dev/zero of=file.txt bs=1M count=10"},{"desc":"","code":"wipe -r -q secret-file.txt"},{"desc":"","code":"secure-delete 工具包中的 srm 命令"}],"example":"shred -v document.txt"},{"cat":"文件管理","name":"install","desc":"复制文件并设置属性","diff":1,"intro":"install 是 Linux 系统中一个多功能文件安装工具，它结合了文件复制、权限设置和目录创建等功能于一体。与简单的 cp 命令相比，install 提供了更精细的控制能力，特别适合在脚本中用于程序安装和文件部署。","syntax":"install [选项]... 源文件 目标文件\n\ninstall [选项]... 源文件... 目标目录\n\ninstall -d [选项]... 目录...","params":[["-b 或 --backup","覆盖前备份现有文件"],["-C 或 --compare","比较源文件和目标文件，只有在不同时才复制"],["-D","创建目标目录的所有父目录"],["-d 或 --directory","创建目录而不是复制文件"],["-g 或 --group=GROUP","设置文件所属组"],["-m 或 --mode=MODE","设置文件权限模式（如 755）"],["-o 或 --owner=OWNER","设置文件所有者"],["-p 或 --preserve-timestamps","保留源文件的访问/修改时间"],["-S 或 --suffix=SUFFIX","覆盖默认的备份后缀（默认为 ~）"],["-t 或 --target-directory=DIRECTORY","将所有源文件复制到指定目录"],["-v 或 --verbose","显示详细操作信息"]],"examples":[],"example":"install -m 755 app /usr/local/bin/"},{"cat":"文件管理","name":"updatedb","desc":"更新 locate 数据库","diff":1,"intro":"updatedb 命令用来创建或更新 slocate/locate 命令所必需的数据库文件。","syntax":"updatedb(选项)","params":[],"examples":[],"example":"sudo updatedb"},{"cat":"文档编辑","name":"col","desc":"过滤控制字符","diff":2,"intro":"Linux col命令用于过滤控制字符。","syntax":"col [-bfx][-l\u003c缓冲区列数>]","params":[],"examples":[{"desc":"将man 命令的帮助文档保存为man_help，使用-b 参数过滤所有控制字符。在终端中使用如下命令：","code":"man man | col-b > man_help"}],"example":"man man | col-b > man_help"},{"cat":"文档编辑","name":"colrm","desc":"删除指定列内容","diff":2,"intro":"Linux colrm命令用于滤掉指定的行。","syntax":"colrm [开始行数编号\u003c结束行数编号>]","params":[],"examples":[{"desc":"不带任何参数时该命令不会删除任何列：","code":"colrm"},{"desc":"按回车键后，光标将在第一行闪烁，等待标准输入，此时输入字符，如\"Hello Linux！\"，再按回车键后第二行将出现与第一行相同内容，此时按Ctrl+C组合键可以退出。终端中显示的内容如下所示：","code":"cmd@hdd-desktop:~$ colrm \n\nHello Linux! #输入Hello Linux！字符串 \n\nHello Linux! #输出刚才输入的字符串Hello Linux！"},{"desc":"如想要删除第4 列之后的所有内容，可以使用如下命令：","code":"colrm 4"},{"desc":"类似于上例，此时标准输入等待输入，用户输入字符串按回车键后，将输出如下结果：","code":"cmd@hdd-desktop:~$ colrm 4 \n\nHello Linux! #输入Hello Linux！字符串 \n\nHel #输出删除了第4列以后所有内容的字符串"},{"desc":"删除指定列的内容。如删除第4列到第6列的内容，可使用如下命令：","code":"colrm 4 6"},{"desc":"输出的结果如下：","code":"cmd@hdd-desktop:~$ colrm 4 6 \n\nHello Linux! #输入Hello Linux！字符串 \n\nHelLinux! #输出删除了从第4列到第6列字符的字符串"}],"example":"colrm"},{"cat":"文档编辑","name":"comm","desc":"比较两个文件内容","diff":2,"intro":"Linux comm 命令用于比较两个已排过序的文件。","syntax":"comm [-123][--help][--version][第1个文件][第2个文件]","params":[],"examples":[{"desc":"aaa.txt 与 bbb.txt 的文件内容如下：","code":"[root@localhost text]# cat aaa.txt \n\naaa \n\nbbb \n\nccc \n\nddd \n\neee \n\n111 \n\n222\n\n[root@localhost text]# cat bbb.txt\n\nbbb \n\nccc \n\naaa \n\nhhh \n\nttt \n\njjj"},{"desc":"执行 comm 命令输出结果如下：","code":"[root@localhost text]# comm aaa.txt bbb.txt \n\naaa\n\n bbb\n\n ccc\n\n aaa\n\nddd\n\neee\n\n111\n\n222\n\n hhh\n\n ttt\n\n jjj\n\n第一列 第二列 第三列"}],"example":"[root@localhost text]# cat aaa.txt"},{"cat":"文档编辑","name":"csplit","desc":"按模式分割文件","diff":2,"intro":"Linux csplit命令用于分割文件。","syntax":"csplit [-kqsz][-b\u003c输出格式>][-f\u003c输出字首字符串>]\n\n[-n\u003c输出文件名位数>][--help][--version][文件][范本样式...]","params":[],"examples":[{"desc":"将文本文件testfile以第 2 行为分界点切割成两份，使用如下命令：","code":"csplit testfile 2"},{"desc":"testfile文件中的内容如下：","code":"$ cat testfile #查看testfile 文件内容 \n\nhello Linux! \n\nLinux is a free Unix-type operating system. \n\nThis is a Linux testfile! \n\nLinux"},{"desc":"使用csplit命令，输出结果如下：","code":"$ csplit testfile 2 \n\n13 #xx00文件字符个数 \n\n76 #xx01文件字符个数"},{"desc":"其中第1 行是第一个文件xx00的字符个数，同样，第2 行为第二个文件xx01的字符个数。同时，在testfile 的同目录下将生成两个文件，文件名分别为xx00、xx01，xx00 中的内容为：","code":"$ cat xx00 #查看分割后的xx00文件内容 \n\nhello Linux! #testfile文件第1行的内容"},{"desc":"xx01 中的内容为：","code":"$ cat xx01 #查看分割后的xx01文件内容 \n\nLinux is a free Unix-type operating system. #testfile文件第2行以后的内容 \n\nThis is a Linux testfile! \n\nLinux"}],"example":"csplit testfile 2"},{"cat":"文档编辑","name":"ed","desc":"行编辑器","diff":2,"intro":"Linux ed命令是文本编辑器，用于文本编辑。","syntax":"ed [-][-Gs][-p\u003c字符串>][--help][--version][文件]","params":[],"examples":[{"desc":"以下是一个 Linux ed 完整实例解析：","code":"$ ed \u003c- 激活 ed 命令 \n\na \u003c- 告诉 ed 我要编辑新文件 \n\nMy name is Titan. \u003c- 输入第一行内容 \n\nAnd I love Perl very much. \u003c- 输入第二行内容 \n\n. \u003c- 返回 ed 的命令行状态 \n\ni \u003c- 告诉 ed 我要在最后一行之前插入内容 \n\nI am 24. \u003c- 将“I am 24.”插入“My name is Titan.”和“And I love Perl very much.”之间 \n\n. \u003c- 返回 ed 的命令行状态 \n\nc \u003c- 告诉 ed 我要替换最后一行输入内容 \n\nI am 24 years old. \u003c- 将“I am 24.”替换成“I am 24 years old.”（注意：这里替换的是最后输的内容） \n\n. \u003c- 返回 ed 的命令行状态 \n\nw readme.text \u003c- 将文件命名为“readme.text”并保存（注意：如果是编辑已经存在的文件，只需要敲入 w 即可） \n\nq \u003c- 完全退出 ed 编辑器"},{"desc":"这是文件的内容是：","code":"$ cat readme.text \n\nMy name is Titan. \n\nI am 24 years old. \n\nAnd I love Perl vrey much."}],"example":"ed \u003c- 激活 ed 命令"},{"cat":"文档编辑","name":"egrep","desc":"扩展正则匹配文本","diff":2,"intro":"Linux egrep命令用于在文件内查找指定的字符串。","syntax":"egrep [范本模式] [文件或目录]","params":[],"examples":[{"desc":"显示文件中符合条件的字符。例如，查找当前目录下所有文件中包含字符串\"Linux\"的文件，可以使用如下命令：","code":"egrep Linux *"},{"desc":"结果如下所示：","code":"$ egrep Linux * #查找当前目录下包含字符串“Linux”的文件 \n\ntestfile:hello Linux! #以下五行为testfile 中包含Linux字符的行 \n\ntestfile:Linux is a free Unix-type operating system. \n\ntestfile:This is a Linux testfile! \n\ntestfile:Linux \n\ntestfile:Linux \n\ntestfile1:helLinux! #以下两行为testfile1中含Linux字符的行 \n\ntestfile1:This a Linux testfile! \n\n#以下两行为testfile_2 中包含Linux字符的行 \n\ntestfile_2:Linux is a free unix-type opterating system. \n\ntestfile_2:Linux test \n\nxx00:hello Linux! #xx00包含Linux字符的行 \n\nxx01:Linux is a free Unix-type operating system. #以下三行为xx01包含Linux字符的行 \n\nxx01:This is a Linux testfile! \n\nxx01:Linux"}],"example":"egrep Linux *"},{"cat":"文档编辑","name":"ex","desc":"行模式文本编辑器","diff":2,"intro":"Linux ex命令用于在Ex模式下启动vim文本编辑器。","syntax":"ex [选项][参数]","params":[],"examples":[{"desc":"在ex 指令后输入文件名按回车键后，即可进入ex 编辑模式，如编辑testfile文件，使用的命令格式如下：","code":"ex testfile"},{"desc":"输出的信息如下：","code":"\"testfile\" 5L, 95C"}],"example":"ex testfile"},{"cat":"文档编辑","name":"fgrep","desc":"固定字符串查找","diff":2,"intro":"Linux fgrep命令用于查找文件里符合条件的字符串。","syntax":"fgrep [范本样式][文件或目录...]","params":[],"examples":[],"example":"fgrep \"error\" app.log"},{"cat":"文档编辑","name":"fmt","desc":"简单文本格式化","diff":2,"intro":"Linux fmt命令用于编排文本文件。","syntax":"fmt [-cstu][-p\u003c列起始字符串>][-w\u003c每列字符数>][--help][--version][文件...]","params":[],"examples":[{"desc":"重排指定文件。如文件testfile共5 行文字，可以通过命令对该文件格式进行重排，其命令为：","code":"fmt testfile"},{"desc":"输出结果如下：","code":"$ fmt testfile #重排testfile 文件 \n\nhello Linux! Linux is a free Unix-type operating system. This is a \n\nLinux testfile! Linux Linux"},{"desc":"将文件testfile重新排成85 个字符一行，并在标准输出设备上输出，其命令应该为：","code":"fmt -w 85 testfile"},{"desc":"为了对比，先使用cat 命令查看文件内容：","code":"$ cat testfile #查看testfile 文件的内容 \n\nhello Linux! \n\nLinux is a free Unix-type operating system. \n\nThis is a Linux testfile! \n\nLinux \n\nLinux"},{"desc":"使用fmt命令重排之后，输出结果如下：","code":"$ fmt -w 85 testfile #指定重排宽度为85个字符 \n\nhello Linux! Linux is a free Unix-type operating system. This is a Linux testfile! \n\nLinux Linux"}],"example":"fmt testfile"},{"cat":"文档编辑","name":"fold","desc":"按宽度换行文本","diff":2,"intro":"Linux fold命令用于限制文件列宽。","syntax":"fold [-bs][-w\u003c每列行数>][--help][--version][文件...]","params":[],"examples":[{"desc":"将一个名为testfile 的文件的行折叠成宽度为30，可使用如下命令：","code":"fold -w 30 testfile"},{"desc":"为了对比，先将testfile文件输出如下：","code":"$ cat testfile #查看testfile 中的内容 \n\nLinux networks are becoming more and more common, but \n\nsecurity is often an overlooked \n\nissue. Unfortunately, in today’s environment all networks \n\nare potential hacker targets, \n\nfrom top-secret military research networks to small home LANs. \n\nLinux Network Security focuses on securing Linux in a \n\nnetworked environment, where the \n\nsecurity of the entire network needs to be considered \n\nrather than just isolated machines. \n\nIt uses a mix of theory and practical techniques to \n\nteach administrators how to install and \n\nuse security applications, as well as how the \n\napplications work and why they are necessary."},{"desc":"然后使用fold命令折叠显示：","code":"$ fold -w 30 testfile #行折叠成宽度为30，显示testfile 文件 \n\nLinux networks are becoming mo \n\nre and more common, but securi \n\nty is often an overlooked issu \n\ne. Unfortunately, in today’s \n\nenvironment all networks are \n\npotential hacker targets, from \n\ntop-secret military research \n\nnetworks to small home LANs. \n\nLinux Network Security focuses \n\non securing Linux in a networ \n\nked environment, where the sec \n\nurity of the entire network ne \n\neds to be considered rather th \n\nan just isolated machines. It \n\nuses a mix of theory and pract \n\nical techniques to teach admin \n\nistrators how to install and u \n\nse security applications, as w \n\nell as how the applications wo \n\nrk and why they are necessary"}],"example":"fold -w 30 testfile"},{"cat":"文档编辑","name":"grep","desc":"文本搜索工具","diff":2,"intro":"Linux grep (global regular expression) 命令用于查找文件里符合条件的字符串或正则表达式。","syntax":"grep [options] pattern [files]\n\n或\n\ngrep [-abcEFGhHilLnqrsvVwxy][-A\u003c显示行数>][-B\u003c显示列数>][-C\u003c显示列数>][-d\u003c进行动作>][-e\u003c范本样式>][-f\u003c范本文件>][--help][范本样式][文件或目录...]","params":[],"examples":[{"desc":"1、在文件 file.txt 中查找字符串 \"hello\"，并打印匹配的行：","code":"grep hello file.txt"},{"desc":"2、在文件夹 dir 中递归查找所有文件中匹配正则表达式 \"pattern\" 的行，并打印匹配行所在的文件名和行号：","code":"grep -r -n pattern dir/"},{"desc":"3、在标准输入中查找字符串 \"world\"，并只打印匹配的行数：","code":"echo \"hello world\" | grep -c world"},{"desc":"4、在当前目录中，查找后缀有 file 字样的文件中包含 test 字符串的文件，并打印出该字符串的行。此时，可以使用如下命令：","code":"grep test *file"},{"desc":"结果如下所示：","code":"$ grep test test* #查找前缀有“test”的文件包含“test”字符串的文件 \n\ntestfile1:This a Linux testfile! #列出testfile1 文件中包含test字符的行 \n\ntestfile_2:This is a linux testfile! #列出testfile_2 文件中包含test字符的行 \n\ntestfile_2:Linux test #列出testfile_2 文件中包含test字符的行"},{"desc":"5、以递归的方式查找符合条件的文件。例如，查找指定目录/etc/acpi 及其子目录（如果存在子目录的话）下所有文件中包含字符串\"update\"的文件，并打印出该字符串所在行的内容，使用的命令为：","code":"grep -r update /etc/acpi"},{"desc":"输出结果如下：","code":"$ grep -r update /etc/acpi #以递归的方式查找“etc/acpi” \n\n#下包含“update”的文件 \n\n/etc/acpi/ac.d/85-anacron.sh:# (Things like the slocate updatedb cause a lot of IO.) \n\nRather than \n\n/etc/acpi/resume.d/85-anacron.sh:# (Things like the slocate updatedb cause a lot of \n\nIO.) Rather than \n\n/etc/acpi/events/thinkpad-cmos:action=/usr/sbin/thinkpad-keys--update"},{"desc":"查找文件名中包含 test 的文件中不包含test 的行，此时，使用的命令为：","code":"grep -v test *test*"},{"desc":"结果如下所示：","code":"$ grep-v test* #查找文件名中包含test 的文件中不包含test 的行 \n\ntestfile1:helLinux! \n\ntestfile1:Linis a free Unix-type operating system. \n\ntestfile1:Lin \n\ntestfile_1:HELLO LINUX! \n\ntestfile_1:LINUX IS A FREE UNIX-TYPE OPTERATING SYSTEM. \n\ntestfile_1:THIS IS A LINUX TESTFILE! \n\ntestfile_2:HELLO LINUX! \n\ntestfile_2:Linux is a free unix-type opterating system."}],"example":"grep hello file.txt"},{"cat":"文档编辑","name":"ispell","desc":"拼写检查工具","diff":2,"intro":"Linux ispell命令用于拼写检查程序。","syntax":"ispell [-aAbBClmMnNPStVx][-d\u003c字典文件>][-L\u003c行数>][-p\u003c字典文件>][-w\u003c非字母字符>][-W\u003c字符串长度>][要检查的文件]","params":[],"examples":[{"desc":"检查文件的拼写。例如，检查testfile文件，可使用如下命令：","code":"ispell testfile"},{"desc":"如果文件中出现可疑词汇，则第一个出现的可疑词汇以高亮显示，并在屏幕下方给出词汇的修改意见，以及ispell的操作命令。如下所示：","code":"netwrks File: testfile \n\nLinux netwrks are becoming more and more common, but security is often an overlooked \n\nissue. Unfortunately \n\n0: networks \n\n[SP] \u003cnumber> R)epl A)ccept I)nsert L)ookup U)ncap Q)uit e(X)it or ? for help"},{"desc":"通过以上实例我们可以发现，文件testfile中有拼写错误，对该文件进行修改后需备份文件。此时使用如下命令：","code":"ispell-b testfile #检查拼写错误的同时，备份文件"},{"desc":"如果文件已经无拼写错误，则不显示任何信息，通过ls命令我们也可以查看到当前文件目录下产生了文件testfile的备份文件testfile.bak。查看结果如下所示：","code":"$ ls #以列表的形式查看当前目录下的文件 \n\nexamples.desktop testfile_1 testfile.bak xx01 模板图片 音乐 \n\ntestfile testfile1 testfile_2 xx00 公共的视频文档桌面"}],"example":"ispell testfile"},{"cat":"文档编辑","name":"jed","desc":"文本编辑器 JED","diff":2,"intro":"Linux jed命令用于编辑文本文件。","syntax":"jed [-2n][-batch][-f\u003c函数>][-g\u003c行数>][-i\u003c文件>][-I\u003c文件>][-s\u003c字符串>][文件]","params":[],"examples":[{"desc":"jed主要用于编辑程序的源码，编辑源码时将以彩色高亮的方式显示程序的语法。例如使用jed编辑一个C语言的源代码文件，可使用如下命令：","code":"jed main.c #用jed编辑器打开main.c 文件"},{"desc":"输出结果如下：","code":"F10 key ==> File Edit Mode Search Buffers Windows System Help #编辑器菜单 \n\n/*-*- linux-c-*-*/ #编辑区 \n\n#include \u003clinux/mm.h> \n\n#include \u003clinux/sysctl.h> \n\n#include \u003clinux/nsproxy.h> \n\nstatic struct list_head * \n\nnet_ctl_header_lookup(struct ctl_table_root *root, struct nsproxy *namespaces) \n\n{ \n\nreturn &namespaces->net_ns->sysctl_table_headers; \n\n} \n\nstatic struct ctl_table_root net_sysctl_root = { \n\n.lookup = net_ctl_header_lookup, \n\n}; \n\nstatic int sysctl_net_init(struct net *net) \n\n{ \n\nINIT_LIST_HEAD(&net->sysctl_table_headers); \n\nreturn 0; \n\n} \n\n-----+(Jed 0.99.18U) Emacs: main.c (C) All 6:06pm----------------------------- \n\n#从左到右分别为jed版本编号、当前是模拟emacs编辑器、打开的文件名、现在的时间 \n\nloading /usr/share/jed/lib/modeinfo.slc"}],"example":"jed main.c #用jed编辑器打开main.c 文件"},{"cat":"文档编辑","name":"joe","desc":"文本编辑器 JOE","diff":2,"intro":"Linux joe命令用于编辑文本文件。","syntax":"joe [-asis][-beep][-csmode][-dopadding][-exask][-force][-help][-keepup][-lightoff][-arking][-mid][-nobackups][-nonotice][-nosta][-noxon][-orphan][-backpath\u003c目录>][-columns\u003c栏位>][-lines\u003c行数>][-pg\u003c行数>][-skiptop\u003c行数>][-autoindent crlf linums overwrite rdonly wordwrap][+\u003c行数>][-indentc\u003c缩排字符>][-istep\u003c缩排字符数>][-keymap\u003c按键配置文件>][-lmargin\u003c栏数>][-rmargin\u003c栏数>][-tab\u003c栏数>][要编辑的文件]\u003c/p>","params":[],"examples":[{"desc":"利用joe命令编辑文本文件。例如利用joe编辑C 语言源代码main.c，使用如下命令：","code":"joe main.c"},{"desc":"与jed类似，joe编辑器中C语言的语法也以彩色的方式显示。效果如下：","code":"I A main.c (c) Row 1 Col 1 12:28 Ctrl-K H for help \n\n#上排从左至右分别为打开的文件名、光标所在行列数、现在时间、显示操作说明 \n\n/*-*- linux-c-*-*/ #编辑区 \n\n#include \u003clinux/mm.h> \n\n#include \u003clinux/sysctl.h> \n\n#include \u003clinux/nsproxy.h> \n\nstatic struct list_head * \n\nnet_ctl_header_lookup(struct ctl_table_root *root, struct nsproxy *namespaces) \n\n{ \n\nreturn &namespaces->net_ns->sysctl_table_headers; \n\n} \n\nstatic struct ctl_table_root net_sysctl_root = { \n\n.lookup = net_ctl_header_lookup, \n\n}; \n\nstatic int sysctl_net_init(struct net *net) \n\n{ \n\nINIT_LIST_HEAD(&net->sysctl_table_headers); \n\nreturn 0; \n\n} \n\n** Joe's Own Editor v3.5 ** (utf-8) ** Copyright . 2006 ** #joe编辑区的版本及版权信息"}],"example":"joe main.c"},{"cat":"文档编辑","name":"join","desc":"合并文件中相同行","diff":2,"intro":"Linux join命令用于将两个文件中，指定栏位内容相同的行连接起来。","syntax":"join [-i][-a\u003c1或2>][-e\u003c字符串>][-o\u003c格式>][-t\u003c字符>][-v\u003c1或2>][-1\u003c栏位>][-2\u003c栏位>][--help][--version][文件1][文件2]","params":[],"examples":[{"desc":"然后以默认的方式比较两个文件，将两个文件中指定字段的内容相同的行连接起来，在终端中输入命令：","code":"join testfile_1 testfile_2"},{"desc":"首先查看testfile_1、testfile_2 中的文件内容：","code":"$ cat testfile_1 #testfile_1文件中的内容 \n\nHello 95 #例如，本例中第一列为姓名，第二列为数额 \n\nLinux 85 \n\ntest 30 \n\ncmd@hdd-desktop:~$ cat testfile_2 #testfile_2文件中的内容 \n\nHello 2005 #例如，本例中第一列为姓名，第二列为年份 \n\nLinux 2009 \n\ntest 2006"},{"desc":"然后使用join命令，将两个文件连接，结果如下：","code":"$ join testfile_1 testfile_2 #连接testfile_1、testfile_2中的内容 \n\nHello 95 2005 #连接后显示的内容 \n\nLinux 85 2009 \n\ntest 30 2006"},{"desc":"文件1与文件2的位置对输出到标准输出的结果是有影响的。例如将命令中的两个文件互换，即输入如下命令：","code":"join testfile_2 testfile_1"},{"desc":"最终在标准输出的输出结果将发生变化，如下所示：","code":"$ join testfile_2 testfile_1 #改变文件顺序连接两个文件 \n\nHello 2005 95 #连接后显示的内容 \n\nLinux 2009 85 \n\ntest 2006 30"}],"example":"join testfile_1 testfile_2"},{"cat":"文档编辑","name":"look","desc":"查找字典单词","diff":2,"intro":"Linux look命令用于查询单词。","syntax":"look [-adf][-t\u003c字尾字符串>][字首字符串][字典文件]","params":[],"examples":[{"desc":"为了查找在testfile文件中以字母L开头的所有的行，可以输入如下命令：","code":"look L testfile"},{"desc":"原文件testfile中的内容如下：","code":"$ cat testfile #查看testfile 文件内容 \n\nHELLO LINUX! \n\nLinux is a free unix-type opterating system. \n\nThis is a linux testfile! \n\nLinux test"},{"desc":"在testfile文件中使用look命令查找以\"L\"开头的单词，结果如下：","code":"$ look L testfile #查找以“L”开头的单词 \n\nLinux is a free unix-type opterating system. #第二行以“L”开头，列出全句 \n\nLinux test #第四行以“L”开头，列出全句"}],"example":"look L testfile"},{"cat":"文档编辑","name":"mtype","desc":"显示 MS-DOS 文件内容","diff":2,"intro":"mtype为mtools工具指令，模拟MS-DOS的type指令，可显示MS-DOS文件的内容。","syntax":"mtype [-st][文件]","params":[],"examples":[{"desc":"打开名为dos.txt 的MS-DOS文件可使用如下命令：","code":"mtype dos.txt #打开MS-DOS 文件"},{"desc":"显示结果如下：","code":"$ mtype dos.txt #打开MS-DOS 文件 \n\nLinux networks are becoming more and more common, but security is often an overlooked \n\nissue. Unfortunately, in today’s environment all networks are potential hacker targets, \n\nfrom top-secret military research networks to small home LANs. \n\nLinux Network Securty focuses on securing Linux in a networked environment, where the \n\nsecurity of the entire network needs to be considered rather than just isolated machines. \n\nIt uses a mix of theory and practicl techniques to teach administrators how to install and \n\nuse security applications, as well as how the applcations work and why they are necessary."}],"example":"mtype dos.txt #打开MS-DOS 文件"},{"cat":"文档编辑","name":"pico","desc":"简单文本编辑器","diff":2,"intro":"Linux pico命令用于编辑文字文件。","syntax":"pico [-bdefghjkmqtvwxz][-n\u003c间隔秒数>][-o\u003c工作目录>][-r\u003c编辑页宽>][-s\u003c拼字检查器>][+\u003c列数编号>][文件]","params":[],"examples":[{"desc":"使用pico命令来编辑testfile文件，在终端中输入如下命令：","code":"pico testfile"},{"desc":"输出结果如下：","code":"GNU nano 2.0.9 文件: testfile #从左到右分别为编辑器版本号、文件名 \n\n#编辑区 \n\nLinux networks are becoming more and more common, but security is often an over$ \n\nLinux Network Securty focuses on securing Linux in a networked environment, whe$ \n\n[ 已读取3 行] #以下为菜单栏 \n\n^G 求助^O 写入^R 读档^Y 上页^K 剪切文字^C 在标位置 \n\n^X 离开^J 对齐^W 搜寻^V 下页^U 还原剪切^T 拼写检查"}],"example":"pico testfile"},{"cat":"文档编辑","name":"rgrep","desc":"递归查找文本","diff":2,"intro":"Linux rgrep命令用于递归查找文件里符合条件的字符串。","syntax":"rgrep [-?BcDFhHilnNrv][-R\u003c范本样式>][-W\u003c列长度>][-x\u003c扩展名>][--help][--version][范本样式][文件或目录...]","params":[],"examples":[{"desc":"在当前目录下查找句子中包含\"Hello\"字符串的文件，可使用如下命令：","code":"rgrep Hello *"},{"desc":"其搜索结果如下：","code":"$ rgrep Hello * #在当前目录下查找句子中包含“Hello”字符串的文件 \n\ntestfile_1:Hello 95 #testfile_1中包含“Hello”字符串的句子 \n\ntestfile_2:Hello 2005 #testfile_2中包含“Hello”字符串的句子"}],"example":"rgrep Hello *"},{"cat":"文档编辑","name":"sed","desc":"流编辑器","diff":2,"intro":"Linux sed 命令是利用脚本来处理文本文件。","syntax":"sed [-hnV][-e\u003cscript>][-f\u003cscript文件>][文本文件]","params":[],"examples":[{"desc":"我们先创建一个 testfile 文件，内容如下：","code":"$ cat testfile #查看testfile 中的内容 \n\nHELLO LINUX! \n\nLinux is a free unix-type opterating system. \n\nThis is a linux testfile! \n\nLinux test \n\nGoogle\n\nTaobao\n\nRunoob\n\nTesetfile\n\nWiki"},{"desc":"在 testfile 文件的第四行后添加一行，并将结果输出到标准输出，在命令行提示符下输入如下命令：","code":"sed -e 4a\\newLine testfile"},{"desc":"使用 sed 命令后，输出结果如下：","code":"$ sed -e 4a\\newLine testfile \n\nHELLO LINUX! \n\nLinux is a free unix-type opterating system. \n\nThis is a linux testfile! \n\nLinux test \n\nnewLine\n\nGoogle\n\nTaobao\n\nRunoob\n\nTesetfile\n\nWiki"},{"desc":"","code":"$ nl testfile | sed '2,5d'\n\n 1 HELLO LINUX! \n\n 6 Taobao\n\n 7 Runoob\n\n 8 Tesetfile\n\n 9 Wiki"},{"desc":"","code":"$ nl testfile | sed '2d' \n\n 1 HELLO LINUX! \n\n 3 This is a linux testfile! \n\n 4 Linux test \n\n 5 Google\n\n 6 Taobao\n\n 7 Runoob\n\n 8 Tesetfile\n\n 9 Wiki"},{"desc":"","code":"$ nl testfile | sed '3,$d' \n\n 1 HELLO LINUX! \n\n 2 Linux is a free unix-type opterating system."},{"desc":"","code":"$ nl testfile | sed '2a drink tea'\n\n 1 HELLO LINUX! \n\n 2 Linux is a free unix-type opterating system. \n\ndrink tea\n\n 3 This is a linux testfile! \n\n 4 Linux test \n\n 5 Google\n\n 6 Taobao\n\n 7 Runoob\n\n 8 Tesetfile\n\n 9 Wiki"},{"desc":"","code":"$ nl testfile | sed '2i drink tea' \n\n 1 HELLO LINUX! \n\ndrink tea\n\n 2 Linux is a free unix-type opterating system. \n\n 3 This is a linux testfile! \n\n 4 Linux test \n\n 5 Google\n\n 6 Taobao\n\n 7 Runoob\n\n 8 Tesetfile\n\n 9 Wiki"},{"desc":"","code":"$ nl testfile | sed '2a Drink tea or ......\\\n\ndrink beer ?'\n\n1 HELLO LINUX! \n\n 2 Linux is a free unix-type opterating system. \n\nDrink tea or ......\n\ndrink beer ?\n\n 3 This is a linux testfile! \n\n 4 Linux test \n\n 5 Google\n\n 6 Taobao\n\n 7 Runoob\n\n 8 Tesetfile\n\n 9 Wiki"},{"desc":"","code":"$ nl testfile | sed '2,5c No 2-5 number'\n\n 1 HELLO LINUX! \n\nNo 2-5 number\n\n 6 Taobao\n\n 7 Runoob\n\n 8 Tesetfile\n\n 9 Wiki"}],"example":"cat testfile #查看testfile 中的内容"},{"cat":"文档编辑","name":"sort","desc":"排序文本内容","diff":2,"intro":"Linux sort 命令用于将文本文件内容加以排序。","syntax":"sort [-bcdfimMnr][-o\u003c输出文件>][-t\u003c分隔字符>][+\u003c起始栏位>-\u003c结束栏位>][--help][--verison][文件][-k field1[,field2]]","params":[],"examples":[{"desc":"在使用 sort 命令以默认的式对文件的行进行排序，使用的命令如下：","code":"sort testfile"},{"desc":"使用 cat 命令显示 testfile 文件可知其原有的排序如下：","code":"$ cat testfile # testfile文件原有排序 \n\ntest 30 \n\nHello 95 \n\nLinux 85"},{"desc":"使用 sort 命令重排后的结果如下：","code":"$ sort testfile # 重排结果 \n\nHello 95 \n\nLinux 85 \n\ntest 30"},{"desc":"使用 -k 参数设置对第二列的值进行重排，结果如下：","code":"$ sort testfile -k 2\n\ntest 30 \n\nLinux 85 \n\nHello 95"}],"example":"sort testfile"},{"cat":"文档编辑","name":"spell","desc":"拼写检查工具","diff":2,"intro":"Linux spell命令可建立拼写检查程序。","syntax":"spell","params":[],"examples":[{"desc":"检查文件testfile是否有拼写错误，在命令行提示符下输入如下命令：","code":"spell testfile"},{"desc":"如果文件中有单词拼写错误，则输出如下信息：","code":"$ spell testfile #检查testfile 拼写错误 \n\nscurity #以下为有错误的单词 \n\ntp \n\nLANs \n\nSecurty \n\npracticl \n\napplcations \n\nnecesary"},{"desc":"检查从标准输入读取的字符串。例如在命令行中输入如下命令：","code":"spell"},{"desc":"按回车键后，输入一串字符串，然后按Ctrl+D 组合键退出spell，屏幕上将显示拼写有错误的单词。如下所示：","code":"$ spell #检查标准输入的字符串的拼写错误 \n\nhell,this is a linx sustem! #拼写错误的字符串 \n\nlinx #以下为有拼写错误的单词 \n\nsustem"}],"example":"spell testfile"},{"cat":"文档编辑","name":"tr","desc":"字符替换或删除","diff":2,"intro":"Linux tr 命令用于转换或删除文件中的字符。","syntax":"tr [-cdst][--help][--version][第一字符集][第二字符集] \n\ntr [OPTION]…SET1[SET2]","params":[],"examples":[{"desc":"将文件testfile中的小写字母全部转换成大写字母，此时，可使用如下命令：","code":"cat testfile |tr a-z A-Z"},{"desc":"testfile文件中的内容如下：","code":"$ cat testfile #testfile原来的内容 \n\nLinux networks are becoming more and more common, \n\nbut scurity is often an overlooked \n\nissue. Unfortunately, in today’s environment all networks \n\nare potential hacker targets, \n\nfro0m tp-secret military research networks to small home LANs. \n\nLinux Network Securty focuses on securing Linux in a \n\nnetworked environment, where the \n\nsecurity of the entire network needs to be considered\n\nrather than just isolated machines. \n\nIt uses a mix of theory and practicl techniques to \n\nteach administrators how to install and \n\nuse security applications, as well as how the \n\napplcations work and why they are necesary."},{"desc":"使用 tr 命令大小写转换后，得到如下输出结果：","code":"$ cat testfile | tr a-z A-Z #转换后的输出 \n\nLINUX NETWORKS ARE BECOMING MORE AND MORE COMMON, BUT SCURITY IS OFTEN AN OVERLOOKED \n\nISSUE. UNFORTUNATELY, IN TODAY’S ENVIRONMENT ALL NETWORKS ARE POTENTIAL HACKER TARGETS, \n\nFROM TP-SECRET MILITARY RESEARCH NETWORKS TO SMALL HOME LANS. \n\nLINUX NETWORK SECURTY FOCUSES ON SECURING LINUX IN A NETWORKED ENVIRONMENT, WHERE THE \n\nSECURITY OF THE ENTIRE NETWORK NEEDS TO BE CONSIDERED RATHER THAN JUST ISOLATED MACHINES. \n\nIT USES A MIX OF THEORY AND PRACTICL TECHNIQUES TO TEACH ADMINISTRATORS HOW TO INSTALL AND \n\nUSE SECURITY APPLICATIONS, AS WELL AS HOW THE APPLCATIONS WORK AND WHY THEY ARE NECESARY."},{"desc":"大小写转换，也可以通过[:lower][:upper]参数来实现。例如使用如下命令：","code":"cat testfile |tr [:lower:] [:upper:]"},{"desc":"输出结果如下：","code":"$ cat testfile | tr [:lower:] [:upper:] #转换后的输出 \n\nLINUX NETWORKS ARE BECOMING MORE AND MORE COMMON, BUT SCURITY IS OFTEN AN OVERLOOKED \n\nISSUE. UNFORTUNATELY, IN TODAY’S ENVIRONMENT ALL NETWORKS ARE POTENTIAL HACKER TARGETS, \n\nFROM TP-SECRET MILITARY RESEARCH NETWORKS TO SMALL HOME LANS. \n\nLINUX NETWORK SECURTY FOCUSES ON SECURING LINUX IN A NETWORKED ENVIRONMENT, WHERE THE \n\nSECURITY OF THE ENTIRE NETWORK NEEDS TO BE CONSIDERED RATHER THAN JUST ISOLATED MACHINES. \n\nIT USES A MIX OF THEORY AND PRACTICL TECHNIQUES TO TEACH ADMINISTRATORS HOW TO INSTALL AND \n\nUSE SECURITY APPLICATIONS, AS WELL AS HOW THE APPLCATIONS WORK AND WHY THEY ARE NECESARY."}],"example":"cat testfile |tr a-z A-Z"},{"cat":"文档编辑","name":"expr","desc":"表达式计算工具","diff":2,"intro":"expr命令是一个手工命令行计数器，用于在UNIX/LINUX下求表达式变量的值，一般用于整数值，也可用于字符串。","syntax":"expr 表达式","params":[],"examples":[{"desc":"1、计算字串长度","code":"> expr length “this is a test”\n\n 14"},{"desc":"2、抓取字串","code":"> expr substr “this is a test” 3 5\n\nis is"},{"desc":"3、抓取第一个字符数字串出现的位置","code":"> expr index \"sarasara\" a\n\n 2"},{"desc":"4、整数运算","code":"> expr 14 % 9\n\n 5\n\n > expr 10 + 10\n\n 20\n\n > expr 1000 + 900\n\n 1900\n\n > expr 30 / 3 / 2\n\n 5\n\n > expr 30 \\* 3 (使用乘号时，必须用反斜线屏蔽其特定含义。因为shell可能会误解显示星号的意义)\n\n 90\n\n > expr 30 * 3\n\n expr: Syntax error"}],"example":"> expr length “this is a test”"},{"cat":"文档编辑","name":"uniq","desc":"去除重复行","diff":2,"intro":"Linux uniq 命令用于检查及删除文本文件中重复出现的行列，一般与 sort 命令结合使用。","syntax":"uniq [-cdu][-f\u003c栏位>][-s\u003c字符位置>][-w\u003c字符位置>][--help][--version][输入文件][输出文件]","params":[],"examples":[{"desc":"文件testfile中第 2、3、5、6、7、9行为相同的行，使用 uniq 命令删除重复的行，可使用以下命令：","code":"uniq testfile"},{"desc":"testfile中的原有内容为：","code":"$ cat testfile #原有内容 \n\ntest 30 \n\ntest 30 \n\ntest 30 \n\nHello 95 \n\nHello 95 \n\nHello 95 \n\nHello 95 \n\nLinux 85 \n\nLinux 85"},{"desc":"使用uniq 命令删除重复的行后，有如下输出结果：","code":"$ uniq testfile #删除重复行后的内容 \n\ntest 30 \n\nHello 95 \n\nLinux 85"},{"desc":"检查文件并删除文件中重复出现的行，并在行首显示该行重复出现的次数。使用如下命令：","code":"uniq -c testfile"},{"desc":"结果输出如下：","code":"$ uniq -c testfile #删除重复行后的内容 \n\n3 test 30 #前面的数字的意义为该行共出现了3次 \n\n4 Hello 95 #前面的数字的意义为该行共出现了4次 \n\n2 Linux 85 #前面的数字的意义为该行共出现了2次"},{"desc":"","code":"$ cat testfile1 # 原有内容 \n\ntest 30 \n\nHello 95 \n\nLinux 85 \n\ntest 30 \n\nHello 95 \n\nLinux 85 \n\ntest 30 \n\nHello 95 \n\nLinux 85"},{"desc":"这时我们就可以使用 sort：","code":"$ sort testfile1 | uniq\n\nHello 95 \n\nLinux 85 \n\ntest 30"},{"desc":"统计各行在文件中出现的次数：","code":"$ sort testfile1 | uniq -c\n\n 3 Hello 95 \n\n 3 Linux 85 \n\n 3 test 30"},{"desc":"在文件中找出重复的行：","code":"$ sort testfile1 | uniq -d\n\nHello 95 \n\nLinux 85 \n\ntest 30"}],"example":"uniq testfile"},{"cat":"文档编辑","name":"wc","desc":"统计字数行数","diff":2,"intro":"Linux wc命令用于计算字数。","syntax":"wc [-clw][--help][--version][文件...]","params":[],"examples":[{"desc":"在默认的情况下，wc将计算指定文件的行数、字数，以及字节数。使用的命令为：","code":"wc testfile"},{"desc":"先查看testfile文件的内容，可以看到：","code":"$ cat testfile \n\nLinux networks are becoming more and more common, but scurity is often an overlooked \n\nissue. Unfortunately, in today’s environment all networks are potential hacker targets, \n\nfro0m tp-secret military research networks to small home LANs. \n\nLinux Network Securty focuses on securing Linux in a networked environment, where the \n\nsecurity of the entire network needs to be considered rather than just isolated machines. \n\nIt uses a mix of theory and practicl techniques to teach administrators how to install and \n\nuse security applications, as well as how the applcations work and why they are necesary."},{"desc":"","code":"$ wc testfile # testfile文件的统计信息 \n\n3 92 598 testfile # testfile文件的行数为3、单词数92、字节数598"},{"desc":"","code":"wc testfile testfile_1 testfile_2 #统计三个文件的信息"},{"desc":"","code":"$ wc testfile testfile_1 testfile_2 #统计三个文件的信息 \n\n3 92 598 testfile #第一个文件行数为3、单词数92、字节数598 \n\n9 18 78 testfile_1 #第二个文件的行数为9、单词数18、字节数78 \n\n3 6 32 testfile_2 #第三个文件的行数为3、单词数6、字节数32 \n\n15 116 708 总用量 #三个文件总共的行数为15、单词数116、字节数708"}],"example":"wc testfile"},{"cat":"文档编辑","name":"vi/vim","desc":"强大的文本编辑器","diff":2,"intro":"除了上面简易范例的 i, Esc, :wq 之外，其实 vim 还有非常多的按键可以使用。","syntax":"$ vim runoob.txt","params":[],"examples":[],"example":"vim /etc/hosts"},{"cat":"文档编辑","name":"let","desc":"计算表达式值","diff":2,"intro":"let 命令是 BASH 中用于计算的工具，用于执行一个或多个表达式，变量计算中不需要加上 $ 来表示变量。如果表达式中包含了空格或其他特殊字符，则必须引起来。","syntax":"let arg [arg ...]","params":[],"examples":[{"desc":"以下实例计算 a 和 b 两个表达式，并输出结果：","code":"#!/bin/bash\n\nlet a=5+4\n\nlet b=9-3 \n\necho $a $b"},{"desc":"以上实例执行结果为：","code":"9 6"}],"example":"let a=5+4"},{"cat":"文档编辑","name":"column","desc":"将文本按列格式化","diff":2,"intro":"column 是 Linux 系统中的一个实用命令行工具，用于将输入文本格式化为多列显示。它能够将原本杂乱无章的文本数据重新组织成整齐的表格形式，极大提高可读性。","syntax":"column [选项] [文件名]","params":[["-t","自动识别输入的分隔符并创建表格"],["-s sep","指定自定义列分隔符（默认是空白字符）"],["-c width","设置输出总宽度（字符数）"],["-x","先填充行再填充列（默认是先列后行）"],["-o sep","指定输出列分隔符（默认是两个空格）"],["-N names","为各列指定名称（逗号分隔）"],["-n","不合并多个连续分隔符"]],"examples":[],"example":"df -h | column -t"},{"cat":"文档编辑","name":"jq","desc":"JSON 数据处理工具","diff":2,"intro":"jq 是一个轻量级且功能强大的命令行 JSON 处理器。它允许你以高效的方式解析、过滤、转换和格式化 JSON 数据，特别适合在 shell 脚本中处理 JSON 数据。","syntax":"jq [options] [file...]","params":[["-c","紧凑输出（不美化）"],["-r","输出原始字符串（去除 JSON 引号）"],["-s","将整个输入流读取到数组中"],["-M","禁用颜色输出"],["--arg","定义变量"],["--slurp","将多个 JSON 对象读入数组"]],"examples":[{"desc":"安装完成后，可以通过以下命令验证安装是否成功：","code":"jq --version"},{"desc":"获取所有内容（美化输出）：","code":"jq '.' data.json"},{"desc":"","code":"jq -s '.[0] + .[1]' file1.json file2.json"},{"desc":"","code":"jq --arg new_city \"Boston\" '.address.city = $new_city' data.json"},{"desc":"","code":"curl -s https://api.example.com/users | jq '.[] | {name: .name, email: .email}'"},{"desc":"","code":"jq -n 'inputs | select(.value &gt; 100)' hugefile.json"}],"example":"jq --version"},{"cat":"文档编辑","name":"iconv","desc":"转换文件编码","diff":2,"intro":"iconv 是 Linux 系统中的一个命令行工具，用于在不同字符编码之间转换文本文件的内容。它能够处理各种常见的字符编码格式，如 UTF-8、GB2312、ISO-8859 等，解决不同系统间文本编码不兼容的问题。","syntax":"iconv [选项] -f 原编码 -t 目标编码 [输入文件]","params":[["-f","指定原始文件的字符编码（from）"],["-t","指定要转换的目标字符编码（to）"],["-o","指定输出文件（默认输出到标准输出）"],["-l","列出所有支持的编码格式"],["-c","静默忽略无法转换的字符（默认会报错）"],["--verbose","显示转换过程中的详细信息"]],"examples":[{"desc":"","code":"iconv -l"},{"desc":"将 GB2312 编码的文件转换为 UTF-8：","code":"iconv -f GB2312 -t UTF-8 input.txt -o output.txt"},{"desc":"通过管道转换文本：","code":"cat gb2312_file.txt | iconv -f GB2312 -t UTF-8"},{"desc":"","code":"iconv -f GBK -t UTF-8//IGNORE input.txt -o output.txt"},{"desc":"","code":"find . -name \"*.txt\" -exec bash -c 'iconv -f GB2312 -t UTF-8 \"{}\" &gt; \"{}.utf8\"' ;"},{"desc":"","code":"vim -c \"set fileencoding\" filename.txt"},{"desc":"","code":"file -i filename.txt"}],"example":"iconv -l"},{"cat":"文档编辑","name":"dos2unix","desc":"转换行尾符为 Unix 格式","diff":2,"intro":"dos2unix 是一个用于将文本文件从 DOS/Windows 格式转换为 Unix/Linux 格式的实用工具。它主要解决不同操作系统间换行符差异导致的问题。","syntax":"dos2unix [选项] 文件...","params":[["-k","保留文件时间戳不变"],["-f","强制转换，忽略二进制文件检查"],["-q","静默模式，不显示警告信息"],["-o","覆盖原始文件（默认行为）"],["-n","新文件模式，保留原文件，输出到新文件"],["-c","转换编码（需配合 -e 选项使用）"],["-e","指定目标编码（如 -e utf8）"],["-b","创建备份文件（添加 .bak 后缀）"]],"examples":[{"desc":"","code":"dos2unix file.txt"},{"desc":"","code":"dos2unix -n file.txt newfile.txt"},{"desc":"","code":"dos2unix *.txt"},{"desc":"","code":"find . -type f -name \"*.sh\" -exec dos2unix {} ;"},{"desc":"","code":"dos2unix -k script.py"},{"desc":"","code":"dos2unix -b *.php # 转换并创建备份"},{"desc":"","code":"tr -d 'r' unixfile.txt"},{"desc":"","code":"sed -i 's/r$//' winfile.txt"}],"example":"dos2unix file.txt"},{"cat":"文档编辑","name":"unix2dos","desc":"转换行尾符为 DOS 格式","diff":2,"intro":"unix2dos 是一个用于将 Unix/Linux 格式的文本文件转换为 DOS/Windows 格式的实用工具。它主要处理文本文件中的行结束符（line endings）问题。","syntax":"unix2dos [选项] 文件...","params":[["-b 或 --keep-bom","保留 UTF-8 字节顺序标记（BOM）"],["-c 或 --convmode","转换模式（ascii, 7bit, iso, mac）"],["-f 或 --force","强制转换二进制文件"],["-h 或 --help","显示帮助信息"],["-k 或 --keepdate","保持文件时间戳不变"],["-L 或 --license","显示软件许可证"],["-l 或 --newline","仅添加换行符"],["-m 或 --add-bom","添加 UTF-8 字节顺序标记"],["-n 或 --newfile","写入新文件（不修改原文件）"],["-o 或 --oldfile","写入原文件（默认行为）"],["-q 或 --quiet","静默模式，不显示警告"],["-V 或 --version","显示版本信息"]],"examples":[{"desc":"将 Unix 格式的文件转换为 DOS 格式：","code":"unix2dos file.txt"},{"desc":"如果你想保留原始文件并创建一个转换后的新文件：","code":"unix2dos -n unixfile.txt dosfile.txt"},{"desc":"使用通配符转换多个文件：","code":"unix2dos *.txt"},{"desc":"结合 find 命令递归处理目录：","code":"find . -name \"*.sh\" -exec unix2dos {} ;"},{"desc":"转换文件但不修改其时间戳：","code":"unix2dos -k file.txt"},{"desc":"","code":"unix2dos script.sh"},{"desc":"","code":"unix2dos config.properties"},{"desc":"","code":"unix2dos README.md"},{"desc":"","code":"file filename.txt"}],"example":"unix2dos file.txt"},{"cat":"文件传输","name":"lprm","desc":"删除打印队列任务","diff":2,"intro":"Linux lprm命令用于将一个工作由打印机贮列中移除","syntax":"/usr/bin/lprm [P] [file...]","params":[],"examples":[{"desc":"将打印机 hpprinter 中的第 1123 号工作移除","code":"lprm -Phpprinter 1123"},{"desc":"将第 1011 号工作由预设印表机中移除","code":"lprm 1011"}],"example":"lprm -Phpprinter 1123"},{"cat":"文件传输","name":"lpr","desc":"提交打印任务","diff":2,"intro":"cancel 命令用于取消打印队列中的作业，其中 job_number 是作业的编号。","syntax":"lpr [选项] [文件...]","params":[],"examples":[{"desc":"打印一个文件：","code":"lpr myfile.txt"},{"desc":"指定打印机打印：","code":"lpr -P myprinter myfile.txt"},{"desc":"打印多份：","code":"lpr -# 3 myfile.txt"},{"desc":"不打印标题页：","code":"lpr -h myfile.txt"},{"desc":"指定打印选项（例如双面打印）：","code":"lpr -o sides=two-sided-long-edge myfile.txt"},{"desc":"双面打印：","code":"lpr -o sides=two-sided-long-edge myfile.txt"},{"desc":"指定页面范围：","code":"lpr -o page-ranges=1-5 myfile.pdf"},{"desc":"你可以一次打印多个文件，只需将文件名按空格分隔列出：","code":"lpr file1.txt file2.txt file3.txt"},{"desc":"打印目录中的所有文件:","code":"lpr -r directory"},{"desc":"使用 lpstat 命令可以查看当前打印队列的状态：","code":"lpstat -o"}],"example":"lpr myfile.txt"},{"cat":"文件传输","name":"lpq","desc":"显示打印队列","diff":2,"intro":"Linux lpq命令用于查看一个打印队列的状态，该程序可以查看打印机队列状态及其所包含的打印任务。","syntax":"$ lpq \n\nprinter is ready \n\nno entries","params":[],"examples":[{"desc":"为系统默认的打印机printer的一个空队列。","code":"$ lpq \n\nprinter is ready \n\nno entries"},{"desc":"如果事先并未指定打印机（使用-P选项），系统便会显示默认的打印机。如果向打印机发送打印任务，然后查看打印队列，便会看到如下列表。","code":"$ ls *.txt | pr -3 | lp \n\nrequest id is printer-603 (1 file(s)) \n\n[me@linuxbox ~]$ lpq \n\nprinter is ready and printing \n\nRank Owner Job File(s) Total Size \n\nactive me 603 (stdin)"}],"example":"lpq"},{"cat":"文件传输","name":"lpd","desc":"打印服务守护进程","diff":2,"intro":"Linux lpd命令 是一个常驻的打印机管理程序，它会根据 /etc/printcap 的内容来管理本地或远端的打印机。","syntax":"lpd [-l] [#port]","params":[],"examples":[],"example":"lpd -D"},{"cat":"文件传输","name":"bye","desc":"结束 FTP 会话","diff":2,"intro":"bye 命令通常用于退出当前的 shell 会话或终端窗口。","syntax":"bye","params":[],"examples":[{"desc":"","code":"bye"},{"desc":"","code":"alias bye='exit'"},{"desc":"","code":"#!/bin/bash\n\nexit"},{"desc":"","code":"chmod +x bye"},{"desc":"","code":"sudo mv bye /usr/local/bin/"}],"example":"bye"},{"cat":"文件传输","name":"ftp","desc":"文件传输协议客户端","diff":2,"intro":"在 Linux 系统中，ftp 命令是一个用于与 FTP 服务器进行交互的命令行工具。","syntax":"ftp [-dignv][主机名称或IP地址]","params":[],"examples":[{"desc":"","code":"ftp ftp.example.com"},{"desc":"1. 连接到 FTP 服务器：","code":"ftp ftp.example.com"},{"desc":"2. 切换到远程服务器上的目标目录（如果需要）：","code":"cd /path/to/remote/directory"},{"desc":"3. 切换到本地计算机的目标目录：","code":"lcd ~/downloads"},{"desc":"4.下载文件：","code":"get example.txt"},{"desc":"5. 断开连接并退出：","code":"bye"}],"example":"ftp ftp.example.com"},{"cat":"文件传输","name":"uuto","desc":"UUCP 文件传输","diff":2,"intro":"Linux uuto 命令将文件传送到远端的 UUCP 主机。","syntax":"uuto [选项] 源文件 目标系统!目标用户","params":[],"examples":[{"desc":"","code":"uuto example.txt remote_system!remote_user"},{"desc":"","code":"uuto -r my_directory remote_system!remote_user"},{"desc":"","code":"uuto -p example.txt remote_system!remote_user"},{"desc":"","code":"uuto -m example.txt remote_system!remote_user"}],"example":"uuto example.txt remote_system!remote_user"},{"cat":"文件传输","name":"uupick","desc":"UUCP 文件接收","diff":2,"intro":"Linux uupick 命令处理传送进来的文件。","syntax":"uupick [选项]","params":[],"examples":[{"desc":"","code":"uupick -s remote_system"},{"desc":"","code":"uupick -s remote_system -d /home/user/received_files"},{"desc":"","code":"uupick -s remote_system -v"}],"example":"uupick -s remote_system"},{"cat":"文件传输","name":"uucp","desc":"Unix 到 Unix 文件拷贝","diff":2,"intro":"Linux uucp（Unix-to-Unix Copy）是一个在 Unix 和 Linux 系统中用于在计算机之间传输文件的命令。","syntax":"uucp [选项] 源文件 目标文件","params":[],"examples":[{"desc":"","code":"uucp example.txt remote!/home/user/example.txt"},{"desc":"","code":"uucp -r mydir remote!/home/user/mydir"},{"desc":"","code":"uucp -f example.txt remote!/home/user/example.txt"},{"desc":"","code":"uucp -j example.txt remote!/home/user/example.txt"}],"example":"uucp example.txt remote!/home/user/example.txt"},{"cat":"文件传输","name":"uucico","desc":"UUCP 传输守护进程","diff":2,"intro":"Linux uucico是 Linux 系统中用于管理 UUCP（Unix-to-Unix Copy）协议的命令。","syntax":"uucico [-cCDefqvwz][-i\u003c类型>][-I\u003c文件>][-p\u003c连接端口号码>][-][-rl][-s\u003c主机>][-S\u003c主机>][-u\u003c用户>][-x\u003c类型>][--help]","params":[],"examples":[{"desc":"假设我们要主动连接名为 remote_system 的远程系统，可以使用以下命令：","code":"uucico -r1 -s remote_system"},{"desc":"如果我们希望uucico等待远程系统连接，可以使用以下命令：","code":"uucico -r0"},{"desc":"","code":"system remote_system\n\n phone 123-456-7890\n\n login uucp\n\n password secret"},{"desc":"","code":"port ttyS0\n\n type modem\n\n speed 9600"},{"desc":"","code":"uucico -r1 -s remote_system -x9"}],"example":"uucico -r1 -s remote_system"},{"cat":"文件传输","name":"tftp","desc":"简单文件传输协议","diff":2,"intro":"Linux tftp 命令用于传输文件。","syntax":"tftp [选项] [主机名或IP地址]","params":[],"examples":[{"desc":"","code":"tftp 192.168.1.1"},{"desc":"","code":"tftp> get config.txt"},{"desc":"","code":"tftp> put backup.cfg"},{"desc":"","code":"tftp> quit"},{"desc":"连接远程服务器\"218.28.188.288\"，然后使用put 命令下载其中根目录下的文件\"README\"，可使用命令如下：","code":"tftp 218.28.188.288 #连接远程服务器"},{"desc":"连接服务器之后可进行相应的操作，具体如下：","code":"$ tftp 218.28.188.228 #连接远程服务器 \n\ntftp> ? #使用？，参考帮助 \n\nCommands may be abbreviated. Commands are: #帮助命令列表 \n\nconnect connect to remote tftp \n\nmode set file transfer mode \n\nput send file \n\nget receive file \n\nquit exit tftp \n\nverbose toggle verbose mode \n\ntrace toggle packet tracing \n\nstatus show current status \n\nbinary set mode to octet \n\nascii set mode to netascii \n\nrexmt set per-packet retransmission timeout \n\ntimeout set total retransmission timeout \n\n? print help information \n\ntftp>get README #远程下载README文件 \n\ngetting from 218.28.188.288 to /home/cmd \n\nRecived 168236 bytes in 1.5 seconds[112157 bit/s] \n\ntftp>quit #离开tftp"},{"desc":"使用 -v 选项启用详细模式：","code":"tftp -v 192.168.1.1"},{"desc":"","code":"tftp 192.168.1.1\n\ntftp> get config.txt local_config.txt"},{"desc":"","code":"tftp 192.168.1.1\n\ntftp> put backup.cfg remote_backup.cfg"}],"example":"tftp 192.168.1.1"},{"cat":"文件传输","name":"ncftp","desc":"增强型 FTP 客户端","diff":2,"intro":"Linux ncftp 命令用于传输文件。","syntax":"ncftp [主机或IP地址]","params":[],"examples":[{"desc":"","code":"ncftp ftp.example.com"},{"desc":"","code":"ncftp -u anonymous ftp.example.com"},{"desc":"","code":"get file.txt"},{"desc":"","code":"put file.txt"},{"desc":"","code":"get -R directory_name"},{"desc":"","code":"get -C file.txt"},{"desc":"","code":"quit"},{"desc":"","code":"exit"},{"desc":"","code":"bookmark add mybookmark"},{"desc":"","code":"ncftp mybookmark"}],"example":"ncftp ftp.example.com"},{"cat":"文件传输","name":"ftpshut","desc":"关闭 FTP 服务器","diff":2,"intro":"Linux ftpshut 命令在指定的时间关闭 FTP 服务器。","syntax":"ftpshut [选项] [时间] [警告消息]","params":[],"examples":[{"desc":"在晚上 11:00 关闭 FTP 服务器，并在关闭前 5 分钟拒绝新的 FTP 登录，前 3 分钟关闭所有 ftp 的链接，且给出警告信息，可使用如下命令：","code":"ftpshut-d 3 -1 5 1100 \"Server will be shutdown at 23:00:00\""},{"desc":"假设你希望在 10 分钟后关闭 FTP 服务，并向用户发送一条警告消息，可以使用以下命令：","code":"ftpshut +10 \"FTP 服务将在 %s 关闭，请尽快完成操作。\""},{"desc":"如果你希望在下午 3:00 关闭 FTP 服务，可以使用以下命令：","code":"ftpshut 1500 \"FTP 服务将在 %s 关闭，预计在 %r 重新启动。\""},{"desc":"如果你希望在关闭 FTP 服务前 5 分钟拒绝新用户登录，可以使用以下命令：","code":"ftpshut -l 5 +10 \"FTP 服务将在 %s 关闭，请尽快完成操作。\""},{"desc":"如果你希望在关闭 FTP 服务前 2 分钟断开所有用户的连接，可以使用以下命令：","code":"ftpshut -d 2 +10 \"FTP 服务将在 %s 关闭，请尽快完成操作。\""}],"example":"ftpshut-d 3 -1 5 1100 \"Server will be shutdown at 23:00:00\""},{"cat":"文件传输","name":"ftpwho","desc":"显示 FTP 用户信息","diff":2,"intro":"Linux ftpwho 命令用于显示目前所有以FTP登入的用户信息。","syntax":"ftpwho [选项]","params":[],"examples":[{"desc":"查询当前有哪些用户正在登录FTP服务器，可直接使用如下命令：","code":"ftpwho"},{"desc":"执行该命令后，你将看到类似以下的输出：","code":"Service class all:\n\n 10000 ? S 0:00 proftpd: (accepting connections)\n\n 10001 ? S 0:00 proftpd: user1 - idle\n\n 10002 ? S 0:00 proftpd: user2 - uploading file.txt"},{"desc":"如果你的系统上运行了多个 FTP 服务实例，你可以通过指定服务类来查看特定服务的用户信息。例如：","code":"ftpwho -s proftpd"},{"desc":"有些 FTP 服务器支持显示更详细的用户信息，包括用户的 IP 地址、连接时间等。你可以通过以下命令查看：","code":"ftpwho -v"}],"example":"ftpwho"},{"cat":"文件传输","name":"ftpcount","desc":"显示 FTP 连接数","diff":2,"intro":"Linux ftpcount 命令用于显示目前以 FTP 登入的用户人数。","syntax":"ftpcount [选项]","params":[],"examples":[{"desc":"ftpcount 可以直接查询 FTP 服务器上用户的人数，可直接使用如下命令：","code":"ftpcount #查询当前FTP用户的人数"},{"desc":"执行该命令后，ftpcount 会输出类似以下的信息：","code":"Service class local - 2 users (no maximum)\n\nService class remote - 1 users (no maximum)"}],"example":"ftpcount #查询当前FTP用户的人数"},{"cat":"磁盘管理","name":"cd","desc":"切换当前目录","diff":2,"intro":"Linux cd（英文全拼：change directory）命令用于改变当前工作目录的命令，切换到指定的路径。","syntax":"cd [dirName]","params":[],"examples":[{"desc":"切换到 /usr/bin/ 目录:","code":"cd /usr/bin"},{"desc":"切换到上级目录：使用 .. 表示上级目录，可以通过连续多次使用 .. 来切换到更高级的目录。","code":"cd ..\n\ncd ../../ // 切换到上上级目录"},{"desc":"切换到用户主目录（home）：使用 ~ 表示当前用户的主目录，可以使用 cd 命令直接切换到主目录。","code":"cd ~"},{"desc":"切换到上次访问的目录：使用 cd - 可以切换到上次访问的目录。","code":"cd -"},{"desc":"切换到环境变量指定的目录：可以使用环境变量来指定目标目录，并使用 cd 命令切换到该目录。","code":"cd $VAR_NAME"}],"example":"cd /usr/bin"},{"cat":"磁盘管理","name":"df","desc":"显示磁盘空间使用","diff":3,"intro":"Linux df（英文全拼：display free disk space） 命令用于用于显示文件系统的磁盘空间使用情况，包括总容量、已用空间、可用空间和挂载点等信息。","syntax":"df [选项]... [FILE]...","params":[["-a, --all","显示所有文件系统，包括虚拟文件系统（如 proc, sysfs）"],["-B, --block-size=SIZE","指定显示单位（如 -BK=KB，-BM=MB，-BG=GB）"],["-h, --human-readable","以易读格式显示（自动转换单位：K, M, G, T，基于 1024）"],["-H, --si","类似 -h，但以 1000 为换算单位（符合 SI 标准）"],["-i, --inodes","显示 inode 使用情况（而非磁盘空间）"],["-k","以 1KB 为单位显示（默认单位）"],["-m","以 1MB 为单位显示（部分系统支持）"],["-l, --local","仅显示本地文件系统（排除网络文件系统如 NFS）"],["--no-sync","获取信息前不调用 sync（默认行为）"],["--sync","获取信息前调用 sync（确保数据最新）"],["--total","显示总计信息"],["-t, --type=TYPE","仅显示指定类型的文件系统（如 ext4, xfs）"],["-T, --print-type","显示文件系统类型"],["-x, --exclude-type=TYPE","排除指定类型的文件系统"],["-P, --portability","使用 POSIX 兼容的输出格式（避免换行问题）"],["--output=FIELD_LIST","自定义输出字段（如 source,fstype,size,pcent）"],["--help","显示帮助信息"],["--version","显示版本信息"]],"examples":[{"desc":"显示文件系统的磁盘使用情况统计：","code":"# df \n\nFilesystem 1K-blocks Used Available Use% Mounted on \n\n/dev/sda6 29640780 4320704 23814388 16% / \n\nudev 1536756 4 1536752 1% /dev \n\ntmpfs 617620 888 616732 1% /run \n\nnone 5120 0 5120 0% /run/lock \n\nnone 1544044 156 1543888 1% /run/shm"},{"desc":"-h 选项会以人类可读的方式显示磁盘空间使用情况：","code":"# df -h \n\nFilesystem Size Used Avail Use% Mounted on \n\n/dev/sda6 29G 4.2G 23G 16% / \n\nudev 1.5G 4.0K 1.5G 1% /dev \n\ntmpfs 604M 892K 603M 1% /run \n\nnone 5.0M 0 5.0M 0% /run/lock \n\nnone 1.5G 156K 1.5G 1% /run/shm"},{"desc":"df 也可以显示磁盘使用的文件系统信息：","code":"# df test \n\nFilesystem 1K-blocks Used Available Use% Mounted on \n\n/dev/sda6 29640780 4320600 23814492 16% /"},{"desc":"用一个 -i 选项的 df 命令的输出显示 inode 信息而非块使用量。","code":"df -i \n\nFilesystem Inodes IUsed IFree IUse% Mounted on \n\n/dev/sda6 1884160 261964 1622196 14% / \n\nudev 212748 560 212188 1% /dev \n\ntmpfs 216392 477 215915 1% /run \n\nnone 216392 3 216389 1% /run/lock \n\nnone 216392 8 216384 1% /run/shm"},{"desc":"显示所有的信息:","code":"# df --total \n\nFilesystem 1K-blocks Used Available Use% Mounted on \n\n/dev/sda6 29640780 4320720 23814372 16% / \n\nudev 1536756 4 1536752 1% /dev \n\ntmpfs 617620 892 616728 1% /run \n\nnone 5120 0 5120 0% /run/lock \n\nnone 1544044 156 1543888 1% /run/shm \n\ntotal 33344320 4321772 27516860 14%"}],"example":"Filesystem 1K-blocks Used Available Use% Mounted on"},{"cat":"磁盘管理","name"
