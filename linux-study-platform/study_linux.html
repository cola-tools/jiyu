(000) ret #96"},{"desc":"转换成十进制格式","code":"# tcpdump -ddd\n\n1\n\n6 0 0 96"}],"example":"44 packets captured"},{"cat":"网络通讯","name":"ytalk","desc":"多用户聊天工具","diff":3,"intro":"Linux ytalk命令用于与其他用户交谈。","syntax":"ytalk [-isxY][-h\u003c主机名称IP地址>][用户名称...]","params":[],"examples":[{"desc":"发送消息","code":"# who //显示当前用户\n\nroot :0 Apr 9 20:17\n\nroot pts/1 Apr 9 20:17\n\nw3c pts/6 May 27 16:47 (192.168.0.1)\n\nroot pts/2 May 27 17:37 (192.168.0.1)\n\n# ytalk w3c //发送消息\n\nhey"}],"example":"root :0 Apr 9 20:17"},{"cat":"网络通讯","name":"cu","desc":"串口终端连接","diff":3,"intro":"Linux cu命令用于连接另一个系统主机。","syntax":"cu [dehnotv][-a\u003c通信端口>][-c\u003c电话号码>][-E\u003c脱离字符>][-I\u003c设置文件>][-l\u003c外围设备代号>][-s\u003c连线速率>][-x\u003c排错模式>][-z\u003c系统主机>][--help][-nostop][--parity=none][\u003c系统主机>/\u003c电话号码>]","params":[],"examples":[{"desc":"与远程主机连接","code":"# cu -c 0102377765"}],"example":"cu -l /dev/ttyS0 -s 9600"},{"cat":"网络通讯","name":"smbd","desc":"Samba 服务守护进程","diff":3,"intro":"Linux smbd命令用于Samba服务器程序。","syntax":"smbd [-aDhoP][-d\u003c排错层级>][-i\u003c范围>][-l\u003c记录文件>][-O\u003c连接槽选项>][-p\u003c连接端口编号>][-s\u003c配置文件>]","params":[],"examples":[{"desc":"启动Samba服务器","code":"# smbd -D"}],"example":"smbd -D"},{"cat":"网络通讯","name":"testparm","desc":"Samba 配置检测","diff":3,"intro":"Linux testparm命令用于测试Samba的设置是否正确无误。","syntax":"testparm [-s][配置文件][\u003c主机名称>\u003cIP地址>]","params":[],"examples":[{"desc":"查看Ssmba配置","code":"# testparm \n\nLoad smb config files from /etc/samba/smb.conf\n\nProcessing section '[homes]'\n\nProcessing section '[printers]'\n\nProcessing section '[uptech]'\n\nProcessing section '[home]'\n\nLoaded services file OK.\n\nServer role: ROLE_STANDALONE\n\nPress enter to see a dump of your service definitions\n\n ///按下回车继续\n\n# Global parameters\n\n[global]\n\nworkgroup = MYGROUP\n\nserver string = Samba Server\n\nsecurity = SHARE\n\nencrypt passwords = No\n\npassword server = None\n\nlog file = /var/log/samba/%m.log\n\nmax log size = 50\n\nsocket options = TCP_NODELAY SO_RCVBUF=8192 SO_SNDBUF=8192\n\nprintcap name = /etc/printcap\n\ndns proxy = No\n\nidmap uid = 16777216-33554431\n\nidmap gid = 16777216-33554431\n\ncups options = raw\n\n[homes]\n\ncomment = Home Directories\n\nread only = No\n\nbrowseable = No\n\n[printers]\n\ncomment = All Printers\n\npath = /var/spool/samba\n\nprintable = Yes\n\nbrowseable = No\n\n[uptech]\n\ncomment = *\n\npath = /home/uptech\n\nread only = No\n\nguest ok = Yes\n\n[home]\n\ncomment = *\n\npath = /home\n\nread only = No\n\nguest ok = Yes"}],"example":"Load smb config files from /etc/samba/smb.conf"},{"cat":"网络通讯","name":"smbclient","desc":"Samba 客户端工具","diff":3,"intro":"Linux smbclient命令可存取SMB/CIFS服务器的用户端程序。","syntax":"smbclient [网络资源][密码][-EhLN][-B\u003cIP地址>][-d\u003c排错层级>][-i\u003c范围>][-I\u003cIP地址>][-l\u003c记录文件>][-M\u003cNetBIOS名称>][-n\u003cNetBIOS名称>][-O\u003c连接槽选项>][-p\u003cTCP连接端口>][-R\u003c名称解析顺序>][-s\u003c目录>][-t\u003c服务器字码>][-T\u003ctar选项>][-U\u003c用户名称>][-W\u003c工作群组>]","params":[],"examples":[],"example":"smbclient //server/share -U user"},{"cat":"网络通讯","name":"shapecfg","desc":"流量整形配置","diff":3,"intro":"Linux shapecfg命令用于管制网络设备的流量。","syntax":"shapecfg attach [流量管制器][网络设备]","params":[],"examples":[],"example":"shapecfg attach shaper0 eth0"},{"cat":"网络通讯","name":"nslookup","desc":"查询 DNS 记录（已过时，推荐 dig）","diff":3,"intro":"nslookup (Name Server Lookup) 是一个用于查询域名系统(DNS)记录的网络管理工具。它能够帮助用户诊断和解决DNS相关问题，是Linux系统管理员和网络工程师常用的命令行工具之一。","syntax":"nslookup [选项] [域名/IP] [DNS服务器]","params":[["域名/IP","要查询的域名或IP地址"],["DNS服务器","指定使用的DNS服务器(可选)"]],"examples":[{"desc":"","code":"nslookup example.com"},{"desc":"","code":"Server: 8.8.8.8\n\nAddress: 8.8.8.8#53\n\nNon-authoritative answer:\n\nName: example.com\n\nAddress: 93.184.216.34"},{"desc":"","code":"nslookup example.com 8.8.8.8"},{"desc":"","code":"nslookup -type=MX google.com"},{"desc":"","code":"nslookup -type=NS google.com"},{"desc":"","code":"nslookup -type=TXT google.com"},{"desc":"","code":"nslookup 8.8.8.8"},{"desc":"","code":"nslookup -debug example.com"},{"desc":"","code":"nslookup -type=NS ."},{"desc":"","code":"nslookup -port=8053 example.com dns-server.example.com"}],"example":"nslookup example.com"},{"cat":"网络通讯","name":"dig","desc":"DNS 查询工具","diff":3,"intro":"dig (Domain Information Groper) 是 Linux 系统中一个功能强大的 DNS 查询工具，用于查询 DNS 域名服务器。与传统的 nslookup 相比，dig 提供了更详细的查询结果和更灵活的查询选项。","syntax":"dig [@server] [domain] [query-type] [query-class] [query-options]","params":[["@server","指定要查询的 DNS 服务器（如 @8.8.8.8）"],["domain","要查询的域名（如 example.com）"],["query-type","查询的记录类型（如 A, MX, NS 等）"],["query-class","查询的类别（通常为 IN 表示 Internet）"],["query-options","额外的查询选项"]],"examples":[{"desc":"","code":"dig example.com"},{"desc":"","code":"dig @8.8.8.8 example.com"},{"desc":"","code":"dig example.com MX"},{"desc":"","code":"dig +trace example.com"},{"desc":"","code":"dig +short example.com"},{"desc":"","code":"dig -x 8.8.8.8"},{"desc":"","code":"dig -f domains.txt +short"},{"desc":"","code":"dig +noall +answer example.com"},{"desc":"","code":"dig +time=5 example.com"},{"desc":"","code":"dig @dns.server.example.com -p 5353 example.com"}],"example":"dig example.com"},{"cat":"网络通讯","name":"nmap","desc":"网络扫描和安全审计","diff":3,"intro":"nmap（Network Mapper）是 Linux 系统中最强大的网络探测和安全审计工具之一。它能够帮助系统管理员和网络安全专家：","syntax":"nmap [扫描类型] [选项] {目标规范}","params":[["open","端口开放且有应用程序监听"],["closed","端口关闭（主机可达，但没有应用程序监听）"],["filtered","端口被防火墙/网络过滤，无法确定状态"],["unfiltered","端口可访问，但无法确定开放或关闭（用于ACK扫描）"],["open|filtered","无法确定端口是开放还是被过滤（UDP扫描常见）"],["closed|filtered","无法确定端口是关闭还是被过滤"]],"examples":[{"desc":"","code":"nmap -sS 192.168.1.1"},{"desc":"","code":"nmap -sT 192.168.1.1"},{"desc":"","code":"nmap -sU 192.168.1.1"},{"desc":"","code":"nmap -O 192.168.1.1"},{"desc":"","code":"nmap -sV 192.168.1.1"},{"desc":"","code":"nmap -T4 192.168.1.1 # 较快的扫描速度"},{"desc":"","code":"nmap 192.168.1.1"},{"desc":"","code":"Starting Nmap 7.80 ( https://nmap.org ) at 2023-05-01 10:00 UTC\n\nNmap scan report for 192.168.1.1\n\nHost is up (0.045s latency).\n\nNot shown: 998 closed ports\n\nPORT STATE SERVICE\n\n22/tcp open ssh\n\n80/tcp open http\n\n443/tcp open https"},{"desc":"","code":"nmap -A 192.168.1.1"},{"desc":"","code":"nmap 192.168.1.0/24"}],"example":"nmap -sS 192.168.1.1"},{"cat":"网络通讯","name":"mtr","desc":"网络诊断工具（ping + traceroute）","diff":3,"intro":"当运行mtr时，你会看到类似下面的输出：","syntax":"mtr [选项] 目标主机","params":[["-4","强制使用 IPv4"],["-6","强制使用 IPv6"],["-c COUNT","设置发送的ping包数量"],["-i SECONDS","设置ping间隔时间（秒）"],["-n","不解析主机名，显示IP地址"],["-r","生成报告模式（非交互式）"],["-s BYTES","设置ping包大小（字节）"],["-w","宽输出模式，显示完整主机名"],["-z","显示AS（自治系统）编号"],["--report","等同于 -r，生成报告后退出"],["--report-wide","宽格式报告"]],"examples":[{"desc":"","code":"mtr google.com"},{"desc":"","code":"mtr -r -c 10 google.com > mtr_report.txt"},{"desc":"","code":"mtr -s 100 -i 0.5 example.com"},{"desc":"","code":"mtr -z example.com"},{"desc":"","code":"mtr --tcp example.com"},{"desc":"","code":"mtr --port 8080 example.com"},{"desc":"","code":"mtr --csv example.com > result.csv"}],"example":"mtr google.com"},{"cat":"网络通讯","name":"iperf","desc":"网络带宽测试工具","diff":3,"intro":"iperf 是一个专业的网络性能测试工具，用于测量 TCP 和 UDP 带宽性能。它能够报告带宽、延迟抖动和数据包丢失等网络性能指标。","syntax":"iperf3 -s","params":[["-p","指定端口号"],["-t","测试时间（秒），默认 10 秒"],["-i","间隔时间（秒）报告一次结果"],["-f","显示单位（Kbits, Mbits, KBytes, MBytes）"],["-V","显示版本信息并退出"],["-h","显示帮助信息"]],"examples":[],"example":"iperf -c 192.168.1.10"},{"cat":"系统管理","name":"adduser","desc":"添加新用户","diff":3,"intro":"Linux adduser 命令用于新增使用者帐号或更新预设的使用者资料。","syntax":"adduser [-c comment] [-d home_dir] [-e expire_date] [-f inactive_time] [-g initial_group] [-G group[,...]] [-m [-k skeleton_dir] | -M] [-p passwd] [-s shell] [-u uid [ -o]] [-n] [-r] loginid","params":[],"examples":[{"desc":"添加一个一般用户","code":"# adduser kk //添加用户kk"},{"desc":"为添加的用户指定相应的用户组","code":"# adduser -g root kk //添加用户kk，并指定用户所在的组为root用户组"},{"desc":"创建一个系统用户","code":"# adduser -r kk //创建一个系统用户kk"},{"desc":"为新添加的用户指定/home目录","code":"# adduser -d /home/myf kk //新添加用户kk，其home目录为/home/myf\n\n//当用户名kk登录主机时，系统进入的默认目录为/home/myf"}],"example":"//当用户名kk登录主机时，系统进入的默认目录为/home/myf"},{"cat":"系统管理","name":"chfn","desc":"更改用户信息","diff":3,"intro":"chfn 命令用于修改用户在系统中的 finger 信息，包括全名、办公室地址、办公室电话和家庭电话等。","syntax":"chfn [选项] [用户名]","params":[],"examples":[{"desc":"","code":"# 交互式修改当前用户信息\n\n$ chfn\n\nPassword:\n\nChanging the user information for runoob\n\nEnter the new value, or press ENTER for the default\n\n Full Name: runoob\n\n Room Number []: A-301\n\n Work Phone []: 010-12345678\n\n Home Phone []: 010-87654321"},{"desc":"","code":"# 使用 finger 查看用户信息\n\n$ finger runoob\n\nLogin: runoob Name: Li Si\n\nDirectory: /home/runoob Shell: /bin/bash\n\nOffice: B-202, 010-12345678 Home Phone: 010-87654321\n\nLast login Tue May 19 10:30 (CST) on pts/0\n\nNo mail.\n\nNo Plan."},{"desc":"","code":"# 查看 /etc/passwd 中 runoob 用户的 GECOS 字段\n\n$ grep runoob /etc/passwd\n\nrunoob:x:1001:1001:Li Si,B-202,010-12345678,010-87654321:/home/runoob:/bin/bash"},{"desc":"","code":"# 只修改全名，其他信息保持不变\n\n$ chfn -f \"Wang Wu\" runoob\n\n# 验证修改结果\n\n$ finger runoob | grep Name\n\nLogin: runoob Name: Wang Wu"}],"example":"chfn"},{"cat":"系统管理","name":"useradd","desc":"创建新用户账户","diff":3,"intro":"Linux useradd 命令用于建立用户帐号。","syntax":"useradd [-mMnr][-c \u003c备注>][-d \u003c登入目录>][-e \u003c有效期限>][-f \u003c缓冲天数>][-g \u003c群组>][-G \u003c群组>][-s \u003cshell>][-u \u003cuid>][用户帐号]","params":[],"examples":[{"desc":"添加一般用户","code":"# useradd tt"},{"desc":"为添加的用户指定相应的用户组","code":"# useradd -g root tt"},{"desc":"创建一个系统用户","code":"# useradd -r tt"},{"desc":"为新添加的用户指定home目录","code":"# useradd -d /home/myd tt"},{"desc":"建立用户且制定ID","code":"# useradd caojh -u 544"}],"example":"sudo useradd -m -s /bin/bash tom"},{"cat":"系统管理","name":"date","desc":"显示或设置系统日期","diff":2,"intro":"Linux date 命令可以用来显示或设定系统的日期与时间。","syntax":"date [OPTION]... [+FORMAT]\n\ndate [-u] [-d datestr] [-s datestr] [--utc] [--universal] [--date=datestr] [--set=datestr] [--help] [--version] [+FORMAT] [MMDDhhmm[[CC]YY][.ss]]","params":[],"examples":[{"desc":"显示当前时间","code":"# date\n\nTue May 24 09:29:43 CST 2022\n\n# date '+%c' \n\nTue 24 May 2022 09:30:03 AM CST\n\n# date '+%D' //显示完整的时间\n\n05/24/22\n\n# date '+%x' //显示数字日期\n\n05/24/2022\n\n# date '+%T' //显示日期，年份用四位数表示\n\n14:09:31\n\n# date '+%X' //显示24小时的格式\n\n09:31:31 AM"},{"desc":"格式化输出：","code":"# date +\"%Y-%m-%d\"\n\n2009-12-07"},{"desc":"输出昨天日期：","code":"# date -d \"1 day ago\" +\"%Y-%m-%d\"\n\n2012-11-19"},{"desc":"输出 2 秒后的时间：","code":"# date -d \"2 second\" +\"%Y-%m-%d %H:%M.%S\"\n\n2012-11-20 14:21.31"},{"desc":"传说中的 1234567890 秒：","code":"# date -d \"1970-01-01 1234567890 seconds\" +\"%Y-%m-%d %H:%M:%S\"\n\n2009-02-13 23:02:30"},{"desc":"或者:","code":"# date -d@1234567890 +\"%F %T\"\n\n2009-02-13 23:02:30"},{"desc":"时间格式转换：","code":"# date -d \"2009-12-12\" +\"%Y/%m/%d %H:%M.%S\"\n\n2009/12/12 00:00.00"},{"desc":"apache 格式转换：","code":"# date -d \"Dec 5, 2009 12:00:37 AM\" +\"%Y-%m-%d %H:%M.%S\"\n\n2009-12-05 00:00.37"},{"desc":"格式转换后时间游走：","code":"# date -d \"Dec 5, 2009 12:00:37 AM 2 year ago\" +\"%Y-%m-%d %H:%M.%S\"\n\n2007-12-05 00:00.37"},{"desc":"按自己的格式输出","code":"# date '+usr_time: $1:%M %P -hey'\n\nusr_time: $1:16 下午 -hey"}],"example":"Tue May 24 09:29:43 CST 2022"},{"cat":"系统管理","name":"exit","desc":"退出终端会话","diff":2,"intro":"Linux exit命令用于退出目前的shell。","syntax":"exit [状态值]","params":[],"examples":[{"desc":"退出终端","code":"# exit"}],"example":"exit"},{"cat":"系统管理","name":"finger","desc":"查询用户信息","diff":3,"intro":"finger 命令用于查看本地或远程系统中用户的详细信息，包括登录名、全名、登录时间、空闲时间等。","syntax":"finger [选项] [用户@主机]","params":[],"examples":[{"desc":"","code":"# 查看所有当前登录的用户\n\n$ finger\n\nLogin Name Tty Idle Login Time Office Office Phone\n\nroot root tty1 May 19 09:00\n\nrunoob Zhang San pts/0 3 May 19 10:30 A-301 010-12345678"},{"desc":"","code":"# 查看 runoob 用户的详细信息\n\n$ finger runoob\n\nLogin: runoob Name: Zhang San\n\nDirectory: /home/runoob Shell: /bin/bash\n\nOffice: A-301, 010-12345678 Home Phone: 010-87654321\n\nLast login Tue May 19 10:30 (CST) on pts/0\n\nMail last read Tue May 19 09:00 2026 (CST)\n\nNo Plan."},{"desc":"","code":"# 以简短格式查看用户信息\n\n$ finger -s runoob\n\nLogin Name Tty Idle Login Time Office Office Phone\n\nrunoob Zhang San pts/0 3 May 19 10:30 A-301 010-12345678"},{"desc":"","code":"# 精确匹配用户名，不搜索全名和其他字段\n\n$ finger -m runoob"},{"desc":"","code":"# 同时查看多个用户\n\n$ finger runoob root\n\nLogin: runoob Name: Zhang San\n\nDirectory: /home/runoob Shell: /bin/bash\n\nOffice: A-301, 010-12345678 Home Phone: 010-87654321\n\nLast login Tue May 19 10:30 (CST) on pts/0\n\nNo Plan.\n\nLogin: root Name: root\n\nDirectory: /root Shell: /bin/bash\n\nLast login Tue May 19 09:00 (CST) on tty1\n\nNo Plan."},{"desc":"","code":"# 查看远程主机上的用户信息（需要远程主机开启 fingerd 服务）\n\n$ finger runoob@192.168.1.100\n\nLogin: runoob Name: Zhang San\n\nDirectory: /home/runoob Shell: /bin/bash\n\nLast login Tue May 19 08:00 (CST) on pts/1\n\nNo Plan."},{"desc":"","code":"# 创建 .project 文件（单行项目说明）\n\n$ echo \"RUNOOB Platform Development\" > ~/.project\n\n# 创建 .plan 文件（多行计划或简介）\n\n$ cat > ~/.plan &lt;&lt; 'EOF'\n\n当前任务：\n\n1. 负责 RUNOOB 后端 API 开发\n\n2. 维护数据库迁移脚本\n\n3. Code Review 本周三之前完成\n\nEOF\n\n# 再次查看用户信息\n\n$ finger runoob\n\nLogin: runoob Name: Zhang San\n\nDirectory: /home/runoob Shell: /bin/bash\n\nOffice: A-301, 010-12345678 Home Phone: 010-87654321\n\nLast login Tue May 19 10:30 (CST) on pts/0\n\nProject: RUNOOB Platform Development\n\nPlan:\n\n当前任务：\n\n1. 负责 RUNOOB 后端 API 开发\n\n2. 维护数据库迁移脚本\n\n3. Code Review 本周三之前完成"}],"example":"finger"},{"cat":"系统管理","name":"fwhios","desc":"whois 相关查询（原教程条目）","diff":3,"intro":"Linux fwhios命令用于查找并显示用户信息。","syntax":"fwhios [帐号名称]","params":[],"examples":[],"example":"whois example.com"},{"cat":"系统管理","name":"sleep","desc":"延迟指定时间","diff":3,"intro":"Linux sleep命令可以用来将目前动作延迟一段时间。","syntax":"sleep [--help] [--version] number[smhd]","params":[],"examples":[{"desc":"休眠5分钟","code":"# sleep 5m"},{"desc":"显示目前时间后延迟 1 分钟，之后再次显示时间","code":"date;sleep 1m;date"}],"example":"date;sleep 1m;date"},{"cat":"系统管理","name":"suspend","desc":"挂起当前 shell","diff":3,"intro":"Linux suspend命令用于暂停执行shell。","syntax":"suspend [-f]","params":[],"examples":[{"desc":"暂停shell","code":"# suspend \n\n-bash: suspend: 无法挂起一个登录 shell\n\n# suspend -f"}],"example":"-bash: suspend: 无法挂起一个登录 shell"},{"cat":"系统管理","name":"groupdel","desc":"删除用户组","diff":3,"intro":"Linux groupdel命令用于删除群组。","syntax":"groupdel [群组名称]","params":[],"examples":[{"desc":"删除一个群组","code":"# groupdel hnuser"}],"example":"sudo groupdel devteam"},{"cat":"系统管理","name":"groupmod","desc":"修改用户组信息","diff":3,"intro":"Linux groupmod命令用于更改群组识别码或名称。","syntax":"groupmod [-g \u003c群组识别码> \u003c-o>][-n \u003c新群组名称>][群组名称]","params":[],"examples":[{"desc":"修改组名","code":"[root@runoob.com ~]# groupadd linuxso \n\n[root@runoob.com ~]# tail -1 /etc/group \n\nlinuxso:x:500: \n\n[root@runoob.com ~]# tail -1 /etc/group \n\nlinuxso:x:500: \n\n[root@runoob.com ~]# groupmod -n linux linuxso \n\n[root@runoob.com ~]# tail -1 /etc/group \n\nlinux:x:500:"}],"example":"[root@runoob.com ~]# groupadd linuxso"},{"cat":"系统管理","name":"halt","desc":"关闭系统电源","diff":3,"intro":"若系统的 runlevel 为 0 或 6 ，则Linux halt命令关闭系统，否则以 shutdown 指令（加上 -h 参数）来取代。","syntax":"halt [-n] [-w] [-d] [-f] [-i] [-p]","params":[],"examples":[{"desc":"关闭系统","code":"# halt"},{"desc":"关闭系统并关闭电源","code":"# halt -p"},{"desc":"关闭系统，但不留下纪录","code":"# halt -d"}],"example":"sudo halt"},{"cat":"系统管理","name":"kill","desc":"发送信号终止进程","diff":3,"intro":"Linux kill 命令用于终止正在运行的进程。","syntax":"kill [options] \u003cPID>","params":[],"examples":[{"desc":"","code":"kill PID"},{"desc":"","code":"kill -s SIGNAL PID"},{"desc":"","code":"kill -9 PID"},{"desc":"","code":"kill -9 -PID"},{"desc":"终止 PID 为 1234 的进程：","code":"kill 1234"},{"desc":"强制终止 PID 为 1234 的进程：","code":"kill -9 1234"},{"desc":"向 PID 为 1234 的进程发送 SIGSTOP：","code":"kill -s SIGSTOP 1234"},{"desc":"显示信号","code":"# kill -l\n\n1) SIGHUP 2) SIGINT 3) SIGQUIT 4) SIGILL 5) SIGTRAP\n\n6) SIGABRT 7) SIGBUS 8) SIGFPE 9) SIGKILL 10) SIGUSR1\n\n11) SIGSEGV 12) SIGUSR2 13) SIGPIPE 14) SIGALRM 15) SIGTERM\n\n16) SIGSTKFLT 17) SIGCHLD 18) SIGCONT 19) SIGSTOP 20) SIGTSTP\n\n21) SIGTTIN 22) SIGTTOU 23) SIGURG 24) SIGXCPU 25) SIGXFSZ\n\n26) SIGVTALRM 27) SIGPROF 28) SIGWINCH 29) SIGIO 30) SIGPWR\n\n31) SIGSYS 34) SIGRTMIN 35) SIGRTMIN+1 36) SIGRTMIN+2 37) SIGRTMIN+3\n\n38) SIGRTMIN+4 39) SIGRTMIN+5 40) SIGRTMIN+6 41) SIGRTMIN+7 42) SIGRTMIN+8\n\n43) SIGRTMIN+9 44) SIGRTMIN+10 45) SIGRTMIN+11 46) SIGRTMIN+12 47) SIGRTMIN+13\n\n48) SIGRTMIN+14 49) SIGRTMIN+15 50) SIGRTMAX-14 51) SIGRTMAX-13 52) SIGRTMAX-12\n\n53) SIGRTMAX-11 54) SIGRTMAX-10 55) SIGRTMAX-9 56) SIGRTMAX-8 57) SIGRTMAX-7\n\n58) SIGRTMAX-6 59) SIGRTMAX-5 60) SIGRTMAX-4 61) SIGRTMAX-3 62) SIGRTMAX-2\n\n63) SIGRTMAX-1 64) SIGRTMAX"},{"desc":"杀死指定用户所有进程:","code":"kill -9 $(ps -ef | grep hnlinux) //方法一 过滤出hnlinux用户进程 \n\nkill -u hnlinux //方法二"}],"example":"kill PID"},{"cat":"系统管理","name":"last","desc":"显示最近登录用户","diff":3,"intro":"Linux last 命令用于显示用户最近登录信息。","syntax":"last [options] [username...] [tty...]","params":[],"examples":[{"desc":"显示两行，并省略主机名 hostname 的列：","code":"# last -R -2\n\nroot pts/0 Thu Apr 28 18:06 still logged in\n\nroot pts/0 Tue Apr 26 09:06 - 19:36 (10:30)\n\nwtmp begins Sun Apr 3 13:11:25 2022"},{"desc":"显示两行，并省略主机列：","code":"~# last -R -2\n\nroot pts/0 Thu Apr 28 18:06 still logged in\n\nroot pts/0 Tue Apr 26 09:06 - 19:36 (10:30)\n\nwtmp begins Sun Apr 3 13:11:25 2022"},{"desc":"一般显示方法：","code":"# last\n\n...\n\nroot pts/4 Thu May 13 17:25 still logged in \n\nroot pts/2 Thu May 13 17:23 - 17:25 (00:02) \n\nroot pts/1 Thu May 13 16:46 still logged in \n\n..."},{"desc":"简略显示，并指定显示的个数:","code":"# last -n 5 -R\n\nroot pts/4 Thu May 13 17:25 still logged in \n\nroot pts/2 Thu May 13 17:23 - 17:25 (00:02) \n\nroot pts/1 Thu May 13 16:46 still logged in \n\nroot pts/7 Thu May 13 15:36 still logged in \n\nroot pts/9 Thu May 13 15:35 still logged in \n\nwtmp begins Thu May 13 18:55:40 2014"},{"desc":"显示最后一列显示主机 IP 地址:","code":"# last -n 5 -a -i\n\nroot pts/4 Thu May 13 17:25 still logged in 192.168.1.10\n\nroot pts/2 Thu May 13 17:23 - 17:25 (00:02) 192.168.1.10\n\nroot pts/1 Thu May 13 16:46 still logged in 192.168.1.10\n\nroot pts/7 Thu May 13 15:36 still logged in 192.168.1.10\n\nroot pts/9 Thu May 13 15:35 still logged in 192.168.1.10\n\nwtmp begins Thu May 13 18:55:40 2014"}],"example":"root pts/0 Thu Apr 28 18:06 still logged in"},{"cat":"系统管理","name":"lastb","desc":"显示失败登录记录","diff":3,"intro":"Linux lastb 命令用于列出登入系统失败的用户相关信息。","syntax":"lastb [-adRx][-f \u003c记录文件>][-n \u003c显示行数>][帐号名称...][终端机编号...]","params":[],"examples":[{"desc":"显示属于登录失败的用户信息：","code":"# lastb \n\n...\n\nzgg ssh:notty 143.198.176.57 Thu Apr 7 11:27 - 11:27 (00:00)\n\nzgg ssh:notty 143.198.176.57 Thu Apr 7 11:27 - 11:27 (00:00)\n\nzf ssh:notty 143.198.176.57 Thu Apr 7 11:27 - 11:27 (00:00)\n\nza ssh:notty 143.198.176.57 Thu Apr 7 11:27 - 11:27 (00:00)\n\nzeng ssh:notty 143.198.176.57 Thu Apr 7 11:27 - 11:27 (00:00)\n\nzf ssh:notty 143.198.176.57 Thu Apr 7 11:27 - 11:27 (00:00)\n\nzette ssh:notty 143.198.176.57 Thu Apr 7 11:27 - 11:27 (00:00)\n\nz310 ssh:notty 143.198.176.57 Thu Apr 7 11:27 - 11:27 (00:00)\n\nbtmp begins Fri Apr 1 07:38:45 2022"},{"desc":"显示 5 行登录失败的用户信息：","code":"# lastb -n 5\n\nmos ssh:notty 194.31.98.204 Thu Apr 28 16:52 - 16:52 (00:00)\n\nuser ssh:notty 194.31.98.204 Thu Apr 28 16:52 - 16:52 (00:00)\n\nuser ssh:notty 194.31.98.204 Thu Apr 28 16:52 - 16:52 (00:00)\n\nuser ssh:notty 194.31.98.204 Thu Apr 28 16:52 - 16:52 (00:00)\n\nuser ssh:notty 194.31.98.204 Thu Apr 28 16:52 - 16:52 (00:00)\n\nbtmp begins Fri Apr 1 07:38:45 2022"}],"example":"..."},{"cat":"系统管理","name":"login","desc":"登录系统","diff":3,"intro":"Linux login命令用于登入系统。","syntax":"login","params":[],"examples":[{"desc":"使用新的身份登录系统","code":"# login"}],"example":"login"},{"cat":"系统管理","name":"logname","desc":"显示当前登录名","diff":3,"intro":"Linux logname命令用于显示用户名称。","syntax":"logname [--help][--version]","params":[],"examples":[{"desc":"显示登录账号的信息：","code":"# logname \n\nroot"}],"example":"root"},{"cat":"系统管理","name":"logout","desc":"注销当前用户","diff":3,"intro":"Linux logout命令用于退出系统。","syntax":"logout","params":[],"examples":[{"desc":"退出系统：","code":"[root@runoob.com ~]# logout"}],"example":"[root@runoob.com ~]# logout"},{"cat":"系统管理","name":"ps","desc":"显示进程状态","diff":3,"intro":"Linux ps （英文全拼：process status）命令用于显示当前进程的状态，类似于 windows 的任务管理器。","syntax":"ps [options] [--help]","params":[],"examples":[{"desc":"查找指定进程格式：","code":"ps -ef | grep 进程关键字"},{"desc":"例如显示 php 的进程：","code":"# ps -ef | grep php\n\nroot 794 1 0 2020 ? 00:00:52 php-fpm: master process (/etc/php/7.3/fpm/php-fpm.conf)\n\nwww-data 951 794 0 2020 ? 00:24:15 php-fpm: pool www\n\nwww-data 953 794 0 2020 ? 00:24:14 php-fpm: pool www\n\nwww-data 954 794 0 2020 ? 00:24:29 php-fpm: pool www\n\n..."},{"desc":"显示进程信息：","code":"# ps -A \n\nPID TTY TIME CMD\n\n 1 ? 00:00:02 init\n\n 2 ? 00:00:00 kthreadd\n\n 3 ? 00:00:00 migration/0\n\n 4 ? 00:00:00 ksoftirqd/0\n\n 5 ? 00:00:00 watchdog/0\n\n 6 ? 00:00:00 events/0\n\n 7 ? 00:00:00 cpuset\n\n 8 ? 00:00:00 khelper\n\n 9 ? 00:00:00 netns\n\n 10 ? 00:00:00 async/mgr\n\n 11 ? 00:00:00 pm\n\n 12 ? 00:00:00 sync_supers\n\n 13 ? 00:00:00 bdi-default\n\n 14 ? 00:00:00 kintegrityd/0\n\n 15 ? 00:00:02 kblockd/0\n\n 16 ? 00:00:00 kacpid\n\n 17 ? 00:00:00 kacpi_notify\n\n 18 ? 00:00:00 kacpi_hotplug\n\n 19 ? 00:00:27 ata/0\n\n……省略部分结果\n\n30749 pts/0 00:00:15 gedit\n\n30886 ? 00:01:10 qtcreator.bin\n\n30894 ? 00:00:00 qtcreator.bin \n\n31160 ? 00:00:00 dhclient\n\n31211 ? 00:00:00 aptd\n\n31302 ? 00:00:00 sshd\n\n31374 pts/2 00:00:00 bash\n\n31396 pts/2 00:00:00 ps"},{"desc":"显示指定用户信息","code":"# ps -u root //显示root进程用户信息\n\n PID TTY TIME CMD\n\n 1 ? 00:00:02 init\n\n 2 ? 00:00:00 kthreadd\n\n 3 ? 00:00:00 migration/0\n\n 4 ? 00:00:00 ksoftirqd/0\n\n 5 ? 00:00:00 watchdog/0\n\n 6 ? 00:00:00 events/0\n\n 7 ? 00:00:00 cpuset\n\n 8 ? 00:00:00 khelper\n\n 9 ? 00:00:00 netns\n\n 10 ? 00:00:00 async/mgr\n\n 11 ? 00:00:00 pm\n\n 12 ? 00:00:00 sync_supers\n\n 13 ? 00:00:00 bdi-default\n\n 14 ? 00:00:00 kintegrityd/0\n\n 15 ? 00:00:02 kblockd/0\n\n 16 ? 00:00:00 kacpid\n\n……省略部分结果\n\n30487 ? 00:00:06 gnome-terminal\n\n30488 ? 00:00:00 gnome-pty-helpe\n\n30489 pts/0 00:00:00 bash\n\n30670 ? 00:00:00 debconf-communi \n\n30749 pts/0 00:00:15 gedit\n\n30886 ? 00:01:10 qtcreator.bin\n\n30894 ? 00:00:00 qtcreator.bin \n\n31160 ? 00:00:00 dhclient\n\n31211 ? 00:00:00 aptd\n\n31302 ? 00:00:00 sshd\n\n31374 pts/2 00:00:00 bash\n\n31397 pts/2 00:00:00 ps"},{"desc":"显示所有进程信息，连同命令行","code":"# ps -ef //显示所有命令，连带命令行\n\nUID PID PPID C STIME TTY TIME CMD\n\nroot 1 0 0 10:22 ? 00:00:02 /sbin/init\n\nroot 2 0 0 10:22 ? 00:00:00 [kthreadd]\n\nroot 3 2 0 10:22 ? 00:00:00 [migration/0]\n\nroot 4 2 0 10:22 ? 00:00:00 [ksoftirqd/0]\n\nroot 5 2 0 10:22 ? 00:00:00 [watchdog/0]\n\nroot 6 2 0 10:22 ? /usr/lib/NetworkManager\n\n……省略部分结果\n\nroot 31302 2095 0 17:42 ? 00:00:00 sshd: root@pts/2 \n\nroot 31374 31302 0 17:42 pts/2 00:00:00 -bash\n\nroot 31400 1 0 17:46 ? 00:00:00 /usr/bin/python /usr/sbin/aptd\n\nroot 31407 31374 0 17:48 pts/2 00:00:00 ps -ef"}],"example":"ps -ef | grep 进程关键字"},{"cat":"系统管理","name":"nice","desc":"设置进程优先级","diff":3,"intro":"Linux nice命令以更改过的优先序来执行程序，如果未指定程序，则会印出目前的排程优先序，内定的 adjustment 为 10，范围为 -20（最高优先序）到 19（最低优先序）。","syntax":"nice [-n adjustment] [-adjustment] [--adjustment=adjustment] [--help] [--version] [command [arg...]]","params":[],"examples":[{"desc":"设置程序运行时的优先级","code":"# vi & //后台运行\n\n[1] 15297\n\n# nice vi & //设置默认优先级\n\n[2] 15298\n\n[1]+ Stopped vi\n\n# nice -n 19 vi & //设置优先级为19\n\n[3] 15299\n\n[2]+ Stopped nice vi\n\n# nice -n -20 vi & //设置优先级为 -20\n\n[4] 15300\n\n[3]+ Stopped nice -n 19 vi\n\n# ps -l //显示进程\n\nF S UID PID PPID C PRI NI ADDR SZ WCHAN TTY TIME CMD\n\n4 S 0 15278 15212 0 80 0 - 1208 wait pts/2 00:00:00 bash\n\n0 T 0 15297 15278 0 80 0 - 2687 signal pts/2 00:00:00 vi\n\n0 T 0 15298 15278 0 90 10 - 2687 signal pts/2 00:00:00 vi\n\n0 T 0 15299 15278 1 99 19 - 2687 signal pts/2 00:00:00 vi\n\n4 T 0 15300 15278 3 60 -20 - 2687 signal pts/2 00:00:00 vi\n\n4 R 0 15301 15278 0 80 0 - 625 - pts/2 00:00:00 ps\n\n[4]+ Stopped nice -n -20 vi"},{"desc":"将 ls 的优先序加 1 并执行","code":"nice -n 1 ls"},{"desc":"将 ls 的优先序加 10 并执行","code":"nice ls"}],"example":"[1] 15297"},{"cat":"系统管理","name":"procinfo","desc":"显示内核/进程信息","diff":3,"intro":"Linux procinfo命令用于显示系统状态。","syntax":"procinfo [-abdDfhimsSv][-F \u003c输出文件>][-n \u003c间隔秒数>]","params":[],"examples":[{"desc":"显示系统状态","code":"# procinfo"}],"example":"procinfo -a"},{"cat":"系统管理","name":"top","desc":"实时显示进程信息","diff":3,"intro":"Linux top 是一个在 Linux 和其他类 Unix 系统上常用的实时系统监控工具。它提供了一个动态的、交互式的实时视图，显示系统的整体性能信息以及正在运行的进程的相关信息。","syntax":"top [-] [d delay] [q] [c] [S] [s] [i] [n] [b]","params":[],"examples":[{"desc":"显示进程信息","code":"# top"},{"desc":"显示完整命令","code":"# top -c"},{"desc":"以批处理模式显示程序信息","code":"# top -b"},{"desc":"以累积模式显示程序信息","code":"# top -S"},{"desc":"设置信息更新次数","code":"top -n 2\n\n//表示更新两次后终止更新显示"},{"desc":"设置信息更新时间","code":"# top -d 3\n\n//表示更新周期为3秒"},{"desc":"显示指定的进程信息","code":"# top -p 139\n\n//显示进程号为139的进程信息，CPU、内存占用率等"},{"desc":"显示更新十次后退出","code":"top -n 10"},{"desc":"使用者将不能利用交谈式指令来对行程下命令","code":"top -s"}],"example":"top -n 2"},{"cat":"系统管理","name":"pstree","desc":"树状显示进程","diff":3,"intro":"Linux pstree(英文全称：display a tree of processes）) 命令将所有进程以树状图显示，树状图将会以 pid (如果有指定) 或是以 init 这个基本进程为根 (root)，如果有指定使用者 id，则树状图会只显示该使用者所拥有的进程。","syntax":"pstree [-a] [-c] [-h|-Hpid] [-l] [-n] [-p] [-u] [-G|-U] [pid|user]","params":[],"examples":[{"desc":"显示进程的关系","code":"pstree\n\ninit-+-amd\n\n|-apmd\n\n|-atd\n\n|-httpd---10*[httpd]\n\n%pstree -p\n\ninit(1)-+-amd(447)\n\n|-apmd(105)\n\n|-atd(339)\n\n%pstree -c\n\ninit-+-amd\n\n|-apmd\n\n|-atd\n\n|-httpd-+-httpd\n\n| |-httpd\n\n| |-httpd\n\n| |-httpd\n\n...."},{"desc":"特别表明在运行的进程","code":"# pstree -apnh //显示进程间的关系"},{"desc":"同时显示用户名称","code":"# pstree -u //显示用户名称"}],"example":"pstree"},{"cat":"系统管理","name":"reboot","desc":"重启系统","diff":3,"intro":"Linux reboot命令用于用来重新启动计算机。","syntax":"reboot [-n] [-w] [-d] [-f] [-i]","params":[],"examples":[{"desc":"重新启动","code":"# reboot"}],"example":"sudo reboot"},{"cat":"系统管理","name":"rlogin","desc":"远程登录主机","diff":3,"intro":"Linux rlogin命令用于远端登入。","syntax":"rlogin [-8EL][-e \u003c脱离字符>][-l \u003c用户名称>][主机名称或IP地址]","params":[],"examples":[{"desc":"显示rlogin服务是否开启","code":"# chkconfig --list //检测rlogin服务是否开启"},{"desc":"开启rlogin服务","code":"# chkconfig rlogin on //开启rlogin服务"},{"desc":"登陆远程主机","code":"# rlogin 192.168.1.88\n\nPassword：\n\nPassword：\n\nLogin incorrect\n\nLogin:root\n\nPasswd:\n\nLogin incorrect\n\nLogin:kk\n\nPasswd:"},{"desc":"指定用户名登陆远程主机","code":"# rlogin 192.168.1.88 -l hnlinux\n\nPassord:\n\nLast login：Mon May 28 15：30:25 from 192.168.1.88\n\n#"}],"example":"Password："},{"cat":"系统管理","name":"rsh","desc":"远程 shell 命令","diff":3,"intro":"Linux rsh命令用于远端登入的Shell。","syntax":"rsh [-dn][-l \u003c用户名称>][主机名称或IP地址][执行指令]","params":[],"examples":[{"desc":"开启rsh服务","code":"# chkconfig --list //检测rlogin服务是否开启\n\n# chkconfig rsh on //开启rsh服务\n\n# chkconfig -list //检测开启的服务"},{"desc":"远程命令执行","code":"# rsh -l hnlinux 192.168.1.88 /bin/ls //远程执行ls命令"}],"example":"rsh host uptime"},{"cat":"系统管理","name":"sliplogin","desc":"SLIP 登录管理","diff":3,"intro":"Linux sliplogin命令用于将SLIP接口加入标准输入。","syntax":"sliplogin [用户名称]","params":[],"examples":[{"desc":"改变用户的连接方式","code":"# sliplogin kk // 改变用户的连接方式"}],"example":"sliplogin"},{"cat":"系统管理","name":"screen","desc":"终端多路复用器","diff":3,"intro":"Linux screen命令用于多重视窗管理程序。","syntax":"screen [-AmRvx -ls -wipe][-d \u003c作业名称>][-h \u003c行数>][-r \u003c作业名称>][-s \u003cshell>][-S \u003c作业名称>]","params":[],"examples":[{"desc":"创建 screen 终端","code":"# screen //创建 screen 终端"},{"desc":"创建 screen 终端 并执行任务","code":"# screen vi ~/main.c //创建 screen 终端 ，并执行 vi命令"},{"desc":"离开 screen 终端","code":"# screen vi ~/main.c //创建 screen 终端 ，并执行 vi命令\n\n#include \n\nmain ()\n\n{\n\n}\n\n\"~/mail.c\" 0,0-1 \n\n在 screen 终端 下 按下 Ctrl+a d键"},{"desc":"重新连接离开的 screen 终端","code":"# screen -ls //显示已创建的screen终端 \n\nThere are screens on:\n\n2433.pts-3.linux (2013年10月20日 16时48分59秒) (Detached)\n\n2428.pts-3.linux (2013年10月20日 16时48分05秒) (Detached)\n\n2284.pts-3.linux (2013年10月20日 16时14分55秒) (Detached)\n\n2276.pts-3.linux (2013年10月20日 16时13分18秒) (Detached)\n\n4 Sockets in /var/run/screen/S-root.\n\n# screen -r 2276 //连接 screen_id 为 2276 的 screen终端"}],"example":"main ()"},{"cat":"系统管理","name":"shutdown","desc":"关闭或重启系统","diff":3,"intro":"Linux shutdown 命令可以用来进行关机程序，并且在关机以前传送讯息给所有使用者正在执行的程序，shutdown 也可以用来重开机。","syntax":"shutdown [-t seconds] [-rkhncfF] time [message]","params":[],"examples":[{"desc":"立即关机","code":"# shutdown -h now"},{"desc":"指定 10 分钟后关机","code":"# shutdown -h 10"},{"desc":"重新启动计算机","code":"# shutdown -r now"}],"example":"sudo shutdown -h now"},{"cat":"系统管理","name":"rwho","desc":"显示网络用户信息","diff":3,"intro":"Linux rwho命令用于查看系统用户。","syntax":"rwho [-a]","params":[],"examples":[{"desc":"显示本地局域网内的所有用户","code":"# rwho\n\nroot snail-hnlinux:pts/2 May 14 17:42"}],"example":"root snail-hnlinux:pts/2 May 14 17:42"},{"cat":"系统管理","name":"sudo","desc":"以其他用户身份执行","diff":3,"intro":"sudo 全称为 Super User DO，允许授权用户以其他用户（通常是 root 用户）的身份执行命令，也就是说，经由 sudo 所执行的指令就好像是 root 亲自执行。","syntax":"sudo [选项] 命令","params":[],"examples":[{"desc":"以 root 权限执行单个命令：","code":"sudo apt update\n\nsudo systemctl restart nginx\n\nsudo mkdir /opt/myapp"},{"desc":"切换到 root 用户shell：","code":"sudo -i # 登录shell，加载root环境变量\n\nsudo -s # 非登录shell\n\nsudo su - # 另一种方式"},{"desc":"以其他用户身份执行命令：","code":"sudo -u username command"},{"desc":"","code":"sudo -u postgres psql # 以 postgres 用户运行 psql"},{"desc":"检查可用权限：","code":"sudo -l"},{"desc":"编辑系统文件：","code":"sudo nano /etc/hosts\n\nsudo vim /etc/nginx/nginx.conf"},{"desc":"","code":"sudo visudo"},{"desc":"","code":"# 允许用户免密码执行所有命令\n\nusername ALL=(ALL) NOPASSWD: ALL\n\n# 允许用户组执行特定命令\n\n%wheel ALL=(ALL) /bin/systemctl, /usr/bin/apt"},{"desc":"","code":"# 需要 root 用户将目标用户加入 sudo 组：\n\nusermod -aG sudo username # Ubuntu/Debian\n\nusermod -aG wheel username # CentOS/RHEL"},{"desc":"","code":"Defaults timestamp_timeout=30"}],"example":"sudo apt update"},{"cat":"系统管理","name":"gitps","desc":"检测进程启动情况（原教程条目）","diff":3,"intro":"Linux gitps命令用于报告程序状况。","syntax":"gitps [acefgjlnrsSTuvwxX][p \u003c程序识别码>][t \u003c终端机编号>][U \u003c帐号名称>]","params":[],"examples":[{"desc":"显示指定用户信息","code":"# gitps hnlinux"}],"example":"ps aux | grep git"},{"cat":"系统管理","name":"swatch","desc":"日志监控工具","diff":3,"intro":"Linux swatch命令用于系统监控程序。","syntax":"swatch [-A \u003c分隔字符>][-c \u003c设置文件>][-f \u003c记录文件>][-I \u003c分隔字符>][-P \u003c分隔字符>][-r \u003c时间>][-t \u003c记录文件>]","params":[],"examples":[{"desc":"开启系统监视","code":"# swatch"}],"example":"swatch --config-file watch.conf"},{"cat":"系统管理","name":"tload","desc":"图形显示负载","diff":3,"intro":"Linux tload命令用于显示系统负载状况。","syntax":"tload [-V][-d \u003c间隔秒数>][-s \u003c刻度大小>][终端机编号]","params":[],"examples":[{"desc":"显示系统负载","code":"# tload"}],"example":"tload -d 2"},{"cat":"系统管理","name":"logrotate","desc":"日志文件轮转","diff":3,"intro":"Linux logrotate命令用于管理记录文件。","syntax":"logrotate [-?dfv][-s \u003c状态文件>][--usage][配置文件]","params":[],"examples":[{"desc":"指定记录文件","code":"# logrotate /root/log.config"}],"example":"sudo logrotate -f /etc/logrotate.conf"},{"cat":"系统管理","name":"uname","desc":"显示系统信息","diff":3,"intro":"Linux uname（英文全拼：unix name）命令用于显示操作系统信息，例如内核版本、主机名、处理器类型等。。","syntax":"uname [-amnrsv][--help][--version]","params":[],"examples":[{"desc":"显示系统信息：","code":"# uname -a\n\nLinux iZbp19byk2t6khuqj437q6Z 4.11.0-14-generic #20~16.04.1-Ubuntu SMP Wed Aug 9 09:06:22 UTC 2017 x86_64 x86_64 x86_64 GNU/Linux"},{"desc":"显示计算机类型：","code":"# uname -m\n\nx86_64"},{"desc":"显示计算机名：","code":"# uname -n\n\nrunoob-linux"},{"desc":"显示操作系统发行编号：","code":"# uname -r\n\n4.11.0-14-generic"},{"desc":"显示操作系统名称：","code":"# uname -s\n\nLinux"},{"desc":"显示系统版本与时间：","code":"# uname -v\n\n#20~16.04.1-Ubuntu SMP Wed Aug 9 09:06:22 UTC 2017"}],"example":"x86_64"},{"cat":"系统管理","name":"chsh","desc":"更改登录 shell","diff":3,"intro":"Linux chsh命令用于更改使用者 shell 设定。","syntax":"shell>> chsh","params":[],"examples":[{"desc":"","code":"shell>> chsh\n\nChanging fihanging shell for user1\n\nPassword: [del]\n\nNew shell [/bin/tcsh]: ### [是目前使用的 shell]\n\n[del]\n\nshell>> chsh -l ### 展示 /etc/shells 档案内容\n\n/bin/bash\n\n/bin/sh\n\n/bin/ash\n\n/bin/bsh\n\n/bin/tcsh\n\n/bin/csh"},{"desc":"改变当前的shell。当前的shell 设置为//bin/bash，通过chsh命令，改变shell的设置/bin/csh。","code":"# chsh\n\nChanging shell for root.\n\nNew shell [/bin/bash]: /bin/csh //输入新的shell地址\n\nShell changed."},{"desc":"通过 -s 参数改变当前的shell设置","code":"# chsh -s /bin/csh //改变当前设置为 /bin/csh\n\nChanging shell for root.\n\nShell not changed."}],"example":"shell>> chsh"},{"cat":"系统管理","name":"userconf","desc":"用户配置工具","diff":3,"intro":"Linux userconf命令用于用户帐号设置程序。","syntax":"userconf [--addgroup \u003c群组>][--adduser \u003c用户ID>\u003c群组>\u003c用户名称>\u003cshell>][--delgroup \u003c群组>][--deluser \u003c用户ID>][--help]","params":[],"examples":[{"desc":"新增用户","code":"# userconf --adduser 666 tt lord /bin/bash //新增用户账号"}],"example":"userconf"},{"cat":"系统管理","name":"userdel","desc":"删除用户账户","diff":3,"intro":"Linux userdel命令用于删除用户帐号。","syntax":"userdel [-r][用户帐号]","params":[],"examples":[{"desc":"删除用户账号","code":"# userdel hnlinux"}],"example":"sudo userdel -r tom"},{"cat":"系统管理","name":"usermod","desc":"修改用户账户","diff":3,"intro":"Linux usermod命令用于修改用户帐号。","syntax":"usermod [-LU][-c \u003c备注>][-d \u003c登入目录>][-e \u003c有效期限>][-f \u003c缓冲天数>][-g \u003c群组>][-G \u003c群组>][-l \u003c帐号名称>][-s \u003cshell>][-u \u003cuid>][用户帐号]","params":[],"examples":[{"desc":"更改登录目录","code":"# usermod -d /home/hnlinux root"},{"desc":"改变用户的uid","code":"# usermod -u 777 root"}],"example":"sudo usermod -aG docker tom"},{"cat":"系统管理","name":"vlock","desc":"锁定终端","diff":3,"intro":"Linux vlock命令用于锁住虚拟终端。","syntax":"vlock [-achv]","params":[],"examples":[{"desc":"锁定虚拟终端","code":"# vlock"}],"example":"vlock"},{"cat":"系统管理","name":"who","desc":"显示登录用户","diff":3,"intro":"Linux who命令用于显示系统中有哪些使用者正在上面，显示的资料包含了使用者 ID、使用的终端机、从哪边连上来的、上线时间、呆滞时间、CPU 使用量、动作等等。","syntax":"who - [husfV] [user]","params":[],"examples":[{"desc":"显示当前登录系统的用户","code":"# who //显示当前登录系统的用户\n\nroot tty7 2014-05-13 12:12 (:0)\n\nroot pts/0 2014-05-14 17:09 (:0.0)\n\nroot pts/1 2014-05-14 18:51 (192.168.1.17)\n\nroot pts/2 2014-05-14 19:48 (192.168.1.17)"},{"desc":"显示标题栏","code":"# who -H\n\nNAME LINE TIME COMMENT\n\nroot tty7 2014-05-13 12:12 (:0)\n\nroot pts/0 2014-05-14 17:09 (:0.0)\n\nroot pts/1 2014-05-14 18:51 (192.168.1.17)\n\nroot pts/2 2014-05-14 19:48 (192.168.1.17)"},{"desc":"显示用户登录来源","code":"# who -l -H\n\nNAME LINE TIME IDLE PID COMMENT\n\nLOGIN tty4 2014-05-13 12:11 852 id=4\n\nLOGIN tty5 2014-05-13 12:11 855 id=5\n\nLOGIN tty2 2014-05-13 12:11 862 id=2\n\nLOGIN tty3 2014-05-13 12:11 864 id=3\n\nLOGIN tty6 2014-05-13 12:11 867 id=6\n\nLOGIN tty1 2014-05-13 12:11 1021 id=1"},{"desc":"显示终端属性","code":"# who -T -H\n\nNAME LINE TIME COMMENT\n\nroot + tty7 2014-05-13 12:12 (:0)\n\nroot + pts/0 2014-05-14 17:09 (:0.0)\n\nroot - pts/1 2014-05-14 18:51 (192.168.1.17)\n\nroot - pts/2 2014-05-14 19:48 (192.168.1.17)"},{"desc":"只显示当前用户","code":"# who -m -H\n\nNAME LINE TIME COMMENT\n\nroot pts/1 2014-05-14 18:51 (192.168.1.17)"},{"desc":"精简模式显示","code":"# who -q\n\nroot root root root\n\n# users=4"}],"example":"root tty7 2014-05-13 12:12 (:0)"},{"cat":"系统管理","name":"whoami","desc":"显示当前用户名","diff":2,"intro":"Linux whoami命令用于显示自身用户名称。","syntax":"whoami [--help][--version]","params":[],"examples":[{"desc":"显示用户名","code":"# whoami \n\nroot"}],"example":"root"},{"cat":"系统管理","name":"whois","desc":"域名注册信息查询","diff":3,"intro":"Linux whois命令用于查找并显示用户信息。","syntax":"whois [帐号名称]","params":[],"examples":[{"desc":"显示指定用户信息","code":"# whois root\n\n//查找root用户信息"},{"desc":"查询域名描述信息","code":"# whois .Lx138.COm\n\nWhois Server Version 2.0\n\nDomain names in the .com and .net domains can now be registered\n\nwith many different competing registrars. Go to http://www.internic.net\n\nfor detailed information.\n\n...省略部分内容"},{"desc":"查询域名信息","code":"# whois Lx138.COm\n\nThe Registry database contains ONLY .COM, .NET, .EDU domains and\n\nRegistrars.\n\nDomain Name ..................... Lx138.COm\n\nName Server ..................... dns15.hichina.com\n\n dns16.hichina.com\n\nRegistrant ID ................... hc937242545-cn\n\n...省略部分内容"},{"desc":"查询域名信息省略法律声明","code":"# whois -H Lx138.COm\n\n...省略内容"},{"desc":"指定端口查询","code":"# whois -p 80 Lx138.COm\n\n...省略内容"}],"example":"Whois Server Version 2.0"},{"cat":"系统管理","name":"newgrp","desc":"切换当前用户组","diff":3,"intro":"Linux newgrp 命令用于登入另一个群组。","syntax":"newgrp [群组名称]","params":[],"examples":[{"desc":"改变群组","code":"# newgrp root"}],"example":"newgrp developers"},{"cat":"系统管理","name":"renice","desc":"重新设置进程优先级","diff":3,"intro":"Linux renice命令用于重新指定一个或多个行程（Process）的优先序（一个或多个将根据参数而定）。","syntax":"renice priority [[-p] pid ...] [[-g] pgrp ...] [[-u] user ...]","params":[],"examples":[{"desc":"将行程 id 为 987 及 32 的行程与行程拥有者为 daemon 及 root 的优先序号码加 1","code":"renice +1 987 -u daemon root -p 32"}],"example":"renice +1 987 -u daemon root -p 32"},{"cat":"系统管理","name":"su","desc":"切换用户身份","diff":3,"intro":"Linux su（英文全拼：switch user）命令用于切换用户身份的命令，除 root 外，需要键入该使用者的密码。","syntax":"su [选项] [用户名]","params":[],"examples":[{"desc":"临时以 root 身份执行命令：","code":"su -c \"apt update && apt upgrade\" root"},{"desc":"切换到服务用户进行调试：","code":"su - www-data\n\nsu -s /bin/bash www-data # 如果默认shell是/bin/false"},{"desc":"在脚本中使用：","code":"su - postgres -c \"psql -c 'SELECT version();'\""},{"desc":"退出 su 会话:","code":"exit # 退出当前su会话\n\nCtrl+D # 同样可以退出"},{"desc":"","code":"# 当前用户：john，工作目录：/home/john\n\npwd # /home/john\n\necho $HOME # /home/john\n\nsu root\n\npwd # /home/john (目录未变)\n\necho $HOME # /home/john (环境未变)\n\nexit\n\nsu - root\n\npwd # /root (切换到root家目录)\n\necho $HOME # /root (完整环境)\n\nexit"}],"example":"su -c \"apt update && apt upgrade\" root"},{"cat":"系统管理","name":"skill","desc":"按条件终止进程","diff":3,"intro":"Linux skill命令送个讯号给正在执行的程序，预设的讯息为 TERM (中断)，较常使用的讯息为 HUP、INT、KILL、STOP、CONT 和 0。","syntax":"skill [signal to send] [options] 选择程序的规则","params":[],"examples":[{"desc":"停止所有在 PTY 装置上的程序","code":"skill -KILL -v pts/*"},{"desc":"停止三个使用者 user1、user2、user3","code":"skill -STOP user1 user2 user3"}],"example":"skill -KILL -v pts/*"},{"cat":"系统管理","name":"w","desc":"显示登录用户信息","diff":3,"intro":"Linux w命令用于显示目前登入系统的用户信息。","syntax":"w [-fhlsuV][用户名称]","params":[],"examples":[{"desc":"显示当前用户","code":"# w // 显示当前用户登录信息及执行的命令\n\n19:50:14 up 9:27, 4 users, load average: 0.31, 0.26, 0.18\n\nUSER TTY FROM LOGIN@ IDLE JCPU PCPU WHAT\n\nroot tty7 :0 Thu12 31:39m 10:10 0.60s gnome-session\n\nroot pts/0 :0.0 17:09 2:18m 15.26s 0.15s bash\n\nroot pts/1 192.168.1.17 18:51 1.00s 1.24s 0.14s -bash\n\nroot pts/2 192.168.1.17 19:48 60.00s 0.05s 0.05s -bash"},{"desc":"不显示登录位置","code":"w -f\n\n19:53:59 up 9:31, 4 users, load average: 0.05, 0.16, 0.15\n\nUSER TTY LOGIN@ IDLE JCPU PCPU WHAT\n\nroot tty7 Thu12 31:43m 10:10 0.60s gnome-session\n\nroot pts/0 17:09 2:21m 15.26s 0.15s bash\n\nroot pts/1 18:51 0.00s 1.04s 0.14s -bash\n\nroot pts/2 19:48 4:45 0.05s 0.05s -bash"},{"desc":"以精简模式显示","code":"w -s\n\n19:54:37 up 9:31, 4 users, load average: 0.24, 0.19, 0.16\n\nUSER TTY FROM IDLE WHAT\n\nroot tty7 :0 31:43m gnome-session\n\nroot pts/0 :0.0 2:22m bash\n\nroot pts/1 192.168.1.17 0.00s -bash\n\nroot pts/2 192.168.1.17 5:23 -bash"},{"desc":"不显示标题","code":"w -h\n\nroot tty7 :0 Thu12 31:44m 10:10 0.60s gnome-session\n\nroot pts/0 :0.0 17:09 2:23m 15.26s 0.15s bash\n\nroot pts/1 192.168.1.17 18:51 0.00s 1.05s 0.14s -bash\n\nroot pts/2 192.168.1.17 19:48 5:54 0.05s 0.05s -bash"}],"example":"19:50:14 up 9:27, 4 users, load average: 0.31, 0.26, 0.18"},{"cat":"系统管理","name":"id","desc":"显示用户和组 ID","diff":3,"intro":"Linux id命令用于显示用户的ID，以及所属群组的ID。","syntax":"id [-gGnru][--help][--version][用户名称]","params":[],"examples":[{"desc":"显示当前用户信息：","code":"# id //显示当前用户ID\n\nuid=0(root) gid=0(root) groups=0(root),1(bin),2(daemon),3(sys),4(adm),6(disk),10(wheel) context=root:system_r:unconfined_t"},{"desc":"显示用户群组的 ID：","code":"# id -g\n\n0"},{"desc":"显示所有群组的 ID：","code":"# id -G\n\n0 1 2 3 4 5 6 10"},{"desc":"显示指定用户信息","code":"# id hnlinux"}],"example":"0 1 2 3 4 5 6 10"},{"cat":"系统管理","name":"groupadd","desc":"创建新用户组","diff":3,"intro":"groupadd 命令用于创建一个新的工作组，新工作组的信息将被添加到系统文件中。","syntax":"groupadd [-g gid [-o]] [-r] [-f] group","params":[],"examples":[{"desc":"创建一个新的组，并添加组 ID。","code":"＃groupadd －g 344 runoob"}],"example":"＃groupadd －g 344 runoob"},{"cat":"系统管理","name":"free","desc":"显示内存使用情况","diff":3,"intro":"Linux free命令用于显示内存状态。","syntax":"free [-bkmotV][-s \u003c间隔秒数>]","params":[],"examples":[{"desc":"显示内存使用情况","code":"# free //显示内存使用信息\n\ntotal used free shared buffers cached\n\nMem: 254772 184568 70204 0 5692 89892\n\n-/+ buffers/cache: 88984 165788\n\nSwap: 524280 65116 459164"},{"desc":"以总和的形式显示内存的使用信息","code":"# free -t //以总和的形式查询内存的使用信息\n\ntotal used free shared buffers cached\n\nMem: 254772 184868 69904 0 5936 89908\n\n-/+ buffers/cache: 89024 165748\n\nSwap: 524280 65116 459164\n\nTotal: 779052 249984 529068"},{"desc":"周期性的查询内存使用信息","code":"# free -s 10 //每10s 执行一次命令\n\ntotal used free shared buffers cached\n\nMem: 254772 187628 67144 0 6140 89964\n\n-/+ buffers/cache: 91524 163248\n\nSwap: 524280 65116 459164\n\ntotal used free shared buffers cached\n\nMem: 254772 187748 67024 0 6164 89940\n\n-/+ buffers/cache: 91644 163128\n\nSwap: 524280 65116 459164"}],"example":"total used free shared buffers cached"},{"cat":"系统管理","name":"iotop","desc":"监控磁盘 I/O 使用情况","diff":3,"intro":"iotop是一个类似于top命令的Linux系统监控工具，但它专注于显示磁盘I/O使用情况。它能实时监控系统中各个进程的磁盘读写活动，帮助系统管理员识别I/O密集型进程。","syntax":"sudo iotop [选项]","params":[["-o 或 --only","只显示实际进行I/O操作的进程"],["-b 或 --batch","非交互式模式，适合脚本中使用"],["-n NUM","在非交互模式下运行的迭代次数"],["-d SEC","设置刷新间隔时间（秒）"],["-p PID","只监控指定PID的进程"],["-u USER","只监控指定用户的进程"],["-P 或 --processes","只显示进程，不显示线程"],["-a 或 --accumulated","显示累计I/O而不是带宽"],["-k 或 --kilobytes","使用KB/s而不是B/s作为单位"],["-t 或 --time","在输出中添加时间戳"],["-q 或 --quiet","减少头部信息（在非交互模式下自动启用）"]],"examples":[{"desc":"","code":"sudo iotop"},{"desc":"这会启动交互式界面，显示所有进程的I/O活动，按I/O使用量排序。","code":"sudo iotop -o"},{"desc":"或者运行iotop后按o键，只显示当前正在进行I/O操作的进程。","code":"sudo iotop -u apache"},{"desc":"只监控用户apache的进程I/O活动。","code":"sudo iotop -b -n 3 -d 2"},{"desc":"以非交互模式运行，每2秒刷新一次，共输出3次结果后退出。","code":"sudo iotop -p 1234"},{"desc":"","code":"sudo iotop -o"},{"desc":"","code":"sudo iotop -u mysql -o"},{"desc":"","code":"sudo iotop -b -t -n 5 -d 10 &gt; iotop_log.txt"}],"example":"sudo iotop"},{"cat":"系统管理","name":"nethogs","desc":"按进程显示网络带宽占用","diff":3,"intro":"nethogs 是一个开源的 Linux 命令行工具，用于按进程实时监控网络带宽使用情况。与传统的网络监控工具（如 iftop）不同，nethogs 不是基于端口或协议来统计流量，而是直接显示每个进程的网络活动。","syntax":"sudo nethogs","params":[["-d","设置刷新间隔时间（秒）"],["-c","刷新指定次数后退出"],["-t","追踪模式（显示累计流量）"],["-p","混杂模式（监听所有流量）"],["-V","显示版本信息"],["-h","显示帮助信息"]],"examples":[],"example":"sudo nethogs eth0"},{"cat":"系统管理","name":"glances","desc":"综合系统监控工具","diff":3,"intro":"glances 是一款跨平台的命令行系统监控工具，它能够以直观的方式展示 Linux 系统的各项性能指标。与传统的 top 或 htop 命令相比，glances 提供了更丰富的监控维度和更友好的用户界面。","syntax":"pip install glances","params":[],"examples":[{"desc":"","code":"glances --process-name nginx # 只监控nginx相关进程"},{"desc":"","code":"glances --export csv --export-csv-file /tmp/system_stats.csv"},{"desc":"","code":"glances --alert cpu:80,mem:90 # CPU超过80%或内存超过90%时告警"}],"example":"glances --process-name nginx # 只监控nginx相关进程"},{"cat":"系统管理","name":"dstat","desc":"实时系统资源统计","diff":3,"intro":"dstat 是一个功能强大的 Linux 系统监控工具，它可以实时显示系统资源使用情况，包括 CPU、内存、磁盘、网络等关键指标。dstat 的设计目标是替代传统的 vmstat、iostat、netstat 等工具，提供一个统一的监控界面。","syntax":"dstat [选项] [间隔时间] [执行次数]","params":[["-c","显示 CPU 使用情况"],["-d","显示磁盘读写情况"],["-m","显示内存使用情况"],["-n","显示网络状态"],["-l","显示系统负载"],["-p","显示进程状态"],["-s","显示交换分区使用情况"],["-t","显示时间戳"],["--output","将输出保存到 CSV 文件"],["--top-cpu","显示最耗 CPU 的进程"],["--top-mem","显示最耗内存的进程"]],"examples":[{"desc":"","code":"dstat -cdlmnpsy"},{"desc":"","code":"dstat -t -cdm"},{"desc":"","code":"----system---- ----total-cpu-usage---- -dsk/total- ---memory-usage----\n\n time |usr sys idl wai hiq siq| read writ| used buff cach free\n\n12-05 14:30:01| 2 1 96 0 0 1| 12k 25k| 3.2G 1.1G 5.6G 2.4G\n\n12-05 14:30:02| 3 1 95 0 0 1| 24k 18k| 3.2G 1.1G 5.6G 2.4G"},{"desc":"","code":"dstat -cdm --output /tmp/dstat_output.csv 5 10"},{"desc":"","code":"dstat --top-cpu --top-mem"},{"desc":"","code":"dstat -c -d -n -N eth0,total"},{"desc":"","code":"dstat --time,proc,disk,net,tcp,load,sys"}],"example":"dstat -cdlmnpsy"},{"cat":"系统管理","name":"bpftrace","desc":"动态内核追踪工具","diff":3,"intro":"bpftrace 是一个基于 eBPF (扩展伯克利包过滤器) 的高级追踪工具，它允许开发者在不修改内核代码的情况下，动态地观察和分析 Linux 系统的运行状态。","syntax":"probe /filter/ {\n\n action\n\n}","params":[],"examples":[],"example":"sudo bpftrace -l 'tracepoint:syscalls:*'"},{"cat":"系统管理","name":"pgrep","desc":"根据名称查找进程 ID","diff":3,"intro":"pgrep 是 Linux 系统中一个非常实用的进程查找工具，它是 procps 或 procps-ng 软件包的一部分。这个命令的名称来源于 \"process grep\"，顾名思义，它能够像 grep 命令搜索文本那样搜索系统中的进程。","syntax":"pgrep [选项] [匹配模式]","params":[["-l","同时显示进程名和 PID"],["-a","显示完整命令行而不仅是进程名"],["-f","匹配完整命令行（包括参数）而不仅是进程名"],["-u","只匹配指定用户拥有的进程"],["-x","精确匹配整个进程名"],["-n","只显示最新（最近启动）的匹配进程"],["-o","只显示最旧（最早启动）的匹配进程"],["-c","只返回匹配进程的数量而不显示 PID"],["-d","指定输出分隔符（默认为换行符）"],["-P","只匹配指定父进程 ID 的子进程"],["-g","只匹配指定进程组 ID 的进程"],["-t","只匹配指定终端（tty）的进程"]],"examples":[{"desc":"","code":"pgrep nginx"},{"desc":"","code":"pgrep -l ssh"},{"desc":"","code":"1234 sshd\n\n5678 ssh-agent"},{"desc":"","code":"pgrep -x bash"},{"desc":"","code":"pgrep -f \"sshd -p 2222\""},{"desc":"","code":"pgrep -u www-data"},{"desc":"","code":"pgrep -u mysql mysqld"},{"desc":"","code":"pgrep -c chrome"},{"desc":"","code":"pgrep -n python"},{"desc":"","code":"pgrep -o python"}],"example":"pgrep nginx"},{"cat":"系统管理","name":"lsof","desc":"列出被打开的文件和进程","diff":3,"intro":"中一个功能强大的命令行工具，用于列出当前系统打开的所有文件及相关进程信息。在 Linux 中，\"一切皆文件\"的理念意味着 lsof 不仅能显示常规文件，还能显示网络连接、设备文件、管道和套接字等。","syntax":"lsof [选项] [文件名或目录]","params":[["-a","使用 AND 逻辑组合多个条件"],["-c \u003c进程名>","显示指定进程打开的文件"],["-d \u003c文件描述符>","显示指定文件描述符的文件"],["-i","显示网络连接相关信息"],["-n","不解析主机名（显示 IP 地址）"],["-P","不解析端口名（显示端口号）"],["-p \u003cPID>","显示指定进程 ID 打开的文件"],["-u \u003c用户名>","显示指定用户打开的文件"],["+D \u003c目录>","递归显示目录下被打开的文件"],["-t","仅输出进程 ID（适合脚本使用）"]],"examples":[{"desc":"","code":"lsof"},{"desc":"","code":"lsof -u root # 查看 root 用户打开的文件"},{"desc":"","code":"lsof | grep deleted"},{"desc":"","code":"lsof +D /var/log # 查看 /var/log 目录下被打开的文件"},{"desc":"","code":"COMMAND PID USER FD TYPE DEVICE SIZE/OFF NODE NAME"},{"desc":"","code":"lsof -i :8080"},{"desc":"","code":"watch -n 1 'lsof /path/to/file'"},{"desc":"","code":"lsof | grep deleted"},{"desc":"","code":"lsof /mount/point"},{"desc":"","code":"lsof -i -n -P"}],"example":"lsof"},{"cat":"系统管理","name":"ltrace","desc":"跟踪库调用","diff":3,"intro":"ltrace 是 Linux 系统中的一个实用工具，用于跟踪和记录程序运行时调用的动态库函数。它是调试和分析程序行为的强大工具，特别适合以下场景：","syntax":"ltrace [选项] 要跟踪的程序 [程序参数]","params":[["-c","统计函数调用次数和时间，最后输出汇总信息"],["-e","只跟踪指定的函数（支持通配符）"],["-f","跟踪子进程"],["-i","打印指令指针（IP）"],["-l","只跟踪指定库中的函数"],["-n","指定输出行的缩进级别"],["-o","将输出写入文件"],["-p","附加到正在运行的进程"],["-r","打印相对时间戳"],["-S","同时跟踪系统调用"],["-t","在每行前添加时间"],["-T","显示每次调用的耗时"],["-u","以指定用户身份运行"]],"examples":[{"desc":"跟踪一个简单程序的库函数调用：","code":"ltrace ./my_program"},{"desc":"输出示例：","code":"printf(\"Hello, World!n\") = 13\n\nmalloc(1024) = 0x55a1a2e2e260\n\nfree(0x55a1a2e2e260) ="},{"desc":"","code":"ltrace -c ./my_program"},{"desc":"","code":"% time seconds usecs/call calls function\n\n------ ----------- ----------- --------- --------------------\n\n 45.23 0.123456 123 1000 malloc\n\n 32.12 0.087654 87 1000 free\n\n 22.65 0.061728 61 1000 printf"},{"desc":"","code":"ltrace -e \"malloc,free\" ./my_program"},{"desc":"","code":"ltrace -p 1234"},{"desc":"","code":"ltrace -T ./my_program"},{"desc":"","code":"malloc(1024) = 0x55a1a2e2e260 \n\nfree(0x55a1a2e2e260) ="},{"desc":"","code":"ltrace -e \"malloc,free\" ./memory_intensive_program"},{"desc":"","code":"ltrace -e \"connect,send,recv\" ./network_program"}],"example":"ltrace ./my_program"},{"cat":"系统管理","name":"timeout","desc":"限制命令运行时间","diff":3,"intro":"timeout 是 Linux 系统中的一个实用命令，用于在指定时间后终止正在运行的命令。这个命令特别适用于以下几种场景：","syntax":"timeout [选项] 持续时间 命令 [参数...]","params":[],"examples":[{"desc":"","code":"timeout --foreground 10s sh -c 'command &amp; wait'"}],"example":"timeout --foreground 10s sh -c 'command &amp; wait'"},{"cat":"系统设置","name":"reset","desc":"重置终端设置","diff":3,"intro":"Linux reset命令其实和 tset 是一同个命令，它的用途是设定终端机的状态。一般而言，这个命令会自动的从环境变数、命令列或是其它的组态档决定目前终端机的型态。如果指定型态是 '?' 的话，这个程序会要求使用者输入终端机的型别。","syntax":"tset [-IQqrs] [-] [-e ch] [-i ch] [-k ch] [-m mapping] [terminal]","params":[],"examples":[{"desc":"让使用者输入一个终端机型别并将终端机设到该型别的预设状态","code":"# reset ?"},{"desc":"将 erase 字元设定 control-h","code":"# reset -e ^B"},{"desc":"将设定用的字串显示在屏幕上","code":"# reset -s\n\nErase is control-B (^B).\n\nKill is control-U (^U).\n\nInterrupt is control-C (^C).\n\nTERM=xterm;"}],"example":"Erase is control-B (^B)."},{"cat":"系统设置","name":"clear","desc":"清屏命令","diff":2,"intro":"Linux clear命令用于清除屏幕。","syntax":"clear","params":[],"examples":[{"desc":"清屏","code":"#clear"}],"example":"clear"},{"cat":"系统设置","name":"alias","desc":"设置命令别名","diff":3,"intro":"Linux alias 命令用于设置指令的别名，用户可利用 alias，自定指令的别名。。","syntax":"alias[别名]=[指令名称]","params":[],"examples":[{"desc":"1、创建别名：","code":"alias ll='ls -alF'"},{"desc":"2、显示别名：","code":"alias"},{"desc":"删除别名：","code":"unalias ll"},{"desc":"3、以 root 权限执行命令：","code":"alias sudo='sudo '"},{"desc":"4、向历史记录中添加时间戳：","code":"alias history='history | awk '\"'\"'{CMD=\"date +\\\"[%Y-%m-%d %H:%M:%S]\\\"\"; print CMD \" \" $0 }'\"'\"' | cut -c 29-'"},{"desc":"在 alias 命令中使用 \"--color=auto\" 参数可以让该命令在支持颜色输出的终端上自动启用颜色输出，从而提高命令行的可读性。例如：","code":"alias ls='ls --color=auto'"}],"example":"alias ll='ls -alF'"},{"cat":"系统设置","name":"dircolors","desc":"设置 ls 颜色","diff":3,"intro":"Linux dircolors命令用于设置 ls 指令在显示目录或文件时所用的色彩。","syntax":"dircolors [色彩配置文件]","params":[],"examples":[{"desc":"显示默认值","code":"# dircolors -p //显示默认值\n\n# Configuration file for dircolors, a utility to help you set the\n\n# LS_COLORS environment variable used by G 003c >][--show][--systohc][--test][--utc][--version]","params":[],"examples":[{"desc":"获取当前的时间","code":"# clock //获取当前的时间"},{"desc":"显示UTC时间","code":"# clock -utc //显示UTC时间"}],"example":"sudo clock -w"},{"cat":"系统设置","name":"crontab","desc":"定时任务管理","diff":3,"intro":"Linux crontab 是 Linux 系统中用于设置周期性被执行的指令的命令。","syntax":"crontab [ -u user ] file","params":[],"examples":[{"desc":"","code":"f1 f2 f3 f4 f5 program"},{"desc":"","code":"* * * * *\n\n- - - - -\n\n| | | | |\n\n| | | | +----- 星期中星期几 (0 - 6) (星期天 为0)\n\n| | | +---------- 月份 (1 - 12) \n\n| | +--------------- 一个月中的第几天 (1 - 31)\n\n| +-------------------- 小时 (0 - 23)\n\n+------------------------- 分钟 (0 - 59)"},{"desc":"每一分钟执行一次 /bin/ls：","code":"* * * * * /bin/ls"},{"desc":"在 12 月内, 每天的早上 6 点到 12 点，每隔 3 个小时 0 分钟执行一次 /usr/bin/backup：","code":"0 6-12/3 * 12 * /usr/bin/backup"},{"desc":"周一到周五每天下午 5:00 寄一封信给 alex@domain.name：","code":"0 17 * * 1-5 mail -s \"hi\" alex@domain.name \u003c /tmp/maildata"},{"desc":"每月每天的午夜 0 点 20 分, 2 点 20 分, 4 点 20 分....执行 echo \"haha\"：","code":"20 0-23/2 * * * echo \"haha\""},{"desc":"下面再看看几个具体的例子：","code":"0 */2 * * * /sbin/service httpd restart 意思是每两个小时重启一次apache \n\n50 7 * * * /sbin/service sshd start 意思是每天7：50开启ssh服务 \n\n50 22 * * * /sbin/service sshd stop 意思是每天22：50关闭ssh服务 \n\n0 0 1,15 * * fsck /home 每月1号和15号检查/home 磁盘 \n\n1 * * * * /home/bruce/backup 每小时的第一分执行 /home/bruce/backup这个文件 \n\n00 03 * * 1-5 find /home \"*.xxx\" -mtime +4 -exec rm {} \\; 每周一至周五3点钟，在目录/home中，查找文件名为*.xxx的文件，并删除4天前的文件。\n\n30 6 */10 * * ls 意思是每月的1、11、21、31日是的6：30执行一次ls命令"},{"desc":"注意：当程序在你所指定的时间执行后，系统会发一封邮件给当前的用户，显示该程序执行的内容，若是你不希望收到这样的邮件，请在每一行空一格之后加上 > /dev/null 2>&1 即可，如：","code":"20 03 * * * . /etc/profile;/bin/sh /var/www/runoob/test.sh > /dev/null 2>&1"},{"desc":"","code":"#!/bin/sh\n\n. /etc/profile\n\n. ~/.bash_profile"},{"desc":"","code":"20 03 * * * . /etc/profile;/bin/sh /var/www/runoob/test.sh"}],"example":"f1 f2 f3 f4 f5 program"},{"cat":"系统设置","name":"declare","desc":"声明变量属性","diff":3,"intro":"L "[root@linux runoob]# resize -c"},{"cat":"系统设置","name":"rmmod","desc":"卸载内核模块","diff":3,"intro":"Linux rmmod（英文全拼：remove module）命令用于删除模块。","syntax":"rmmod [-as][模块名称...]","params":[],"examples":[{"desc":"显示已安装的模块","code":"# lsmod\n\nModule Size Used by\n\ncramfs 39042 1 \n\nnfsd 238935 11 \n\nlockd 64849 1 nfsd\n\nnfs_acl 2245 1 nfsd\n\nauth_rpcgss 33735 1 nfsd\n\nsunrpc 193181 10 nfsd,lockd,nfs_acl,auth_rpcgss\n\nexportfs 3437 1 nfsd\n\nxt_TCPMSS 2931 0 \n\nxt_tcpmss 1197 0 \n\nxt_tcpudp 2011 0 \n\niptable_mangle 2771 0 \n\nip_tables 9991 1 iptable_mangle\n\nx_tables 14299 4 \n\n……省略部分结果\n\npppoe 8943 0 \n\npppox 2074 1 pppoe\n\nbinfmt_misc 6587 1 \n\nsnd_ens1371 18814 0 \n\ngameport 9089 1 snd_ens1371\n\nsnd_ac97_codec 100646 1 snd_ens1371\n\nac97_bus 1002 1 snd_ac97_codec\n\nsnd_pcm_oss 35308 0"},{"desc":"卸载模块","code":"# rmmod -v pppoe //卸载模块pppoe\n\nChecking ppoe for persistent data"},{"desc":"安装模块","code":"# insmod -v pppoe >1.log //安装模块\n\n~# tail -b 30 1.log //显示文件信息"}],"example":"Module Size Used by"},{"cat":"系统设置","name":"grpunconv","desc":"合并组影子文件","diff":3,"intro":"Linux grpunconv命令用于关闭群组的投影密码。","syntax":"grpunconv","params":[],"examples":[{"desc":"未关闭的情况","code":"cat /etc/gshadow | grep cdy \n\ncdy:123456::"},{"desc":"关闭影子密码","code":"cat /etc/gshadow\n\ncat: /etc/gshadow: 没有那个文件或目录"},{"desc":"查看密码已经复制到 /etc/group 中了。","code":"cat /etc/group | grep cdy\n\ncdy:123456:1000:"}],"example":"cat /etc/gshadow | grep cdy"},{"cat":"系统设置","name":"modinfo","desc":"显示模块信息","diff":3,"intro":"Linux modinfo命令用于显示kernel模块的信息。","syntax":"modinfo [-adhpV][模块文件]","params":[],"examples":[{"desc":"显示sg模块的信息。","code":"# modinfo sg\n\nfilename: /lib/modules/2.6.9-42.ELsmp/kernel/drivers/scsi/sg.ko\n\nauthor: Douglas Gilbert\n\ndescription: SCSI generic (sg) driver\n\nlicense: GPL\n\nversion: 3.5.31 B0B0CB1BB59F0669A1F0D6B\n\nparm: def_reserved_size:size of buffer reserved for each fd\n\nparm: allow_dio:allow direct I/O (default: 0 (disallow))\n\nalias: char-major-21-*\n\nvermag nstack size (kbytes, -s) 10240\n\ncpu time (seconds, -t) unlimited\n\nmax user processes (-u) 500\n\nvirtual memory (kbytes, -v) unlimited\n\nfile locks (-x) unlimited\n\n[root@runoob ~]#"}],"example":"[root@runoob ~]# ulimit -a"},{"cat":"系统设置","name":"unset","desc":"删除变量或函数","diff":3,"intro":"Linux unset命令用于删除变量或函数。","syntax":"unset [-fv][变量或函数名称]","params":[],"examples":[{"desc":"删除环境变量","code":"[root@runoob.com ~]# lx=\"ls -lh\" //设定环境变量\n\n[root@runoob.com ~]# $lx //使用环境变量\n\n总用量 116K\n\n-rw-r--r-- 1 root root 2.1K 2008-03-30 anaconda-ks.cfg\n\ndrwx------ 3 root root 4.0K 3月 30 21:22 Desktop\n\n-rw-r--r-- 1 root root 50K 2008-03-30 install.log\n\n-rw-r--r-- 1 root root 32K 2008-03-30 install.log.syslog\n\nlrwxrwxrwx 1 root root 9 2008-03-30 qte -> /opt/qte/\n\n[root@runoob.com ~]# set //查看当前的环境变量\n\nBASH=/bin/bash\n\nBASH_ARGC=()\n\nBASH_ARGV=()\n\n……省略部分内容\n\nPROMPT_COMMAND='echo -ne \"33]0;${USER}@${HOSTNAME%%.*}:${PWD/#$HOME/~}07\"'\n\nPS1='[u@h W]$ '\n\nPS2='> '\n\nPS4='+ '\n\nPWD=/root\n\nQTDIR=/usr/lib/qt-3.3\n\nSHELL=/bin/bash\n\nSSH_TTY=/dev/pts/4\n\nSUPPORTED=zh_CN.UTF-8:zh_CN:zh:en_US.UTF-8:en_US:en\n\nSYSFONT=latarcyrheb-sun16\n\nTERM=xterm\n\nUID=0\n\nUSER=root\n\n_=-lh\n\nlx='ls -lh'\n\n[root@runoob.com ~]# unset lx //删除环境变量\n\n[root@runoob.com ~]# set //显示当前环境变量\n\nBASH=/bin/bash\n\nBASH_ARGC=()\n\nBASH_ARGV=()\n\n……省略部分内容\n\nPROMPT_COMMAND='echo -ne \"33]0;${USER}@${HOSTNAME%%.*}:${PWD/#$HOME/~}07\"'\n\nPS1='[u@h W]$ '\n\nPS2='> '\n\nPS4='+ '\n\nPWD=/root\n\nQTDIR=/usr/lib/qt-3.3\n\nSHELL=/bin/bash\n\nSSH_TTY=/dev/pts/4\n\nSUPPORTED=zh_CN.UTF-8:zh_CN:zh:en_US.UTF-8:en_US:en\n\nSYSFONT=latarcyrheb-sun16\n\nTERM=xterm\n\nUID=0\n\nUSER=root\n\n_=-lh"}],"example":"[root@runoob.com ~]# lx=\"ls -lh\" //设定环境变量"},{"cat":"系统设置","name":"chkconfig","desc":"服务开关管理","diff":3,"intro":"Linux chkconfig 命令用于检查，设置系统的各种服务。","syntax":"chkconfig [--add][--del][--list][系统服务] 或 chkconfig [--level \u003c等级代号>][系统服务][on/off/reset]","params":[],"examples":[{"desc":"列出c hkconfig 所知道的所有命令。","code":"# chkconfig --list"},{"desc":"开启服务。","code":"# chkconfig telnet on //开启 Telnet 服务\n\n# chkconfig --list //列出 chkconfig 所知道的所有的服务的情况"},{"desc":"关闭服务","code":"# chkconfig telnet off // 关闭 Telnet 服务\n\n# chkconfig --list // 列出 chkconfig 所知道的所有的服务的情况"}],"example":"chkconfig --list"},{"cat":"系统设置","name":"apmd","desc":"高级电源管理","diff":3,"intro":"Linux apmd命令用于进阶电源管理服务程序。","syntax":"apmd [-u v V W][-p \u003c百分比变化量>][-w \u003c百分比值>]","params":[],"examples":[{"desc":"记录所有的电源管理事件","code":"# apmd -v"},{"desc":"设置BIOS时钟","code":"# apmd -utc //设置BIOS时钟为UTC"}],"example":"apmd -V"},{"cat":"系统设置","name":"hwclock","desc":"硬件时钟管理","diff":3,"intro":"Linux hwclock命令用于显示与设定硬件时钟。","syntax":"hwclock [--adjust][--debug][--directisa][--hctosys][--show][--systohc][--test]\n\n[--utc][--version][--set --date=\u003c日期与时间>]","params":[],"examples":[{"desc":"显示当前时间","code":"# hwclock \n\n2010年05月27日 星期四 18时04分31秒 -0.704214 seconds"},{"desc":"查看版本信息","code":"# hwclock -v\n\nhwclock from util-linux-2.12a"}],"example":"2010年05月27日 星期四 18时04分31秒 -0.704214 seconds"},{"cat":"系统设置","name":"mkkickstart","desc":"生成 kickstart 文件","diff":3,"intro":"Linux mkkickstart命令用于建立安装的组态文件。","syntax":"mkkickstart [--bootp][--dhcp][--nonet][--nox][--version][--nfs \u003c远端电脑:路径>]","params":[],"examples":[{"desc":"构建一个安装组态文件：","code":"# mkkickstart --nonet -bootp"}],"example":"mkkickstart"},{"cat":"系统设置","name":"fbset","desc":"帧缓冲设置工具","diff":3,"intro":"Linux fbset命令用于设置景框缓冲区。","syntax":"fbset [-ahinsvVx][-db \u003c信息文件>][-fb \u003c外围设备代号>][--test][显示模式]","params":[],"examples":[{"desc":"设置画面分辨率 和桌面分辨率","code":"# fbset -g 800 688 1024 768//画面分辨率为800*600 桌面分辨率为1024*768"},{"desc":"启动硬件文本加速","code":"# fbset -accel true // 启动硬件文本加速"},{"desc":"启动广播功能","code":"# fbset -bcast true //启动广播功能"}],"example":"fbset -i"},{"cat":"系统设置","name":"unalias","desc":"取消命令别名","diff":3,"intro":"Linux unalias命令用于删除别名。","syntax":"unalias [-a][别名]","params":[],"examples":[{"desc":"给命令设置别名","code":"[root@runoob.com ~]# alias lx=ls\n\n[root@runoob.com ~]# lx\n\nanaconda-ks.cfg Desktop install.log install.log.syslog qte"},{"desc":"删除别名","code":"[root@runoob.com ~]# alias lx //显示别名\n\nalias lx='ls'\n\n[root@runoob.com ~]# unalias lx //删除别名\n\n[root@runoob.com ~]# lx\n\n-bash: lx: command not found"}],"example":"[root@runoob.com ~]# alias lx=ls"},{"cat":"系统设置","name":"SVGATextMode","desc":"VGA 文本模式设置","diff":3,"intro":"Linux SVGATextMode命令用于加强文字模式的显示画面。","syntax":"SVGATextMode [-acdfhmnrsv][-t \u003c配置文件>][模式]","params":[],"examples":[],"example":"SVGATextMode 80x25"},{"cat":"系统设置","name":"gpasswd","desc":"管理用户组密码","diff":3,"intro":"Linux gpasswd 是 Linux 下工作组文件 /etc/group 和 /etc/gshadow 管理工具，用于将一个用户添加到组或者从组中删除。","syntax":"gpasswd [可选项] 组名","params":[],"examples":[{"desc":"如系统有个 peter 账户，该账户本身不是 groupname 群组的成员，使用 newgrp 需要输入密码即可。","code":"gpasswd groupname"},{"desc":"所以使用 gpasswd groupname 设定密码，就是让知道该群组密码的人可以暂时切换具备 groupname 群组功能的。","code":"gpasswd -A peter users"},{"desc":"这样 peter 就是 users 群组的管理员，就可以执行下面的操作:","code":"gpasswd -a mary users\n\ngpasswd -a allen users"},{"desc":"所以想要添加一个用户到一个组，同时保留以前添加的组时，请使用 gpasswd 这个命令来添加操作用户：","code":"gpasswd -a user_name group_name"}],"example":"gpasswd groupname"},{"cat":"备份压缩","name":"ar","desc":"创建、修改和提取归档文件","diff":2,"intro":"Linux ar命令用于建立或修改备存文件，或是从备存文件中抽取文件。","syntax":"ar[-dmpqrtx][cfosSuvV][a\u003c成员文件>][b\u003c成员文件>][i\u003c成员文件>][备存文件][成员文件]","params":[],"examples":[{"desc":"打包文件","code":"[root@runoob.com ~]# ls //显示当前目录文件 \n\na.c b.c d.c install.log qte\n\nanaconda-ks.cfg c.c Desktop \n\n[root@runoob.com ~]# ar rv one.bak a.c b.c //打包 a.c b.c文件 \n\nar: 正在创建 one.bak\n\na - a.c\n\na - b.c\n\n[root@runoob.com ~]#"},{"desc":"打包多个文件","code":"[root@runoob.com ~]# ar rv two.bak *.c //打包以.c结尾的文件 \n\nar: 正在创建 two.bak\n\na - a.c\n\na - b.c\n\na - c.c\n\na - d.c\n\n[root@runoob.com ~]#"},{"desc":"显示打包文件的内容","code":"[root@runoob.com ~]# ar t two.bak \n\na.c\n\nb.c\n\nc.c\n\nd.c\n\n[root@runoob.com ~]#"},{"desc":"删除打包文件的成员文件","code":"[root@runoob.com ~]# ar d two.bak a.c b.c c.c \n\n[root@runoob.com ~]# ar t two.bak \n\nd.c"}],"example":"[root@runoob.com ~]# ls //显示当前目录文件"},{"cat":"备份压缩","name":"bunzip2","desc":"解压 bzip2 压缩文件","diff":2,"intro":"Linux bunzip2命令是.bz2文件的解压缩程序。","syntax":"# bunzip2 -v temp.bz2 //解压文件显示详细处理信息","params":[],"examples":[{"desc":"解压.bz2文件","code":"# bunzip2 -v temp.bz2 //解压文件显示详细处理信息"}],"example":"bunzip2 data.bz2"},{"cat":"备份压缩","name":"bzip2","desc":"高效文件压缩工具","diff":2,"intro":"Linux bzip2 命令用于压缩文件。","syntax":"bzip2 [options] [file...]","params":[],"examples":[{"desc":"压缩文件","code":"bzip2 example.txt"},{"desc":"如果希望在压缩后保留原始文件，可以使用 -k 选项：","code":"bzip2 -k example.txt"},{"desc":"要解压缩 .bz2 文件，可以使用 -d 选项或直接使用 bunzip2：","code":"bzip2 -d example.txt.bz2"},{"desc":"或","code":"bunzip2 example.txt.bz2"},{"desc":"可以使用 -t 选项来测试压缩文件的完整性：","code":"bzip2 -t example.txt.bz2"}],"example":"bzip2 example.txt"},{"cat":"备份压缩","name":"bzip2recover","desc":"修复损坏的 bzip2 文件","diff":2,"intro":"Linux bzip2recover命令用来修复损坏的.bz2文件。","syntax":"bzip2recover [.bz2 压缩文件]","params":[],"examples":[],"example":"bzip2recover badfile.bz2"},{"cat":"备份压缩","name":"gunzip","desc":"解压 gzip 压缩文件","diff":2,"intro":"Linux gunzip 命令用于解压文件。","syntax":"gunzip [选项] 压缩文件","params":[],"examples":[{"desc":"1、解压缩文件：","code":"gunzip example.txt.gz"},{"desc":"2、解压缩文件并保留原始文件：","code":"gunzip -k example.txt.gz"},{"desc":"解压缩文件并将内容输出到标准输出：","code":"gunzip -c example.txt.gz"},{"desc":"递归地解压缩目录下的所有文件：","code":"gunzip -r directory"}],"example":"gunzip example.txt.gz"},{"cat":"备份压缩","name":"unarj","desc":"解压 ARJ 归档文件","diff":2,"intro":"Linux unarj命令用于解压缩.arj文件。","syntax":"unarj [eltx][.arj压缩文件]","params":[],"examples":[{"desc":"解压.arj文件","code":"# unarj e test.arj"}],"example":"unarj e data.arj"},{"cat":"备份压缩","name":"compress","desc":"压缩和解压 .Z 文件","diff":2,"intro":"Linux compress命令是一个相当古老的 unix 档案压缩指令，压缩后的档案会加上一个 .Z 延伸档名以区别未压缩的档案，压缩后的档案可以以 uncompress 解压。若要将数个档案压成一个压缩档，必须先将档案 tar 起来再压缩。由于 gzip 可以产生更理想的压缩比例，一般人多已改用 gzip 为档案压缩工具。","syntax":"compress [-dfvcV] [-b maxbits] [file ...]","params":[],"examples":[],"example":"compress data.txt"},{"cat":"备份压缩","name":"cpio","desc":"备份和还原文件","diff":2,"intro":"Linux cpio命令用于备份文件。","syntax":"cpio [-0aABckLovV][-C \u003c输入/输出大小>][-F \u003c备份档>][-H \u003c备份格式>][-O \u003c备份档>][--block-size=\u003c区块大小>][--force-local][--help][--quiet][--version] 或 cpio [-bBcdfikmnrsStuvV][-C \u003c输入/输出大小>][-E \u003c范本文件>][-F \u003c备份档>][-H \u003c备份格式>][-I \u003c备份档>][-M \u003c回传信息>][-R \u003c拥有者>\u003c:/.>\u003c所属群组>][--block-size=\u003c区块大小>][--force-local][--help][--no-absolute-filenames][--no-preserve-owner][--only-verify-crc][--quiet][--sparse][--version][范本样式...] 或 cpio [-","params":[],"examples":[{"desc":"制作备份文件","code":"[root@runoob.com var]# ll //显示当前目录下的文件\n\n总用量 164\n\ndrwxr-xr-x 2 root root 4096 2008-03-30 account\n\ndrwxr-xr-x 9 root root 4096 2008-03-30 cache\n\ndrwxr-xr-x 3 netdump netdump 4096 2008-03-30 crash\n\ndrwxr-xr-x 3 root root 4096 2008-03-30 db\n\ndrwxr-xr-x 3 root root 4096 2008-03-30 empty\n\ndrwxr-xr-x 3 root root 4096 2008-03-30 ftp\n\ndrwxrwx--T 2 root gdm 4096 4月 9 20:17 gdm\n\ndrwxr-xr-x 25 root root 4096 2008-03-30 lib\n\ndrwxr-xr-x 2 root root 4096 2004-08-13 local\n\ndrwxrwxr-x 6 root lock 4096 5月 8 15:25 lock\n\ndrwxr-xr-x 14 root root 4096 5月 8 15:14 log\n\nlrwxrwxrwx 1 root root 10 2008-03-30 mail -> spool/mail\n\ndrwxr-xr-x 2 root root 4096 2004-08-13 nis\n\ndrwxr-xr-x 2 root root 4096 2004-08-13 opt\n\ndrwxr-xr-x 2 root root 4096 2004-08-13 preserve\n\ndrwxr-xr-x 16 root root 4096 5月 8 15:14 run\n\ndrwxr-xr-x 16 root root 4096 2008-03-30 spool\n\ndrwxrwxrwt 3 root root 4096 1月 13 18:53 tmp\n\ndrwx------ 2 root root 4096 2004-07-08 tux\n\ndrwxr-xr-x 8 root root 4096 1月 19 19:39 www\n\ndrwxr-xr-x 3 root root 4096 2008-03-30 yp\n\n[root@runoob.com var]# ls | cpio -o >123.cpio //制作备份文件\n\n25 blocks\n\n[root@runoob.com var]# ll //显示当前目录下的文件\n\n总用量 172\n\n-rw-r--r-- 1 root root 1024 5月 24 13:06 123.cpio\n\ndrwxr-xr-x 2 root root 4096 2008-03-30 account\n\ndrwxr-xr-x 9 root root 4096 2008-03-30 cache\n\ndrwxr-xr-x 3 netdump netdump 4096 2008-03-30 crash\n\ndrwxr-xr-x 3 root root 4096 2008-03-30 db\n\ndrwxr-xr-x 3 root root 4096 2008-03-30 empty\n\ndrwxr-xr-x 3 root root 4096 2008-03-30 ftp\n\ndrwxrwx--T 2 root gdm 4096 4月 9 20:17 gdm\n\ndrwxr-xr-x 25 root root 4096 2008-03-30 lib\n\ndrwxr-xr-x 2 root root 4096 2004-08-13 local\n\ndrwxrwxr-x 6 root lock 4096 5月 8 15:25 lock\n\ndrwxr-xr-x 14 root root 4096 5月 8 15:14 log\n\nlrwxrwxrwx 1 root root 10 2008-03-30 mail -> spool/mail\n\ndrwxr-xr-x 2 root root 4096 2004-08-13 nis\n\ndrwxr-xr-x 2 root root 4096 2004-08-13 opt\n\ndrwxr-xr-x 2 root root 4096 2004-08-13 preserve\n\ndrwxr-xr-x 16 root root 4096 5月 8 15:14 run\n\ndrwxr-xr-x 16 root root 4096 2008-03-30 spool\n\ndrwxrwxrwt 3 root root 4096 1月"},{"desc":"解压备份文件","code":"[root@runoob.com var]# ls | cpio -i -l 123.cpio"},{"desc":"解压缩备份文件，并列出详细信息","code":"[root@runoob.com var]# cpio -t -I 123.cpio \n\n123.cpio\n\na.c\n\nb.c\n\nc.c\n\n……省略部分结果"},{"desc":"强制解压缩","code":"[root@runoob.com var]# cpio -i -u -I 123.cpio"},{"desc":"解压缩时进行反向匹配，指定不解压的文件","code":"[root@runoob.com var]# cpio -i -I 123.cpio -f *.c \n\n//不解压.c结尾的文件"},{"desc":"向指定的.cpio文件添加文件","code":"[root@runoob.com var]# ls\n\n123.cpio crash ftp local mail preserve tmp yp\n\naccount db gdm lock nis run tux\n\ncache empty lib log opt spool www\n\n[root@runoob.com var]# cpio -o -O 123.cpio -A\n\ndb //用户输入 按下Ctrl+D结束输入\n\n1 block\n\n[root@runoob.com var]#"},{"desc":"从标准输入备份文件","code":"[root@runoob.com test]# ls \n\na. a.c b.c c.c d.c f.c\n\n[root@runoob.com test]# cpio -o >123.cpio\n\na.c //用户输入\n\nb.c\n\nc.c //按下Ctrl+D完成输入\n\n3 block\n\n[root@runoob.com test]#"},{"desc":"复制文件","code":"[root@runoob.com test]# cpio -p /root\n\na.c //用户输入\n\nb.c\n\nc.c //按下Ctrl+D完成输入\n\n3 block"}],"example":"[root@runoob.com var]# ll //显示当前目录下的文件"},{"cat":"备份压缩","name":"dump","desc":"文件系统备份工具","diff":2,"intro":"Linux dump命令用于备份文件系统。","syntax":"dump [-cnu][-0123456789][-b \u003c区块大小>][-B \u003c区块数目>][-d \u003c密度>][-f \u003c设备名称>][-h \u003c层级>][-s \u003c磁带长度>][-T \u003c日期>][目录或文件系统] 或 dump [-wW]","params":[],"examples":[{"desc":"备份文件到磁带","code":"# dump -0 -u /dev/tape /home/"}],"example":"sudo dump -0u -f /dev/st0 /home"},{"cat":"备份压缩","name":"uuencode","desc":"编码二进制为 ASCII 文本","diff":2,"intro":"Linux uuencode 命令用于将二进制文件转换为 ASCII 文本格式，以便通过电子邮件或其他传输方式发送。","syntax":"uuencode [input-file] [output-file]","params":[],"examples":[{"desc":"假设你有一个二进制文件 example.bin，你想将其转换为 ASCII 格式并保存到 encoded.txt 文件中：","code":"uuencode example.bin example.bin > encoded.txt"},{"desc":"","code":"uudecode encoded.txt"}],"example":"uuencode example.bin example.bin > encoded.txt"},{"cat":"备份压缩","name":"gzexe","desc":"压缩可执行文件","diff":2,"intro":"Linux gzexe命令用于压缩执行文件。","syntax":"gzexe [-d][执行文件...]","params":[],"examples":[{"desc":"压缩可执行文件","code":"# gzexe abc"}],"example":"gzexe script.sh"},{"cat":"备份压缩","name":"gzip","desc":"文件压缩与解压缩","diff":2,"intro":"Linux gzip 命令用于压缩文件。","syntax":"gzip [options] [file...]","params":[],"examples":[{"desc":"压缩文件","code":"gzip example.txt"},{"desc":"如果希望在压缩后保留原始文件，可以使用 -k 选项：","code":"gzip -k example.txt"},{"desc":"要解压缩 .gz 文件，可以使用 -d 选项或直接使用 gunzip：","code":"gzip -d example.txt.gz"},{"desc":"或","code":"gunzip example.txt.gz"},{"desc":"你可以使用 -r 选项递归压缩整个目录：","code":"gzip -r directory/"},{"desc":"使用 -l 选项可以查看 .gz 文件的详细信息：","code":"gzip -l example.txt.gz"},{"desc":"使用 -t 选项测试压缩文件的完整性：","code":"gzip -t example.txt.gz"},{"desc":"gzip 主要用于压缩单个文件。如果需要压缩多个文件或整个目录，通常先用 tar 归档，再用 gzip 压缩。例如：","code":"tar -cvzf archive.tar.gz directory/"}],"example":"gzip example.txt"},{"cat":"备份压缩","name":"lha","desc":"LHA 归档工具","diff":2,"intro":"Linux lha 命令用于压缩或解压缩文件。","syntax":"PERMISSION UID GID SIZE RATIO STAMP NAME\n\n---------- ----------- ------- ------ ------------ --------------------\n\n-rw-r--r-- 1000/1000 1024 65.3% May 15 10:00 file1.txt\n\n-rw-r--r-- 1000/1000 2048 70.1% May 15 10:05 file2.txt\n\ndrwxr-xr-x 1000/1000 0 0.0% May 15 09:55 dir1/","params":[["a","添加文件到压缩包"],["e","解压文件（不保留路径）"],["x","解压文件（保留完整路径）"],["l","列出压缩包内容"],["t","测试压缩包完整性"],["d","从压缩包删除文件"]],"examples":[{"desc":"输出示例：","code":"PERMISSION UID GID SIZE RATIO STAMP NAME\n\n---------- ----------- ------- ------ ------------ --------------------\n\n-rw-r--r-- 1000/1000 1024 65.3% May 15 10:00 file1.txt\n\n-rw-r--r-- 1000/1000 2048 70.1% May 15 10:05 file2.txt\n\ndrwxr-xr-x 1000/1000 0 0.0% May 15 09:55 dir1/"}],"example":"PERMISSION UID GID SIZE RATIO STAMP NAME"},{"cat":"备份压缩","name":"restore","desc":"还原 dump 备份数据","diff":2,"intro":"Linux restore命令用来还原由dump操作所备份下来的文件或整个文件系统(一个分区)。","syntax":"restore [-cCvy][-b \u003c区块大小>][-D \u003c文件系统>][-f \u003c备份文件>][-s \u003c文件编号>] 或 restore [-chimvy][-b \u003c区块大小>][-f \u003c备份文件>][-s \u003c文件编号>] 或 restore [-crvy][-b \u003c区块大小>][-f \u003c备份文件>][-s \u003c文件编号>] 或 restore [-cRvy][-b \u003c区块大小>][-D \u003c文件系统>][-f \u003c备份文件>][-s \u003c文件编号>] 或 restore [chtvy][-b \u003c区块大小>][-D \u003c文件系统>][-f \u003c备份文件>][-s \u003c文件编号>][文件...] 或 restore [-chmvxy][-b \u003c区块大小>][-D \u003c文件系统>][-f \u003c备份文件>][-s \u003c文件编号>][文件...]","params":[],"examples":[],"example":"sudo restore -rf /dev/st0"},{"cat":"备份压缩","name":"tar","desc":"打包与解包文件","diff":2,"intro":"Linux tar（英文全拼：tape archive ）命令用于备份文件。","syntax":"tar [options] -f archive.tar [files...]","params":[],"examples":[{"desc":"1、创建归档文件：将文件 file1、file2 和 directory 打包到一个名为 archive.tar 的归档文件中。","code":"tar -cvf archive.tar file1 file2 directory"},{"desc":"2、解压归档文件：解压名为 archive.tar 的归档文件，还原其中包含的文件和目录。","code":"tar -xvf archive.tar"},{"desc":"3、压缩归档文件：将名为 directory 的目录打包成一个归档文件，然后使用 gzip 进行压缩，生成名为 archive.tar.gz 的文件。","code":"tar -czvf archive.tar.gz directory"},{"desc":"4、列出归档文件中的内容：列出名为 archive.tar 的归档文件中包含的所有文件和目录。","code":"tar -tvf archive.tar"},{"desc":"5、追加文件到已存在的归档中：将名为 newfile 的文件添加到已存在的名为 archive.tar 的归档文件中。","code":"tar -rvf archive.tar newfile"},{"desc":"6、创建一个经过 gzip 压缩的归档文件：打包 directory 目录下的所有文件和子目录，并使用 gzip 压缩，生成名为 archive.tar.gz 的归档文件。","code":"tar -zcvf archive.tar.gz directory"},{"desc":"7、解压一个已经被 gzip 压缩的归档文件：解压 example.tar.gz 文件，并在当前目录下恢复其中包含的文件和目录。","code":"tar -zxvf example.tar.gz"},{"desc":"","code":"tar -czvf archive.tar.gz directory\n\ntar -xzvf archive.tar.gz"},{"desc":"","code":"tar -cjvf archive.tar.bz2 directory\n\ntar -xjvf archive.tar.bz2"},{"desc":"","code":"tar -cJvf archive.tar.xz directory\n\ntar -xJvf archive.tar.xz"}],"example":"tar -cvf archive.tar file1 file2 directory"},{"cat":"备份压缩","name":"uudecode","desc":"解码 uuencode 文件","diff":2,"intro":"Linux uudecode 命令用于将由 uuencode 命令生成的 ASCII 编码文件还原为原始的二进制文件。","syntax":"uudecode [input-file]\u003c/p>","params":[],"examples":[{"desc":"假设你有一个通过 uuencode 编码后的文件 encoded.txt，你想将其还原为原始的二进制文件：","code":"uudecode encoded.txt"},{"desc":"","code":"cat encoded.txt | uudecode"}],"example":"uudecode encoded.txt"},{"cat":"备份压缩","name":"unzip","desc":"解压 zip 压缩包","diff":2,"intro":"Linux unzip 命令用于解压缩 .zip 格式的压缩文件。","syntax":"unzip [options] file.zip","params":[],"examples":[{"desc":"解压缩 .zip 文件","code":"unzip archive.zip"},{"desc":"解压到指定目录","code":"unzip archive.zip -d /path/to/directory"},{"desc":"列出 .zip 文件的内容","code":"unzip -l archive.zip"},{"desc":"测试 .zip 文件的完整性","code":"unzip -t archive.zip"},{"desc":"解压时排除特定文件","code":"unzip archive.zip -x \"*.log\""},{"desc":"解压时不覆盖已存在的文件","code":"unzip -n archive.zip"},{"desc":"解压缩文件并覆盖已存在的文件","code":"unzip -o archive.zip"},{"desc":"解压缩时不保留目录结构","code":"unzip -j archive.zip"}],"example":"unzip archive.zip"},{"cat":"备份压缩","name":"zip","desc":"创建 zip 压缩包","diff":2,"intro":"Linux zip 命令用于压缩文件。","syntax":"zip [options] output.zip file1 file2 ...","params":[],"examples":[{"desc":"压缩单个文件","code":"zip archive.zip example.txt"},{"desc":"压缩多个文件","code":"zip archive.zip file1.txt file2.txt file3.txt"},{"desc":"递归压缩目录","code":"zip -r archive.zip directory/"},{"desc":"压缩并设置密码保护","code":"zip -e archive.zip file.txt"},{"desc":"排除特定文件","code":"zip -r archive.zip directory/ -x \"*.log\""},{"desc":"压缩后删除原始文件","code":"zip -m archive.zip file.txt"},{"desc":"使用 unzip 命令来解压缩 .zip 文件：","code":"unzip archive.zip"}],"example":"zip archive.zip example.txt"},{"cat":"备份压缩","name":"7z","desc":"高效的多格式压缩与解压工具","diff":2,"intro":"7z 是 Linux 系统中一款强大的文件压缩和解压工具，支持多种压缩格式。","syntax":"7z \u003ccommand> [options] \u003carchive_name> [files...]","params":[["a","添加文件到压缩包"],["e","解压文件（无视目录结构）"],["x","解压文件（保留目录结构）"],["l","列出压缩包内容"],["d","删除压缩包中的文件"],["t","测试压缩包完整性"]],"examples":[{"desc":"","code":"7z a archive.7z file1.txt file2.txt # 压缩文件\n\n7z a archive.7z dir/ # 压缩目录\n\n7z a -tzip archive.zip file.txt # 指定格式为 ZIP\n\n7z a -p123456 archive.7z file.txt # 加密压缩（密码：123456）"},{"desc":"","code":"7z x archive.7z # 解压到当前目录\n\n7z x archive.7z -o/path/to/extract # 解压到指定路径\n\n7z x -p123456 archive.7z # 解压加密压缩包"},{"desc":"","code":"7z l archive.7z"},{"desc":"","code":"7z d archive.7z file_to_delete.txt"},{"desc":"","code":"7z t archive.7z"},{"desc":"","code":"7z a -v100M archive.7z large_file.dat # 按 100MB 分卷"},{"desc":"","code":"7z x archive.7z.001"}],"example":"7z a archive.7z file1.txt file2.txt # 压缩文件"},{"cat":"备份压缩","name":"zipinfo","desc":"查看 zip 包信息","diff":2,"intro":"Linux zipinfo 命令用于显示 .zip 压缩文件的详细信息，而不解压文件。","syntax":"zipinfo [options] file.zip","params":[],"examples":[{"desc":"列出 .zip 文件的内容","code":"zipinfo archive.zip"},{"desc":"仅列出文件名","code":"zipinfo -1 archive.zip"},{"desc":"显示详细信息","code":"zipinfo -v archive.zip"},{"desc":"显示人性化的文件大小信息","code":"zipinfo -h archive.zip"},{"desc":"总结 .zip 文件的整体信息","code":"zipinfo -s archive.zip"}],"example":"zipinfo archive.zip"},{"cat":"设备管理","name":"setleds","desc":"设置键盘 LED 灯","diff":4,"intro":"Linux setleds命令用来设定键盘上方三个 LED 的状态。在 Linux 中，每一个虚拟主控台都有独立的设定。","syntax":"setleds [-v] [-L] [-D] [-F] [{+|-}num] [{+|-}caps] [{+|-}scroll]","params":[],"examples":[{"desc":"将数字键打开，其馀二个灯关闭。","code":"# setleds +num -caps -scroll"}],"example":"setleds +num"},{"cat":"设备管理","name":"loadkeys","desc":"加载键盘映射表","diff":4,"intro":"Linux loadkeys命令可以根据一个键盘定义表改变 linux 键盘驱动程序转译键盘输入过程。详细的说明请参考 dumpkeys。","syntax":"loadkeys [ -d --default ] [ -h --help ] [ -q --quiet ] [ -v --verbose [ -v --verbose ]...] [ -m --mktable ] [ -c --clearcompose ] [ -s --clearstrings ] [ filename... ]","params":[],"examples":[{"desc":"","code":"定义按键组合\n\n\u003cpre>\n\n# loadkeys \n\ncontrol alt keycode 88 = F80 //现确定键代码\n\nstring F80=\"runoob.com\" //给变变量设定值\n\n//按下 Ctrl + D键 确定输入\n\n//效果：按下 Ctrl +Alt + F12 输出 Lx138.Com\n\n# dumpkeys --funcs-only //显示功能键\n\n……省略部分结果\n\nstring F3 = \"\\033[[C\"\n\nstring F4 = \"\\033[[D\"\n\nstring F5 = \"\\033[[E\"\n\nstring F6 = \"\\033[17~\"\n\nstring F7 = \"\\033[18~\"\n\nstring F8 = \"\\033[19~\"\n\nstring F9 = \"\\033[20~\"\n\nstring F10 = \"\\033[21~\"\n\nstring F11 = \"\\033[23~\"\n\nstring F12 = \"\\033[24~\"\n\nstring F13 = \"\\033[25~\"\n\nstring F14 = \"\\033[26~\"\n\nstring F15 = \"\\033[28~\"\n\nstring F16 = \"\\033[29~\"\n\nstring F17 = \"\\033[31~\"\n\nstring F18 = \"\\033[32~\"\n\nstring F19 = \"\\033[33~\"\n\nstring F20 = \"\\033[34~\"\n\nstring Find = \"\\033[1~\"\n\nstring Insert = \"\\033[2~\"\n\nstring Remove = \"\\033[3~\"\n\nstring Select = \"\\033[4~\"\n\nstring Prior = \"\\033[5~\"\n\nstring Next = \"\\033[6~\"\n\nstring Macro = \"\\033[M\"\n\nstring Pause = \"\\033[P\"\n\nstring F80 = \"runoob.com\""}],"example":"定义按键组合"},{"cat":"设备管理","name":"rdev","desc":"显示或设置根设备","diff":4,"intro":"Linux rdev命令可以用来查询/设置内核映像文件的根设备，RAM 磁盘大小或视频模式。","syntax":"rdev [-rsvh ] [-o offset ] [ image [value [ offset ] ] ]\u003c/p>","params":[],"examples":[],"example":"rdev /dev/sda1"},{"cat":"设备管理","name":"dumpkeys","desc":"导出键盘映射","diff":4,"intro":"Linux dumpkeys命令用于显示键盘映射表，输出的内容可以被loadkeys命令识别,改变映射关系。","syntax":"dumpkey[选择参数]","params":[],"examples":[{"desc":"显示功能键信息","code":"# dumpkeys --funcs-only \n\nstring F1 = \"\\033[[A\"\n\nstring F2 = \"\\033[[B\"\n\nstring F3 = \"\\033[[C\"\n\nstring F4 = \"\\033[[D\"\n\nstring F5 = \"\\033[[E\"\n\nstring F6 = \"\\033[17~\"\n\nstring F7 = \"\\033[18~\"\n\nstring F8 = \"\\033[19~\"\n\nstring F9 = \"\\033[20~\"\n\nstring F10 = \"\\033[21~\"\n\nstring F11 = \"\\033[23~\"\n\nstring F12 = \"\\033[24~\"\n\nstring F13 = \"\\033[25~\"\n\nstring F14 = \"\\033[26~\"\n\nstring F15 = \"\\033[28~\"\n\nstring F16 = \"\\033[29~\"\n\nstring F17 = \"\\033[31~\"\n\nstring F18 = \"\\033[32~\"\n\nstring F19 = \"\\033[33~\"\n\nstring F20 = \"\\033[34~\"\n\nstring Find = \"\\033[1~\"\n\nstring Insert = \"\\033[2~\"\n\nstring Remove = \"\\033[3~\"\n\nstring Select = \"\\033[4~\"\n\nstring Prior = \"\\033[5~\"\n\nstring Next = \"\\033[6~\"\n\nstring Macro = \"\\033[M\"\n\nstring Pause = \"\\033[P\"\n\nroot@snail-hnlinux:~#"},{"desc":"显示驱动信息","code":"# dumpkeys -i\n\n键值码范围被内核支持: 1 - 255\n\n可绑定到键值的动作最大值: 256\n\n实际使用的键值数: 128\n\n其中 121 已动态分配\n\n被内核支持的动作码值范围\n\n0x0000 - 0x00ff\n\n0x0100 - 0x01ff\n\n0x0200 - 0x0213\n\n0x0300 - 0x0313\n\n0x0400 - 0x0405\n\n0x0500 - 0x05ff\n\n0x0600 - 0x0603\n\n0x0700 - 0x0708\n\n0x0800 - 0x08ff\n\n0x0900 - 0x0919\n\n0x0a00 - 0x0a08\n\n0x0b00 - 0x0bff\n\n0x0c00 - 0x0c08\n\n0x0d00 - 0x0dff\n\n0x0e00 - 0x0e0a\n\n内核支持的功能键数：256\n\n编写定义的最大nr: 256\n\n实际使用的编写定义nr: 68"}],"example":"string F1 = \"\\033[[A\""},{"cat":"设备管理","name":"MAKEDEV","desc":"创建设备文件","diff":4,"intro":"AKEDEV 是一个用于在 Linux 系统中创建设备节点的工具。在 Unix/Linux 系统中，设备节点是作为特殊文件存在的，它们位于 /dev 目录下，用于与硬件设备或内核提供的虚拟设备进行通信。","syntax":"MAKEDEV -V\n\nMAKEDEV [ -n ] [ -v ] update\n\nMAKEDEV [ -n ] [ -v ] [ -d ] device ...","params":[],"examples":[{"desc":"","code":"cd /dev\n\n./MAKEDEV [选项] 设备名..."},{"desc":"创建串口设备 ttyS0 和 ttyS1：","code":"cd /dev\n\nsudo ./MAKEDEV ttyS0 ttyS1"},{"desc":"查看将会创建哪些设备但不实际执行：","code":"cd /dev\n\nsudo ./MAKEDEV ttyS0 ttyS1"}],"example":"cd /dev"},{"cat":"设备管理","name":"poweroff","desc":"关闭计算机电源","diff":4,"intro":"poweroff 命令命令用于关闭计算器并切断电源。","syntax":"poweroff [-n] [-w] [-d] [-f] [-i] [-h]","params":[],"examples":[{"desc":"关闭系统","code":"# poweroff"}],"example":"sudo poweroff"},{"cat":"其他命令（高频实用）","name":"ab","desc":"Apache HTTP 服务器性能测试工具","diff":3,"intro":"ab (Apache Benchmark) 是 Apache HTTP 服务器自带的一个性能测试工具，用于测量 Web 服务器的性能表现。","syntax":"# Ubuntu/Debian 系统\n\nsudo apt-get install apache2-utils\n\n# CentOS/RHEL 系统\n\nsudo yum install httpd-tools\n\n# 验证安装\n\nab -V","params":[],"examples":[],"example":"ab -n 1000 -c 50 http://localhost/"},{"cat":"其他命令（高频实用）","name":"bc","desc":"任意精度计算器语言","diff":3,"intro":"bc 命令是任意精度计算器语言，通常在linux下当计算器用。","syntax":"bc(选项)(参数)","params":[],"examples":[{"desc":"","code":"$ bc\n\nbc 1.06.95\n\nCopyright 1991-1994, 1997, 1998, 2000, 2004, 2006 Free Software Foundation, Inc.\n\nThis is free software with ABSOLUTELY NO WARRANTY.\n\nFor details type `warranty'.\n\n2+3\n\n5\n\n5-2\n\n3\n\n2+3*1\n\n5"},{"desc":"通过管道符","code":"$ echo \"15+5\" | bc\n\n20"},{"desc":"scale=2 设小数位，2 代表保留两位:","code":"$ echo 'scale=2; (2.777 - 1.4744)/1' | bc\n\n1.30"},{"desc":"bc 除了 scale 来设定小数位之外，还有 ibase 和 obase 来其它进制的运算:","code":"$ echo \"ibase=2;111\" |bc\n\n7"},{"desc":"进制转换","code":"#!/bin/bash\n\nabc=192 \n\necho \"obase=2;$abc\" | bc"},{"desc":"执行结果为：11000000，这是用bc将十进制转换成二进制。","code":"#!/bin/bash \n\nabc=11000000 \n\necho \"obase=10;ibase=2;$abc\" | bc"},{"desc":"计算平方和平方根：","code":"$ echo \"10^10\" | bc \n\n10000000000\n\n$ echo \"sqrt(100)\" | bc\n\n10"}],"example":"bc"},{"cat":"其他命令（高频实用）","name":"tail","desc":"查看文件尾部内容","diff":2,"intro":"tail 命令可用于查看文件的内容，有一个常用的参数 -f 常用于查阅正在改变的日志文件。","syntax":"tail [参数] [文件]","params":[],"examples":[],"example":"tail -f /var/log/syslog"},{"cat":"其他命令（高频实用）","name":"head","desc":"查看文件开头内容","diff":2,"intro":"head 命令可用于查看文件的开头部分的内容，有一个常用的参数 -n 用于显示行数，默认为 10，即显示 10 行的内容。","syntax":"head [参数] [文件]","params":[],"examples":[],"example":"head -n 20 /etc/passwd"},{"cat":"其他命令（高频实用）","name":"xargs","desc":"构建并执行命令行参数","diff":3,"intro":"xargs（英文全拼： eXtended ARGuments）是给命令传递参数的一个过滤器，也是组合多个命令的一个工具。","syntax":"find /sbin -perm +700 |ls -l #这个命令是错误的\n\nfind /sbin -perm +700 |xargs ls -l #这样才是正确的","params":[],"examples":[{"desc":"定义一个测试文件，内有多行文本数据：","code":"# cat test.txt\n\na b c d e f g\n\nh i j k l m n\n\no p q\n\nr s t\n\nu v w x y z"},{"desc":"多行输入单行输出："
