<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdfbf5">
<meta name="description" content="Linux 学习打卡平台 · 学生端打卡 + 管理员后台（进度跟踪 / 督促 / 出题）">
<title>Linux 学习打卡平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/member.css">
</head>
<body>

<!-- ═══ 手绘滤镜（feTurbulence 位移，让描边产生手绘抖动） ═══ -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-soft" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<!-- ═══ 启动遮罩 ═══ -->
<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-logo">📚</div>
    <div class="boot-title">Linux 学习打卡平台</div>
    <div class="boot-sub" id="bootSub">正在加载…</div>
  </div>
</div>

<!-- ═══ 登录页 ═══ -->
<div id="loginPage" class="login-page" hidden>
  <div class="login-bg"></div>

  <button class="theme-fab" id="themeFabLogin" type="button" title="切换浅色 / 深色" aria-label="切换主题">
    <span class="theme-ico"></span>
  </button>

  <div class="login-card sketch">
    <div class="login-head">
      <div class="login-logo">📚</div>
      <h1>Linux 学习打卡平台</h1>
      <p>边学边打卡 · 老师看得见你的每一点进步</p>
    </div>

    <div class="seg" role="tablist">
      <button class="seg-btn on" data-role="student" type="button">🙋 学生登录</button>
      <button class="seg-btn" data-role="admin" type="button">🧑‍🏫 管理员登录</button>
    </div>

    <form id="loginForm" autocomplete="on" novalidate>
      <label class="field">
        <span class="field-label">账号</span>
        <input id="loginUser" name="username" type="text" autocomplete="username"
               placeholder="请输入账号" required>
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <input id="loginPass" name="password" type="password" autocomplete="current-password"
               placeholder="请输入密码" required>
      </label>
      <label class="checkline"><input type="checkbox" id="loginRemember" checked> <span>记住账号</span></label>
      <div class="login-err" id="loginErr" hidden></div>
      <button class="btn btn-primary btn-lg btn-block" id="loginBtn" type="submit">进入学习</button>
    </form>
  </div>

  <div class="login-foot">
    <span>数据存储于 MySQL · 支持手机 / 平板 / Windows / macOS</span>
    <div class="platform-switch">
      <a href="../learn/">📖 前往学习平台（课程内容在这里学）</a>
      <a href="../learn/#/records">📥 学习打卡记录与导出</a>
    </div>
    <span style="margin-top:8px;display:block">打卡平台仅向<b>超级会员</b>开放，普通会员请联系管理员开通</span>
  </div>
</div>

<!-- ═══ 主应用 ═══ -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="btnMenu" type="button" aria-label="展开菜单">☰</button>

    <div class="brand">
      <span class="brand-logo">📚</span>
      <span class="brand-text">
        <b>Linux 学习打卡平台</b>
        <i id="brandSub">学生端</i>
      </span>
    </div>

    <div class="topbar-mid" id="topbarMid"></div>

    <div class="topbar-right">
      <button class="theme-fab inline" id="themeFab" type="button" title="切换浅色 / 深色" aria-label="切换主题">
        <span class="theme-ico"></span>
      </button>
      <div class="usermenu" id="userMenu">
        <button class="user-btn" id="userBtn" type="button">
          <span class="avatar" id="userAvatar">学</span>
          <span class="user-meta">
            <b id="userName">—</b>
            <i id="userSub">—</i>
            <em class="member-badge" id="userMember">普通会员</em>
          </span>
          <span class="caret">▾</span>
        </button>
        <div class="usermenu-pop" id="userPop" hidden>
          <div class="member-line" id="userMemberLine">会员：<b>普通会员</b></div>
          <button type="button" data-act="pricing">💎 定价</button>
          <button type="button" data-act="member">👑 我的会员</button>
          <button type="button" data-act="learn">📖 学习平台</button>
          <div class="sep"></div>
          <button type="button" data-act="profile">🙍 我的资料</button>
          <button type="button" data-act="password">🔑 修改密码</button>
          <button type="button" data-act="theme">🌗 切换浅色 / 深色</button>
          <div class="sep"></div>
          <button type="button" data-act="logout" class="danger">🚪 退出登录</button>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    <div class="scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar">
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <span class="dot"></span>
        <span id="sideFootText">已连接</span>
      </div>
    </aside>
    <main class="view" id="view"></main>
  </div>

  <!-- 学生端：底部打卡操作栏 -->
  <div class="checkin-bar" id="checkinBar" hidden>
    <div class="cbar-info">
      <span>已选 <b id="cbarCount">0</b> 项</span>
      <span class="cbar-mode" id="cbarMode">提交打卡</span>
    </div>
    <input type="date" class="input date-input" id="cbarDate" aria-label="打卡日期">
    <button class="btn" id="cbarToday" type="button">今天</button>
    <button class="btn" id="cbarToggle" type="button">↩️ 撤销模式</button>
    <button class="btn btn-ghost" id="cbarClear" type="button">清空</button>
    <button class="btn btn-primary" id="cbarSubmit" type="button">✓ 提交打卡</button>
  </div>
</div>

<!-- ═══ 通用弹层 ═══ -->
<div class="modal" id="modal" hidden>
  <div class="modal-bg" data-close="1"></div>
  <div class="modal-box sketch" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="icon-btn" id="modalX" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<!-- ═══ 会员门禁层（定价 / 我的会员 / 到期强制退出 / 倒计时）挂载点 ═══ -->
<div id="memberLayer"></div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/member.js"></script>
<script src="js/views/login.js"></script>
<script src="js/views/student.js"></script>
<script src="js/views/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
